<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体上传端</title>
    <link rel="stylesheet" href="css/upload.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <span class="logo">MC</span>
        </div>
        <div class="sidebar-nav">
            <button class="nav-item active" data-target="media" title="媒体管理">
                <span class="nav-icon">📁</span>
                <span class="nav-text">媒体</span>
            </button>
            <button class="nav-item" data-target="display" title="显示控制">
                <span class="nav-icon">🖥️</span>
                <span class="nav-text">显示</span>
            </button>
            <button class="nav-item" data-target="reminder" title="提醒设置">
                <span class="nav-icon">⏰</span>
                <span class="nav-text">提醒</span>
            </button>
            <button class="nav-item" data-target="chat" title="AI助手">
                <span class="nav-icon">💬</span>
                <span class="nav-text">助手</span>
            </button>
        </div>
    </nav>
    
    <main class="content">
        <section class="panel" id="panel-media">
            <h1 class="page-title">媒体管理</h1>
            
            <div class="section">
                <h2>显示端选择</h2>
                <div class="display-list" id="mediaDisplayList">
                    <div class="empty-list">暂无显示端连接</div>
                </div>
            </div>
            
            <div class="section">
                <h2>上传文件</h2>
                <div class="file-input-wrapper">
                    <label class="file-label image" for="imageInput">选择图片/GIF</label>
                    <label class="file-label video" for="videoInput">选择视频</label>
                </div>
                <input type="file" id="imageInput" accept="image/*">
                <input type="file" id="videoInput" accept="video/*">
            </div>
            
            <div class="section">
                <h2>URL上传</h2>
                <div class="url-input-group">
                    <input type="text" id="urlInput" placeholder="输入图片/视频URL">
                    <button onclick="uploadByUrl()">发送</button>
                </div>
            </div>
            
            <div class="section">
                <h2>服务器资源 <button onclick="loadMediaList()" style="float:right;padding:4px 12px;border:none;border-radius:6px;background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;font-size:12px;">刷新</button></h2>
                <div class="media-list" id="mediaList">
                    <div class="empty-list">暂无资源</div>
                </div>
            </div>
        </section>
        
        <section class="panel" id="panel-display" style="display:none;">
            <h1 class="page-title">显示控制</h1>
            
            <div class="section">
                <h2>显示端选择</h2>
                <div class="display-list" id="displayList">
                    <div class="empty-list">暂无显示端连接</div>
                </div>
            </div>
            
            <div class="section">
                <h2>显示控制</h2>
            <div class="control-grid">
                <div class="control-item">
                    <label>画面填充</label>
                    <div class="control-buttons">
                        <button class="control-btn" data-fit="contain" onclick="sendFitMode('contain')">适应</button>
                        <button class="control-btn" data-fit="height" onclick="sendFitMode('height')">高度铺满</button>
                        <button class="control-btn" data-fit="width" onclick="sendFitMode('width')">宽度铺满</button>
                        <button class="control-btn" data-fit="crop" onclick="sendFitMode('crop')">裁剪</button>
                    </div>
                </div>
                
                <div class="control-item">
                    <label>视频播放</label>
                    <div class="control-buttons">
                        <button class="control-btn paused" id="playPauseBtn" onclick="togglePlayPause()">播放</button>
                    </div>
                </div>
                
                <div class="control-item">
                    <label>播放进度: <span id="progressValue">0</span>%</label>
                    <input type="range" id="progressSlider" min="0" max="100" value="0" oninput="updateProgress(this.value)">
                </div>
                
                <div class="control-item">
                    <label>音量: <span id="volumeValue">100</span>%</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="100" oninput="updateVolume(this.value)">
                </div>
            </div>
            
            <div class="control-item" style="margin-top: 15px;">
                <label>语音播报 (TTS)</label>
                <div class="control-buttons">
                    <button class="control-btn" id="autoTtsBtn" onclick="toggleAutoTts()">自动播报: 开</button>
                    <button class="control-btn" onclick="stopTts()">停止播报</button>
                    <button class="control-btn" onclick="testTimeAnnounce()">测试整点报时</button>
                </div>
                <div style="margin-top: 10px;">
                    <input type="text" id="ttsTextInput" placeholder="输入要播报的文字" style="width: calc(100% - 70px);padding: 10px;border: none;border-radius: 8px;background: rgba(255,255,255,0.1);color: #fff;font-size: 14px;outline: none;">
                    <button class="control-btn" onclick="playCustomTts()" style="padding: 10px 16px;">播放</button>
                </div>
                <div class="time-announce-config" style="margin-top: 15px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                    <div style="font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 10px;">整点报时设置</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <label style="font-size: 12px; color: rgba(255,255,255,0.6);">状态:</label>
                            <select id="timeAnnounceEnabled" style="padding: 5px 10px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px;">
                                <option value="true">启用</option>
                                <option value="false">禁用</option>
                            </select>
                        </div>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <label style="font-size: 12px; color: rgba(255,255,255,0.6);">间隔:</label>
                            <select id="timeAnnounceInterval" style="padding: 5px 10px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px;">
                                <option value="15">15分钟</option>
                                <option value="30">30分钟</option>
                                <option value="60">60分钟</option>
                            </select>
                        </div>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <label style="font-size: 12px; color: rgba(255,255,255,0.6);">重复:</label>
                            <input type="number" id="timeAnnounceRepeatCount" min="1" max="10" value="3" style="width: 50px; padding: 5px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; text-align: center;">
                            <span style="font-size: 12px; color: rgba(255,255,255,0.6);">次</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <label style="font-size: 12px; color: rgba(255,255,255,0.6);">间隔:</label>
                            <input type="number" id="timeAnnounceRepeatDelay" min="1" max="30" value="3" style="width: 50px; padding: 5px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; text-align: center;">
                            <span style="font-size: 12px; color: rgba(255,255,255,0.6);">秒</span>
                        </div>
                        <button class="control-btn" onclick="saveTimeAnnounceConfig()" style="padding: 5px 12px; font-size: 12px;">保存</button>
                    </div>
                </div>
            </div>
            
            <div class="crop-control">
                <label style="display:block;font-size:14px;color:#fff;margin-bottom:10px;font-weight:500;">画面裁剪区域</label>
                <div class="crop-preview-container" id="cropPreviewContainer">
                    <img class="crop-preview-media" id="cropPreviewImg" style="display:none;">
                    <video class="crop-preview-media" id="cropPreviewVideo" style="display:none;" muted></video>
                    <div class="crop-box" id="cropBox" style="display:none;">
                        <div class="crop-box-h1"></div>
                        <div class="crop-box-h2"></div>
                        <div class="crop-box-v1"></div>
                        <div class="crop-box-v2"></div>
                        <div class="crop-resize-handle nw" data-handle="nw"></div>
                        <div class="crop-resize-handle ne" data-handle="ne"></div>
                        <div class="crop-resize-handle sw" data-handle="sw"></div>
                        <div class="crop-resize-handle se" data-handle="se"></div>
                    </div>
                </div>
                <div class="crop-buttons">
                    <button class="control-btn" data-rotation="0" onclick="setCropRotation(0)">0°</button>
                    <button class="control-btn" data-rotation="90" onclick="setCropRotation(90)">90°</button>
                    <button class="control-btn" data-rotation="180" onclick="setCropRotation(180)">180°</button>
                    <button class="control-btn" data-rotation="270" onclick="setCropRotation(270)">270°</button>
                    <button class="control-btn" onclick="resetCrop()">重置裁剪</button>
                </div>
            </div>
        </div>
        
        <div class="section info-section">
            <p>显示端地址: <a href="/display" target="_blank">点击打开显示端</a></p>
            <button class="control-btn restart-btn" onclick="restartServer()" style="margin-top: 10px; background: linear-gradient(135deg, #e74c3c, #c0392b);">重启服务器</button>
        </div>
        </section>
        
        <section class="panel" id="panel-reminder" style="display:none;">
            <h1 class="page-title">提醒设置</h1>
            
            <div class="section">
                <h2>提醒设置</h2>
            <div class="reminder-form" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <div>
                        <label style="font-size: 12px; color: rgba(255,255,255,0.6); display: block; margin-bottom: 5px;">提醒内容</label>
                        <input type="text" id="reminderContent" placeholder="输入提醒内容" style="width: 100%; padding: 10px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: rgba(255,255,255,0.6); display: block; margin-bottom: 5px;">提醒时间</label>
                        <input type="time" id="reminderTime" style="width: 100%; padding: 10px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none;">
                    </div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 10px; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label style="font-size: 12px; color: rgba(255,255,255,0.6);">类型:</label>
                        <select id="reminderType" style="padding: 8px 12px; border: none; border-radius: 6px; background: rgba(255,255,255,0.1); color: #fff; font-size: 13px;">
                            <option value="once">临时提醒</option>
                            <option value="daily">每天提醒</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label style="font-size: 12px; color: rgba(255,255,255,0.6);">方式:</label>
                        <label style="font-size: 13px; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="reminderMethodVoice" checked> 语音播报
                        </label>
                        <label style="font-size: 13px; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="reminderMethodPopup" checked> 弹窗提示
                        </label>
                    </div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: center; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px;">
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">每次重复:</span>
                        <input type="number" id="reminderRepeatEachTime" min="1" max="10" value="1" style="width: 50px; padding: 5px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; text-align: center;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">次</span>
                    </div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: center; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px;">
                    <label style="font-size: 12px; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="reminderRepeatEnabled"> 重复提醒
                    </label>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">间隔:</span>
                        <input type="number" id="reminderRepeatInterval" min="1" max="60" value="5" style="width: 50px; padding: 5px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; text-align: center;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">分钟</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">次数:</span>
                        <input type="number" id="reminderRepeatCount" min="0" max="100" value="10" style="width: 50px; padding: 5px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; text-align: center;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">(0=无限)</span>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="control-btn" onclick="addReminder()" style="padding: 10px 20px; background: linear-gradient(135deg, #4CAF50, #45a049);">添加提醒</button>
                    <button class="control-btn" onclick="testReminder()" style="padding: 10px 20px; background: linear-gradient(135deg, #2196F3, #1976D2);">测试提醒</button>
                </div>
            </div>
            <div class="reminder-list" id="reminderList" style="max-height: 300px; overflow-y: auto;">
                <div class="empty-list">暂无提醒</div>
            </div>
        </div>
        </section>
        
        <section class="panel" id="panel-chat" style="display:none;">
            <h1 class="page-title">AI 助手</h1>
            
            <div class="section">
                <h2>AI 聊天助手</h2>
                <div class="chat-container" id="chatContainer"></div>
            </div>
        </section>
    </main>
    
    <div class="modal-overlay" id="featureModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">显示端信息</span>
                <button class="modal-close" onclick="closeFeatureModal()">&times;</button>
            </div>
            <div class="browser-detail" id="browserDetail"></div>
            <div class="feature-list" id="featureList"></div>
        </div>
    </div>
    
    <div class="chat-modal-overlay" id="chatTemplateModal">
        <div class="chat-modal-content">
            <div class="chat-modal-header">
                <h3>聊天模板</h3>
                <button class="chat-modal-close" onclick="Chat.hideTemplates()">&times;</button>
            </div>
            <div class="chat-modal-body">
                <div id="chatTemplateList"></div>
                <div class="chat-add-template">
                    <h4>添加新模板</h4>
                    <input type="text" id="newTemplateName" placeholder="模板名称">
                    <textarea id="newTemplateContent" placeholder="模板内容"></textarea>
                    <button class="chat-add-btn" onclick="Chat.addTemplate()">添加模板</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="chat-modal-overlay" id="chatConfigModal">
        <div class="chat-modal-content">
            <div class="chat-modal-header">
                <h3>聊天设置</h3>
                <button class="chat-modal-close" onclick="hideChatConfig()">&times;</button>
            </div>
            <div class="chat-modal-body">
                <div class="chat-config-item">
                    <label for="chatSystemPrompt">系统提示词 (System Prompt)</label>
                    <textarea id="chatSystemPrompt" placeholder="设置 AI 的角色和行为方式..."></textarea>
                    <p class="chat-config-hint">系统提示词用于定义 AI 助手的角色、行为方式和回答风格。</p>
                </div>
                <div class="chat-config-actions">
                    <button class="chat-add-btn" onclick="saveChatConfig()">保存设置</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="chat-modal-overlay" id="editReminderModal">
        <div class="chat-modal-content" style="max-width: 500px;">
            <div class="chat-modal-header">
                <h3>编辑提醒</h3>
                <button class="chat-modal-close" onclick="closeEditReminderModal()">&times;</button>
            </div>
            <div class="chat-modal-body">
                <input type="hidden" id="editReminderId">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <div>
                        <label style="font-size: 12px; color: rgba(255,255,255,0.6); display: block; margin-bottom: 5px;">提醒内容</label>
                        <input type="text" id="editReminderContent" placeholder="输入提醒内容" style="width: 100%; padding: 10px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: rgba(255,255,255,0.6); display: block; margin-bottom: 5px;">提醒时间</label>
                        <input type="time" id="editReminderTime" style="width: 100%; padding: 10px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none;">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <div>
                        <label style="font-size: 12px; color: rgba(255,255,255,0.6); display: block; margin-bottom: 5px;">类型</label>
                        <select id="editReminderType" style="width: 100%; padding: 8px 12px; border: none; border-radius: 6px; background: rgba(255,255,255,0.1); color: #fff; font-size: 13px;">
                            <option value="once">临时提醒</option>
                            <option value="daily">每天提醒</option>
                        </select>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; padding-top: 20px;">
                        <label style="font-size: 13px; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="editReminderMethodVoice"> 语音播报
                        </label>
                        <label style="font-size: 13px; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 5px;">
                            <input type="checkbox" id="editReminderMethodPopup"> 弹窗提示
                        </label>
                    </div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: center; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px;">
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">每次重复:</span>
                        <input type="number" id="editReminderRepeatEachTime" min="1" max="10" value="1" style="width: 50px; padding: 5px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; text-align: center;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">次</span>
                    </div>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: center; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px;">
                    <label style="font-size: 12px; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="editReminderRepeatEnabled"> 重复提醒
                    </label>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">间隔:</span>
                        <input type="number" id="editReminderRepeatInterval" min="1" max="60" value="5" style="width: 50px; padding: 5px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; text-align: center;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">分钟</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">次数:</span>
                        <input type="number" id="editReminderRepeatCount" min="0" max="100" value="10" style="width: 50px; padding: 5px; border: none; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; text-align: center;">
                        <span style="font-size: 12px; color: rgba(255,255,255,0.6);">(0=无限)</span>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button class="control-btn" onclick="closeEditReminderModal()" style="padding: 10px 20px; background: linear-gradient(135deg, #9E9E9E, #757575);">取消</button>
                    <button class="control-btn" onclick="saveEditReminder()" style="padding: 10px 20px; background: linear-gradient(135deg, #4CAF50, #45a049);">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/media-list.js"></script>
    <script src="js/display-list.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/crop.js"></script>
    <script src="js/tts.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/reminder.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
