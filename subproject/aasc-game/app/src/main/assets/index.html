<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AASC 游戏</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>AASC 游戏</h1><p>局域网游戏</p></header>
<section id="lobby"><h2>加入房间</h2><p>与房主连接同一局域网，输入地址或扫描二维码。</p><input id="address" placeholder="房主地址，例如 192.168.1.10:8765"><button id="join">连接房间</button><label id="gamePicker" hidden>游戏 <select id="gameSelect"></select></label><button id="relayHost" hidden>创建游戏房间</button><button id="scan">摄像头扫码</button><label class="file">选择二维码图片<input id="image" type="file" accept="image/*" capture="environment"></label><button id="host" hidden>开启本机房主服务</button><video id="video" playsinline hidden></video><button id="stopScan" hidden>停止扫码</button></section>
<section id="room" hidden><button id="otherRoom">连接其他房间</button><div id="invite" hidden><h2>邀请玩家</h2><p>其他设备扫码或访问：</p><strong id="roomAddress"></strong><canvas id="qr"></canvas></div><div id="gameArea"></div></section>
<p id="notice" role="status"></p><p><a href="third-party-licenses.txt">第三方许可</a></p></main><script src="app.js"></script></body></html>
