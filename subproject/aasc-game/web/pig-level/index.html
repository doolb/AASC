<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6c776">
<title>猪了个猪 · 第 48 关</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
    <header class="topbar"><div><span class="eyebrow">猪了个猪 · 关卡练习</span><h1>第 <span id="levelNumber">48</span> 关</h1></div><div class="top-actions"><label class="level-picker">关卡<select id="levelSelect" aria-label="选择关卡"><option value="2">第 2 关</option><option value="3">第 3 关</option><option value="4">第 4 关</option><option value="5">第 5 关</option><option value="6">第 6 关</option><option value="7">第 7 关</option><option value="8">第 8 关</option><option value="9">第 9 关</option><option value="10">第 10 关</option><option value="11">第 11 关</option><option value="12">第 12 关</option><option value="13">第 13 关</option><option value="14">第 14 关</option><option value="15">第 15 关</option><option value="16">第 16 关</option><option value="17">第 17 关</option><option value="18">第 18 关</option><option value="19">第 19 关</option><option value="20">第 20 关</option><option value="21">第 21 关</option><option value="22">第 22 关</option><option value="23">第 23 关</option><option value="24">第 24 关</option><option value="25">第 25 关</option><option value="26">第 26 关</option><option value="27">第 27 关</option><option value="28">第 28 关</option><option value="29">第 29 关</option><option value="30">第 30 关</option><option value="31">第 31 关</option><option value="32">第 32 关</option><option value="33">第 33 关</option><option value="34">第 34 关</option><option value="35">第 35 关</option><option value="36">第 36 关</option><option value="37">第 37 关</option><option value="38">第 38 关</option><option value="39">第 39 关</option><option value="40">第 40 关</option><option value="41">第 41 关</option><option value="42">第 42 关</option><option value="43">第 43 关</option><option value="44">第 44 关</option><option value="45">第 45 关</option><option value="46">第 46 关</option><option value="47">第 47 关</option><option value="48">第 48 关</option><option value="49">第 49 关</option><option value="50">第 50 关</option><option value="51">第 51 关</option><option value="52">第 52 关</option><option value="53">第 53 关</option><option value="54">第 54 关</option><option value="55">第 55 关</option><option value="56">第 56 关</option><option value="57">第 57 关</option><option value="58">第 58 关</option><option value="59">第 59 关</option><option value="60">第 60 关</option><option value="61">第 61 关</option><option value="62">第 62 关</option><option value="63">第 63 关</option><option value="64">第 64 关</option><option value="65">第 65 关</option><option value="66">第 66 关</option><option value="67">第 67 关</option><option value="68">第 68 关</option><option value="69">第 69 关</option><option value="70">第 70 关</option><option value="82">第 82 关</option></select></label><button class="text-button" id="resetButton" type="button">重新开始</button></div></header>
    <section class="game-card" aria-label="游戏棋盘">
        <div class="game-meta"><span id="remaining">剩余 95 只</span><span id="ropeCount">✂ 还需 3 把剪刀</span></div>
        <div id="board" class="board" role="group" aria-label="点击小猪移动"></div>
        <div id="win" class="win" hidden><div class="win-card"><span class="win-icon">✦</span><strong>挑战成功！</strong><p>所有小猪都安全离开了</p><button id="winReset" type="button">再玩一次</button></div></div>
        <div id="failure" class="win" hidden><div class="win-card"><span class="win-icon">💥</span><strong>炸弹爆炸了</strong><p>撤回一步或重新开始</p><button id="failureUndo" type="button">撤回一步</button><button id="failureReset" type="button">重新开始</button></div></div>
    </section>
    <section class="controls" aria-label="步骤控制">
        <div class="control-heading"><div><span class="eyebrow">通关步骤</span><h2 id="stepText">准备开始</h2></div><label class="switch-label"><input id="hintToggle" type="checkbox" checked><span class="switch"></span><span>步骤提示</span></label></div>
        <p id="status" class="status" aria-live="polite">点小猪，或使用步骤按钮查看解法。</p>
        <div class="progress"><button id="previous" class="step-button" type="button" aria-label="上一步">‹</button><input id="slider" type="range" min="0" value="0" aria-label="步骤进度"><button id="next" class="step-button primary" type="button" aria-label="下一步">›</button></div>
        <div class="progress-labels"><span id="progressText">0 / 176</span><button id="undo" class="undo" type="button">↶ 撤回一步</button></div>
    </section>
    <p class="footnote" id="ruleText">剪刀猪离场后会解除一根绳；绳子全部解开后才能移动绳子猪。</p>
</main>
<script type="module" src="./app.mjs"></script>
</body>
</html>
