        function handleRestoreState(state) {
            if (!state) return;
            
            if (state.rotation !== undefined) {
                currentRotation = state.rotation;
                applyRotation();
            }
            
            if (state.fit !== undefined) {
                applyFit(state.fit);
            }
            
            if (state.crop !== undefined) {
                currentCrop = state.crop;
                applyCrop();
            }
            
            if (state.volume !== undefined) {
                mediaVideo.volume = state.volume / 100;
            }
            
            if (state.currentMedia) {
                showMedia(state.currentMedia);
            }
        }
        
        function extractFileName(url) {
            try {
                const urlParts = url.split('/');
                let fileName = urlParts[urlParts.length - 1].split('?')[0];
                fileName = decodeURIComponent(fileName);
                const dotIndex = fileName.lastIndexOf('.');
                if (dotIndex > 0) {
                    fileName = fileName.substring(0, dotIndex);
                }
                return fileName;
            } catch (e) {
                return '';
            }
        }
        
        <!-- 批量播放模式：本地自循环播放列表 -->
        let playlistState = null;
        let savedAutoTts = null;

        function stopPlaylist() {
            if (!playlistState) return;
            playlistState.active = false;
            stopHtmlScroll();
            if (playlistState.timer) {
                clearTimeout(playlistState.timer);
                playlistState.timer = null;
            }
            if (playlistState.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', playlistState.videoEndedHandler);
                playlistState.videoEndedHandler = null;
            }
            if (savedAutoTts !== null) {
                autoTtsEnabled = savedAutoTts;
                savedAutoTts = null;
            }
            playlistState = null;
        }

        function sendPlaylistProgress(state) {
            if (!playlistState || !displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            const ps = playlistState;
            const item = ps.playlist[ps.index];
            let width, height;
            if (item) {
                // 回传实际播放尺寸（临时模式控制端无数据，依赖此尺寸做裁剪预览）
                if (item.mediaType === 'video') {
                    width = mediaVideo.videoWidth || undefined;
                    height = mediaVideo.videoHeight || undefined;
                } else {
                    width = mediaImage.naturalWidth || undefined;
                    height = mediaImage.naturalHeight || undefined;
                }
            }
            displayWs.send(JSON.stringify({
                type: 'playlistProgress',
                listId: ps.listId,
                index: ps.index,
                total: ps.playlist.length,
                state: state,
                fileName: item ? item.fileName : '',
                url: item ? item.url : undefined,
                mediaType: item ? item.mediaType : undefined,
                width: width,
                height: height
            }));
        }

        function handlePlaylistStart(data) {
            stopPlaylist();
            savedAutoTts = autoTtsEnabled;
            autoTtsEnabled = !!data.announceName;
            const playlist = data.playlist || [];
            if (playlist.length === 0) {
                stopPlaylist();
                return;
            }
            const resumeIndex = Math.max(Math.min(data.resumeIndex || 0, playlist.length - 1), 0);
            playlistState = {
                listId: data.listId,
                playlist: playlist,
                interval: (data.interval || 0) * 1000,
                loop: !!data.loop,
                index: resumeIndex,
                timer: null,
                videoEndedHandler: null,
                active: true,
                paused: false
            };
            playCurrentItem();
        }

        function playCurrentItem() {
            if (!playlistState || !playlistState.active || playlistState.paused) return;
            const ps = playlistState;
            const item = ps.playlist[ps.index];
            if (!item) {
                finishPlaylist();
                return;
            }
            // 清除上一项残留的定时器/ended 监听/加载失败回调，
            // 防止切换时重复触发 next 跳过媒体项
            if (ps.timer) {
                clearTimeout(ps.timer);
                ps.timer = null;
            }
            if (ps.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                ps.videoEndedHandler = null;
            }
            mediaVideo.onerror = null;
            mediaImage.onerror = null;
            const mediaData = item.url
                ? { type: 'url', url: item.url, fileName: item.fileName, mediaType: item.mediaType }
                : { type: 'base64', data: item.data, fileName: item.fileName, mediaType: item.mediaType, mimeType: item.mimeType };
            showMedia(mediaData);
            // 媒体加载完成后补报一次进度（带实际尺寸，供控制端裁剪预览）
            const reportSizeOnce = () => {
                if (playlistState && playlistState.paused) {
                    sendPlaylistProgress('paused');
                } else {
                    sendPlaylistProgress('playing');
                }
            };
            if (item.mediaType === 'video') {
                mediaVideo.addEventListener('loadedmetadata', reportSizeOnce, { once: true });
            } else if (item.mediaType === 'html') {
                mediaHtml.addEventListener('load', reportSizeOnce, { once: true });
            } else {
                mediaImage.addEventListener('load', reportSizeOnce, { once: true });
            }
            if (item.mediaType === 'video') {
                // 视频用自己的时长播放，播完后再等间隔
                mediaVideo.loop = false;
                ps.videoEndedHandler = function() {
                    mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                    ps.videoEndedHandler = null;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                mediaVideo.addEventListener('ended', ps.videoEndedHandler);
                mediaVideo.onerror = function() {
                    // 视频加载失败：等间隔后播下一个，不卡死循环
                    mediaVideo.onerror = null;
                    if (ps.paused) return;
                    if (ps.videoEndedHandler) {
                        mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                        ps.videoEndedHandler = null;
                    }
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
            } else {
                // 图片按间隔时间切换
                mediaImage.onerror = function() {
                    // 图片加载失败：等间隔后播下一个，不卡死循环
                    mediaImage.onerror = null;
                    if (ps.paused) return;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                ps.timer = setTimeout(playlistNext, ps.interval);
            }
            sendPlaylistProgress('playing');
        }

        function playlistNext() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            if (ps.index + 1 >= ps.playlist.length) {
                if (ps.loop) {
                    ps.index = 0;
                    playCurrentItem();
                } else {
                    finishPlaylist();
                }
            } else {
                ps.index++;
                playCurrentItem();
            }
        }

        function playlistPrev() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.index = ps.index - 1 < 0 ? (ps.loop ? ps.playlist.length - 1 : 0) : ps.index - 1;
            playCurrentItem();
        }

        function playlistJump(index) {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            if (index < 0 || index >= ps.playlist.length) return;
            ps.index = index;
            playCurrentItem();
        }

        function playlistPause() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.paused = true;
            stopHtmlScroll();
            if (ps.timer) {
                clearTimeout(ps.timer);
                ps.timer = null;
            }
            if (ps.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                ps.videoEndedHandler = null;
                mediaVideo.pause();
            }
            // 清除加载失败回调，防止 pause 后 error 事件重新设置定时器自动播下一项
            mediaVideo.onerror = null;
            mediaImage.onerror = null;
            sendPlaylistProgress('paused');
        }

        function playlistResume() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.paused = false;
            const item = ps.playlist[ps.index];
            if (item && item.mediaType === 'video' && !ps.timer && !ps.videoEndedHandler) {
                // 暂停时视频正在播放 → 继续播放视频
                mediaVideo.play().catch(e => console.log('播放被阻止'));
                ps.videoEndedHandler = function() {
                    mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                    ps.videoEndedHandler = null;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                mediaVideo.addEventListener('ended', ps.videoEndedHandler);
            } else {
                // 图片或间隔等待中 → 重新计时
                ps.timer = setTimeout(playlistNext, ps.interval);
                // html 项暂停时滚动已冻结，恢复时继续滚动
                if (item && item.mediaType === 'html') {
                    startHtmlScroll(mediaHtml, item.htmlScroll || null);
                }
            }
            sendPlaylistProgress('playing');
        }

        function finishPlaylist() {
            if (!playlistState) return;
            const info = {
                listId: playlistState.listId,
                index: playlistState.index,
                total: playlistState.playlist.length,
                state: 'finished'
            };
            playlistState.active = false;
            stopHtmlScroll();
            if (playlistState.timer) {
                clearTimeout(playlistState.timer);
                playlistState.timer = null;
            }
            if (playlistState.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', playlistState.videoEndedHandler);
                playlistState.videoEndedHandler = null;
            }
            if (savedAutoTts !== null) {
                autoTtsEnabled = savedAutoTts;
                savedAutoTts = null;
            }
            playlistState = null;
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({ type: 'playlistProgress', ...info }));
            }
        }

        function handlePlaylistControl(data) {
            if (!playlistState) return;
            switch (data.action) {
                case 'pause':
                    playlistPause();
                    break;
                case 'resume':
                    playlistResume();
                    break;
                case 'next':
                    playlistNext();
                    break;
                case 'prev':
                    playlistPrev();
                    break;
                case 'jump':
                    playlistJump(data.index);
                    break;
                case 'stop':
                    const info = {
                        listId: playlistState.listId,
                        index: playlistState.index,
                        total: playlistState.playlist.length,
                        state: 'stopped'
                    };
                    stopPlaylist();
                    if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                        displayWs.send(JSON.stringify({ type: 'playlistProgress', ...info }));
                    }
                    break;
            }
        }

        // .mhtml（MIME 打包网页）转纯 HTML：提取主文档，内嵌资源转为 data: URI。
        // Chromium 对 .mhtml 渲染支持差（直接导航都会 ERR_ABORTED），必须转换后用 srcdoc 渲染
        // quoted-printable 解码为字节数组（=XX 十六进制、行尾 = 软换行）
        function qpToBytes(str) {
            const decoded = str.replace(/=\r?\n/g, '').replace(/=([0-9A-Fa-f]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
            return Uint8Array.from(decoded, c => c.charCodeAt(0));
        }

        function decodePartBody(body, encoding, charset) {
            if (encoding === 'base64') {
                const bytes = Uint8Array.from(atob(body.replace(/\s/g, '')), c => c.charCodeAt(0));
                return new TextDecoder(charset === 'gbk' || charset === 'gb2312' ? 'gbk' : 'utf-8').decode(bytes);
            }
            if (encoding === 'quoted-printable') {
                const bytes = qpToBytes(body);
                return new TextDecoder(charset === 'gbk' || charset === 'gb2312' ? 'gbk' : 'utf-8').decode(bytes);
            }
            return body;
        }

        function mhtmlToHtml(text) {
            const boundaryMatch = text.match(/^--([^\r\n]+)/m);
            if (!boundaryMatch) return null;
            const boundary = boundaryMatch[1].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const parts = text.split(new RegExp('--' + boundary));
            if (parts.length < 2) return null;

            let main = null;
            const resources = new Map();

            for (let i = 1; i < parts.length; i++) {
                const part = parts[i];
                if (!part || part.trim() === '' || part.trim() === '--') continue;
                const headerEnd = part.indexOf('\r\n\r\n');
                const bodyStart = headerEnd === -1 ? part.indexOf('\n\n') : headerEnd;
                if (bodyStart === -1) continue;
                const headersText = part.slice(0, bodyStart);
                const body = part.slice(bodyStart + (headerEnd === -1 ? 2 : 4)).replace(/^[\r\n]+/, '').replace(/[\r\n]+$/, '');
                const headers = {};
                headersText.split(/\r?\n/).forEach(line => {
                    const idx = line.indexOf(':');
                    if (idx > 0) headers[line.slice(0, idx).trim().toLowerCase()] = line.slice(idx + 1).trim();
                });
                const ctype = headers['content-type'] || 'text/html';
                const encoding = (headers['content-transfer-encoding'] || '').toLowerCase();
                const charsetMatch = ctype.match(/charset=([^;]+)/i);
                const charset = charsetMatch ? charsetMatch[1].trim() : 'utf-8';

                if (ctype.startsWith('text/html')) {
                    main = decodePartBody(body, encoding, charset);
                } else {
                    const loc = headers['content-location'] || headers['content-id'] || '';
                    if (loc) {
                        const clean = loc.replace(/^cid:/i, '').replace(/^<|>$/g, '').split('/').pop();
                        const mime = ctype.split(';')[0].trim();
                        let data;
                        if (encoding === 'quoted-printable') {
                            // QP 解码后转回 base64（data URI 用）
                            const bytes = qpToBytes(body);
                            let bin = '';
                            bytes.forEach(b => { bin += String.fromCharCode(b); });
                            data = btoa(bin);
                        } else if (encoding === 'base64') {
                            data = body.replace(/\s/g, '');
                        } else {
                            data = btoa(unescape(encodeURIComponent(body)));
                        }
                        resources.set(clean, { mime: mime, data: data });
                    }
                }
            }
            if (main === null) return null;

            // 重写资源引用为 data: URI（src/href/style url()，支持 cid: 引用）
            const findResource = (loc) => {
                const clean = loc.replace(/^cid:/i, '').replace(/^<|>$/g, '').split('?')[0].split('/').pop();
                return resources.get(clean) || resources.get(loc);
            };
            main = main.replace(/(src|href)=["']([^"']+)["']/gi, (m, attr, loc) => {
                const r = findResource(loc);
                return r ? attr + '="data:' + r.mime + ';base64,' + r.data + '"' : m;
            });
            main = main.replace(/url\(["']?([^"')]+)["']?\)/gi, (m, loc) => {
                const r = findResource(loc);
                return r ? 'url("data:' + r.mime + ';base64,' + r.data + '")' : m;
            });
            return main;
        }

        // HTML 媒体滚动控制器：分页式 / 平滑 / 循环
        let htmlScrollState = null;
        // 当前生效的 html 播放模式（发送未指定时沿用；控制端可实时切换）
        let currentHtmlScroll = null;
        // 当前 html 裁剪缩放倍数（无裁剪=1）；进度上报用
        let currentHtmlScale = 1;
        let htmlProgressTimer = null;

        // html 播放进度上报：滚动比例 + 缩放倍数（控制端进度条显示）
        function reportHtmlProgress() {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            const win = mediaHtml.contentWindow;
            if (!win || !win.document) return;
            const doc = win.document;
            const scrollHeight = Math.max(
                (doc.documentElement && doc.documentElement.scrollHeight) || 0,
                (doc.body && doc.body.scrollHeight) || 0
            );
            const clientHeight = win.innerHeight || mediaHtml.clientHeight;
            let scrollProgress = 0;
            if (scrollHeight > clientHeight) {
                scrollProgress = Math.min(100, Math.round((win.scrollY / (scrollHeight - clientHeight)) * 100));
            }
            displayWs.send(JSON.stringify({
                type: 'htmlProgress',
                scrollProgress: scrollProgress,
                scale: currentHtmlScale,
                mode: currentHtmlScroll ? currentHtmlScroll.mode : 'page',
                loop: currentHtmlScroll ? !!currentHtmlScroll.loop : false
            }));
        }

        function stopHtmlScroll() {
            if (htmlScrollState) {
                if (htmlScrollState.timer) clearInterval(htmlScrollState.timer);
                if (htmlScrollState.rafId) cancelAnimationFrame(htmlScrollState.rafId);
                htmlScrollState = null;
            }
            if (htmlProgressTimer) {
                clearInterval(htmlProgressTimer);
                htmlProgressTimer = null;
            }
        }

        function startHtmlScroll(iframe, htmlScroll) {
            stopHtmlScroll();
            // 进度上报定时器（暂停/恢复/切换统一管理）
            if (!htmlProgressTimer) {
                htmlProgressTimer = setInterval(reportHtmlProgress, 1000);
            }
            const win = iframe.contentWindow;
            if (!win) return;
            const opts = htmlScroll || {};
            // 兼容旧消息：mode='loop' 视为平滑+循环
            const mode = opts.mode === 'loop' ? 'smooth' : (opts.mode || 'page');
            const loop = !!opts.loop || opts.mode === 'loop';
            const pageInterval = opts.pageInterval || 5;
            const speedPx = { slow: 60, medium: 120, fast: 240 }[opts.speed || 'medium'];

            const scrollHeight = Math.max(
                (win.document.documentElement && win.document.documentElement.scrollHeight) || 0,
                (win.document.body && win.document.body.scrollHeight) || 0
            );
            const clientHeight = win.innerHeight || iframe.clientHeight;
            // 内容不溢出时无需滚动
            if (scrollHeight <= clientHeight + 1) return;

            if (mode === 'page') {
                // 分页式：每 pageInterval 秒滚一屏；循环时到底回顶继续
                htmlScrollState = {
                    timer: setInterval(() => {
                        if (!htmlScrollState) return;
                        if (win.scrollY + clientHeight >= scrollHeight - 2) {
                            if (loop) {
                                win.scrollTo(0, 0);
                                return;
                            }
                            stopHtmlScroll();
                            return;
                        }
                        win.scrollBy(0, clientHeight);
                    }, pageInterval * 1000)
                };
            } else {
                // 平滑：匀速滚动；循环时滚到底回顶继续
                let last = performance.now();
                const step = (now) => {
                    if (!htmlScrollState) return;
                    const dt = (now - last) / 1000;
                    last = now;
                    if (win.scrollY + clientHeight >= scrollHeight - 2) {
                        if (loop) {
                            win.scrollTo(0, 0);
                        } else {
                            stopHtmlScroll();
                            return;
                        }
                    }
                    win.scrollBy(0, speedPx * dt);
                    htmlScrollState.rafId = requestAnimationFrame(step);
                };
                htmlScrollState = { rafId: requestAnimationFrame(step) };
            }
        }

        // TTS 播报 + 临时媒体信息上报（各媒体类型共用）
        function announceAndReport(mediaName, data) {
            if (autoTtsEnabled && mediaName) {
                const displayName = extractFileName(mediaName);
                if (displayName) {
                    playTTS(displayName);
                }
            }

            if (!data.temp) return;
            const sendTempInfo = () => {
                if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                let w, h;
                if (data.mediaType === 'video') {
                    w = mediaVideo.videoWidth;
                    h = mediaVideo.videoHeight;
                } else if (data.mediaType !== 'html') {
                    w = mediaImage.naturalWidth;
                    h = mediaImage.naturalHeight;
                }
                displayWs.send(JSON.stringify({
                    type: 'tempMediaInfo',
                    fileName: data.fileName || mediaName || '',
                    mediaType: data.mediaType,
                    width: w || undefined,
                    height: h || undefined
                }));
            };
            const readyTarget = data.mediaType === 'video' ? mediaVideo : (data.mediaType === 'html' ? mediaHtml : mediaImage);
            const readyEvent = data.mediaType === 'video' ? 'loadedmetadata' : 'load';
            if (data.mediaType === 'html') {
                // html 无固有尺寸，加载完成即上报（不含宽高）
                readyTarget.addEventListener(readyEvent, sendTempInfo, { once: true });
            } else if (readyTarget.readyState >= 1 || (readyTarget.complete && readyTarget.naturalWidth > 0)) {
                sendTempInfo();
            } else {
                readyTarget.addEventListener(readyEvent, sendTempInfo, { once: true });
            }
        }

        function showMedia(data) {
            mediaVideo.pause();
            mediaVideo.src = '';
            mediaVideo.load();
            waitingMessage.style.display = 'none';

            if (data.mediaType === 'html') {
                // HTML 媒体：iframe 铺满纯展示，跳过 img/video 与裁剪
                stopHtmlScroll();
                mediaImage.style.display = 'none';
                mediaImage.removeAttribute('src');
                mediaVideo.pause();
                mediaVideo.src = '';
                mediaVideo.load();
                mediaVideo.style.display = 'none';
                mediaHtml.style.display = 'block';
                // 发送未指定模式时沿用显示端当前模式；指定则更新记忆
                if (data.htmlScroll) currentHtmlScroll = data.htmlScroll;
                mediaHtml.onload = () => startHtmlScroll(mediaHtml, data.htmlScroll || currentHtmlScroll);
                // html 播放进度上报（滚动比例 + 缩放倍数）
                if (!htmlProgressTimer) {
                    htmlProgressTimer = setInterval(reportHtmlProgress, 1000);
                }
                let mediaName = data.fileName || 'HTML内容';
                if (data.type === 'url') {
                    mediaHtml.srcdoc = '';
                    if (/\.mhtml?$/i.test(data.url)) {
                        // .mhtml 浏览器无法直接渲染：fetch 后转纯 HTML 用 srcdoc 显示
                        fetch(data.url, { credentials: 'same-origin' })
                            .then(r => r.text())
                            .then(text => {
                                const html = mhtmlToHtml(text);
                                mediaHtml.srcdoc = html || '<p style="color:#fff;padding:20px">无法解析该 .mhtml 文件</p>';
                            })
                            .catch(() => {
                                mediaHtml.srcdoc = '<p style="color:#fff;padding:20px">加载 .mhtml 失败</p>';
                            });
                    } else {
                        mediaHtml.src = data.url;
                    }
                    const urlParts = data.url.split('/');
                    mediaName = decodeURIComponent(urlParts[urlParts.length - 1].split('?')[0]) || mediaName;
                } else {
                    const bytes = Uint8Array.from(atob(data.data), c => c.charCodeAt(0));
                    const html = new TextDecoder().decode(bytes);
                    mediaHtml.src = '';
                    mediaHtml.srcdoc = html;
                }
                fileNameDisplay.textContent = mediaName;
                announceAndReport(mediaName, data);
                return;
            }

            // 非 html 媒体：取消滚动并隐藏 iframe（html 切回图片/视频时清理）
            stopHtmlScroll();
            mediaHtml.style.display = 'none';
            mediaHtml.removeAttribute('src');
            mediaHtml.srcdoc = '';

            let mediaName = '';

            if (data.type === 'url') {
                if (data.mediaType === 'video') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'block';
                    mediaVideo.src = data.url;
                    mediaVideo.load();
                    mediaVideo.play().catch(e => console.log('自动播放被阻止'));
                    mediaVideo.onloadedmetadata = () => applyCrop();
                    mediaVideo.ontimeupdate = function() {
                        if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                        var d = mediaVideo.duration;
                        if (!d) return;
                        displayWs.send(JSON.stringify({
                            type: 'videoProgress',
                            currentTime: mediaVideo.currentTime,
                            duration: d
                        }));
                    };
                } else {
                    mediaVideo.style.display = 'none';
                    mediaImage.style.display = 'block';
                    mediaImage.src = data.url;
                    mediaImage.onload = () => applyCrop();
                }
                const urlParts = data.url.split('/');
                mediaName = decodeURIComponent(urlParts[urlParts.length - 1].split('?')[0]) || '来自URL';
                fileNameDisplay.textContent = mediaName;
            } else if (data.type === 'base64') {
                const mimeType = data.mimeType || 'application/octet-stream';
                const src = 'data:' + mimeType + ';base64,' + data.data;
                
                if (data.mediaType === 'video') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'block';
                    mediaVideo.src = src;
                    mediaVideo.load();
                    mediaVideo.play().catch(e => console.log('自动播放被阻止'));
                    mediaVideo.onloadedmetadata = () => applyCrop();
                } else {
                    mediaVideo.style.display = 'none';
                    mediaImage.style.display = 'block';
                    mediaImage.src = src;
                    mediaImage.onload = () => applyCrop();
                }
                mediaName = data.fileName || '未知文件';
                fileNameDisplay.textContent = mediaName;
            }

            announceAndReport(mediaName, data);
        }

        function handleControl(data) {
            switch (data.action) {
                case 'rotate':
                    currentRotation = data.value !== undefined ? data.value : data.rotation;
                    applyRotation();
                    applyCrop();
                    break;
                    
                case 'fit':
                    applyFit(data.value);
                    break;

                case 'htmlScroll':
                    // 控制端切换当前 html 播放模式（未指定模式时记忆沿用）
                    if (data.value) currentHtmlScroll = data.value;
                    if (mediaHtml.style.display !== 'none') {
                        startHtmlScroll(mediaHtml, currentHtmlScroll);
                    }
                    break;

                case 'htmlScrollTo':
                    // 控制端拖动进度条：同步滚动到对应位置（0-100）
                    if (mediaHtml.style.display !== 'none') {
                        const win = mediaHtml.contentWindow;
                        if (win && win.document) {
                            const doc = win.document;
                            const scrollHeight = Math.max(
                                (doc.documentElement && doc.documentElement.scrollHeight) || 0,
                                (doc.body && doc.body.scrollHeight) || 0
                            );
                            const clientHeight = win.innerHeight || mediaHtml.clientHeight;
                            win.scrollTo(0, (data.value / 100) * (scrollHeight - clientHeight));
                        }
                    }
                    break;
                    
                case 'play':
                    if (data.value === true) {
                        if (mediaHtml.style.display !== 'none') {
                            // html 模式：恢复滚动播放（从当前滚动位置继续）
                            startHtmlScroll(mediaHtml, currentHtmlScroll);
                        } else {
                            mediaVideo.play().catch(e => console.log('播放被阻止'));
                        }
                    } else {
                        if (mediaHtml.style.display !== 'none') {
                            // html 模式：暂停滚动（滚动位置保留）
                            stopHtmlScroll();
                        } else {
                            mediaVideo.pause();
                        }
                    }
                    break;
                    
                case 'seek':
                    if (mediaVideo.duration) {
                        mediaVideo.currentTime = (data.value / 100) * mediaVideo.duration;
                    }
                    break;
                    
                case 'volume':
                    mediaVideo.volume = data.value / 100;
                    break;
                    
                case 'cropDebug':
                    _cropDebug = !!data.value;
                    break;

                case 'crop':
                    currentCrop = data.value;
                    currentFit = 'crop';
                    scheduleCropApply();
                    break;
                    
                case 'customCrop':
                    applyCustomCrop(data.value);
                    sendCommandAck('customCrop', true, '自定义裁剪已应用');
                    break;
            }
        }
        
        function getPersistentDisplayId() {
            let id = localStorage.getItem('displayId');
            if (!id) {
                id = 'display-' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('displayId', id);
            }
            return id;
        }

        function applyLogReportConfig(data) {
            logReportConfig = data;
            if (data.enabled) {
                if (!_originalConsole) {
                    _originalConsole = {
                        log: console.log,
                        info: console.info,
                        warn: console.warn,
                        error: console.error,
                        debug: console.debug
                    };
                    console.log = function() {};
                    console.info = function() {};
                    console.warn = function() {};
                    console.error = function() {};
                    console.debug = function() {};
                }
            } else {
                if (_originalConsole) {
                    console.log = _originalConsole.log;
                    console.info = _originalConsole.info;
                    console.warn = _originalConsole.warn;
                    console.error = _originalConsole.error;
                    console.debug = _originalConsole.debug;
                    _originalConsole = null;
                }
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const id = getPersistentDisplayId();
            const wsUrl = `${protocol}//${window.location.host}/display?displayId=${id}`;
            
            displayWs = new WebSocket(wsUrl);
            
            displayWs.onopen = function() {
                setConnectionStatus('connected', '已连接');
                sendCanvasSize();
                sendBrowserInfo();
                declareCapabilities();
                sendVoiceStatus();
                
                if (!isAlwaysListening) {
                    pendingAutoStart = true;
                    isAlwaysListening = true;
                    console.log('标记自动启动监听模式，等待服务器能力确认');
                }
            };
            
            displayWs.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('[显示端] 收到消息:', data.type, data);
                    setCorrelationId(data.correlationId);

                    if (data.type === 'serverStartTime') {
                        const storedTime = localStorage.getItem('serverStartTime');
                        if (storedTime && storedTime !== String(data.time)) {
                            localStorage.setItem('serverStartTime', data.time);
                            location.reload();
                        } else {
                            localStorage.setItem('serverStartTime', data.time);
                        }
                        return;
                    }
                    
                    if (data.type === 'displayId') {
                        displayId = data.id;
                        return;
                    }
                    
                    if (data.type === 'capabilitiesUpdated') {
                        handleCapabilitiesUpdated(data);
                        return;
                    }

                    if (data.type === 'asrAudio') {
                        handleAsrAudio(data);
                        return;
                    }

                    if (data.type === 'asrConfig') {
                        if (data.localAsrEnabled && !localAsrAvailable) {
                            forceInitLocalAsr();
                        } else if (!data.localAsrEnabled && localAsrAvailable) {
                            if (localAsrStreaming) {
                                SherpaASR.stopStreaming();
                                localAsrStreaming = false;
                            }
                        }
                        return;
                    }

                    if (data.type === 'logReportConfig') {
                        applyLogReportConfig(data);
                        return;
                    }

                    if (data.type === 'control') {
                        handleControl(data);
                        if (data.action !== 'crop') {
                            sendCommandAck('control', true, data.action);
                        }
                    } else if (data.type === 'tts') {
                        handleTTS(data);
                        sendCommandAck('tts', true, data.action);
                    } else if (data.type === 'reminder') {
                        handleReminder(data);
                        sendCommandAck('reminder', true, data.action);
                    } else if (data.type === 'restoreState') {
                        handleRestoreState(data.state);
                        sendCommandAck('restoreState', true, 'state restored');
                    } else if (data.type === 'voiceCommand') {
                        handleVoiceCommand(data);
                        sendCommandAck('voiceCommand', true, data.action);
                    } else if (data.type === 'task:execute') {
                        executeTask(data.payload);
                    } else if (data.type === 'task:stop') {
                        // 停止显示端渲染任务，清理覆盖层
                        var stopInstanceId = data.instanceId;
                        console.log('[显示端] 停止任务:', stopInstanceId);
                        var overlayEl = document.getElementById('renderTask-' + stopInstanceId);
                        if (overlayEl) overlayEl.remove();
                        var styleEl = document.getElementById('renderTaskStyle-' + stopInstanceId);
                        if (styleEl) styleEl.remove();
                        if (window._renderTaskUpdates) {
                            delete window._renderTaskUpdates[stopInstanceId];
                        }
                    } else if (data.type === 'task:renderUpdate') {
                        // 渲染任务实时数据更新
                        var fn = window._renderTaskUpdates && window._renderTaskUpdates[data.instanceId];
                        if (fn) fn(data.data, data.sourceInstanceId);
                        sendCommandAck('renderUpdate', true, null);
                    } else if (data.type === 'hardwareStats') {
                        // 兼容 direct hardwareStats 消息（旧转发方式）
                        for (var _rid in window._renderTaskUpdates) {
                            window._renderTaskUpdates[_rid](data.data);
                        }
                        sendCommandAck('hardwareStats', true, null);
                    } else if (data.type === 'playlistStart') {
                        handlePlaylistStart(data);
                        sendCommandAck('playlistStart', true, data.listId);
                    } else if (data.type === 'playlistControl') {
                        handlePlaylistControl(data);
                        sendCommandAck('playlistControl', true, data.action);
                    } else {

        async function detectCapabilities() {
            const capabilities = {
                mediaRendering: true,
                voicePlayback: true,
                voiceRecording: false,
                voiceRecognition: false,
                displayText: true,
                webgl: (function() {
                    try {
                        const c = document.createElement('canvas');
                        return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
                    } catch(e) { return false; }
                })(),
                webgpu: !!navigator.gpu && await (async function () {
                    try {
                        var diag = [];
                        try {
                            var glCanvas = document.createElement('canvas');
                            var gl = glCanvas.getContext('webgl2') || glCanvas.getContext('webgl');
                            if (gl) {
                                var dbg = gl.getExtension('WEBGL_debug_renderer_info');
                                if (dbg) {
                                    diag.push('GL_VENDOR=' + gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
                                    diag.push('GL_RENDERER=' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
                                }
                            }
                        } catch (e) {}
                        diag.push('UA=' + (navigator.userAgent.match(/Chrome\/(\d+\.\d+)/) || ['?'])[1]);

                        var a = await navigator.gpu.requestAdapter();
                        var path = 'default';
                        if (!a) { a = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }); path = 'high-performance'; }
                        if (!a) { a = await navigator.gpu.requestAdapter({ powerPreference: 'low-power' }); path = 'low-power'; }
                        if (!a) {
                            diag.push('RESULT=三轮回退全部返回null');
                            capabilities._webgpuDiag = diag.join(' | ');
                            return false;
                        }
                        try {
                            var info = await a.requestAdapterInfo();
                            diag.push('VENDOR=' + (info.vendor || '?'));
                            diag.push('ARCH=' + (info.architecture || '?'));
                            diag.push('DEVICE=' + (info.device || '?'));
                        } catch (e) {}
                        diag.push('PREF=' + path);
                        capabilities._webgpuDiag = diag.join(' | ');
                        a.destroy();
                        return true;
                    } catch (e) {
                        capabilities._webgpuDiag = 'EXCEPTION: ' + e.message;
                        return false;
                    }
                })()
            };
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                capabilities.voiceRecording = true;
                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                capabilities.voiceRecording = false;
            }
            
            if (localAsrAvailable || voiceSupported) {
                capabilities.voiceRecognition = true;
            } else {
                try {
                    const response = await fetch('/api/asr/status');
                    const result = await response.json();
                    if (result.available || result.ready) {
                        capabilities.voiceRecognition = true;
                    }
                } catch (e) {
                    capabilities.voiceRecognition = false;
                }
            }
            
            return capabilities;
        }

        function handleCapabilitiesUpdated(data) {
            if (data.capabilities) {

                // 媒体渲染能力关闭 → 停止媒体播放，清空画面
                if (!data.capabilities.mediaRendering) {

                // 语音播放能力关闭 → 停止 TTS，清空队列
                if (!data.capabilities.voicePlayback) {
                    ttsQueue = [];
                    ttsAudio.pause();
                    ttsAudio.currentTime = 0;
                    isPlayingTts = false;
                    voiceTextDisplay.className = 'voice-text-hidden';
                }

                // 语音录音能力关闭 → 停止录音
                if (!data.capabilities.voiceRecording && isListening) {
                    stopVoiceRecording();
                }

                // 语音识别能力关闭 → 停止 ASR 和录音
                if (!data.capabilities.voiceRecognition) {
                    if (localAsrStreaming) {
                        SherpaASR.stopStreaming();
                        localAsrStreaming = false;
                    }
                    if (isListening) {
                        stopVoiceRecording();
                    }
                }

                // 文本显示能力关闭 → 隐藏提醒弹窗和文字覆盖层
                if (!data.capabilities.displayText) {
                    const popup = document.querySelector('.reminder-popup');
                    if (popup) popup.remove();
                    voiceTextDisplay.className = 'voice-text-hidden';
                }

                // 初始能力从服务器到达 → 检查是否要自动启动录音
                if (pendingAutoStart && isAlwaysListening && !isListening) {
                    pendingAutoStart = false;
                    if (data.capabilities.voiceRecording && data.capabilities.voiceRecognition) {
                        console.log('[能力] 服务器能力已确认，启动录音');
                        startVoiceRecording();
                    } else {
                        console.log('[能力] 服务器禁止语音录制，跳过自动启动');
                    }
                }

                // 动态开启录音 → 如果能力从关闭变为开启，启动录音
                if (!pendingAutoStart && isAlwaysListening && !isListening &&
                    data.capabilities.voiceRecording && data.capabilities.voiceRecognition) {
                    // 检测是否有能力从关闭变为开启（prevCaps 存在时才算转变，避免与初始 pendingAutoStart 冲突）
                    if (prevCaps && (!prevCaps.voiceRecording || !prevCaps.voiceRecognition)) {
                        console.log('[能力] 录音能力已开启，启动录音');
                        startVoiceRecording();
                    }
                }
            }
        }

        async function startVoiceRecording() {
            if (isListening) return;
            
            if (currentCapabilities && !currentCapabilities.voiceRecording) {
                console.log('[能力] 无语音录音能力，跳过录音启动');
                return;
            }

            if (currentCapabilities && !currentCapabilities.voiceRecognition) {
                console.log('[能力] 无语音识别能力，跳过录音启动');
                return;
            }

            if (Date.now() < voiceCooldownUntil) {
                const remainingMs = voiceCooldownUntil - Date.now();
                console.log('显示端语音冷却中，剩余' + Math.ceil(remainingMs / 1000) + '秒');
                if (isAlwaysListening) {
                    setTimeout(() => startVoiceRecording(), remainingMs + 500);
                }
                return;
            }
            
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 16000
                    }
                });
                
                if (localAsrAvailable && SherpaASR.isLoaded) {
                    const started = await SherpaASR.startStreaming(micStream);
                    if (started) {
                        localAsrStreaming = true;
                        isListening = true;
                        hasSpeech = false;
                        speechStartTime = null;
                        silenceStartTime = null;
                        console.log('显示端本地ASR流式识别已启动');
                        sendVoiceStatus();
                        return;
                    }
                }
                
                mediaRecorder = new MediaRecorder(micStream);
                audioChunks = [];
                speechChunks = [];
                collectingSpeech = false;

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        audioChunks.push(e.data);

                        if (collectingSpeech || hasSpeech) {
                            collectingSpeech = true;
                            speechChunks.push(e.data);
                        } else if (speechChunks.length === 0) {
                            speechChunks.push(e.data);
                        }
                    }
                };

                mediaRecorder.onstop = async () => {
                    const useChunks = collectingSpeech ? speechChunks : audioChunks;
                    if (useChunks.length > 0) {
                        const audioBlob = new Blob(useChunks, { type: 'audio/webm' });
                        await sendAudioForRecognition(audioBlob);
                    }

                    if (isListening) {
                        audioChunks = [];
                        speechChunks = [];
                        collectingSpeech = false;
                        try {
                            mediaRecorder.start();
                            startSilenceDetection();
                        } catch (e) {
                            console.log('重新启动录音失败:', e);
                            isListening = false;
                            sendVoiceStatus();
                        }
                    }
                };
                
                mediaRecorder.start();
                isListening = true;
                hasSpeech = false;
                speechStartTime = null;
                silenceStartTime = null;
                console.log('显示端语音录制已启动');
                sendVoiceStatus();
                startSilenceDetection();
                
            } catch (e) {
                console.error('显示端麦克风访问失败:', e);
                isListening = false;
                voiceSupported = false;
                sendVoiceStatus();
            }
        }
        
        function startSilenceDetection() {
            if (!micStream) return;
            
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);
                
                const SILENCE_THRESHOLD = 0.01;
                const SILENCE_DURATION = 1000;
                const MIN_SPEECH_DURATION = 300;
                
                const checkSilence = () => {
                    if (!isListening || !analyser) return;
                    
                    const timeDomainData = new Uint8Array(analyser.fftSize);
                    analyser.getByteTimeDomainData(timeDomainData);
                    
                    let sumSquares = 0;
                    for (let i = 0; i < timeDomainData.length; i++) {
                        const normalized = (timeDomainData[i] - 128) / 128;
                        sumSquares += normalized * normalized;
                    }
                    const rms = Math.sqrt(sumSquares / timeDomainData.length);
                    
                    if (rms >= SILENCE_THRESHOLD) {
                        if (!hasSpeech && !speechStartTime) {
                            speechStartTime = Date.now();
                        }
                        hasSpeech = true;
                        silenceStartTime = null;
                    } else if (hasSpeech) {
                        if (!silenceStartTime) {
                            silenceStartTime = Date.now();
                        }
                        if (Date.now() - silenceStartTime > SILENCE_DURATION) {
                            const speechDuration = speechStartTime ? Date.now() - speechStartTime : 0;
                            if (speechDuration >= MIN_SPEECH_DURATION) {
                                console.log('显示端检测到静音，发送识别');
                                if (mediaRecorder && mediaRecorder.state === 'recording') {
                                    mediaRecorder.stop();
                                }
                                stopSilenceDetection();
                                return;
                            }
                        }
                    }
                    
                    requestAnimationFrame(checkSilence);
                };
                
                requestAnimationFrame(checkSilence);
            } catch (e) {
                console.log('静音检测初始化失败:', e);
            }
        }
        
        function stopSilenceDetection() {
            if (audioContext) {
                audioContext.close();
                audioContext = null;
                analyser = null;
            }
        }
        
        async function sendAudioForRecognition(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                
                const response = await fetch('/api/asr/recognize', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success' && data.text) {
                    const recognizedText = data.text.trim();
                    console.log('显示端识别结果:', recognizedText);
                    
                    consecutiveIgnoreCount = 0;
                    
                    updateVoiceTextDisplay(recognizedText, true);
                    
                    if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                        displayWs.send(JSON.stringify({
                            type: 'voiceInput',
                            text: recognizedText,
                            isFinal: true,
                            fullText: recognizedText
                        }));
                    }
                    
                    setTimeout(() => {
                        updateVoiceTextDisplay('', true);
                    }, 3000);
                } else if (data.status === 'ignored') {
                    consecutiveIgnoreCount++;
                    console.log('显示端无效语音输入，已忽略 (' + consecutiveIgnoreCount + '/' + MAX_CONSECUTIVE_IGNORES + '):', data.text);
                    updateVoiceTextDisplay('', true);
                    
                    if (consecutiveIgnoreCount >= MAX_CONSECUTIVE_IGNORES) {
                        const cooldownMs = VOICE_COOLDOWN_MS * Math.pow(2, Math.min(consecutiveIgnoreCount - MAX_CONSECUTIVE_IGNORES, 3));
                        voiceCooldownUntil = Date.now() + cooldownMs;
                        console.log('显示端连续' + consecutiveIgnoreCount + '次无效输入，冷却' + (cooldownMs / 1000) + '秒');
                        isListening = false;
                        sendVoiceStatus();
                        
                        if (isAlwaysListening) {
                            setTimeout(() => {
                                if (Date.now() >= voiceCooldownUntil) {
                                    consecutiveIgnoreCount = 0;
                                    startVoiceRecording();
                                }
                            }, cooldownMs);
                        }
                    } else if (isAlwaysListening) {
                        setTimeout(() => startVoiceRecording(), 500);
                    }
                }
            } catch (e) {
                console.error('显示端语音识别请求失败:', e);
            }
        }
