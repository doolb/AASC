                        voiceConversationTarget = data.target || null;
                        const expiresAt = Number(data.expiresAt);
                        voiceConversationExpiresAt = Number.isFinite(expiresAt) && expiresAt > 0 ? expiresAt : null;
                        if (voiceConversationState === 'disabled') {
                            clearVoiceConversationTimer();
                            clearVoiceConversationCountdown();
                            clearVoiceConversationConfirmation();
                            stopVoiceRecording();
                        } else if (voiceConversationState === 'waitingWake') {
                            clearVoiceConversationTimer();
                            clearVoiceConversationCountdown();
                            clearVoiceConversationConfirmation();
                        } else {
                            startVoiceConversationCountdown();
                        }
                        updateVoiceStatusDisplay();
                        return;
                    }

                    if (data.type === 'voiceVadConfig') {
                        vadThreshold = normalizeVadThreshold(data.threshold);
                        console.log('[语音] VAD 阈值已更新:', vadThreshold);
                        return;
                    }

                    if (data.type === 'voiceVadNoiseTest') {
                        startVoiceNoiseTest(data.requestId, data.durationMs);
                        return;
                    }

                    if (data.type === 'asrAudio') {
                        void handleAsrAudio(data);
                        return;
                    }

                    if (data.type === 'voiceprintConfig') {
                        asrDenoiseEnabled = !!data.denoise;
                        voiceprintEnabled = !!data.enabled;
                        voiceprintMultiSpeaker = !!data.multiSpeaker;
                        voiceprintMultiMode = data.multiMode || 'fast';
                        voiceprintSpeakerCount = data.speakerCount || 'AUTO';
                        if (nativeVoiceprintAvailable) {
                            nativeBridge.voiceprintConfigure(JSON.stringify({
                                enabled: voiceprintEnabled,
                                threshold: data.threshold || 0.5,
                                multiSpeaker: voiceprintMultiSpeaker,
                                multiMode: voiceprintMultiMode,
                                speakerCount: voiceprintSpeakerCount
                            }));
                            if (voiceprintEnabled) {
                                // 拉取权威库重建本地声纹库（WebView 信任自签名证书，走 fetch）
                                fetch('/api/voiceprint/db')
                                    .then(r => r.json())
                                    .then(db => nativeBridge.voiceprintSyncDb(JSON.stringify(db)))
                                    .catch(e => console.warn('[声纹] 拉取声纹库失败:', e));
                            }
                        }
                        return;
                    }

                    if (data.type === 'speakerDbUpdated') {
                        // 声纹库变更 → 重拉重建（静默，不打扰）
                        if (nativeVoiceprintAvailable && voiceprintEnabled) {
                            fetch('/api/voiceprint/db')
                                .then(r => r.json())
                                .then(db => nativeBridge.voiceprintSyncDb(JSON.stringify(db)))
                                .catch(e => console.warn('[声纹] 重拉声纹库失败:', e));
                        }
                        return;
                    }

                    if (data.type === 'voiceprintExtract') {
                        // register display 模式：中转提取 → 回传 embedding
                        if (nativeVoiceprintAvailable) {
                            try {
                                const res = JSON.parse(nativeBridge.voiceprintExtract(data.audioBase64));
                                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                                    displayWs.send(JSON.stringify({
                                        type: 'voiceprintExtracted',
                                        requestId: data.requestId,
                                        embedding: res.embedding || [],
                                        error: res.error || ''
                                    }));
                                }
                            } catch (e) {
                                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                                    displayWs.send(JSON.stringify({
                                        type: 'voiceprintExtracted',
                                        requestId: data.requestId,
                                        embedding: [],
                                        error: e.message
                                    }));
                                }
                            }
                        } else {
                            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                                displayWs.send(JSON.stringify({
                                    type: 'voiceprintExtracted',
                                    requestId: data.requestId,
                                    embedding: [],
                                    error: '声纹桥不可用'
                                }));
                            }
                        }
                        return;
                    }

                    if (data.type === 'asrConfig') {
                        asrLanguageMode = 'zh';
                        asrDenoiseEnabled = !!data.denoise;
                        if (nativeAsrAvailable && data.localAsrEnabled) {
                            if (typeof nativeBridge.asrConfigure === 'function') {
                                nativeBridge.asrConfigure(asrLanguageMode, asrDenoiseEnabled);
                            }
                            try {
                                const state = JSON.parse(nativeBridge.asrStatus());
                                if (state.state === 'ready') {
                                    nativeAsrReady = true;
                                    reportLocalAsrProviderAvailability(true);
                                } else if (state.state === 'not_ready' ||
                                    (state.state === 'error' && !(state.error || '').includes('内存不足'))) {
                                    nativeBridge.asrEnsureModel();
                                }
                            } catch (e) {
                                console.warn('[ASR] asrStatus 解析失败:', e);
                            }
                        } else if (nativeAsrAvailable && nativeAsrReady) {
                            nativeAsrReady = false;
                            reportLocalAsrProviderAvailability(false);
                        }
                        return;
                    }

                    if (data.type === 'ttsConfig') {
                        ttsDevice = data.device || (data.localTtsEnabled ? 'display' : 'server');
                        localTtsEnabled = !!data.localTtsEnabled;
                        if (localTtsEnabled && nativeTtsAvailable) {
                            // 服务端选择显示端生成：模型未就绪时幂等触发下载，就绪后立即上报能力
                            if (nativeTtsReady) {
                                reportNativeTtsCapability(true);
                            } else {
                                ensureNativeTtsModel();
                            }
                        } else if (!localTtsEnabled && nativeTtsReady) {
                            nativeTtsReady = false;
                            reportNativeTtsCapability(false);
                        }
                        return;
                    }

                    if (data.type === 'cpuConfig') {
                        applyCpuConfig({
                            asr: data.asr,
                            tts: data.tts
                        });
                        return;
                    }

                    if (data.type === 'ttsGenerate') {
                        handleTtsGenerate(data);
                        return;
                    }

                    if (data.type === 'logReportConfig') {
                        applyLogReportConfig(data);
                        return;
                    }

                    if (data.type === 'control') {
                        handleControl(data);
                        if (data.action !== 'crop') {
                            // 睡眠设置/激活/手动覆盖回传当前 sleepState，供控制端状态显示
                            let ackExtra = null;
                            if (data.action === 'sleepSettings' || data.action === 'sleepActivate' || data.action === 'sleepOverride') {
                                ackExtra = { sleepState: sleepState };
                            }
                            sendCommandAck('control', true, data.action, ackExtra);
                        }
                    } else if (data.type === 'tts') {
                        handleTTS(data);
                        sendCommandAck('tts', true, data.action);
                    } else if (data.type === 'textSentenceTtsError') {
                        TextMediaPlayer.handleTtsError(data);
                        sendCommandAck('textSentenceTtsError', true, 'skip sentence');
                    } else if (data.type === 'textSentenceTtsReady') {
                        TextMediaPlayer.handleTtsReady(data);
                        sendCommandAck('textSentenceTtsReady', true, 'prefetch ready');
                    } else if (data.type === 'textSentenceTtsFinished') {
                        TextMediaPlayer.handleTtsFinished(data);
                        sendCommandAck('textSentenceTtsFinished', true, data.status || 'ended');
                    } else if (data.type === 'reminder') {
                        handleReminder(data);
                        sendCommandAck('reminder', true, data.action);
                    } else if (data.type === 'restoreState') {
                        handleRestoreState(data.state);
                        sendCommandAck('restoreState', true, 'state restored');
                    } else if (data.type === 'voiceCommand') {
                        handleVoiceCommand(data);
                        sendCommandAck('voiceCommand', true, data.action);
                    } else if (data.type === 'task:execute') {
                        executeTask(data.payload);
                    } else if (data.type === 'task:stop') {
                        // 停止显示端渲染任务，清理覆盖层
                        var stopInstanceId = data.instanceId;
                        console.log('[显示端] 停止任务:', stopInstanceId);
                        var overlayEl = document.getElementById('renderTask-' + stopInstanceId);
                        if (overlayEl) overlayEl.remove();
                        var styleEl = document.getElementById('renderTaskStyle-' + stopInstanceId);
                        if (styleEl) styleEl.remove();
                        if (window._renderTaskUpdates) {
                            delete window._renderTaskUpdates[stopInstanceId];
                        }
                    } else if (data.type === 'task:renderUpdate') {
                        // 渲染任务实时数据更新。该消息是高频状态推送，只更新画面，不回传
                        // commandAck，避免服务端广播后在控制端反复生成 renderUpdate 提示。
                        var fn = window._renderTaskUpdates && window._renderTaskUpdates[data.instanceId];
                        if (fn) fn(data.data, data.sourceInstanceId);
                    } else if (data.type === 'hardwareStats') {
                        // 兼容 direct hardwareStats 消息（旧转发方式）。这同样是高频监控数据，
                        // 仅分发给渲染任务，不发送命令回执；显式控制命令仍保留回执逻辑。
                        for (var _rid in window._renderTaskUpdates) {
                            window._renderTaskUpdates[_rid](data.data);
                        }
                    } else if (data.type === 'playlistStart') {
                        handlePlaylistStart(data);
                        sendCommandAck('playlistStart', true, data.listId);
                    } else if (data.type === 'playlistControl') {
                        handlePlaylistControl(data);
                        sendCommandAck('playlistControl', true, data.action);
                    } else {
                        console.log('[显示端] 处理媒体消息，发送 media 确认');
                        stopPlaylist();
                        showMedia(data);
                        sendCommandAck('media', true, data.type);
                    }
                } catch (e) {
                    console.error('解析消息失败:', e);
                }
            };
            
            socket.onclose = function() {

            socket.onerror = function(error) {

                console.error('WebSocket错误:', error);
                // 部分 Android WebView 在服务端重启时可能只触发 error，不保证随后触发 close。
                // 先释放当前连接引用，确保 scheduleDisplayReconnect 不被 OPEN/CLOSING 状态拦截。
                displayWs = null;
                stopControlScreenshot();
                controlModeEnabled = false;
                setConnectionStatus('disconnected', '连接错误');
                try {
                    if (socket.readyState !== WebSocket.CLOSED) socket.close();

                    console.warn('关闭异常 WebSocket 失败:', closeError);
                }
                scheduleDisplayReconnect();
            };

        function updateVoiceStatusDisplay() {

            const getConversationScope = () => {

                return;

        function normalizeVadThreshold(value) {
            const number = Number(value);
            if (!Number.isFinite(number)) return DEFAULT_VAD_THRESHOLD;
            return Math.round(Math.min(0.2, Math.max(0.001, number)) * 1000000) / 1000000;
        }

        function sendVoiceVadNoiseResult(result) {

            }));

        function calculateRms(analyserNode) {
            const timeDomainData = new Uint8Array(analyserNode.fftSize);
            analyserNode.getByteTimeDomainData(timeDomainData);
            let sumSquares = 0;
            for (let i = 0; i < timeDomainData.length; i++) {
                const normalized = (timeDomainData[i] - 128) / 128;
                sumSquares += normalized * normalized;
            }
            return Math.sqrt(sumSquares / timeDomainData.length);
        }

        function startVoiceNoiseTest(requestId, requestedDurationMs) {
            if (vadNoiseTestActive) {
                sendVoiceVadNoiseResult({ requestId, error: '已有底噪检测正在进行' });
                return;
            }
            if (!isListening || !analyser) {
                sendVoiceVadNoiseResult({ requestId, error: '请先开启显示端监听' });
                return;
            }

            const durationMs = Math.min(10000, Math.max(1000, Number(requestedDurationMs) || 3000));
            const samples = [];
            const startedAt = Date.now();
            vadNoiseTestActive = true;
            vadNoiseTestRequestId = requestId || null;
            console.log('[语音] 开始底噪检测，请保持安静:', durationMs, 'ms');

            const collect = () => {
                if (!vadNoiseTestActive) return;
                if (!analyser) {
                    vadNoiseTestActive = false;
                    vadNoiseTestRequestId = null;
                    sendVoiceVadNoiseResult({ requestId, error: '麦克风分析器已停止' });
                    return;
                }
                samples.push(calculateRms(analyser));
                if (Date.now() - startedAt < durationMs) {
                    requestAnimationFrame(collect);
                    return;
                }

                vadNoiseTestActive = false;
                vadNoiseTestRequestId = null;
                const sortedSamples = [...samples].sort((a, b) => a - b);
                const p95Index = Math.max(0, Math.ceil(sortedSamples.length * 0.95) - 1);
                const p95Rms = sortedSamples[p95Index] || 0;
                const averageRms = samples.length
                    ? samples.reduce((total, value) => total + value, 0) / samples.length
                    : 0;
                const peakRms = samples.length ? Math.max(...samples) : 0;
                const recommendedThreshold = normalizeVadThreshold(p95Rms * 1.5);
                sendVoiceVadNoiseResult({
                    requestId,
                    durationMs: Date.now() - startedAt,
                    sampleCount: samples.length,
                    averageRms,
                    peakRms,
                    p95Rms,
                    recommendedThreshold
                });
                console.log('[语音] 底噪检测完成:', { averageRms, peakRms, p95Rms, recommendedThreshold });
            };
            requestAnimationFrame(collect);
        }
        
        function reportVoiceAvailability(available) {
            voiceSupported = available === true;
            sendVoiceStatus();
            if (!currentCapabilities || !displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            displayWs.send(JSON.stringify({
                type: 'capabilities',
                capabilities: currentCapabilities
            }));
        }

        // 模型下载状态只更新本 APK 的提供端提示，不改变公共 ASR 可用性状态。
        function showNativeAsrDownloadProgress(progress) {
            const numericProgress = Number(progress);
            const safeProgress = Number.isFinite(numericProgress)
                ? Math.max(0, Math.min(100, Math.floor(numericProgress)))
                : 0;
            updateVoiceTextDisplay('语音模型下载中 ' + safeProgress + '%', false);
        }

        async function detectCapabilities() {
            // WebGPU 探测在 capabilities 对象构造完成前可能异步执行，先独立保存诊断信息，
            // 避免异步闭包提前访问仍处于暂时性死区的 capabilities。
            let webgpuDiag = '';
            const capabilities = {
                mediaRendering: true,
                voicePlayback: true,
                voiceRecording: false,
                voiceRecognition: false,
                ttsGeneration: false,
                displayText: true,
                webgl: (function() {
                    try {
                        const c = document.createElement('canvas');
                        return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
                    } catch(e) { return false; }
                })(),
                webgpu: !!navigator.gpu && await (async function () {
                    try {
                        var diag = [];
                        try {
                            var glCanvas = document.createElement('canvas');
                            var gl = glCanvas.getContext('webgl2') || glCanvas.getContext('webgl');
                            if (gl) {
                                var dbg = gl.getExtension('WEBGL_debug_renderer_info');
                                if (dbg) {
                                    diag.push('GL_VENDOR=' + gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
                                    diag.push('GL_RENDERER=' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
                                }
                            }
                        } catch (e) {}
                        diag.push('UA=' + (navigator.userAgent.match(/Chrome\/(\d+\.\d+)/) || ['?'])[1]);

                        // requestAdapter 在部分设备（如旧 WebView 无 WebGPU）会永久挂起，
                        // 加超时保护避免 detectCapabilities 卡死导致能力不上报
                        const adapterWithTimeout = (promise, ms) => Promise.race([
                            promise,
                            new Promise(resolve => setTimeout(() => resolve(null), ms))
                        ]);
                        var a = await adapterWithTimeout(navigator.gpu.requestAdapter(), 3000);
                        var path = 'default';
                        if (!a) { a = await adapterWithTimeout(navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }), 3000); path = 'high-performance'; }
                        if (!a) { a = await adapterWithTimeout(navigator.gpu.requestAdapter({ powerPreference: 'low-power' }), 3000); path = 'low-power'; }
                        if (!a) {
                            diag.push('RESULT=三轮回退全部返回null');
                            webgpuDiag = diag.join(' | ');
                            return false;
                        }
                        try {
                            var info = await a.requestAdapterInfo();
                            diag.push('VENDOR=' + (info.vendor || '?'));
                            diag.push('ARCH=' + (info.architecture || '?'));
                            diag.push('DEVICE=' + (info.device || '?'));
                        } catch (e) {}
                        diag.push('PREF=' + path);
                        webgpuDiag = diag.join(' | ');
                        a.destroy();
                        return true;
                    } catch (e) {
                        webgpuDiag = 'EXCEPTION: ' + e.message;
                        return false;
                    }
                })(),
                // APK 原生桥能力：真实像素截图 + 跨域输入注入
                crossOriginControl: !!(nativeBridge && nativeBridge.injectTouch),
                crossOriginControlDegraded: !!(nativeBridge && !nativeBridge.injectTouch),
                voiceprintAvailable: nativeVoiceprintAvailable
            };

            if (webgpuDiag) {
                capabilities._webgpuDiag = webgpuDiag;
            }
            
            try {
                // getUserMedia 授权弹窗无人值守时会永久挂起：3 秒超时视为不可用
                const stream = await Promise.race([
                    navigator.mediaDevices.getUserMedia({ audio: true }),
                    new Promise(resolve => setTimeout(() => resolve(null), 3000))
                ]);
                if (stream) {
                    capabilities.voiceRecording = true;
                    stream.getTracks().forEach(track => track.stop());
                }
            } catch (e) {
                capabilities.voiceRecording = false;
            }
            
            if (nativeAsrAvailable) {
                try {
                    const state = JSON.parse(nativeBridge.asrStatus());
                    nativeAsrReady = state.state === 'ready';
                    capabilities.voiceRecognition = nativeAsrReady;
                    if (state.state === 'downloading') {
                        showNativeAsrDownloadProgress(state.progress);
                    } else if (state.state === 'not_ready' ||
                        (state.state === 'error' && !(state.error || '').includes('内存不足'))) {
                        nativeBridge.asrEnsureModel();
                    }
                } catch (e) {
                    nativeAsrReady = false;
                    capabilities.voiceRecognition = false;
                    console.warn('[ASR] asrStatus 解析失败:', e);
                }
            }

            // APK 原生 TTS 引擎：按模型就绪状态声明能力；服务端选择显示端且未就绪时触发下载
            if (nativeTtsAvailable) {
                try {
                    const st = JSON.parse(nativeBridge.ttsStatus());
                    nativeTtsReady = (st.state === 'ready');
                    capabilities.ttsGeneration = nativeTtsReady;
                    if (localTtsEnabled && (st.state === 'not_ready' || st.state === 'error')) {
                        nativeBridge.ttsEnsureModel();
                    }
                } catch (e) {
                    nativeTtsReady = false;
                    capabilities.ttsGeneration = false;
                    console.warn('[TTS] ttsStatus 解析失败:', e);
                }
            }
            
            return capabilities;
        }
        
        async function declareCapabilities() {
            console.log('[能力] 入口: 开始声明');
            try {
                // 同步构造基础能力立即上报（不依赖可能挂起的异步检测），
                // 确保原生桥能力（crossOriginControl）第一时间生效
                const baseCaps = {
                    mediaRendering: true,
                    voicePlayback: true,
                    displayText: true,
                    webgl: (function() {
                        try {
                            const c = document.createElement('canvas');
                            return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
                        } catch(e) { return false; }
                    })(),
                    crossOriginControl: !!(nativeBridge && nativeBridge.injectTouch),
                    crossOriginControlDegraded: !!(nativeBridge && !nativeBridge.injectTouch)
                };
                currentCapabilities = baseCaps;
                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                    displayWs.send(JSON.stringify({

                console.log('[能力] 已声明基础能力:', baseCaps);
                // 异步补全能力（voiceRecording/webgpu 等）：挂起不影响基础能力
                detectCapabilities().then(full => {

                        }));

        function handleCapabilitiesUpdated(data) {
            if (data.capabilities) {
                const prevCaps = currentCapabilities;
                currentCapabilities = data.capabilities;
                voiceListeningEnabled = data.capabilities.voiceRecording === true;
                console.log('[能力] 能力已更新:', data.capabilities);

                if (!voiceListeningEnabled) {
                    pendingAutoStart = false;
                    clearAsrStatusRetryTimer();
                    voiceConversationState = 'disabled';
                    clearVoiceConversationTimer();
                    stopVoiceRecording();
                } else if (prevCaps && prevCaps.voiceRecording !== true) {
                    voiceConversationState = 'waitingWake';
                }

                // 媒体渲染能力关闭 → 停止媒体播放，清空画面
                if (!data.capabilities.mediaRendering) {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'none';
                    mediaVideo.pause();
                    mediaVideo.src = '';
                    mediaImage.src = '';
                    fileNameDisplay.textContent = '';
                    waitingMessage.style.display = 'block';
                }

                // 语音播放能力关闭 → 停止 TTS，清空队列
                if (!data.capabilities.voicePlayback) {
                    stopTtsPlayback();
                    clearRemoteTextPlayback();
                }

                // 语音录音能力关闭 → 停止录音
                if (!data.capabilities.voiceRecording && isListening) {
                    stopVoiceRecording();
                }

                // 文本显示能力关闭 → 隐藏提醒弹窗和文字覆盖层
                if (!data.capabilities.displayText) {
                    const popup = document.querySelector('.reminder-popup');
                    if (popup) popup.remove();
                    voiceTextDisplay.className = 'voice-text-hidden';
                }

                // 能力确认或重连后都尝试启动，不能依赖 prevCaps/pendingAutoStart 的时序。
                const shouldStartRecording = isAlwaysListening && !isListening
                    && voiceListeningEnabled && voiceSupported && !ttsRecordingPaused;
                if (shouldStartRecording) {
                    pendingAutoStart = false;
                    console.log('[能力] 服务器能力已确认，启动录音');
                    void startVoiceRecording();
                }
            }
        }
        
        function initVoiceRecognition() {
            checkAsrStatus();
        }
        
        async function checkAsrStatus() {
            const requestToken = ++asrStatusRequestToken;
            clearAsrStatusRetryTimer();
            try {
                // 显示端只使用服务端公共 ASR，避免本地模型状态覆盖服务器能力。
                const response = await fetch('/api/asr/status');
                const data = await response.json();
                if (requestToken !== asrStatusRequestToken || !displayPageActive) return;
                const ready = data.ready === true;
                reportVoiceAvailability(ready);
                
                if (ready) {
                    console.log('显示端服务器 ASR 服务可用');
                    // 不直接启动录音，由 handleCapabilitiesUpdated 中的 pendingAutoStart 处理
                } else {
                    console.log('ASR 服务未初始化');
                    scheduleAsrStatusRetry();
                }
            } catch (e) {
                if (requestToken !== asrStatusRequestToken || !displayPageActive) return;
                console.log('ASR 服务不可用:', e.message);
                reportVoiceAvailability(false);
                scheduleAsrStatusRetry();
            }
        }
        
        // 所有网页端 ASR/声纹录音统一使用共享 PCM 采集器，避免不同端的编码器差异。
        function startRawPcmCapture(stream) {
            try {
                // 持续监听复用子显示端的 VAD 分段策略：语音开始前只保留短前置缓冲。
                pcmCapture = new PcmAudioCapture({ segmentMode: true, preRollMs: 300 }).start(stream);
                return true;
            } catch (e) {
                console.warn('[语音] 原始 PCM 采集失败:', e);
                stopRawPcmCapture();
                return false;
            }
        }

        function encodePcmSamplesToWav(samples, sampleRate) {
            return PcmAudioCapture.encodeWav(samples, sampleRate, 16000);
        }

        function takeRawPcmWav() {
            return pcmCapture ? pcmCapture.takeWav() : null;
        }

        function stopRawPcmCapture() {
            if (pcmCapture) pcmCapture.stop();
            pcmCapture = null;
        }

        // 统一释放持续监听资源；调用方可以安全重复执行，避免异常/关闭路径留下旧音频图。
        function releaseVoiceRecordingResources() {
            stopSilenceDetection();
            stopRawPcmCapture();
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }
        }

        function stopVoiceRecording() {
            const shouldSubmitPendingAudio = isListening === true;
            isListening = false;
            clearTtsRecordingResumeTimer();
            ttsRecordingPaused = false;
            wasListeningBeforePlayback = false;
            remoteTtsPlaybackIds.clear();
            if (vadNoiseTestActive) {
                vadNoiseTestActive = false;
                sendVoiceVadNoiseResult({
                    requestId: vadNoiseTestRequestId,
                    error: '监听已停止，底噪检测未完成'
                });
                vadNoiseTestRequestId = null;
            }
            const audioBlob = shouldSubmitPendingAudio ? takeRawPcmWav() : null;
            releaseVoiceRecordingResources();
            sendVoiceStatus();
            console.log('[语音] 录音已停止');
            if (audioBlob) void sendAudioForRecognition(audioBlob);
        }

        // VAD 检测到一段语音结束后，只清空当前 WAV 缓冲并重新开始采集，不创建新的编码器。
        async function finishVoiceSegment() {
            if (!isListening || !pcmCapture) return;
            // 当前检测回调即将返回，先标记为停止，再使用同一个 AnalyserNode 开启下一轮。
            silenceDetectionRunning = false;
            const audioBlob = takeRawPcmWav();
            hasSpeech = false;
            speechStartTime = null;
            silenceStartTime = null;
            if (audioBlob) void sendAudioForRecognition(audioBlob);
            if (!isListening) return;
            startSilenceDetection();
        }

        async function startVoiceRecording() {
            if (!displayPageActive || isListening) return;

            if (ttsRecordingPaused) {
                console.log('[语音] TTS 播放中，暂不恢复录音');
                return;
            }

            if (!voiceListeningEnabled) {
                console.log('[能力] 显示端语音监听已关闭，跳过录音启动');
                return;
            }
            
            if (currentCapabilities && !currentCapabilities.voiceRecording) {
                console.log('[能力] 无语音录音能力，跳过录音启动');
                return;
            }

            if (!voiceSupported) {
                console.log('[能力] 公共 ASR 不可用，跳过录音启动');
                return;
            }

            if (Date.now() < voiceCooldownUntil) {
                const remainingMs = voiceCooldownUntil - Date.now();
                console.log('显示端语音冷却中，剩余' + Math.ceil(remainingMs / 1000) + '秒');
                if (isAlwaysListening) {
                    setTimeout(() => startVoiceRecording(), remainingMs + 500);
                }
                return;
            }
            
            try {
                if (micStream && pcmCapture?.active) {
                    isListening = true;
                    hasSpeech = false;
                    speechStartTime = null;
                    silenceStartTime = null;
                    console.log('复用显示端已有语音采集链路');
                    sendVoiceStatus();
                    startSilenceDetection();
                    return;
                }

                // 旧资源可能处于半关闭状态，创建新麦克风前先幂等清理，避免覆盖旧引用。
                releaseVoiceRecordingResources();
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        // 关闭浏览器隐式处理，保证 APK 本地 ASR 收到与测试 APK 一致的原始音频。
                        echoCancellation: false,
                        noiseSuppression: false,
                        sampleRate: 16000
                    }
                });
                
                if (!startRawPcmCapture(micStream)) {
                    throw new Error('当前浏览器不支持原始 PCM 录音');
                }
                isListening = true;
                hasSpeech = false;
                speechStartTime = null;
                silenceStartTime = null;
                console.log('显示端语音录制已启动');
                sendVoiceStatus();
                startSilenceDetection();
                
            } catch (e) {
                console.error('显示端麦克风访问失败:', e);
                releaseVoiceRecordingResources();
                isListening = false;
                voiceSupported = false;
                sendVoiceStatus();
            }
        }
        
        function startSilenceDetection() {
            if (!micStream || !pcmCapture?.context || silenceDetectionRunning) return;
            
            try {
                if (!audioContext) {
                    // VAD 与 PCM 采集复用同一个 AudioContext，整段监听期间只保留一条音频图。
                    audioContext = pcmCapture.context;
                }
                if (!analyser) {
                    vadSource = audioContext.createMediaStreamSource(micStream);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 2048;
                    vadSource.connect(analyser);
                }
                
                const SILENCE_DURATION = 1000;
                const MIN_SPEECH_DURATION = 300;
                silenceDetectionRunning = true;
                
                const checkSilence = () => {
                    if (!silenceDetectionRunning || !isListening || !analyser) {
                        silenceDetectionFrameId = null;
                        return;
                    }
                    
                    const timeDomainData = new Uint8Array(analyser.fftSize);
                    analyser.getByteTimeDomainData(timeDomainData);
                    
                    let sumSquares = 0;
                    for (let i = 0; i < timeDomainData.length; i++) {
                        const normalized = (timeDomainData[i] - 128) / 128;
                        sumSquares += normalized * normalized;
                    }
                    const rms = Math.sqrt(sumSquares / timeDomainData.length);
                    
                    if (vadNoiseTestActive) {
                        silenceDetectionFrameId = requestAnimationFrame(checkSilence);
                        return;
                    }

                    if (rms >= vadThreshold) {
                        if (!hasSpeech && !speechStartTime) {
                            pcmCapture.beginSegment();
                            speechStartTime = Date.now();
                        }
                        hasSpeech = true;
                        silenceStartTime = null;
                    } else if (hasSpeech) {
                        if (!silenceStartTime) {
                            silenceStartTime = Date.now();
                        }
                        if (Date.now() - silenceStartTime > SILENCE_DURATION) {
                            const speechDuration = speechStartTime ? Date.now() - speechStartTime : 0;
                            if (speechDuration >= MIN_SPEECH_DURATION) {
                                console.log('显示端检测到静音，发送识别');
                                void finishVoiceSegment();
                                return;
                            }
                        }
                    }
                    
                    silenceDetectionFrameId = requestAnimationFrame(checkSilence);
                };
                
                silenceDetectionFrameId = requestAnimationFrame(checkSilence);
            } catch (e) {
                silenceDetectionRunning = false;
                console.log('静音检测初始化失败:', e);
            }
        }
        
        function stopSilenceDetection() {
            silenceDetectionRunning = false;
            if (silenceDetectionFrameId !== null) {
                cancelAnimationFrame(silenceDetectionFrameId);
                silenceDetectionFrameId = null;
            }
            if (vadSource) vadSource.disconnect();
            vadSource = null;
            analyser = null;
            // audioContext 由 PcmAudioCapture 统一关闭，这里只断开 VAD 节点，避免分段时销毁采集上下文。
            audioContext = null;
        }
        
        async function sendAudioForRecognition(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.wav');
                
                const response = await fetch('/api/asr/recognize', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    // 多人分割：逐段独立触发命令（只含已识别声纹的段）
                    if (data.segments && data.segments.length) {
                        for (const seg of data.segments) {
                            const segText = (seg.text || '').trim();
                            if (!segText) continue;
                            console.log('显示端分段识别:', segText, '->', seg.speaker);
                            sendRecognizedVoiceInput(segText, { speaker: seg.speaker });
                        }
                        const ignoredText = String(data.ignoredText || '').trim();
                        if (ignoredText) {
                            updateVoiceTextDisplay(ignoredText, true);
                            setTimeout(() => {
                                updateVoiceTextDisplay('', true);
                            }, 3000);
                        }
                        return;
                    }
                    if (!data.text) return;
                    const recognizedText = data.text.trim();
                    console.log('显示端识别结果:', recognizedText);

                    consecutiveIgnoreCount = 0;

                    updateVoiceTextDisplay(recognizedText, true);

                    const extra = {};
                    if (data.speaker !== undefined) extra.speaker = data.speaker;
                    sendRecognizedVoiceInput(recognizedText, extra);

                    setTimeout(() => {
                        updateVoiceTextDisplay('', true);
                    }, 3000);
                } else if (data.status === 'ignored') {
                    consecutiveIgnoreCount++;
                    console.log('显示端无效语音输入，已忽略 (' + consecutiveIgnoreCount + '/' + MAX_CONSECUTIVE_IGNORES + '):', data.text);
                    const ignoredText = String(data.text || '').trim();
                    if (ignoredText) {
                        updateVoiceTextDisplay(ignoredText, true);
                        setTimeout(() => {
                            updateVoiceTextDisplay('', true);
                        }, 3000);
                    } else {
                        updateVoiceTextDisplay('', true);
                    }
                    
                    if (consecutiveIgnoreCount >= MAX_CONSECUTIVE_IGNORES) {
                        const cooldownMs = VOICE_COOLDOWN_MS * Math.pow(2, Math.min(consecutiveIgnoreCount - MAX_CONSECUTIVE_IGNORES, 3));
                        voiceCooldownUntil = Date.now() + cooldownMs;
                        console.log('显示端连续' + consecutiveIgnoreCount + '次无效输入，冷却' + (cooldownMs / 1000) + '秒');
                        isListening = false;
                        // 连续无效识别进入冷却时才释放采集资源；普通 ignored 继续复用当前链路。
                        releaseVoiceRecordingResources();
                        sendVoiceStatus();
                        
                        if (isAlwaysListening) {
                            setTimeout(() => {
                                if (Date.now() >= voiceCooldownUntil) {
                                    consecutiveIgnoreCount = 0;
                                    startVoiceRecording();
                                }
                            }, cooldownMs);
                        }
                    } else if (isAlwaysListening) {
                        // finishVoiceSegment 已经在同一条采集链路上恢复 VAD，这里不再重复启动麦克风。
                        console.log('显示端忽略无效语音，继续复用当前监听链路');
                    }
                }
            } catch (e) {
                console.error('显示端语音识别请求失败:', e);
            }
        }

        // 只有服务器选中的 APK 提供端处理 asrAudio；录音端永远走上面的公共 HTTP 接口。
        function handleLegacyNativeAsr(data, pcmBase64) {
            const useVoiceprint = nativeVoiceprintAvailable && voiceprintEnabled && voiceprintReady;
            if (useVoiceprint && voiceprintMultiSpeaker) {
                const result = JSON.parse(nativeBridge.voiceprintDiarize(pcmBase64));
                sendAsrResult(data.requestId, {
                    segments: result.segments || [],
                    error: result.error || ''
                });
                return;
            }
            const result = JSON.parse(nativeBridge.asrRecognize(pcmBase64));
            if (!useVoiceprint) {
                sendAsrResult(data.requestId, { text: result.text || '', error: result.error || '' });
                return;
            }
            const voiceprint = JSON.parse(nativeBridge.voiceprintMatch(pcmBase64));
            const response = {
                text: result.text || '',
                error: result.error || voiceprint.error || ''
            };
            if (!voiceprint.error) response.speaker = voiceprint.speaker || null;
            sendAsrResult(data.requestId, response);
        }

        async function handleAsrAudio(data) {
            if (!nativeAsrAvailable) {
                sendAsrResult(data.requestId, { text: '', error: '当前显示端不是 ASR 提供端' });
                return;
            }
            if (!nativeAsrReady) {
                let modelError = '';
                try {
                    const state = JSON.parse(nativeBridge.asrStatus());
                    modelError = state.error || '';
                    if ((state.state === 'not_ready' || state.state === 'error') &&
                        !modelError.includes('内存不足')) {
                        nativeBridge.asrEnsureModel();
                    }
                } catch (e) {
                    console.warn('[ASR] asrStatus 解析失败:', e);
                }
                sendAsrResult(data.requestId, { text: '', error: modelError || '模型下载中' });
                return;
            }
            try {
                const pcmBase64 = await decodeAudioToPcmBase64(data.audioData);
                const useVoiceprint = nativeVoiceprintAvailable && voiceprintEnabled && voiceprintReady;
                if (typeof nativeBridge.asrRecognizeAsyncWithOptions === 'function') {
                    const accepted = JSON.parse(nativeBridge.asrRecognizeAsyncWithOptions(

        // 服务端下发的音频是 WAV/PCM，桥只接收 16kHz mono s16le 裸 PCM。
        async function decodeAudioToPcmBase64(base64Audio) {
            const binary = atob(base64Audio);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const decodeContext = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, 44100);
            const audioBuffer = await decodeContext.decodeAudioData(bytes.buffer.slice(0));
            const length = Math.ceil(audioBuffer.duration * 16000);
            const resampleContext = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, length, 16000);
            const source = resampleContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(resampleContext.destination);
            source.start();
            const rendered = await resampleContext.startRendering();
            const samples = rendered.getChannelData(0);
            const pcm = new Uint8Array(samples.length * 2);
            const dataView = new DataView(pcm.buffer);
            for (let i = 0; i < samples.length; i++) {
                const sample = Math.max(-1, Math.min(1, samples[i]));
                dataView.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
            }
            let encoded = '';
            for (let i = 0; i < pcm.length; i++) encoded += String.fromCharCode(pcm[i]);
            return btoa(encoded);
        }

        LfmVlAdapter.prototype.load = function(baseUrl) {

        LfmVlAdapter.prototype.release = function() {
            if (this.imageSession) { this.imageSession.release(); this.imageSession = null; }
            if (this.textSession) { this.textSession.release(); this.textSession = null; }

        LfmVlAdapter.prototype.process = function(params) {
            var self = this;
            var imageUrl = params.imageUrl;
            var prompt = params.prompt || '请详细描述这张图片';
            var signal = params.signal || null;

            return new Promise(function(resolve, reject) {
                var startTime = performance.now();
                var ttft = 0;
                var totalTokens = 0;
                var hasTtft = false;

                // 1. 加载图片
                fetch(imageUrl, signal ? { signal: signal } : {}).then(function(res) {
                    if (!res.ok) throw new Error('图片加载失败: ' + res.status);
                    return res.blob();
                }).then(function(blob) {
                    return createImageBitmap(blob);
                }).then(function(bitmap) {
                    // 2. 预处理: resize → normalize → NCHW
                    var canvas = document.createElement('canvas');
                    canvas.width = 336;
                    canvas.height = 336;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(bitmap, 0, 0, 336, 336);
                    var imageData = ctx.getImageData(0, 0, 336, 336);
                    bitmap.close();

                    var inputTensor = preprocessImage(imageData);
                    return self.imageSession.run({ input: inputTensor });
                }).then(function(encoderResult) {
                    if (signal && signal.aborted) throw new Error('推理已取消');

                    var imageFeatures = encoderResult.image_features || Object.values(encoderResult)[0];

                    // 4. Tokenize
                    var inputTokens = simpleTokenize(prompt);
                    totalTokens = inputTokens.length;

                    // 5. 解码器自回归
                    return self._decode(inputTokens, imageFeatures, signal, function() {
                        if (!hasTtft) {
                            ttft = performance.now() - startTime;
                            hasTtft = true;
                        }
                        totalTokens++;
                    });
                }).then(function(outputText) {
                    var endTime = performance.now();
                    var totalDuration = endTime - startTime;
                    var genTokens = totalTokens - simpleTokenize(prompt).length;
                    var tokensPerSecond = genTokens > 0 && totalDuration > 0
                        ? genTokens / (totalDuration / 1000)
                        : 0;

                    resolve({
                        text: outputText,
                        metrics: {
                            totalDuration: Math.round(totalDuration),
                            ttft: Math.round(ttft),
                            tokensPerSecond: Math.round(tokensPerSecond * 10) / 10,
                            totalTokens: totalTokens
                        }
                    });
                }).catch(function(err) {
                    reject(err);
                });
            });
        };

        LfmVlAdapter.prototype._decode = function(inputTokens, imageFeatures, signal, onToken) {
            var self = this;
            var outputTokens = inputTokens.slice();
            var maxNewTokens = 256;
            var eosTokenId = 2;

            function step() {
                if (signal && signal.aborted) return Promise.reject(new Error('推理已取消'));
                if (outputTokens.length - inputTokens.length >= maxNewTokens) {
                    return Promise.resolve(detokenize(outputTokens));
                }

                var inputTensor = new ort.Tensor('int64', new BigInt64Array(outputTokens.map(function(t) { return BigInt(t); })), [1, outputTokens.length]);
                return self.textSession.run({ input_ids: inputTensor, image_features: imageFeatures }).then(function(result) {
                    var logits = Object.values(result)[0];
                    var lastLogits = logits.data.slice(logits.data.length - logits.dims[logits.dims.length - 1]);
                    var nextToken = greedySample(lastLogits);

                    if (typeof onToken === 'function') onToken(nextToken);

                    if (nextToken === eosTokenId) {
                        return Promise.resolve(detokenize(outputTokens));
                    }
                    outputTokens.push(nextToken);
                    return step();
                });
            }

            return step();
        };

        // ---- 工具函数 ----

        function preprocessImage(imageData) {
            var pixels = imageData.data;
            var data = new Float32Array(3 * 336 * 336);
            var mean = [0.485, 0.456, 0.406];
            var std = [0.229, 0.224, 0.225];
            for (var y = 0; y < 336; y++) {
                for (var x = 0; x < 336; x++) {
                    var idx = (y * 336 + x) * 4;
                    data[0 * 336 * 336 + y * 336 + x] = (pixels[idx] / 255 - mean[0]) / std[0];
                    data[1 * 336 * 336 + y * 336 + x] = (pixels[idx + 1] / 255 - mean[1]) / std[1];
                    data[2 * 336 * 336 + y * 336 + x] = (pixels[idx + 2] / 255 - mean[2]) / std[2];
                }
            }
            return new ort.Tensor('float32', data, [1, 3, 336, 336]);
        }

        function simpleTokenize(text) {
            var tokens = [1]; // <BOS>
            for (var i = 0; i < text.length; i++) {
                tokens.push(text.charCodeAt(i) + 10);
            }
            return tokens;
        }

        function detokenize(tokens) {
            var chars = [];
            for (var i = 0; i < tokens.length; i++) {
                if (tokens[i] === 1) continue;
                if (tokens[i] === 2) break;
                if (tokens[i] < 10) { chars.push(' '); continue; }
                chars.push(String.fromCharCode(tokens[i] - 10));
            }
            return chars.join('');
        }

        function greedySample(logits) {
            var maxIdx = 0;
            var maxVal = -Infinity;
            for (var i = 0; i < logits.length; i++) {
                if (logits[i] > maxVal) { maxVal = logits[i]; maxIdx = i; }
            }
            return maxIdx;
        }

        // Web Worker 隔离执行用户任务（不阻塞主线程）
        var _taskWorkerUrl = null;
        function _getTaskWorkerUrl() {
            if (_taskWorkerUrl) return _taskWorkerUrl;
            var blob = new Blob([_taskWorkerCode || (_taskWorkerCode = '\
                self.onmessage = function(e) {\
                    var d = e.data;\
                    var entryCode = d.entryCode;\
                    var files = d.files || [];\
                    var context = d.context || {};\
                    var fileStore = {};\
                    for (var i = 0; i < files.length; i++) {\
                        var f = files[i];\
                        if (f.data) {\
                            try {\
                                var binary = atob(f.data);\
                                var bytes = new Uint8Array(binary.length);\
                                for (var j = 0; j < binary.length; j++) {\
                                    bytes[j] = binary.charCodeAt(j);\
                                }\
                                fileStore[f.name] = bytes;\

                    var taskLogs = [];\
                    var origLog = self.console.log;\
                    var origErr = self.console.error;\

                    self.console.log = function() {\
                        taskLogs.push({ stream: "stdout", level: "info", message: Array.prototype.join.call(arguments, " ") });\
                    };\
                    self.console.error = function() {\
                        taskLogs.push({ stream: "stderr", level: "error", message: Array.prototype.join.call(arguments, " ") });\
                    };\
                    self.console.warn = function() {\
                        taskLogs.push({ stream: "stdout", level: "warn", message: Array.prototype.join.call(arguments, " ") });\
                    };\
                    context.files = fileStore;\
                    try {\
                        var fn = new Function("context", entryCode + "\\nreturn run(context);");\
                        Promise.resolve(fn(context)).then(function(result) {\
                            self.console.log = origLog; self.console.error = origErr; self.console.warn = origWarn;\
                            var outputFiles = [];\
                            if (result && result.outputFiles) {\
                                for (var k = 0; k < result.outputFiles.length; k++) {\
                                    var name = result.outputFiles[k];\
                                    if (fileStore[name]) {\
                                        var binStr = "";\
                                        for (var j = 0; j < fileStore[name].length; j++) binStr += String.fromCharCode(fileStore[name][j]);\
                                        outputFiles.push({ name: name, data: btoa(binStr) });\
                                    }\
                                }\
                            }\
                            self.postMessage({ success: true, result: result, outputFiles: outputFiles, logs: taskLogs });\
                        }).catch(function(err) {\
                            self.console.log = origLog; self.console.error = origErr; self.console.warn = origWarn;\
                            self.postMessage({ success: false, error: err.message, logs: taskLogs });\

        // ====== 通用渲染任务：从 files 加载 render.html/render.js 显示覆盖层 ======

        function executeTask(payload) {
            // 模型推理内置任务（已在 GPU 线程异步执行）
            if (payload.builtinId === 'model.inference') {
                console.log('[Model] 收到模型推理任务:', payload.instanceId, 'modelId:', payload.params ? payload.params.modelId : '?');
                executeModelInference(payload);
                return;
            }

            // render-display 内置任务：渲染监控仪表盘（主线程加载 render.html/render.js）
            if (payload.builtinId === 'render-display' || hasRenderFile(payload.files)) {
                executeRenderTask(payload);
                return;
            }

            // 用户任务 — 用 Web Worker 隔离执行，不阻塞主线程
            var taskName = payload.taskName;
            var instanceId = payload.instanceId;
            var entryFile = payload.entryFile;
            var files = payload.files || [];
            var params = payload.params || {};
            console.log('[Task] 收到任务: ' + taskName + '/' + instanceId + '，使用 Web Worker');

            // 查找并解码入口文件（源码通常很小，主线程解码即可）
            var entryFileData = null;
            for (var i = 0; i < files.length; i++) {
                if (files[i].name === entryFile) { entryFileData = files[i]; break; }
            }
            if (!entryFileData || !entryFileData.data) {
                sendTaskResult(taskName, instanceId, false, '入口文件不存在: ' + entryFile, null);
                return;
            }
            var entryCode = base64ToUtf8(entryFileData.data);
            entryCode = entryCode.replace(/module\.exports\s*=[\s\S]*?;\s*/g, '');

            // 检查能力（需要 DOM 访问，在主线程做）
            var capabilities = {
                cpu: true,
                webgl: (function() { try {
                    var c = document.createElement('canvas');
                    return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
                } catch(e) { return false; } })(),
                webgpu: !!navigator.gpu
            };

            // WebGPU/WebGL 任务需要主线程访问 GPU API，跳过 Worker 直接在主线程执行
            if (payload.env === 'webgpu' || payload.env === 'webgl') {
                console.log('[Task] GPU 环境，主线程执行:', taskName, payload.env);
                (async function() {
                    var gpuAdapter = null;
                    try {
                        gpuAdapter = await navigator.gpu.requestAdapter();
                        if (!gpuAdapter) gpuAdapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
                        if (!gpuAdapter) gpuAdapter = await navigator.gpu.requestAdapter({ powerPreference: 'low-power' });
                    } catch(e) {}
                    executeUserTaskMainThread(taskName, instanceId, entryCode, files, capabilities, params, gpuAdapter);
                })();
                return;
            }

            // 尝试创建 Worker，失败时回退到主线程执行
            var worker = null;
            try {
                worker = new Worker(_getTaskWorkerUrl());
            } catch(e) {
                console.warn('[Task] Web Worker 创建失败，回退到主线程执行:', e.message);
            }

            if (worker) {
                // Worker 路径：隔离执行，不阻塞主线程
                var taskTimeout = setTimeout(function() {
                    worker.terminate();
                    sendTaskResult(taskName, instanceId, false, '执行超时', null, null, []);
                }, 30000);
                var settled = false;

                worker.onmessage = function(e) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(taskTimeout);
                    var rd = e.data;
                    worker.terminate();
                    if (rd.success) {
                        sendTaskResult(taskName, instanceId, true, null, rd.outputFiles || [], null, rd.logs || []);
                    } else {
                        sendTaskResult(taskName, instanceId, false, rd.error || '执行失败', null, null, rd.logs || []);
                    }
                };

                worker.onerror = function(err) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(taskTimeout);
                    worker.terminate();
                    sendTaskResult(taskName, instanceId, false, (err && err.message) || 'Worker 内部错误', null, null, []);
                };

                worker.postMessage({
                    entryCode: entryCode,
                    files: files,
                    context: { capabilities: capabilities, params: params, workDir: '/workspace' }
                });
            } else {
                // 回退路径：主线程执行（Worker 不可用时）
                executeUserTaskMainThread(taskName, instanceId, entryCode, files, capabilities, params);
            }
        }

        // 回退：主线程执行用户任务（当 Web Worker 不可用时）
        function executeUserTaskMainThread(taskName, instanceId, entryCode, files, capabilities, params, gpuAdapter) {
            var fileStore = {};
            for (var i = 0; i < files.length; i++) {
                var f = files[i];
                if (f.data) {
                    try {
                        var binary = atob(f.data);
                        var bytes = new Uint8Array(binary.length);
                        for (var j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
                        fileStore[f.name] = bytes;
                    } catch(e) {}
                }
            }

            var taskLogs = [];
            var origLog = console.log;
            var origErr = console.error;
            var origWarn = console.warn;
            console.log = function() {
                taskLogs.push({ stream: 'stdout', level: 'info', message: Array.prototype.join.call(arguments, ' ') });
            };
            console.error = function() {
                taskLogs.push({ stream: 'stderr', level: 'error', message: Array.prototype.join.call(arguments, ' ') });
            };
            console.warn = function() {
                taskLogs.push({ stream: 'stdout', level: 'warn', message: Array.prototype.join.call(arguments, ' ') });
            };

            try {
                var ctx = { files: fileStore, capabilities: capabilities, params: params, workDir: '/workspace', gpuAdapter: gpuAdapter || null };
                var fn = new Function('context', entryCode + '\nreturn run(context);');
                Promise.resolve(fn(ctx)).then(function(result) {
                    console.log = origLog; console.error = origErr; console.warn = origWarn;
                    var outputFiles = [];
                    if (result && result.outputFiles) {
                        for (var k = 0; k < result.outputFiles.length; k++) {
                            var name = result.outputFiles[k];
                            if (fileStore[name]) {
                                var binStr = '';
                                for (var j = 0; j < fileStore[name].length; j++) binStr += String.fromCharCode(fileStore[name][j]);
                                outputFiles.push({ name: name, data: btoa(binStr) });
                            }
                        }
                    }
                    sendTaskResult(taskName, instanceId, true, null, outputFiles, null, taskLogs);
                }).catch(function(err) {
                    console.log = origLog; console.error = origErr; console.warn = origWarn;
                    sendTaskResult(taskName, instanceId, false, err.message || '执行错误', null, null, taskLogs);
                });
            } catch (err) {
                console.log = origLog; console.error = origErr; console.warn = origWarn;
                sendTaskResult(taskName, instanceId, false, err.message || '执行异常', null, null, taskLogs);
            }
        }

        function executeModelInference(payload) {
            var taskName = payload.taskName;
            var instanceId = payload.instanceId;
            var params = payload.params || {};
            var modelId = params.modelId || 'lfm-vl';
            var prompt = params.prompt || '请详细描述这张图片';
            var imageUrl = params.imageUrl;

            console.log('[Model] 开始推理:', modelId, '实例:', instanceId);
            console.log('[Model] 参数:', JSON.stringify({ prompt: prompt ? prompt.substring(0, 50) : '', imageUrl: imageUrl ? imageUrl.substring(0, 80) : 'N/A' }));

            sendProgress(instanceId, 'loading-model', 10);
            sendLog(instanceId, 'system', 'info', '正在加载 ' + modelId + ' 模型...');
            showTaskStatus(modelId, 'loading-model');
            updateTaskProgress('loading-model', 10);

            modelManager.run(modelId, {
                imageUrl: imageUrl,
                prompt: prompt,
                signal: getAbortSignal(instanceId)
            }).then(function(result) {
                console.log('[Model] 推理完成:', instanceId, 'tok/s:', result.metrics.tokensPerSecond, 'TTFT:', result.metrics.ttft + 'ms');
                sendLog(instanceId, 'system', 'info', '推理完成。Token 速度: ' + result.metrics.tokensPerSecond + ' tok/s, 首 Token: ' + result.metrics.ttft + 'ms');
                updateTaskProgress('running', 100);
                showTaskMetrics(result.metrics);
                sendTaskResult(taskName, instanceId, true, null, [
                    { name: 'result.json', data: btoa(JSON.stringify({ text: result.text })) }
                ], result.metrics);
                hideTaskStatus(5000);
            }).catch(function(err) {
                console.error('[Model] 推理失败:', instanceId, err.message);
                sendLog(instanceId, 'system', 'error', '推理失败: ' + err.message);
                hideTaskStatus(0);
                sendTaskResult(taskName, instanceId, false, err.message, null);
            });
        }

        function base64ToUtf8(b64) {
            var binary = atob(b64);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            try { return new TextDecoder().decode(bytes); } catch(e) { return binary; }
        }

        function sendTaskResult(taskName, instanceId, success, error, outputFiles, metrics, taskLogs, data) {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                var msg = {
                    type: 'task:result',
                    payload: {
                        taskName: taskName,
                        instanceId: instanceId,
                        success: success,
                        error: error || null,
                        outputFiles: outputFiles || [],
                        metrics: metrics || null,
                        logs: taskLogs || [],
                        data: data || null
                    }
                };
                displayWs.send(JSON.stringify(msg));
            } else {
                console.warn('[Model] 无法发送结果: WebSocket 未连接');
            }
        }
    </script>
