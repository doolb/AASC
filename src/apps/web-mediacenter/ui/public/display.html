                TextMediaPlayer.attachPlaylist({ listId: ps.listId, index: ps.index, total: ps.playlist.length });
                TextMediaPlayer.load(mediaData, {
                    paused: ps.paused,
                    pageIndex: Number.isFinite(ps.resumeTextPage) ? ps.resumeTextPage : 0
                });
                ps.resumeTextPage = 0;
                sendPlaylistProgress(ps.paused ? 'paused' : 'playing');
                return;
            }
            showMedia(mediaData, true, ps.paused, resumeTime);  // 播放列表自动切播不激活（显示端内部行为）
            // 媒体加载完成后补报一次进度（带实际尺寸，供控制端裁剪预览）
            const reportSizeOnce = () => {
                if (playlistState && playlistState.paused) {
                    sendPlaylistProgress('paused');
                } else {
                    sendPlaylistProgress('playing');
                }
                if (playlistState) playlistState.resumeTime = null;
            };
            if (item.mediaType === 'video') {
                mediaVideo.addEventListener('loadedmetadata', reportSizeOnce, { once: true });
            } else if (item.mediaType === 'audio') {
                mediaAudio.addEventListener('loadedmetadata', reportSizeOnce, { once: true });
            } else if (item.mediaType === 'html') {
                mediaHtml.addEventListener('load', reportSizeOnce, { once: true });
            } else {
                mediaImage.addEventListener('load', reportSizeOnce, { once: true });
            }
            if (item.mediaType === 'video') {
                // 视频用自己的时长播放，播完后再等间隔
                mediaVideo.loop = false;
                if (!ps.paused) {
                    ps.videoEndedHandler = function() {
                        mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                        ps.videoEndedHandler = null;
                        ps.timer = setTimeout(playlistNext, ps.interval);
                    };
                    mediaVideo.addEventListener('ended', ps.videoEndedHandler);
                }
                mediaVideo.onerror = function() {
                    // 视频加载失败：等间隔后播下一个，不卡死循环
                    mediaVideo.onerror = null;
                    if (ps.paused) return;
                    if (ps.videoEndedHandler) {
                        mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                        ps.videoEndedHandler = null;
                    }
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
            } else if (item.mediaType === 'audio') {
                // 音频按自然时长播放，结束后等待间隔再切换，和视频批量语义一致。
                mediaAudio.loop = false;
                if (!ps.paused) {
                    ps.audioEndedHandler = function() {
                        mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                        ps.audioEndedHandler = null;
                        ps.timer = setTimeout(playlistNext, ps.interval);
                    };
                    mediaAudio.addEventListener('ended', ps.audioEndedHandler);
                }
                mediaAudio.onerror = function() {
                    // 音频加载失败：等待间隔后播下一个，避免单项错误卡住列表。
                    mediaAudio.onerror = null;
                    if (ps.paused) return;
                    if (ps.audioEndedHandler) {
                        mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                        ps.audioEndedHandler = null;
                    }
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
            } else {
                // 图片按间隔时间切换
                mediaImage.onerror = function() {
                    // 图片加载失败：等间隔后播下一个，不卡死循环
                    mediaImage.onerror = null;
                    if (ps.paused) return;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                if (!ps.paused) ps.timer = setTimeout(playlistNext, ps.interval);
            }
            sendPlaylistProgress(ps.paused ? 'paused' : 'playing');
        }

        function playlistNext() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.resumeTime = null;
            ps.resumeTextPage = 0;
            // 定时器已经触发，先清除句柄，避免睡眠拦截后唤醒逻辑误判仍在等待。
            if (ps.timer) clearTimeout(ps.timer);
            ps.timer = null;
            // 自动 timer/ended 在睡眠期间只保留当前项，不推进索引、不排队下一项；
            // 控制端手动 next 会先临时激活，再进入此函数执行切换。
            if (isSleepPaused()) return;
            if (ps.index + 1 >= ps.playlist.length) {
                if (ps.loop) {
                    ps.index = 0;
                    playCurrentItem();
                } else {
                    finishPlaylist();
                }
            } else {
                ps.index++;
                playCurrentItem();
            }
        }

        function playlistPrev() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.resumeTime = null;
            ps.resumeTextPage = 0;
            ps.index = ps.index - 1 < 0 ? (ps.loop ? ps.playlist.length - 1 : 0) : ps.index - 1;
            playCurrentItem();
        }

        function playlistJump(index) {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            if (index < 0 || index >= ps.playlist.length) return;
            ps.resumeTime = null;
            ps.resumeTextPage = 0;
            ps.index = index;
            playCurrentItem();
        }

        function playlistPause() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.paused = true;
            if (ps.playlist[ps.index] && ps.playlist[ps.index].mediaType === 'text') {
                TextMediaPlayer.handleControl('pause');
            }
            pauseExpected = true;
            stopHtmlScroll();
            if (ps.timer) {
                clearTimeout(ps.timer);
                ps.timer = null;
            }
            if (ps.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                ps.videoEndedHandler = null;
                mediaVideo.pause();
            }
            if (ps.audioEndedHandler) {
                mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                ps.audioEndedHandler = null;
                mediaAudio.pause();
            }
            // 清除加载失败回调，防止 pause 后 error 事件重新设置定时器自动播下一项
            mediaVideo.onerror = null;
            mediaAudio.onerror = null;
            mediaImage.onerror = null;
            sendPlaylistProgress('paused');
        }

        function playlistResume() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.paused = false;
            pauseExpected = false;
            const item = ps.playlist[ps.index];
            if (item && item.mediaType === 'text') {
                TextMediaPlayer.handleControl('play');
            } else if (item && item.mediaType === 'video' && !ps.timer && !ps.videoEndedHandler) {
                // 暂停时视频正在播放 → 继续播放视频
                playVideoAuto(mediaVideo);
                ps.videoEndedHandler = function() {
                    mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                    ps.videoEndedHandler = null;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                mediaVideo.addEventListener('ended', ps.videoEndedHandler);
            } else if (item && item.mediaType === 'audio' && !ps.timer && !ps.audioEndedHandler) {
                // 暂停时音频正在播放 → 继续播放并重新绑定 ended。
                playAudioAuto(mediaAudio);
                ps.audioEndedHandler = function() {
                    mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                    ps.audioEndedHandler = null;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                mediaAudio.addEventListener('ended', ps.audioEndedHandler);
            } else {
                // 图片或间隔等待中 → 重新计时
                ps.timer = setTimeout(playlistNext, ps.interval);
                // html 项暂停时滚动已冻结，恢复时继续滚动
                if (item && item.mediaType === 'html') {
                    startHtmlScroll(mediaHtml, item.htmlScroll || null);
                }
            }
            sendPlaylistProgress('playing');
        }

        function finishPlaylist() {
            if (!playlistState) return;
            pauseExpected = true;
            const info = {
                listId: playlistState.listId,
                index: playlistState.index,
                total: playlistState.playlist.length,
                state: 'finished'
            };
            playlistState.active = false;
            TextMediaPlayer.attachPlaylist(null);
            TextMediaPlayer.stop();
            stopHtmlScroll();
            if (playlistState.timer) {
                clearTimeout(playlistState.timer);
                playlistState.timer = null;
            }
            if (playlistState.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', playlistState.videoEndedHandler);
                playlistState.videoEndedHandler = null;
            }
            if (playlistState.audioEndedHandler) {
                mediaAudio.removeEventListener('ended', playlistState.audioEndedHandler);
                playlistState.audioEndedHandler = null;
            }
            if (savedAutoTts !== null) {
                autoTtsEnabled = savedAutoTts;
                savedAutoTts = null;
            }
            playlistState = null;
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({ type: 'playlistProgress', ...info }));
            }
        }

        function handlePlaylistControl(data) {
            if (!playlistState) return;
            switch (data.action) {
                case 'pause':
                    playlistPause();
                    break;
                case 'resume':
                    playlistResume();
                    break;
                case 'next':
                    // 手动 next 是用户主动唤醒操作；自动 timer/ended 不经过此分支，睡眠拦截保持不变。
                    activateTemporarily();
                    playlistNext();
                    break;
                case 'prev':
                    playlistPrev();
                    break;
                case 'jump':
                    playlistJump(data.index);
                    break;
                case 'stop':
                    const info = {
                        listId: playlistState.listId,
                        index: playlistState.index,
                        total: playlistState.playlist.length,
                        state: 'stopped'
                    };
                    stopPlaylist();
                    if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                        displayWs.send(JSON.stringify({ type: 'playlistProgress', ...info }));
                    }
                    break;
            }
        }

        // .mhtml（MIME 打包网页）转纯 HTML：提取主文档，内嵌资源转为 data: URI。
        // Chromium 对 .mhtml 渲染支持差（直接导航都会 ERR_ABORTED），必须转换后用 srcdoc 渲染
        // quoted-printable 解码为字节数组（=XX 十六进制、行尾 = 软换行）
        function qpToBytes(str) {
            const decoded = str.replace(/=\r?\n/g, '').replace(/=([0-9A-Fa-f]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
            return Uint8Array.from(decoded, c => c.charCodeAt(0));
        }

        function decodePartBody(body, encoding, charset) {
            if (encoding === 'base64') {
                const bytes = Uint8Array.from(atob(body.replace(/\s/g, '')), c => c.charCodeAt(0));
                return new TextDecoder(charset === 'gbk' || charset === 'gb2312' ? 'gbk' : 'utf-8').decode(bytes);
            }
            if (encoding === 'quoted-printable') {
                const bytes = qpToBytes(body);
                return new TextDecoder(charset === 'gbk' || charset === 'gb2312' ? 'gbk' : 'utf-8').decode(bytes);
            }
            return body;
        }

        function mhtmlToHtml(text) {
            const boundaryMatch = text.match(/^--([^\r\n]+)/m);
            if (!boundaryMatch) return null;
            const boundary = boundaryMatch[1].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const parts = text.split(new RegExp('--' + boundary));
            if (parts.length < 2) return null;

            let main = null;
            const resources = new Map();

            for (let i = 1; i < parts.length; i++) {
                const part = parts[i];
                if (!part || part.trim() === '' || part.trim() === '--') continue;
                const headerEnd = part.indexOf('\r\n\r\n');
                const bodyStart = headerEnd === -1 ? part.indexOf('\n\n') : headerEnd;
                if (bodyStart === -1) continue;
                const headersText = part.slice(0, bodyStart);
                const body = part.slice(bodyStart + (headerEnd === -1 ? 2 : 4)).replace(/^[\r\n]+/, '').replace(/[\r\n]+$/, '');
                const headers = {};
                headersText.split(/\r?\n/).forEach(line => {
                    const idx = line.indexOf(':');
                    if (idx > 0) headers[line.slice(0, idx).trim().toLowerCase()] = line.slice(idx + 1).trim();
                });
                const ctype = headers['content-type'] || 'text/html';
                const encoding = (headers['content-transfer-encoding'] || '').toLowerCase();
                const charsetMatch = ctype.match(/charset=([^;]+)/i);
                const charset = charsetMatch ? charsetMatch[1].trim() : 'utf-8';

                if (ctype.startsWith('text/html')) {
                    main = decodePartBody(body, encoding, charset);
                } else {
                    const loc = headers['content-location'] || headers['content-id'] || '';
                    if (loc) {
                        // 与 findResource 一致：剥离查询串（?xxx），否则带 ?ulf 的 CSS/图片资源 key 对不上
                        const clean = loc.replace(/^cid:/i, '').replace(/^<|>$/g, '').split('?')[0].split('/').pop();
                        const mime = ctype.split(';')[0].trim();
                        let data;
                        if (encoding === 'quoted-printable') {
                            // QP 解码后转回 base64（data URI 用）
                            const bytes = qpToBytes(body);
                            let bin = '';
                            bytes.forEach(b => { bin += String.fromCharCode(b); });
                            data = btoa(bin);
                        } else if (encoding === 'base64') {
                            data = body.replace(/\s/g, '');
                        } else {
                            data = btoa(unescape(encodeURIComponent(body)));
                        }
                        resources.set(clean, { mime: mime, data: data });
                    }
                }
            }
            if (main === null) return null;

            // 重写资源引用为 data: URI（src/href/style url()，支持 cid: 引用）
            const findResource = (loc) => {
                const clean = loc.replace(/^cid:/i, '').replace(/^<|>$/g, '').split('?')[0].split('/').pop();
                return resources.get(clean) || resources.get(loc);
            };
            main = main.replace(/(src|href)=["']([^"']+)["']/gi, (m, attr, loc) => {
                const r = findResource(loc);
                return r ? attr + '="data:' + r.mime + ';base64,' + r.data + '"' : m;
            });
            main = main.replace(/url\(["']?([^"')]+)["']?\)/gi, (m, loc) => {
                const r = findResource(loc);
                return r ? 'url("data:' + r.mime + ';base64,' + r.data + '")' : m;
            });
            return main;
        }

        // HTML 媒体滚动控制器：分页式 / 平滑 / 循环
        let htmlScrollState = null;
        // 当前生效的 html 播放模式（发送未指定时沿用；控制端可实时切换）
        let currentHtmlScroll = null;
        // 当前 html 裁剪缩放倍数（无裁剪=1）；进度上报用
        let currentHtmlScale = 1;
        let htmlProgressTimer = null;

        // ===== 控制模式：转发控制端输入 + 每秒回传 720p 截图 =====
        let controlModeEnabled = false;
        let controlShotTimer = null;
        let controlShotBusy = false;
        let gdmStream = null;        // getDisplayMedia 捕获流（会话内复用）
        let gdmVideo = null;         // 取帧用隐藏 video
        let gdmPending = false;      // 授权请求进行中（防止重复弹框）
        let gdmFailed = false;       // 本会话授权失败，不再重试
        let controlShotCanvas = null;
        let controlShotCtx = null;

        // APK 原生桥探测（Android APK 显示端注入：真实像素截图 + 跨域输入注入）
        const nativeBridge = window.NativeDisplay || null;

        // CPU 配置只交给异步原生桥；重复广播去重，避免 WebView 消息线程等待 native pool 换代。
        let lastAppliedCpuConfigKey = '';
        let pendingCpuConfigKey = '';

        // 向服务端回报 APK 实际探测到的 CPU 拓扑和 TTS 生效槽位，浏览器显示端安全跳过。
        function reportNativeCpuStatus(status = null) {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN
                || !nativeBridge || typeof nativeBridge.cpuStatus !== 'function') return;
            try {
                const currentStatus = status || JSON.parse(nativeBridge.cpuStatus());
                if (!currentStatus || currentStatus.ok !== true) return;
                displayWs.send(JSON.stringify({ type: 'cpuStatus', status: currentStatus }));
            } catch (error) {
                console.warn('[CPU] 回报显示端 CPU 状态失败:', error);
            }
        }

        window.onNativeCpuStatus = reportNativeCpuStatus;

        function applyCpuConfig(config) {
            if (!config) return;
            const payload = {
                asr: config.asr || {},
                tts: config.tts || {}
            };
            const key = JSON.stringify(payload);
            if (key === lastAppliedCpuConfigKey || key === pendingCpuConfigKey) {
                return;
            }
            if (!nativeBridge || typeof nativeBridge.cpuConfigureAsync !== 'function') {
                return;
            }
            pendingCpuConfigKey = key;
            try {
                const resultText = nativeBridge.cpuConfigureAsync(JSON.stringify(payload));
                if (!resultText) {
                    pendingCpuConfigKey = '';
                    return;
                }
                const result = JSON.parse(resultText);
                if (!result || result.accepted !== true) {
                    pendingCpuConfigKey = '';
                } else {
                    lastAppliedCpuConfigKey = key;
                    pendingCpuConfigKey = '';
                }
                if (result && result.error) {
                    console.warn('[CPU] 原生配置失败:', result.error);
                }
            } catch (error) {
                pendingCpuConfigKey = '';
                console.warn('[CPU] 原生配置异常:', error);
            }
        }

        // 截图降级链：APK 原生截图 → 同源 html-to-image → 跨域 getDisplayMedia → 兜底 html-to-image → none
        async function captureHtmlShot() {
            if (mediaHtml.style.display === 'none') {
                sendControlScreenshot('none', null, 0, 0);
                return;
            }
            // APK 原生截图优先：真实像素，跨域 iframe / 外站图片均可截
            if (nativeBridge && nativeBridge.takeScreenshot) {
                const shot = await shotWithNativeBridge();
                if (shot) return;
                // 原生失败（如视频位图空白）回退现有降级链
            }
            // 同源检测：能读 contentDocument 即同源（srcdoc / 服务器同源 URL）
            let sameOrigin = false;
            try {
                if (mediaHtml.contentDocument && mediaHtml.contentDocument.body) {
                    sameOrigin = true;
                }
            } catch (e) {
                sameOrigin = false;
            }
            if (sameOrigin) {
                // 优先 html-to-image 截 iframe 可见区域
                try {
                    const shot = await shotWithHtmlToImage();
                    if (shot) return;
                } catch (e) {
                    console.log('[控制模式] html-to-image 失败:', e.message);
                }
                // 同源内容失败属瞬时异常（如渲染变换期间）：跳过本帧，下一帧重试，
                // 不降级 none（避免误导"跨域未授权"提示）
                return;
            }
            // 检测失败：可能 iframe 导航中瞬时不可读，先试 html-to-image 区分
            // （恢复则正常截图；真跨域会抛 SecurityError）
            try {
                const shotTry = await shotWithHtmlToImage();
                if (shotTry) return;
            } catch (e) { /* 真跨域或持续不可读，走降级 */ }
            // 跨域：尝试 getDisplayMedia（整屏，不裁剪）
            const shot = await shotWithGdm();
            if (shot) return;
            // getDisplayMedia 失败：兜底再试 html-to-image（跨域通常仍失败，成本极低）
            try {
                const shot2 = await shotWithHtmlToImage();
                if (shot2) return;
            } catch (e) { /* 忽略，降级 none */ }
            sendControlScreenshot('none', null, 0, 0);
        }

        // NativeDisplay.takeScreenshot：APK WebView 位图真实像素，同步返回 JSON {dataUrl,width,height}
        // 截图反旋转：WebView 位图 = 屏幕画面（横屏 1280x720，内容随 rotation 换方向），
        // 反旋转成页面直立（阅读方向）：90/270 输出宽高互换成竖图，内容转回可读方向
        function rotateShotToOriginal(dataUrl, width, height, rotation) {
            return new Promise((resolve) => {
                if (!rotation) { resolve({ dataUrl, width, height }); return; }
                const img = new Image();
                img.onload = () => {
                    try {
                        const swap = (rotation === 90 || rotation === 270);
                        const outW = swap ? height : width;
                        const outH = swap ? width : height;
                        const canvas = document.createElement('canvas');
                        canvas.width = outW;
                        canvas.height = outH;
                        const ctx = canvas.getContext('2d');
                        ctx.translate(outW / 2, outH / 2);
                        // 位图内容已顺时针 rotate(rotation)，反旋转用 -rotation 转回直立
                        ctx.rotate(-rotation * Math.PI / 180);
                        ctx.drawImage(img, -width / 2, -height / 2);
                        const fit = ControlModeUtils.fitSizeTo720p(outW, outH);
                        const out = document.createElement('canvas');
                        out.width = fit.width;
                        out.height = fit.height;
                        out.getContext('2d').drawImage(canvas, 0, 0, fit.width, fit.height);
                        resolve({ dataUrl: out.toDataURL('image/jpeg', 0.7), width: fit.width, height: fit.height });
                    } catch (e) {
                        resolve({ dataUrl, width, height });
                    }
                };
                img.onerror = () => resolve({ dataUrl, width, height });
                img.src = dataUrl;
            });
        }

        function shotWithNativeBridge() {
            return new Promise((resolve) => {
                try {
                    const res = JSON.parse(nativeBridge.takeScreenshot());
                    if (res && res.dataUrl) {
                        // 反旋转成页面直立：控制端预览随显示端旋转，阅读方向正确
                        rotateShotToOriginal(res.dataUrl, res.width || 0, res.height || 0, currentRotation).then(rot => {
                            sendControlScreenshot('native', rot.dataUrl, rot.width || 0, rot.height || 0);
                            resolve(rot.dataUrl);
                        });
                        return;
                    }
                } catch (e) { /* 桥截图失败，回退现有降级链 */ }
                resolve(null);
            });
        }

        // html-to-image 截 iframe 可见视口，缩至 720p
        async function shotWithHtmlToImage() {
            const doc = mediaHtml.contentDocument;
            const body = doc && doc.body;
            if (!body) return null;
            const clientW = mediaHtml.clientWidth || 800;
            const clientH = mediaHtml.clientHeight || 600;
            const canvas = await htmlToImage.toCanvas(body, {
                width: clientW,
                height: clientH,
                backgroundColor: '#ffffff'
            });
            const fit = ControlModeUtils.fitSizeTo720p(canvas.width, canvas.height);
            if (!controlShotCanvas) {
                controlShotCanvas = document.createElement('canvas');
                controlShotCtx = controlShotCanvas.getContext('2d');
            }
            controlShotCanvas.width = fit.width;
            controlShotCanvas.height = fit.height;
            controlShotCtx.drawImage(canvas, 0, 0, fit.width, fit.height);
            const dataUrl = controlShotCanvas.toDataURL('image/jpeg', 0.7);
            sendControlScreenshot('html-to-image', dataUrl, fit.width, fit.height);
            return dataUrl;
        }

        // getDisplayMedia 整屏截图（不裁剪），缩至 720p
        // 临时屏蔽浏览器原生截图（GDM_ENABLED = false）：保留代码与状态变量，恢复时改回 true
        const GDM_ENABLED = false;
        async function shotWithGdm() {
            if (!GDM_ENABLED) return null;
            if (gdmFailed || gdmPending) return null;
            if (!gdmStream) {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    gdmFailed = true;
                    return null;
                }
                gdmPending = true;
                try {
                    // 授权弹窗无人值守时会一直挂起：8 秒超时视为失败，走降级链
                    gdmStream = await Promise.race([
                        navigator.mediaDevices.getDisplayMedia({ video: true }),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('授权超时')), 8000))
                    ]);
                    gdmVideo = document.createElement('video');
                    gdmVideo.srcObject = gdmStream;
                    gdmVideo.muted = true;
                    await gdmVideo.play();
                    // 用户停止共享时清理，会话内重新申请
                    gdmStream.getVideoTracks()[0].addEventListener('ended', () => {
                        gdmStream = null;
                        gdmVideo = null;
                        gdmFailed = false;
                    });
                } catch (e) {
                    // 用户拒绝授权或浏览器不支持
                    console.log('[控制模式] getDisplayMedia 授权失败:', e.message);
                    gdmStream = null;
                    gdmFailed = true;
                    return null;
                } finally {
                    gdmPending = false;
                }
            }
            if (!gdmVideo || gdmVideo.videoWidth === 0) return null;
            const vw = gdmVideo.videoWidth;
            const vh = gdmVideo.videoHeight;
            const fit = ControlModeUtils.fitSizeTo720p(vw, vh);
            if (!controlShotCanvas) {
                controlShotCanvas = document.createElement('canvas');
                controlShotCtx = controlShotCanvas.getContext('2d');
            }
            controlShotCanvas.width = fit.width;
            controlShotCanvas.height = fit.height;
            controlShotCtx.drawImage(gdmVideo, 0, 0, fit.width, fit.height);
            const dataUrl = controlShotCanvas.toDataURL('image/jpeg', 0.7);
            sendControlScreenshot('gdm', dataUrl, fit.width, fit.height);
            return dataUrl;
        }

        function sendControlScreenshot(mode, dataUrl, width, height) {
            // 关闭控制模式后丢弃在途帧（busy 中完成的截图不再发送）
            if (!controlModeEnabled) return;
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            displayWs.send(JSON.stringify({
                type: 'controlScreenshot',
                mode: mode,
                dataUrl: dataUrl || null,
                width: width || 0,
                height: height || 0
            }));
        }

        // 截图定时器：1 秒 1 帧；上一帧未完成跳过（防堆积）
        function startControlScreenshot() {
            stopControlScreenshot();
            controlShotTimer = setInterval(async () => {
                if (controlShotBusy) return;
                controlShotBusy = true;
                try {
                    await captureHtmlShot();
                } catch (e) {
                    console.log('[控制模式] 截图失败:', e.message);
                } finally {
                    controlShotBusy = false;
                }
            }, 1000);
        }

        function stopControlScreenshot() {
            if (controlShotTimer) {
                clearInterval(controlShotTimer);
                controlShotTimer = null;
            }
            if (gdmStream) {
                gdmStream.getTracks().forEach(t => t.stop());
                gdmStream = null;
            }
            gdmVideo = null;
        }

        // 控制模式开关：开启暂停自动滚动 + 强制全屏（截图完整网页、坐标按视口+rotation 纯映射），关闭恢复
        let controlSavedCrop = null;
        function setControlMode(on) {
            controlModeEnabled = !!on;
            if (on) {
                stopHtmlScroll();
                startControlScreenshot();
                // 强制全屏：清除裁剪放大（残留 crop 的 scale 会放大 iframe 内容，截图/坐标映射都会错），
                // 保存 crop 供关闭时恢复
                if (mediaHtml.style.display !== 'none') {
                    controlSavedCrop = currentCrop ? { ...currentCrop } : null;
                    currentCrop = { x: 0, y: 0, width: 100, height: 100 };
                    currentHtmlScale = 1;
                    applyRotation();
                }
            } else {
                stopControlScreenshot();
                if (mediaHtml.style.display !== 'none') {
                    startHtmlScroll(mediaHtml, currentHtmlScroll);
                    // 恢复裁剪放大
                    if (controlSavedCrop) {
                        currentCrop = controlSavedCrop;
                        controlSavedCrop = null;
                    }
                    applyCrop();
                }
            }
            console.log('[控制模式] 状态:', controlModeEnabled ? '开启' : '关闭');
        }

        // 输入合成：把控制端输入派发到 iframe 内容
        function dispatchControlInput(data) {
            if (mediaHtml.style.display === 'none') return;
            const evt0 = data.event;
            // 键盘/文本走桥（WebView dispatchKeyEvent 真实按键，不需要屏幕坐标，跨域 iframe 聚焦元素可接收）；
            // 鼠标/滚轮走 JS 合成（0° 同源准确；跨域 iframe 读不到 contentDocument 静默跳过）
            if (nativeBridge && (evt0 === 'keydown' || evt0 === 'keyup' || evt0 === 'text')) {
                if (dispatchControlInputNative(data)) {
                    return;
                }
            }
            let win = null;
            let doc = null;
            try {
                win = mediaHtml.contentWindow;
                doc = mediaHtml.contentDocument;
            } catch (e) {
                // 跨域 iframe：无法读取内容，忽略输入（防御分支）
                return;
            }
            if (!win || !doc) return;
            const evt = data.event;
            if (evt === 'text') {
                // 文本注入（中文粘贴）：直接插入活动输入框
                injectText(doc, data.text || '');
                return;
            }
            if (evt === 'mousedown' || evt === 'mouseup' || evt === 'click' || evt === 'contextmenu') {
                let px;
                if (controlModeEnabled) {
                    // 控制模式：截图即 iframe 可见视口，坐标直接映射视口像素（不经裁剪框换算）
                    px = {
                        x: Math.round((mediaHtml.clientWidth * (data.x || 0)) / 100),
                        y: Math.round((mediaHtml.clientHeight * (data.y || 0)) / 100)
                    };
                } else {
                    // 裁剪框内百分比 → 内容百分比 → 内容像素
                    const crop = currentCrop || { x: 0, y: 0, width: 100, height: 100 };
                    const pct = ControlModeUtils.contentPointFromCropBox(crop, data.x || 0, data.y || 0);
                    px = ControlModeUtils.contentPixelFromPercent(
                        mediaHtml.clientWidth, mediaHtml.clientHeight, pct
                    );
                }
                const target = doc.elementFromPoint(px.x, px.y) || doc.body;
                // 合成 mousedown 不触发原生 focus：手动聚焦可聚焦元素（输入框等）
                if (evt === 'mousedown' && typeof target.focus === 'function') {
                    try { target.focus(); } catch (e) { /* 不可聚焦元素忽略 */ }
                }
                const opts = {
                    bubbles: true,
                    cancelable: true,
                    view: win,
                    clientX: px.x,
                    clientY: px.y,
                    button: data.button !== undefined ? data.button : 0
                };
                if (evt === 'mousedown') target.dispatchEvent(new MouseEvent('mousedown', opts));
                if (evt === 'mouseup') target.dispatchEvent(new MouseEvent('mouseup', opts));
                if (evt === 'click') target.dispatchEvent(new MouseEvent('click', opts));
                if (evt === 'contextmenu') target.dispatchEvent(new MouseEvent('contextmenu', opts));
            } else if (evt === 'wheel') {
                const target = doc.activeElement || doc.body;
                const wheelOpts = {
                    bubbles: true,
                    cancelable: true,
                    view: win,
                    deltaX: data.deltaX || 0,
                    deltaY: data.deltaY || 0,
                    deltaMode: 0 // 像素
                };
                target.dispatchEvent(new WheelEvent('wheel', wheelOpts));
                // 合成 WheelEvent 不触发浏览器原生滚动，需手动滚动 iframe 窗口
                try { win.scrollBy(data.deltaX || 0, data.deltaY || 0); } catch (e) { /* 忽略 */ }
            } else if (evt === 'keydown' || evt === 'keyup') {
                const target = doc.activeElement || doc.body;
                const keyOpts = {
                    bubbles: true,
                    cancelable: true,
                    view: win,
                    key: data.key || '',
                    code: data.code || '',
                    keyCode: data.keyCode || 0,
                    which: data.keyCode || 0,
                    altKey: !!data.altKey,
                    ctrlKey: !!data.ctrlKey,
                    shiftKey: !!data.shiftKey,
                    metaKey: !!data.metaKey
                };
                target.dispatchEvent(new KeyboardEvent(evt, keyOpts));
                // 单字符文本注入：合成 KeyboardEvent 不会触发输入框默认行为，
                // 需手动 insertText（仅无 Ctrl/Alt/Meta 时）
                if (evt === 'keydown' && data.char && !data.ctrlKey && !data.altKey && !data.metaKey) {
                    injectText(doc, data.char);
                }
            }
        }

        // 原生输入注入：仅键盘/文本走桥（WebView dispatchKeyEvent 真实按键，不需要屏幕坐标，
        // 跨域 iframe 聚焦元素可接收；鼠标/滚轮因盒子 DeX 多屏触摸无法定位，走 JS 合成）
        function dispatchControlInputNative(data) {
            const evt = data.event;
            if (evt === 'text') {
                nativeBridge.injectText(data.text || '');
                return true;
            }
            if (evt === 'keydown' || evt === 'keyup') {
                const keyCode = domKeyToAndroidKeyCode(data.keyCode);
                if (keyCode === 0) return false;   // 未映射键回退 JS 合成
                const meta = domMetaToAndroidMeta(data);
                return nativeBridge.injectKey(keyCode, meta) !== false;
            }
            return false;
        }

        // DOM keyCode → Android keyCode 映射（与 APK KeyInjector 约定一致）
        const DOM_KEY_TO_ANDROID = {
            13: 66, 9: 61, 8: 67, 46: 112, 27: 111, 32: 62,
            37: 21, 38: 19, 39: 22, 40: 20, 33: 92, 34: 93, 35: 123, 36: 122, 45: 124,
            112: 131, 113: 132, 114: 133, 115: 134, 116: 135, 117: 136, 118: 137,
            119: 138, 120: 139, 121: 140, 122: 141, 123: 142,
            48: 7, 49: 8, 50: 9, 51: 10, 52: 11, 53: 12, 54: 13, 55: 14, 56: 15, 57: 16,
            65: 29, 66: 30, 67: 31, 68: 32, 69: 33, 70: 34, 71: 35, 72: 36, 73: 37, 74: 38,
            75: 39, 76: 40, 77: 41, 78: 42, 79: 43, 80: 44, 81: 45, 82: 46, 83: 47, 84: 48,
            85: 49, 86: 50, 87: 51, 88: 52, 89: 53, 90: 54
        };
        function domKeyToAndroidKeyCode(domKeyCode) {
            return DOM_KEY_TO_ANDROID[domKeyCode] || 0;
        }
        function domMetaToAndroidMeta(data) {
            let m = 0;
            if (data.ctrlKey) m |= 4096;   // KeyEvent.META_CTRL_ON
            if (data.altKey) m |= 2;       // KeyEvent.META_ALT_ON
            if (data.shiftKey) m |= 1;     // KeyEvent.META_SHIFT_ON
            if (data.metaKey) m |= 65536;  // KeyEvent.META_META_ON
            return m;
        }

        // 文本注入：对 input/textarea/contentEditable 生效
        function injectText(doc, text) {
            if (!text) return;
            const el = doc.activeElement;
            if (!el) return;
            const tag = (el.tagName || '').toLowerCase();
            const editable = tag === 'input' || tag === 'textarea' || el.isContentEditable;
            if (!editable) return;
            // 先把光标定位到末尾（保证 execCommand 插入位置正确）
            if (tag === 'input' || tag === 'textarea') {
                try {
                    el.focus();
                    const end = el.value ? el.value.length : 0;
                    el.setSelectionRange(end, end);
                } catch (e) { /* 定位失败继续尝试 */ }
            }
            try {
                el.focus();
                if (doc.execCommand && doc.execCommand('insertText', false, text)) return;
            } catch (e) { /* 降级到 input 事件 */ }
            // 兜底：手动修改值 + 派发 input 事件
            if (tag === 'textarea' || (tag === 'input' && (el.type === 'text' || el.type === 'search' || el.type === 'email' || el.type === 'url' || el.type === 'password'))) {
                const start = el.selectionStart || 0;
                const end = el.selectionEnd || 0;
                el.value = el.value.slice(0, start) + text + el.value.slice(end);
                const pos = start + text.length;
                el.setSelectionRange(pos, pos);
                el.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }

        // html 播放进度上报：滚动比例 + 缩放倍数（控制端进度条显示）
        function reportHtmlProgress() {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            let win = null;
            try {
                win = mediaHtml.contentWindow;
            } catch (e) {
                // 跨域 iframe：无法读取内容，跳过进度上报
                return;
            }
            if (!win) return;
            let doc = null;
            try {
                doc = win.document;
            } catch (e) {
                // 跨域 iframe：跳过进度上报
                return;
            }
            const scrollHeight = Math.max(
                (doc.documentElement && doc.documentElement.scrollHeight) || 0,
                (doc.body && doc.body.scrollHeight) || 0
            );
            const clientHeight = win.innerHeight || mediaHtml.clientHeight;
            let scrollProgress = 0;
            if (scrollHeight > clientHeight) {
                scrollProgress = Math.min(100, Math.round((win.scrollY / (scrollHeight - clientHeight)) * 100));
            }
            displayWs.send(JSON.stringify({
                type: 'htmlProgress',
                scrollProgress: scrollProgress,
                scale: currentHtmlScale,
                mode: currentHtmlScroll ? currentHtmlScroll.mode : 'page',
                loop: currentHtmlScroll ? !!currentHtmlScroll.loop : false
            }));
        }

        function stopHtmlScroll() {
            if (htmlScrollState) {
                if (htmlScrollState.timer) clearInterval(htmlScrollState.timer);
                if (htmlScrollState.rafId) cancelAnimationFrame(htmlScrollState.rafId);
                htmlScrollState = null;
            }
            if (htmlProgressTimer) {
                clearInterval(htmlProgressTimer);
                htmlProgressTimer = null;
            }
        }

        function startHtmlScroll(iframe, htmlScroll) {
            stopHtmlScroll();
            // 进度上报定时器（暂停/恢复/切换统一管理）
            if (!htmlProgressTimer) {
                htmlProgressTimer = setInterval(reportHtmlProgress, 1000);
            }
            const win = iframe.contentWindow;
            if (!win) return;
            const opts = htmlScroll || {};
            // 兼容旧消息：mode='loop' 视为平滑+循环
            const mode = opts.mode === 'loop' ? 'smooth' : (opts.mode || 'page');
            const loop = !!opts.loop || opts.mode === 'loop';
            const pageInterval = opts.pageInterval || 5;
            const speedPx = { slow: 60, medium: 120, fast: 240 }[opts.speed || 'medium'];

            const scrollHeight = Math.max(
                (win.document.documentElement && win.document.documentElement.scrollHeight) || 0,
                (win.document.body && win.document.body.scrollHeight) || 0
            );
            const clientHeight = win.innerHeight || iframe.clientHeight;
            // 内容不溢出时无需滚动
            if (scrollHeight <= clientHeight + 1) return;

            if (mode === 'page') {
                // 分页式：每 pageInterval 秒滚一屏；循环时到底回顶继续
                htmlScrollState = {
                    timer: setInterval(() => {
                        if (!htmlScrollState) return;
                        if (win.scrollY + clientHeight >= scrollHeight - 2) {
                            if (loop) {
                                win.scrollTo(0, 0);
                                return;
                            }
                            stopHtmlScroll();
                            return;
                        }
                        win.scrollBy(0, clientHeight);
                    }, pageInterval * 1000)
                };
            } else {
                // 平滑：匀速滚动；循环时滚到底回顶继续
                let last = performance.now();
                const step = (now) => {
                    if (!htmlScrollState) return;
                    const dt = (now - last) / 1000;
                    last = now;
                    if (win.scrollY + clientHeight >= scrollHeight - 2) {
                        if (loop) {
                            win.scrollTo(0, 0);
                        } else {
                            stopHtmlScroll();
                            return;
                        }
                    }
                    win.scrollBy(0, speedPx * dt);
                    htmlScrollState.rafId = requestAnimationFrame(step);
                };
                htmlScrollState = { rafId: requestAnimationFrame(step) };
            }
        }

        // TTS 播报 + 临时媒体信息上报（各媒体类型共用）
        function announceAndReport(mediaName, data) {
            if (autoTtsEnabled && mediaName) {
                const displayName = extractFileName(mediaName);
                if (displayName) {
                    requestMediaNameTts(displayName);
                }
            }

            if (!data.temp) return;
            const sendTempInfo = () => {
                if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                let w, h;
                if (data.mediaType === 'video') {
                    w = mediaVideo.videoWidth;
                    h = mediaVideo.videoHeight;
                } else if (data.mediaType !== 'html' && data.mediaType !== 'audio') {
                    w = mediaImage.naturalWidth;
                    h = mediaImage.naturalHeight;
                }
                displayWs.send(JSON.stringify({
                    type: 'tempMediaInfo',
                    fileName: data.fileName || mediaName || '',
                    mediaType: data.mediaType,
                    width: w || undefined,
                    height: h || undefined
                }));
            };
            const readyTarget = data.mediaType === 'video'
                ? mediaVideo
                : (data.mediaType === 'audio' ? mediaAudio : (data.mediaType === 'html' ? mediaHtml : mediaImage));
            const readyEvent = data.mediaType === 'video' || data.mediaType === 'audio' ? 'loadedmetadata' : 'load';
            if (data.mediaType === 'html') {
                // html 无固有尺寸，加载完成即上报（不含宽高）
                readyTarget.addEventListener(readyEvent, sendTempInfo, { once: true });
            } else if (readyTarget.readyState >= 1 || (readyTarget.complete && readyTarget.naturalWidth > 0)) {
                sendTempInfo();
            } else {
                readyTarget.addEventListener(readyEvent, sendTempInfo, { once: true });
            }
        }

        // 视频自动播放：浏览器/WebView autoplay 策略拦截有声视频（无用户手势），
        // 先 muted 播放绕过拦截，成功后取消静音（音量跟随显示端 volume）
        function playVideoAuto(video, preserveMuted = false) {
            if (isTtsPlaybackActive() && video === mediaVideo) {
                // TTS 期间视频保持原始音轨，不再次申请媒体焦点；系统可按策略自动 duck。
                return Promise.resolve(video.play()).then(() => true).catch(() => false);
            }
            const mutedBeforePlay = video.muted;
            video.muted = true;
            return video.play().then(() => {
                video.muted = preserveMuted ? mutedBeforePlay : false;
                return true;
            }).catch(e => {
                video.muted = preserveMuted ? mutedBeforePlay : false;
                console.log('自动播放被阻止');
                return false;
            });
        }

        // 音频自动播放沿用统一的 Promise 捕获，避免浏览器策略阻止时产生未处理 rejection。
        function playAudioAuto(audio) {
            if (isTtsPlaybackActive()) return Promise.resolve(false);
            // WebSocket 下发不属于用户手势，先静音播放绕过 Chromium/WebView 自动播放限制，
            // 播放成功后恢复当前音量；失败时捕获 Promise，交给控制端播放按钮再次触发。
            audio.muted = true;
            return audio.play().then(() => {
                audio.muted = false;
                return true;
            }).catch(e => {
                audio.muted = false;
                console.log('音频自动播放被阻止');
                return false;
            });
        }

        function getCurrentPlayableMedia() {
            if (currentMediaType === 'audio') return mediaAudio;
            if (currentMediaType === 'video') return mediaVideo;
            return null;
        }

        // 媒体元数据加载后才能安全设置 currentTime；旧状态没有进度时保持 0 秒。
        function applyResumeTime(media, resumeTime) {
            const time = Number(resumeTime);
            if (!Number.isFinite(time) || time <= 0 || !Number.isFinite(media.duration) || media.duration <= 0) return;
            const maxTime = Math.max(media.duration - 0.05, 0);
            media.currentTime = Math.min(Math.max(time, 0), maxTime);
        }

        function showMedia(data, noActivate, paused, resumeTime = 0) {
            // 控制端下发媒体自动进入 60 秒激活窗口（睡眠中操作即时可见）；restore/播放列表等显示端内部调用不激活
            if (!noActivate) activateTemporarily();
            pauseExpected = true;
            mediaRecoveryAttempts = 0;
            if (mediaRecoveryTimer) {
                clearTimeout(mediaRecoveryTimer);
                mediaRecoveryTimer = null;
            }
            const previousMediaType = currentMediaType;
            currentMediaType = data.mediaType || 'image';
            mediaVideo.pause();
            mediaVideo.src = '';
            mediaVideo.load();
            mediaAudio.pause();
            mediaAudio.src = '';
            mediaAudio.load();
            mediaAudio.ontimeupdate = null;
            mediaVideo.onloadedmetadata = null;
            mediaAudio.onloadedmetadata = null;
            waitingMessage.style.display = 'none';

            if (data.mediaType === 'text') {
                stopDynamicFit();
                stopHtmlScroll();
                mediaImage.style.display = 'none';
                mediaImage.removeAttribute('src');
                mediaVideo.style.display = 'none';
                mediaAudio.style.display = 'none';
                mediaHtml.style.display = 'none';
                mediaHtml.removeAttribute('src');
                mediaHtml.srcdoc = '';
                fileNameDisplay.textContent = data.fileName || '文本内容';
                TextMediaPlayer.load(data, {
                    paused: !!paused,
                    pageIndex: data.textProgress && data.textProgress.pageIndex
                });
                mediaIsPlaying = !paused;
                pauseExpected = !!paused;
                return;
            }

            if (data.mediaType === 'html') {
                // HTML 媒体：iframe 铺满纯展示，跳过 img/video 与裁剪
                stopDynamicFit();
                stopHtmlScroll();
                mediaImage.style.display = 'none';
                mediaImage.removeAttribute('src');
                mediaVideo.pause();
                mediaVideo.src = '';
                mediaVideo.load();
                mediaVideo.style.display = 'none';
                mediaAudio.style.display = 'none';
                mediaHtml.style.display = 'block';
                // 发送未指定模式时沿用显示端当前模式；指定则更新记忆
                if (data.htmlScroll) currentHtmlScroll = data.htmlScroll;
                mediaHtml.onload = () => {
                    // 重连恢复且为暂停状态时不自动滚动（控制端暂停的页面重连后保持冻结）
                    if (paused) {
                        stopHtmlScroll();
                    } else {
                        startHtmlScroll(mediaHtml, data.htmlScroll || currentHtmlScroll);
                    }
                };
                // html 播放进度上报（滚动比例 + 缩放倍数）
                if (!htmlProgressTimer) {
                    htmlProgressTimer = setInterval(reportHtmlProgress, 1000);
                }
                let mediaName = data.fileName || 'HTML内容';
                if (data.type === 'url') {
                    // 关键：必须移除 srcdoc 属性，否则 src 导航被 srcdoc（优先）占位，外部网页永远显示空白
                    mediaHtml.removeAttribute('srcdoc');
                    if (/\.mhtml?$/i.test(data.url)) {
                        // .mhtml 浏览器无法直接渲染：fetch 后转纯 HTML 用 srcdoc 显示
                        fetch(data.url, { credentials: 'same-origin' })
                            .then(r => r.text())
                            .then(text => {
                                const html = mhtmlToHtml(text);
                                mediaHtml.srcdoc = html || '<p style="color:#fff;padding:20px">无法解析该 .mhtml 文件</p>';
                            })
                            .catch(() => {
                                mediaHtml.srcdoc = '<p style="color:#fff;padding:20px">加载 .mhtml 失败</p>';
                            });
                    } else {
                        mediaHtml.src = data.url;
                    }
                    const urlParts = data.url.split('/');
                    mediaName = decodeURIComponent(urlParts[urlParts.length - 1].split('?')[0]) || mediaName;
                } else {
                    const bytes = Uint8Array.from(atob(data.data), c => c.charCodeAt(0));
                    const html = new TextDecoder().decode(bytes);
                    mediaHtml.src = '';
                    mediaHtml.srcdoc = html;
                }
                fileNameDisplay.textContent = mediaName;
                pauseExpected = true;
                mediaIsPlaying = false;
                announceAndReport(mediaName, data);
                return;
            }

            // 非 html 媒体：取消滚动并隐藏 iframe（html 切回图片/视频时清理）
            stopHtmlScroll();
            if (previousMediaType === 'text') TextMediaPlayer.stop();
            mediaText.style.display = 'none';
            mediaHtml.style.display = 'none';
            mediaHtml.removeAttribute('src');
            mediaHtml.srcdoc = '';
            mediaAudio.style.display = 'none';

            let mediaName = '';

            if (data.type === 'url') {
                if (data.mediaType === 'audio') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'none';
                    mediaAudio.src = data.url;
                    mediaAudio.loop = true;
                    mediaAudio.onloadedmetadata = () => applyResumeTime(mediaAudio, resumeTime);
                    mediaAudio.load();
                    if (paused) {
                        mediaAudio.pause();
                    } else {
                        playAudioAuto(mediaAudio);
                    }
                    mediaAudio.ontimeupdate = function() {
                        if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                        if (!mediaAudio.duration) return;
                        displayWs.send(JSON.stringify({
                            type: 'audioProgress',
                            currentTime: mediaAudio.currentTime,
                            duration: mediaAudio.duration
                        }));
                    };
                } else if (data.mediaType === 'video') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'block';
                    mediaVideo.src = data.url;
                    // 单媒体/重连恢复始终循环；批量播放切项时会再改为 false
                    mediaVideo.loop = true;
                    mediaVideo.onloadedmetadata = () => {
                        applyResumeTime(mediaVideo, resumeTime);
                        restartDynamicFitAfterMediaLoad();
                    };
                    mediaVideo.load();
                    // 重连恢复且为暂停状态时不自动播放（控制端暂停的视频重连后保持暂停）
                    if (paused) {
                        mediaVideo.pause();
                    } else {
                        playVideoAuto(mediaVideo);
                    }
                    mediaVideo.ontimeupdate = function() {
                        if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                        var d = mediaVideo.duration;
                        if (!d) return;
                        displayWs.send(JSON.stringify({
                            type: 'videoProgress',
                            currentTime: mediaVideo.currentTime,
                            duration: d
                        }));
                    };
                } else {
                    mediaVideo.style.display = 'none';
                    mediaImage.style.display = 'block';
                    mediaImage.src = data.url;
                    mediaImage.onload = restartDynamicFitAfterMediaLoad;
                }
                const urlParts = data.url.split('/');
                mediaName = decodeURIComponent(urlParts[urlParts.length - 1].split('?')[0]) || '来自URL';
                fileNameDisplay.textContent = mediaName;
            } else if (data.type === 'base64') {
                const mimeType = data.mimeType || 'application/octet-stream';
                const src = 'data:' + mimeType + ';base64,' + data.data;
                
                if (data.mediaType === 'audio') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'none';
                    mediaAudio.src = src;
                    mediaAudio.loop = true;
                    mediaAudio.onloadedmetadata = () => applyResumeTime(mediaAudio, resumeTime);
                    mediaAudio.load();
                    if (paused) {
                        mediaAudio.pause();
                    } else {
                        playAudioAuto(mediaAudio);
                    }
                    mediaAudio.ontimeupdate = function() {
                        if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                        if (!mediaAudio.duration) return;
                        displayWs.send(JSON.stringify({
                            type: 'audioProgress',
                            currentTime: mediaAudio.currentTime,
                            duration: mediaAudio.duration
                        }));
                    };
                } else if (data.mediaType === 'video') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'block';
                    mediaVideo.src = src;
                    mediaVideo.loop = true;
                    mediaVideo.onloadedmetadata = () => {
                        applyResumeTime(mediaVideo, resumeTime);
                        restartDynamicFitAfterMediaLoad();
                    };
                    mediaVideo.load();
                    // 重连恢复且为暂停状态时不自动播放
                    if (paused) {
                        mediaVideo.pause();
                    } else {
                        playVideoAuto(mediaVideo);
                    }
                } else {
                    mediaVideo.style.display = 'none';
                    mediaImage.style.display = 'block';
                    mediaImage.src = src;
                    mediaImage.onload = restartDynamicFitAfterMediaLoad;
                }
                mediaName = data.fileName || '未知文件';
                fileNameDisplay.textContent = mediaName;
            }

            announceAndReport(mediaName, data);
            // 新媒体显示即播放（或按恢复的暂停状态），同步本地播放状态 + 上报真实播放状态，避免服务端残留陈旧的 isPlaying=false 导致重连误暂停
            mediaIsPlaying = !paused;
            pauseExpected = !!paused;
            reportPlayState(!paused, resumeTime);
        }

        // 上报播放状态到服务端：控制端暂停/播放、显示新媒体、重连恢复后，供服务端持久化 isPlaying 并在重连时恢复
        function reportPlayState(playing, resumeTime) {
            if (displayWs && displayWs.readyState === 1) {
                const media = getCurrentPlayableMedia();
                const currentTime = Number.isFinite(resumeTime)
                    ? resumeTime
                    : (media && Number.isFinite(media.currentTime) ? media.currentTime : 0);
                const duration = media && Number.isFinite(media.duration) ? media.duration : 0;
                displayWs.send(JSON.stringify({
                    type: 'playStateReport',
                    isPlaying: !!playing,
                    currentTime: currentTime,
                    duration: duration
                }));
            }
        }

        function handleControl(data) {
            switch (data.action) {
                case 'textPlayback':
                    TextMediaPlayer.handleControl(data.value);
                    break;

                case 'textStyle':
                    TextMediaPlayer.applyStyle(data.value);
                    break;

                case 'rotate':
                    currentRotation = data.value !== undefined ? data.value : data.rotation;
                    applyRotation();
                    applyCrop();
                    if (currentMediaType === 'text') {
                        requestAnimationFrame(() => TextMediaPlayer.applyStyle({}));
                    }
                    break;
                    
                case 'fit':
                    applyFit(data.value);
                    break;

                case 'dynamicFitConfig':
                    setDynamicFitConfig(data.value);
                    break;

                case 'reload':
                    // 控制端主动刷新显示端页面（重新加载最新代码并恢复持久化状态）
                    console.log('[显示端] 收到控制端刷新指令，reload...');
                    location.reload();
                    break;

                case 'htmlScroll':
                    // 控制端切换当前 html 播放模式（未指定模式时记忆沿用）
                    if (data.value) currentHtmlScroll = data.value;
                    if (mediaHtml.style.display !== 'none') {
                        startHtmlScroll(mediaHtml, currentHtmlScroll);
                    }
                    break;

                case 'htmlScrollTo':
                    // 控制端拖动进度条：同步滚动到对应位置（0-100）
                    if (mediaHtml.style.display !== 'none') {
                        const win = mediaHtml.contentWindow;
                        if (win && win.document) {
                            const doc = win.document;
                            const scrollHeight = Math.max(
                                (doc.documentElement && doc.documentElement.scrollHeight) || 0,
                                (doc.body && doc.body.scrollHeight) || 0
                            );
                            const clientHeight = win.innerHeight || mediaHtml.clientHeight;
                            win.scrollTo(0, (data.value / 100) * (scrollHeight - clientHeight));
                        }
                    }
                    break;

                case 'controlMode':
                    // 控制模式开关：开启暂停自动滚动并开始截图，关闭恢复
                    setControlMode(data.value === true);
                    break;

                case 'controlInput':
                    // 控制端输入转发：鼠标/滚轮/键盘/文本
                    dispatchControlInput(data);
                    break;

                case 'play':
                    // 睡眠/深度睡眠中拒绝播放命令（暂停命令仍生效并上报）
                    if (data.value === true && isSleepPaused()) break;
                    mediaIsPlaying = data.value === true;  // 同步本地播放状态（退出睡眠恢复时检查）
                    if (data.value === true) {
                        pauseExpected = false;
                        if (mediaHtml.style.display !== 'none') {
                            // html 模式：恢复滚动播放（从当前滚动位置继续）
                            startHtmlScroll(mediaHtml, currentHtmlScroll);
                        } else if (currentMediaType === 'audio') {
                            playAudioAuto(mediaAudio);
                        } else {
                            playVideoAuto(mediaVideo);
                        }
                    } else {
                        pauseExpected = true;
                        if (mediaHtml.style.display !== 'none') {
                            // html 模式：暂停滚动（滚动位置保留）
                            stopHtmlScroll();
                        } else if (currentMediaType === 'audio') {
                            mediaAudio.pause();
                        } else {
                            mediaVideo.pause();
                        }
                    }
                    // 上报真实播放状态：暂停后重连/刷新时服务端据此恢复，避免自动播放
                    reportPlayState(data.value === true);
                    break;
                    
                case 'seek':
                    {
                        const media = getCurrentPlayableMedia();
                        if (media && media.duration) {
                            media.currentTime = (data.value / 100) * media.duration;
                        }
                    }
                    break;
                    
                case 'volume':
                    {
                        const media = getCurrentPlayableMedia();
                        if (media) media.volume = data.value / 100;
                    }
                    break;
                    
                case 'cropDebug':
                    _cropDebug = !!data.value;
                    break;

                case 'crop':
                    currentCrop = data.value;
                    currentFit = 'crop';
                    scheduleCropApply();
                    break;
                    
                case 'customCrop':
                    applyCustomCrop(data.value);
                    sendCommandAck('customCrop', true, '自定义裁剪已应用');
                    break;

                case 'sleepSettings':
                    // 应用控制端下发的睡眠设置（合法化小时值），立即判定并应用
                    {
                        const s = data.value || {};
                        sleepSettings = {
                            enabled: !!s.enabled,
                            startHour: clampHour(s.startHour),
                            endHour: clampHour(s.endHour),
                            deepStartHour: clampHour(s.deepStartHour),
                            deepEndHour: clampHour(s.deepEndHour)
                        };
                        checkSleepMode();
                    }
                    break;

                case 'sleepActivate':
                    activateTemporarily();
                    break;

                case 'sleepOverride':
                    // 立即切换优先于临时激活：先清除 60 秒窗口，再应用手动睡眠/恢复正常
                    activationUntil = 0;
                    manualSleepMode = (data.value === 'sleep' || data.value === 'deep') ? data.value : null;
                    checkSleepMode();
                    break;
            }
        }

        // ===== 睡眠模式：按时段使用媒体/UI 遮罩，降低夜间干扰 =====
        // 时间在显示端本地判断（各设备用自己时区），每 10 秒检查一次。
        // 优先级：立即手动覆盖 > 临时激活 > 深度睡眠 > 睡眠 > 正常。
        // 下发媒体/临时激活（activateTemporarily）会同时取消手动覆盖（manualSleepMode=null），
        // 因此手动覆盖与激活窗口不会同时有效：覆盖被取消后按正常时段判定。
        const mediaSleepOverlay = document.getElementById('mediaSleepOverlay');
        const uiSleepOverlay = document.getElementById('uiSleepOverlay');
        let sleepSettings = { enabled: true, startHour: 23, endHour: 8, deepStartHour: 1, deepEndHour: 6 };
        let sleepState = 'normal';   // 'normal' | 'sleep' | 'deep' | 'active'
        let activationUntil = 0;     // 临时激活截止时间戳
        let manualSleepMode = null;  // 手动覆盖枚举：null | 'sleep' | 'deep'，控制端显式进入睡眠/深度睡眠，直到再次下发
        let mediaIsPlaying = false;  // 单媒体控制端播放/暂停设置：showMedia 末尾与 handleControl('play') 同步更新；退出睡眠恢复时检查，暂停则保持暂停
        let pauseExpected = true;    // 媒体元素的暂停是否由控制端、睡眠或媒体切换主动触发
        let mediaRecoveryTimer = null;
        let mediaRecoveryAttempts = 0;
        const MEDIA_RECOVERY_MAX_ATTEMPTS = 5;
        const MEDIA_RECOVERY_DELAY_MS = 300;

        // 跨天时段判定：startHour > endHour 时跨天（23-8），否则非跨天（1-6）
        function inSleepWindow(hour, start, end) {
            if (start > end) return hour >= start || hour < end;
            return hour >= start && hour < end;
        }

        // 小时值合法化：clamp 到 0-23
        function clampHour(h) {
            h = parseInt(h, 10);
            if (isNaN(h)) return 0;
            return Math.max(0, Math.min(23, h));
        }

        // 暂停媒体：视频暂停 + html 滚动暂停（图片无需处理）
        function pauseSleepMedia() {
            pauseExpected = true;
            mediaRecoveryAttempts = 0;
            if (mediaRecoveryTimer) {
                clearTimeout(mediaRecoveryTimer);
                mediaRecoveryTimer = null;
            }
            mediaVideo.pause();
            mediaAudio.pause();
            if (mediaHtml.style.display !== 'none') stopHtmlScroll();
        }

        // 当前媒体该不该播放：播放列表读 ps.paused（睡眠前控制端暂停播放列表则保持暂停），单媒体读 mediaIsPlaying（控制端播放/暂停设置）
        function shouldPlayMedia() {
            if (playlistState && playlistState.active) return !playlistState.paused;
            return mediaIsPlaying !== false;
        }

        // 睡眠期间 ended/timer 可能已经清掉当前项监听；唤醒时恢复当前项的批量生命周期。
        function resumePlaylistAfterSleep() {
            const ps = playlistState;
            if (!ps || !ps.active || ps.paused || ps.timer) return;
            const item = ps.playlist[ps.index];
            if (!item) return;
            if (item.mediaType === 'video' && !ps.videoEndedHandler) {
                playCurrentItem();
                return;
            }
            if (item.mediaType === 'audio' && !ps.audioEndedHandler) {
                playCurrentItem();
                return;
            }
            if (item.mediaType !== 'video' && item.mediaType !== 'audio') {
                ps.timer = setTimeout(playlistNext, ps.interval);
            }
        }

        // 恢复媒体：html 续滚动，视频/音频续播（拦截自动播放限制）；控制端暂停的媒体保持暂停，不自动播放
        function resumeSleepMedia() {
            if (!shouldPlayMedia()) return;
            pauseExpected = false;
            resumePlaylistAfterSleep();
            if (playlistState && playlistState.active) {
                const item = playlistState.playlist[playlistState.index];
                if (item && (item.mediaType === 'video' || item.mediaType === 'audio')) return;
            }
            if (mediaHtml.style.display !== 'none') {
                startHtmlScroll(mediaHtml, currentHtmlScroll);
            } else if (currentMediaType === 'audio' && mediaAudio.src) {
                playAudioAuto(mediaAudio);
            } else if (mediaVideo.src) {
                playVideoAuto(mediaVideo);
            }
        }

        function getExpectedMediaElement() {
            if (currentMediaType === 'audio') return mediaAudio;
            if (currentMediaType === 'video') return mediaVideo;
            return null;
        }

        // 只要控制端仍期望播放且不在睡眠/播放列表暂停状态，就允许恢复系统打断的媒体。
        function isMediaPlaybackExpected() {
            if (isSleepPaused()) return false;
            if (playlistState && playlistState.active && playlistState.paused) return false;
            return mediaIsPlaying && !pauseExpected;
        }

        // 系统媒体抢占导致 WebView 暂停时，保持服务器期望状态为播放并有限重试。
        // 手动暂停、睡眠、列表暂停会通过 pauseExpected 拦截，不会被误恢复。
        function recoverUnexpectedMediaPause() {
            const reason = arguments[0] || 'pause';
            const media = getExpectedMediaElement();
            if (!media || !media.src || !isMediaPlaybackExpected() || pauseExpected) return;
            if (media.ended) {
                reportPlayState(true);
                return;
            }

            reportPlayState(true);
            if (!media.paused) return;
            if (mediaRecoveryTimer || mediaRecoveryAttempts >= MEDIA_RECOVERY_MAX_ATTEMPTS) return;
            mediaRecoveryAttempts++;
            const playPromise = currentMediaType === 'audio'
                ? playAudioAuto(media)
                : playVideoAuto(media);
            Promise.resolve(playPromise).then(success => {
                if (success) {
                    mediaRecoveryAttempts = 0;
                    reportPlayState(true);
                    return;
                }
                if (isMediaPlaybackExpected()) {
                    mediaRecoveryTimer = setTimeout(() => {
                        mediaRecoveryTimer = null;
                        recoverUnexpectedMediaPause(reason + ':retry');
                    }, MEDIA_RECOVERY_DELAY_MS);
                }
            });
        }

        // 事件优先、低频 watchdog 兜底：覆盖系统媒体焦点切换时 WebView 未发出完整事件的机型。
        function installMediaPlaybackStateMonitor() {
            [mediaVideo, mediaAudio].forEach(media => {
                media.addEventListener('pause', () => {
                    if (media === getExpectedMediaElement()) recoverUnexpectedMediaPause('pause');
                });
                media.addEventListener('play', () => {
                    if (isSleepPaused()) {
                        // WebView/原生焦点回调可能在睡眠已生效后延迟触发 play，必须立即拦截。
                        pauseSleepMedia();
                        return;
                    }
                    if (media === getExpectedMediaElement() && isMediaPlaybackExpected() && !pauseExpected) {
                        mediaRecoveryAttempts = 0;
                        if (mediaRecoveryTimer) {
                            clearTimeout(mediaRecoveryTimer);
                            mediaRecoveryTimer = null;
                        }
                        reportPlayState(true);
                    }
                });
                media.addEventListener('error', () => {
                    // 批量媒体的 error 由当前项处理器安排下一项；单媒体才交给恢复逻辑重试。
                    if (media === getExpectedMediaElement() && !(playlistState && playlistState.active)) {
                        recoverUnexpectedMediaPause('error');
                    }
                });
            });
            setInterval(() => {
                const media = getExpectedMediaElement();
                if (isSleepPaused()) {
                    if (media && media.src && !media.paused) pauseSleepMedia();
                    return;
                }
                if (media && media.src && media.paused && !media.ended
                    && isMediaPlaybackExpected() && !pauseExpected) {
                    recoverUnexpectedMediaPause('watchdog');
                }
            }, 1000);
        }

        // 原生焦点只负责通知，不在网页端再次申请焦点；恢复统一走网页媒体 play()。
        window.onNativeAudioFocusChanged = function(change) {
            const code = Number(change);
            if (code < 0) {
                if (isMediaPlaybackExpected()) recoverUnexpectedMediaPause('audioFocusLoss');
                scheduleTtsRecovery('audioFocusLoss');
                TextMediaPlayer.recoverAudioPlayback('audioFocusLoss');
                return;
            }
            ttsRecoveryAttempts = 0;
            mediaRecoveryAttempts = 0;
            if (mediaRecoveryTimer) {
                clearTimeout(mediaRecoveryTimer);
                mediaRecoveryTimer = null;
            }
            recoverUnexpectedMediaPause('audioFocusGain');
            recoverTtsPlayback('audioFocusGain');
            TextMediaPlayer.recoverAudioPlayback('audioFocusGain');
        };

        installMediaPlaybackStateMonitor();

        // 睡眠/深度睡眠期间为 true，仅用于媒体播放守卫；TTS 是否检查睡眠由服务器调用方决定
        function isSleepPaused() {
            return sleepState === 'sleep' || sleepState === 'deep';
        }

        // 应用睡眠状态：普通睡眠只遮媒体，深度睡眠只显示全屏 UI 遮罩；媒体容器始终保持布局
        function applySleepState(state) {
            const prev = sleepState;
            sleepState = state;
            mediaSleepOverlay.style.display = state === 'sleep' ? 'block' : 'none';
            uiSleepOverlay.style.display = state === 'deep' ? 'block' : 'none';
            if (state === 'sleep' || state === 'deep') {
                pauseSleepMedia();
            } else if (prev === 'sleep' || prev === 'deep') {
                // 仅从隐藏态恢复时续播媒体，TTS 始终由自身队列控制
                resumeSleepMedia();
            }
            // 状态变化时上报，供控制端按钮实时显示
            reportSleepState();
        }

        // 上报当前睡眠状态到服务端（连接成功 + 每次状态变化）：服务端存 displayData.state.sleepState 并转发控制端
        function reportSleepState() {
            if (displayWs && displayWs.readyState === 1) {
                displayWs.send(JSON.stringify({ type: 'sleepStateReport', sleepState: sleepState }));
            }
        }

        // 10 秒定时检查：按优先级计算目标状态，状态变化才应用（避免每 10 秒重复 DOM 操作）
        function checkSleepMode() {
            let target = 'normal';
            // 立即切换优先于临时激活；临时激活只覆盖时段判定
            if (manualSleepMode === 'deep' || manualSleepMode === 'sleep') {
                target = manualSleepMode;
            } else if (Date.now() < activationUntil) {
                target = 'active';
            } else if (sleepSettings.enabled) {
                const hour = new Date().getHours();
                if (inSleepWindow(hour, sleepSettings.deepStartHour, sleepSettings.deepEndHour)) {
                    target = 'deep';
                } else if (inSleepWindow(hour, sleepSettings.startHour, sleepSettings.endHour)) {
                    target = 'sleep';
                }
            }
            if (target !== sleepState) {
                applySleepState(target);
            }
        }

        // 临时激活：强制显示 60 秒。下发媒体/临时激活同时取消手动覆盖（manualSleepMode 置 null），
        // 覆盖解除后不再回落手动，改按时段判定
        function activateTemporarily() {
            manualSleepMode = null;
            activationUntil = Date.now() + 60000;
            applySleepState('active');
        }

        function getPersistentDisplayId() {
            let id = localStorage.getItem('displayId');
            if (!id) {
                id = 'display-' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('displayId', id);
            }
            return id;
        }

        function applyLogReportConfig(data) {
            logReportConfig = data;
            if (data.enabled) {
                if (!_originalConsole) {
                    _originalConsole = {
                        log: console.log,
                        info: console.info,
                        warn: console.warn,
                        error: console.error,
                        debug: console.debug
                    };
                    console.log = function() {};
                    console.info = function() {};
                    console.warn = function() {};
                    console.error = function() {};
                    console.debug = function() {};
                }
            } else {
                if (_originalConsole) {
                    console.log = _originalConsole.log;
                    console.info = _originalConsole.info;
                    console.warn = _originalConsole.warn;
                    console.error = _originalConsole.error;
                    console.debug = _originalConsole.debug;
                    _originalConsole = null;
                }
            }
        }

        function clearDisplayReconnectTimer() {
            if (displayReconnectTimer === null) return;
            clearTimeout(displayReconnectTimer);
            displayReconnectTimer = null;
        }

        function scheduleDisplayReconnect() {
            if (!displayPageActive || displayReconnectTimer !== null) return;
            if (displayWs && (displayWs.readyState === WebSocket.CONNECTING || displayWs.readyState === WebSocket.OPEN)) return;

            displayReconnectTimer = setTimeout(() => {
                displayReconnectTimer = null;
                if (displayPageActive) connectWebSocket();
            }, 3000);
        }

        function isCurrentDisplaySocket(socket) {
            return displayPageActive && displayWs === socket;
        }

        function connectWebSocket() {
            if (!displayPageActive) return;
            if (displayWs && (displayWs.readyState === WebSocket.CONNECTING || displayWs.readyState === WebSocket.OPEN)) return;
            clearDisplayReconnectTimer();

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const id = getPersistentDisplayId();
            const wsUrl = `${protocol}//${window.location.host}/display?displayId=${id}`;

            let socket = null;
            try {
                socket = new WebSocket(wsUrl);
            } catch (error) {
                console.error('创建 WebSocket 失败:', error);
                scheduleDisplayReconnect();
                return;
            }
            displayWs = socket;

            socket.onopen = function() {
                if (!isCurrentDisplaySocket(socket)) return;
                clearDisplayReconnectTimer();
                setConnectionStatus('connected', '已连接');
                sendCanvasSize();
                sendBrowserInfo();
                declareCapabilities();

            socket.onmessage = function(event) {

                    setCorrelationId(data.correlationId);

                    if (data.type === 'serverStartTime') {
                        const storedTime = localStorage.getItem('serverStartTime');
                        if (storedTime && storedTime !== String(data.time)) {
                            localStorage.setItem('serverStartTime', data.time);

                            localStorage.setItem('serverStartTime', data.time);

                        if (window.UiTheme) {

                    }
                    
                    if (data.type === 'capabilitiesUpdated') {
                        handleCapabilitiesUpdated(data);

                    if (data.type === 'voiceTtsPlaybackState') {
                        handleVoiceTtsPlaybackState(data);
                        return;

                    if (data.type === 'voiceConversationState') {
