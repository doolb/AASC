<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>媒体显示端</title>
    <link rel="stylesheet" href="css/display.css">
</head>
<body>
    <div id="connectionStatus" class="connecting">连接中...</div>
    <div id="timeDisplay"></div>
    <div id="fileNameDisplay"></div>
    <div id="voiceStatus" class="voice-status-hidden">语音</div>
    <div id="voiceTextDisplay" class="voice-text-hidden"></div>
    <div class="monitor-wrapper" id="monitorWrapper">
        <div class="monitor-label">AUDIO_FREQ // MONITOR</div>
        <canvas id="mini-monitor" width="160" height="50"></canvas>
    </div>
    
    <div id="mediaContainer">
        <div id="waitingMessage">
            <h2>等待媒体...</h2>
            <p>请在上传端选择图片或视频</p>
        </div>
        <img id="mediaImage">
        <video id="mediaVideo" autoplay loop playsinline></video>
    </div>
    
    <audio id="ttsAudio" style="display:none;"></audio>
    <script src="js/sherpa-asr.js"></script>
    <script>
        const connectionStatus = document.getElementById('connectionStatus');
        const timeDisplay = document.getElementById('timeDisplay');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceTextDisplay = document.getElementById('voiceTextDisplay');
        const monitorWrapper = document.getElementById('monitorWrapper');
        const waitingMessage = document.getElementById('waitingMessage');
        const mediaImage = document.getElementById('mediaImage');
        const mediaVideo = document.getElementById('mediaVideo');
        const ttsAudio = document.getElementById('ttsAudio');
        
        let currentRotation = 0;
        let currentFit = 'contain';
        let currentCrop = { x: 0, y: 0, width: 100, height: 100 };
        let displayWs = null;
        let autoTtsEnabled = true;
        let ttsQueue = [];
        let isPlayingTts = false;
        let voiceSupported = false;
        let isListening = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let micStream = null;
        let audioContext = null;
        let analyser = null;
        let silenceStartTime = null;
        let hasSpeech = false;
        let speechStartTime = null;
        let speechChunks = [];
        let collectingSpeech = false;
        let isAlwaysListening = false;
        let pendingAutoStart = false;
        let wasListeningBeforePlayback = false;
        let noInterruptMode = true;
        let audioQueue = [];
        let isPlayingAudio = false;
        let currentAudio = null;
        let isLLMGenerating = false;
        let consecutiveIgnoreCount = 0;
        let voiceCooldownUntil = 0;
        const MAX_CONSECUTIVE_IGNORES = 3;
        const VOICE_COOLDOWN_MS = 10000;
        let localAsrAvailable = false;
        let localAsrStreaming = false;
        
        let monitorTime = 0;
        let monitorAnalyser = null;
        let monitorDataArray = null;
        
        const monitorCanvas = document.getElementById('mini-monitor');
        const monitorCtx = monitorCanvas.getContext('2d');
        
        function drawMonitor(data) {
            monitorCtx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
            monitorCtx.fillStyle = '#00f2ff';
            
            const barWidth = 3;
            const gap = 1;
            const step = Math.floor(data.length / (monitorCanvas.width / (barWidth + gap)));

            for (let i = 0; i < monitorCanvas.width; i += (barWidth + gap)) {
                const dataIndex = Math.floor(i / (barWidth + gap)) * step;
                const value = data[dataIndex] || 0;
                const percent = value / 255;
                const barHeight = percent * monitorCanvas.height;

                monitorCtx.globalAlpha = 0.5 + (percent * 0.5);
                monitorCtx.fillRect(i, monitorCanvas.height - barHeight, barWidth, barHeight);
            }
        }
        
        function drawIdleMonitor(t) {
            monitorCtx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
            monitorCtx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < monitorCanvas.width; i += 4) {
                const h = 5 + Math.sin(i * 0.1 + t * 5) * 3;
                monitorCtx.fillRect(i, monitorCanvas.height - h, 3, h);
            }
        }
        
        function animateMonitor() {
            requestAnimationFrame(animateMonitor);
            monitorTime += 0.005;

            if (isListening && analyser) {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                drawMonitor(data);
            } else {
                drawIdleMonitor(monitorTime);
            }
        }
        
        animateMonitor();
        
        function sendCanvasSize() {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'canvasSize',
                    width: window.innerWidth,
                    height: window.innerHeight
                }));
            }
        }
        
        // 存储最近收到的消息中的 correlationId，用于 commandAck 回传
        let _lastCorrelationId = null;
        function setCorrelationId(cid) { if (cid) _lastCorrelationId = cid; }

        function sendCommandAck(commandType, success, details, extraData) {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                const ack = {
                    type: 'commandAck',
                    commandType: commandType,
                    success: success,
                    details: details || '',
                    timestamp: Date.now()
                };
                if (_lastCorrelationId) {
                    ack.correlationId = _lastCorrelationId;
                    _lastCorrelationId = null; // 使用后清空，避免重复
                }
                if (extraData) {
                    ack.extraData = extraData;
                }
                displayWs.send(JSON.stringify(ack));
            }
        }
        
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            const uaLower = ua.toLowerCase();
            
            let browserName = '未知浏览器';
            let browserVersion = '未知';
            
            if (uaLower.includes('edg/')) {
                browserName = 'Microsoft Edge';
                browserVersion = ua.split('Edg/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('opr/') || uaLower.includes('opera')) {
                browserName = 'Opera';
                browserVersion = ua.split('OPR/')[1]?.split(' ')[0]?.split('.')[0] || 
                                ua.split('Opera')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('brave')) {
                browserName = 'Brave';
                browserVersion = ua.split('Chrome/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('samsungbrowser')) {
                browserName = 'Samsung Internet';
                browserVersion = ua.split('SamsungBrowser/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('ucbrowser') || uaLower.includes('ubrowser')) {
                browserName = 'UC Browser';
                browserVersion = ua.split('UCBrowser/')[1]?.split(' ')[0]?.split('.')[0] || 
                                ua.split('UBrowser/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('firefox')) {
                browserName = 'Firefox';
                browserVersion = ua.split('Firefox/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('safari') && !uaLower.includes('chrome')) {
                browserName = 'Safari';
                browserVersion = ua.split('Version/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('chrome')) {
                browserName = 'Google Chrome';
                browserVersion = ua.split('Chrome/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            }
            
            let os = '未知系统';
            if (ua.includes('Windows NT 10')) os = 'Windows 10/11';
            else if (ua.includes('Windows NT 6.3')) os = 'Windows 8.1';
            else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
            else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
            else if (ua.includes('Mac OS X')) {
                const match = ua.match(/Mac OS X (\d+[._]\d+)/);
                os = match ? `macOS ${match[1].replace('_', '.')}` : 'macOS';
            } else if (ua.includes('Android')) {
                const match = ua.match(/Android (\d+(\.\d+)?)/);
                os = match ? `Android ${match[1]}` : 'Android';
            } else if (ua.includes('iPhone OS') || ua.includes('iPad')) {
                const match = ua.match(/OS (\d+[._]\d+)/);
                os = match ? `iOS ${match[1].replace('_', '.')}` : 'iOS';
            } else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('CrOS')) os = 'Chrome OS';
            
            let deviceType = '桌面设备';
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                if (/iPad|Android/i.test(ua) || ua.includes('Tablet')) {
                    deviceType = '平板设备';
                } else {
                    deviceType = '移动设备';
                }
            }
            
            return {
                userAgent: ua,
                browserName: browserName,
                browserVersion: browserVersion,
                os: os,
                deviceType: deviceType,
                screenWidth: screen.width,
                screenHeight: screen.height,
                devicePixelRatio: window.devicePixelRatio
            };
        }
        
        function getFeatureSupport() {
            return [
                {
                    name: 'Web Speech API',
                    supported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
                    note: '语音识别'
                },
                {
                    name: 'WebRTC',
                    supported: !!(window.RTCPeerConnection || window.webkitRTCPeerConnection),
                    note: '实时通信'
                },
                {
                    name: 'WebGL',
                    supported: (function() {
                        try {
                            const canvas = document.createElement('canvas');
                            return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
                        } catch(e) { return false; }
                    })(),
                    note: '3D图形'
                },
                {
                    name: 'Service Worker',
                    supported: 'serviceWorker' in navigator,
                    note: '离线缓存'
                },
                {
                    name: 'WebAssembly',
                    supported: typeof WebAssembly === 'object',
                    note: '高性能计算'
                },
                {
                    name: 'Clipboard API',
                    supported: navigator.clipboard && typeof navigator.clipboard.writeText === 'function',
                    note: '剪贴板'
                },
                {
                    name: 'Geolocation',
                    supported: 'geolocation' in navigator,
                    note: '地理位置'
                },
                {
                    name: 'Web Workers',
                    supported: typeof Worker !== 'undefined',
                    note: '后台线程'
                },
                {
                    name: 'Fullscreen API',
                    supported: document.fullscreenEnabled || document.webkitFullscreenEnabled,
                    note: '全屏'
                },
                {
                    name: 'Screen Orientation',
                    supported: 'orientation' in screen,
                    note: '屏幕方向'
                }
            ];
        }
        
        function sendBrowserInfo() {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'browserInfo',
                    ...getBrowserInfo(),
                    featureSupport: getFeatureSupport()
                }));
            }
        }
        
        function applyRotation() {
            const transform = `rotate(${currentRotation}deg)`;
            mediaImage.style.transform = transform;
            mediaVideo.style.transform = transform;
            
            const uiElements = [connectionStatus, timeDisplay, fileNameDisplay, voiceStatus, voiceTextDisplay, monitorWrapper];
            
            uiElements.forEach(el => {
                if (!el) return;
                el.style.transform = '';
                el.style.transformOrigin = '';
                el.style.left = '';
                el.style.top = '';
                el.style.right = '';
                el.style.bottom = '';
                el.style.maxWidth = '';
                el.style.writingMode = '';
                el.style.textOrientation = '';
                el.style.flexDirection = '';
            });
            
            if (currentRotation === 0) {
                connectionStatus.style.top = '20px';
                connectionStatus.style.left = '20px';
                timeDisplay.style.top = '20px';
                timeDisplay.style.right = '20px';
                fileNameDisplay.style.bottom = '20px';
                fileNameDisplay.style.left = '20px';
                monitorWrapper.style.bottom = '20px';
                monitorWrapper.style.right = '20px';
                voiceStatus.style.bottom = '80px';
                voiceStatus.style.right = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.bottom = '140px';
                    voiceTextDisplay.style.right = '20px';
                }
            } else if (currentRotation === 90) {
                connectionStatus.style.top = '20px';
                connectionStatus.style.right = '20px';
                connectionStatus.style.writingMode = 'vertical-rl';
                connectionStatus.style.textOrientation = 'mixed';
                
                timeDisplay.style.bottom = '20px';
                timeDisplay.style.right = '20px';
                timeDisplay.style.writingMode = 'vertical-rl';
                timeDisplay.style.textOrientation = 'mixed';
                
                fileNameDisplay.style.top = '20px';
                fileNameDisplay.style.left = '20px';
                fileNameDisplay.style.writingMode = 'vertical-rl';
                fileNameDisplay.style.textOrientation = 'mixed';
                
                monitorWrapper.style.bottom = '20px';
                monitorWrapper.style.left = '20px';
                monitorWrapper.style.flexDirection = 'column-reverse';
                
                voiceStatus.style.bottom = '80px';
                voiceStatus.style.left = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.bottom = '140px';
                    voiceTextDisplay.style.left = '20px';
                    voiceTextDisplay.style.maxWidth = '50vh';
                }
                [timeDisplay, fileNameDisplay, voiceTextDisplay].forEach(el => {
                    if (el) el.style.maxWidth = '50vh';
                });
            } else if (currentRotation === 180) {
                connectionStatus.style.bottom = '20px';
                connectionStatus.style.right = '20px';
                connectionStatus.style.transform = 'rotate(180deg)';
                
                timeDisplay.style.bottom = '20px';
                timeDisplay.style.left = '20px';
                timeDisplay.style.transform = 'rotate(180deg)';
                
                fileNameDisplay.style.top = '20px';
                fileNameDisplay.style.right = '20px';
                fileNameDisplay.style.transform = 'rotate(180deg)';
                
                monitorWrapper.style.top = '20px';
                monitorWrapper.style.left = '20px';
                
                voiceStatus.style.top = '80px';
                voiceStatus.style.left = '20px';
                voiceStatus.style.transform = 'rotate(180deg)';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.top = '140px';
                    voiceTextDisplay.style.left = '20px';
                    voiceTextDisplay.style.transform = 'rotate(180deg)';
                }
            } else if (currentRotation === 270) {
                connectionStatus.style.bottom = '20px';
                connectionStatus.style.left = '20px';
                connectionStatus.style.writingMode = 'vertical-rl';
                connectionStatus.style.textOrientation = 'mixed';
                connectionStatus.style.transform = 'rotate(180deg)';
                
                timeDisplay.style.top = '20px';
                timeDisplay.style.left = '20px';
                timeDisplay.style.writingMode = 'vertical-rl';
                timeDisplay.style.textOrientation = 'mixed';
                timeDisplay.style.transform = 'rotate(180deg)';
                
                fileNameDisplay.style.bottom = '20px';
                fileNameDisplay.style.right = '20px';
                fileNameDisplay.style.writingMode = 'vertical-rl';
                fileNameDisplay.style.textOrientation = 'mixed';
                fileNameDisplay.style.transform = 'rotate(180deg)';
                
                monitorWrapper.style.top = '20px';
                monitorWrapper.style.right = '20px';
                monitorWrapper.style.flexDirection = 'column-reverse';
                
                voiceStatus.style.top = '80px';
                voiceStatus.style.right = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.top = '140px';
                    voiceTextDisplay.style.right = '20px';
                    voiceTextDisplay.style.maxWidth = '50vh';
                }
                [timeDisplay, fileNameDisplay, voiceTextDisplay].forEach(el => {
                    if (el) el.style.maxWidth = '50vh';
                });
            }
        }
        
        function applyFit(fit) {
            currentFit = fit;
            mediaImage.classList.remove('height', 'width', 'crop');
            mediaVideo.classList.remove('height', 'width', 'crop');
            
            if (fit === 'height') {
                mediaImage.classList.add('height');
                mediaVideo.classList.add('height');
            } else if (fit === 'width') {
                mediaImage.classList.add('width');
                mediaVideo.classList.add('width');
            } else if (fit === 'crop') {
                mediaImage.classList.add('height');
                mediaVideo.classList.add('height');
            }
            
            applyCrop();
        }
        
        function applyCrop() {
            const media = mediaImage.style.display !== 'none' ? mediaImage : mediaVideo;
            
            media.classList.remove('crop');
            media.style.width = '';
            media.style.height = '';
            media.style.left = '';
            media.style.top = '';
            
            const container = document.getElementById('mediaContainer');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            const naturalWidth = media.naturalWidth || media.videoWidth || containerWidth;
            const naturalHeight = media.naturalHeight || media.videoHeight || containerHeight;
            
            const isRotated = currentRotation === 90 || currentRotation === 270;
            
            console.log('[Crop] applyCrop 开始');
            console.log('[Crop] 容器尺寸:', containerWidth, 'x', containerHeight);
            console.log('[Crop] 媒体原始尺寸:', naturalWidth, 'x', naturalHeight);
            console.log('[Crop] 当前旋转:', currentRotation, '是否旋转:', isRotated);
            console.log('[Crop] 当前适配模式:', currentFit);
            console.log('[Crop] 当前裁剪百分比:', JSON.stringify(currentCrop));
            
            const baseInfo = {
                容器尺寸: { width: containerWidth, height: containerHeight },
                媒体原始尺寸: { width: naturalWidth, height: naturalHeight },
                当前旋转: currentRotation,
                是否旋转: isRotated,
                当前适配模式: currentFit,
                当前裁剪百分比: currentCrop
            };
            
            if (currentFit !== 'height' && currentFit !== 'width' && currentFit !== 'crop') {
                console.log('[Crop] 非适配模式，跳过');
                return { ...baseInfo, 状态: '非适配模式' };
            }
            
            const mediaRatio = naturalWidth / naturalHeight;
            
            if (currentFit === 'height') {
                if (isRotated) {
                    const displayHeight = containerWidth;
                    const displayWidth = containerWidth * mediaRatio;
                    media.style.width = displayWidth + 'px';
                    media.style.height = displayHeight + 'px';
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '高度适配模式' };
            }
            
            if (currentFit === 'width') {
                if (isRotated) {
                    const displayWidth = containerHeight;
                    const displayHeight = containerHeight / mediaRatio;
                    media.style.width = displayWidth + 'px';
                    media.style.height = displayHeight + 'px';
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '宽度适配模式' };
            }
            
            if (currentFit !== 'crop') {
                return { ...baseInfo, 状态: '非裁剪模式' };
            }
            
            const containerRatio = containerWidth / containerHeight;
            let displayWidth, displayHeight;
            
            if (isRotated) {
                const rotatedRatio = 1 / mediaRatio;
                if (rotatedRatio > containerRatio) {
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / mediaRatio;
                } else {
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * mediaRatio;
                }
            } else {
                if (mediaRatio > containerRatio) {
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * mediaRatio;
                } else {
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / mediaRatio;
                }
            }
            
            let cropWidth, cropHeight, cropX, cropY;
            let targetWidth, targetHeight;
            
            if (isRotated) {
                cropWidth = displayWidth * (currentCrop.height / 100);
                cropHeight = displayHeight * (currentCrop.width / 100);
                cropX = displayWidth *  (currentCrop.y / 100);
                cropY = displayHeight * (currentCrop.x / 100);
                targetWidth = containerHeight;
                targetHeight = containerWidth;
            } else {
                cropWidth = displayWidth * (currentCrop.width / 100);
                cropHeight = displayHeight * (currentCrop.height / 100);
                cropX = displayWidth * (currentCrop.x / 100);
                cropY = displayHeight * (currentCrop.y / 100);
                targetWidth = containerWidth;
                targetHeight = containerHeight;
            }
            
            const scaleX = targetWidth / cropWidth;
            const scaleY = targetHeight / cropHeight;
            const scale = Math.max(scaleX, scaleY);
            
            let finalWidth, finalHeight, finalLeft, finalTop;
            
            if (isRotated) {
                finalWidth = displayWidth * scale;
                finalHeight = displayHeight * scale;
                finalLeft = -cropY * scale;
                finalTop = -cropX * scale;
                
                // 旋转补偿：CSS transform rotate 是围绕元素中心旋转的
                // 旋转90度后，元素视觉宽度变为原高度，视觉高度变为原宽度
                // 需要补偿 (finalWidth - finalHeight) / 2 的偏移
                const rotationOffset = (finalWidth - finalHeight) / 2;
                finalLeft -= rotationOffset;
                finalTop += rotationOffset;
            } else {
                finalWidth = displayWidth * scale;
                finalHeight = displayHeight * scale;
                finalLeft = -cropX * scale;
                finalTop = -cropY * scale;
            }
            
            media.classList.add('crop');
            media.style.width = finalWidth + 'px';
            media.style.height = finalHeight + 'px';
            media.style.left = finalLeft + 'px';
            media.style.top = finalTop + 'px';
            
            console.log('[Crop] 裁剪计算完成');
            console.log('[Crop] 显示尺寸:', displayWidth, 'x', displayHeight);
            console.log('[Crop] 裁剪像素值:', { cropX, cropY, cropWidth, cropHeight });
            console.log('[Crop] 最终样式:', {
                width: Math.round(finalWidth) + 'px',
                height: Math.round(finalHeight) + 'px',
                left: Math.round(finalLeft) + 'px',
                top: Math.round(finalTop) + 'px'
            });
            
            return {
                ...baseInfo,
                状态: '裁剪模式',
                媒体显示尺寸: { width: displayWidth, height: displayHeight },
                裁剪像素值: { cropX, cropY, cropWidth, cropHeight },
                最终样式: {
                    width: Math.round(finalWidth) + 'px',
                    height: Math.round(finalHeight) + 'px',
                    left: Math.round(finalLeft) + 'px',
                    top: Math.round(finalTop) + 'px'
                }
            };
        }
        
        function applyCustomCrop(customData) {
            const media = mediaImage.style.display !== 'none' ? mediaImage : mediaVideo;
            
            media.classList.remove('crop');
            media.classList.add('height');
            media.style.position = 'absolute';
            media.style.maxWidth = 'none';
            media.style.maxHeight = 'none';
            
            const width = customData.width || 1920;
            const height = customData.height || 1080;
            const left = customData.left || 0;
            const top = customData.top || 0;
            
            media.style.width = width + 'px';
            media.style.height = height + 'px';
            media.style.left = left + 'px';
            media.style.top = top + 'px';
            
            currentFit = 'custom';
            
            return {
                自定义模式: true,
                宽度: width + 'px',
                高度: height + 'px',
                左边距: left + 'px',
                上边距: top + 'px'
            };
        }
        
        window.addEventListener('resize', applyCrop);
        
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        setInterval(updateTime, 1000);
        updateTime();
        
        function setConnectionStatus(status, text) {
            connectionStatus.className = status;
            connectionStatus.textContent = text;
        }
        
        function playTTS(text) {
            fetch('/api/tts/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    ttsAudio.src = data.audioUrl;
                    ttsAudio.play().catch(e => console.log('TTS播放被阻止'));
                }
            })
            .catch(err => console.error('TTS生成失败:', err));
        }
        
        function playNextTts() {
            console.log('[显示端] playNextTts: isPlayingTts=', isPlayingTts, 'queue=', ttsQueue.length);
            if (isPlayingTts) {
                return;
            }
            if (ttsQueue.length === 0) {
                // TTS 队列播放完毕，如果始终监听模式且能力允许，恢复录音
                if (isAlwaysListening && currentCapabilities?.voiceRecording) {
                    setTimeout(() => startVoiceRecording(), 500);
                }
                return;
            }
            
            isPlayingTts = true;
            const item = ttsQueue.shift();
            
            console.log('[显示端] 播放TTS:', item.audioUrl || item.text);
            
            if (item.text) {
                showTtsText(item.text);
            }
            
            if (item.audioUrl) {
                ttsAudio.src = item.audioUrl;
                ttsAudio.play().catch(e => {
                    console.log('TTS播放被阻止:', e.message);
                    hideTtsText();
                    isPlayingTts = false;
                    playNextTts();
                });
            } else if (item.text) {
                fetch('/api/tts/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: item.text })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        ttsAudio.src = data.audioUrl;
                        ttsAudio.play().catch(e => {
                            console.log('TTS播放被阻止');
                            hideTtsText();
                            isPlayingTts = false;
                            playNextTts();
                        });
                    } else {
                        isPlayingTts = false;
                        playNextTts();
                    }
                })
                .catch(err => {
                    console.error('TTS生成失败:', err);
                    isPlayingTts = false;
                    playNextTts();
                });
            } else {
                isPlayingTts = false;
                playNextTts();
            }
        }
        
        function queueTts(item) {
            ttsQueue.push(item);
            playNextTts();
        }
        
        ttsAudio.addEventListener('ended', () => {
            hideTtsText();
            isPlayingTts = false;
            playNextTts();
        });
        
        ttsAudio.addEventListener('error', () => {
            hideTtsText();
            isPlayingTts = false;
            playNextTts();
        });
        
        function showTtsText(text) {
            if (voiceTextDisplay && text) {
                voiceTextDisplay.textContent = text;
                voiceTextDisplay.className = 'voice-text-visible';
            }
        }
        
        function hideTtsText() {
            if (voiceTextDisplay) {
                voiceTextDisplay.className = 'voice-text-hidden';
            }
        }
        
        function handleTTS(data) {
            console.log('[显示端] 收到TTS消息:', data.action, data.audioUrl || data.text);
            if (data.action === 'play') {
                queueTts({ text: data.text });
            } else if (data.action === 'playAudio') {
                queueTts({ audioUrl: data.audioUrl, text: data.text });
            } else if (data.action === 'stop') {
                ttsQueue = [];
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                isPlayingTts = false;
            } else if (data.action === 'setAutoTts') {
                autoTtsEnabled = data.enabled;
            }
        }
        
        function handleReminder(data) {
            if (data.action === 'popup') {
                showReminderPopup(data.time, data.content);
            } else if (data.action === 'voice') {
                queueTts({ audioUrl: data.audioUrl, text: data.text });
            }
        }
        
        function handleVoiceCommand(data) {
            if (data.action === 'confirm') {
                showVoiceConfirmPopup(data.confirmationId, data.text, data.audioUrl);
            } else if (data.action === 'response') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showVoiceResponsePopup(data.text);
            } else if (data.action === 'searchResult') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showSearchResultPopup(data.query, data.results);
            } else if (data.action === 'weatherResult') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showVoiceResponsePopup(data.text);
            } else if (data.action === 'playChoices') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showPlayChoicesPopup(data.confirmationId, data.matches, data.text);
            }
        }

        function handleRestoreState(state) {
            if (!state) return;
            
            if (state.rotation !== undefined) {
                currentRotation = state.rotation;
                applyRotation();
            }
            
            if (state.fit !== undefined) {
                applyFit(state.fit);
            }
            
            if (state.crop !== undefined) {
                currentCrop = state.crop;
                applyCrop();
            }
            
            if (state.volume !== undefined) {
                mediaVideo.volume = state.volume / 100;
            }
            
            if (state.currentMedia) {
                showMedia(state.currentMedia);
            }
        }
        
        function extractFileName(url) {
            try {
                const urlParts = url.split('/');
                let fileName = urlParts[urlParts.length - 1].split('?')[0];
                fileName = decodeURIComponent(fileName);
                const dotIndex = fileName.lastIndexOf('.');
                if (dotIndex > 0) {
                    fileName = fileName.substring(0, dotIndex);
                }
                return fileName;
            } catch (e) {
                return '';
            }
        }
        
        function showMedia(data) {
            waitingMessage.style.display = 'none';
            
            let mediaName = '';
            
            if (data.type === 'url') {
                if (data.mediaType === 'video') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'block';
                    mediaVideo.src = data.url;
                    mediaVideo.load();
                    mediaVideo.play().catch(e => console.log('自动播放被阻止'));
                    mediaVideo.onloadedmetadata = () => applyCrop();
                } else {
                    mediaVideo.style.display = 'none';
                    mediaImage.style.display = 'block';
                    mediaImage.src = data.url;
                    mediaImage.onload = () => applyCrop();
                }
                const urlParts = data.url.split('/');
                mediaName = decodeURIComponent(urlParts[urlParts.length - 1].split('?')[0]) || '来自URL';
                fileNameDisplay.textContent = mediaName;
            } else if (data.type === 'base64') {
                const src = 'data:application/octet-stream;base64,' + data.data;
                
                if (data.mediaType === 'video') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'block';
                    mediaVideo.src = src;
                    mediaVideo.load();
                    mediaVideo.play().catch(e => console.log('自动播放被阻止'));
                    mediaVideo.onloadedmetadata = () => applyCrop();
                } else {
                    mediaVideo.style.display = 'none';
                    mediaImage.style.display = 'block';
                    mediaImage.src = src;
                    mediaImage.onload = () => applyCrop();
                }
                mediaName = data.fileName || '未知文件';
                fileNameDisplay.textContent = mediaName;
            }
            
            if (autoTtsEnabled && mediaName) {
                const displayName = extractFileName(mediaName);
                if (displayName) {
                    playTTS(displayName);
                }
            }
        }
        
        function handleControl(data) {
            switch (data.action) {
                case 'rotate':
                    currentRotation = data.value !== undefined ? data.value : data.rotation;
                    applyRotation();
                    applyCrop();
                    break;
                    
                case 'fit':
                    applyFit(data.value);
                    break;
                    
                case 'play':
                    if (data.value === true) {
                        mediaVideo.play().catch(e => console.log('播放被阻止'));
                    } else {
                        mediaVideo.pause();
                    }
                    break;
                    
                case 'seek':
                    if (mediaVideo.duration) {
                        mediaVideo.currentTime = (data.value / 100) * mediaVideo.duration;
                    }
                    break;
                    
                case 'volume':
                    mediaVideo.volume = data.value / 100;
                    break;
                    
                case 'crop':
                    currentCrop = data.value;
                    currentFit = 'crop';
                    const cropInfo = applyCrop();
                    sendCommandAck('crop', true, '裁剪已应用', cropInfo);
                    break;
                    
                case 'customCrop':
                    applyCustomCrop(data.value);
                    sendCommandAck('customCrop', true, '自定义裁剪已应用');
                    break;
            }
        }
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/display`;
            
            displayWs = new WebSocket(wsUrl);
            
            displayWs.onopen = function() {
                setConnectionStatus('connected', '已连接');
                sendCanvasSize();
                sendBrowserInfo();
                declareCapabilities();
                sendVoiceStatus();
                
                if (!isAlwaysListening) {
                    pendingAutoStart = true;
                    isAlwaysListening = true;
                    console.log('标记自动启动监听模式，等待服务器能力确认');
                }
            };
            
            displayWs.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('[显示端] 收到消息:', data.type, data);
                    setCorrelationId(data.correlationId);

                    if (data.type === 'serverStartTime') {
                        const storedTime = localStorage.getItem('serverStartTime');
                        if (storedTime && storedTime !== String(data.time)) {
                            localStorage.setItem('serverStartTime', data.time);
                            location.reload();
                        } else {
                            localStorage.setItem('serverStartTime', data.time);
                        }
                        return;
                    }
                    
                    if (data.type === 'displayId') {
                        displayId = data.id;
                        return;
                    }
                    
                    if (data.type === 'capabilitiesUpdated') {
                        handleCapabilitiesUpdated(data);
                        return;
                    }

                    if (data.type === 'asrAudio') {
                        handleAsrAudio(data);
                        return;
                    }

                    if (data.type === 'asrConfig') {
                        if (data.localAsrEnabled && !localAsrAvailable) {
                            forceInitLocalAsr();
                        } else if (!data.localAsrEnabled && localAsrAvailable) {
                            if (localAsrStreaming) {
                                SherpaASR.stopStreaming();
                                localAsrStreaming = false;
                            }
                        }
                        return;
                    }

                    if (data.type === 'control') {
                        handleControl(data);
                        if (data.action !== 'crop') {
                            sendCommandAck('control', true, data.action);
                        }
                    } else if (data.type === 'tts') {
                        handleTTS(data);
                        sendCommandAck('tts', true, data.action);
                    } else if (data.type === 'reminder') {
                        handleReminder(data);
                        sendCommandAck('reminder', true, data.action);
                    } else if (data.type === 'restoreState') {
                        handleRestoreState(data.state);
                        sendCommandAck('restoreState', true, 'state restored');
                    } else if (data.type === 'voiceCommand') {
                        handleVoiceCommand(data);
                        sendCommandAck('voiceCommand', true, data.action);
                    } else {
                        console.log('[显示端] 处理媒体消息，发送 media 确认');
                        showMedia(data);
                        sendCommandAck('media', true, data.type);
                    }
                } catch (e) {
                    console.error('解析消息失败:', e);
                }
            };
            
            displayWs.onclose = function() {
                setConnectionStatus('disconnected', '已断开');
                setTimeout(connectWebSocket, 3000);
            };
            
            displayWs.onerror = function(error) {
                console.error('WebSocket错误:', error);
                setConnectionStatus('disconnected', '连接错误');
            };
        }
        
        window.addEventListener('resize', function() {
            applyCrop();
            sendCanvasSize();
        });
        
        applyRotation();
        connectWebSocket();
        
        initVoiceRecognition();
        updateVoiceStatusDisplay();
        
        function updateVoiceStatusDisplay() {
            if (!voiceStatus) return;
            
            if (!voiceSupported) {
                voiceStatus.className = 'voice-status-unsupported';
                voiceStatus.title = '不支持语音识别';
            } else if (isListening) {
                voiceStatus.className = 'voice-status-listening';
                voiceStatus.title = '语音识别中...';
            } else {
                voiceStatus.className = 'voice-status-ready';
                voiceStatus.title = '语音识别就绪';
            }
        }
        
        function updateVoiceTextDisplay(text, isFinal) {
            if (!voiceTextDisplay) return;
            
            if (text) {
                voiceTextDisplay.textContent = text + (isFinal ? '' : '…');
                voiceTextDisplay.className = 'voice-text-visible';
            } else {
                voiceTextDisplay.className = 'voice-text-hidden';
            }
        }
        
        function sendVoiceStatus() {
            if (!isListening && localAsrStreaming) {
                SherpaASR.stopStreaming();
                localAsrStreaming = false;
            }
            
            updateVoiceStatusDisplay();
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'voiceStatus',
                    supported: voiceSupported,
                    listening: isListening
                }));
            }
        }
        
        let currentCapabilities = null;
        
        async function detectCapabilities() {
            const capabilities = {
                mediaRendering: true,
                voicePlayback: true,
                voiceRecording: false,
                voiceRecognition: false,
                displayText: true
            };
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                capabilities.voiceRecording = true;
                stream.getTracks().forEach(track => track.stop());
            } catch (e) {
                capabilities.voiceRecording = false;
            }
            
            if (localAsrAvailable || voiceSupported) {
                capabilities.voiceRecognition = true;
            } else {
                try {
                    const response = await fetch('/api/asr/status');
                    const result = await response.json();
                    if (result.available || result.ready) {
                        capabilities.voiceRecognition = true;
                    }
                } catch (e) {
                    capabilities.voiceRecognition = false;
                }
            }
            
            return capabilities;
        }
        
        async function declareCapabilities() {
            try {
                const capabilities = await detectCapabilities();
                currentCapabilities = capabilities;
                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                    displayWs.send(JSON.stringify({
                        type: 'capabilities',
                        capabilities: capabilities
                    }));
                    console.log('[能力] 已声明能力:', capabilities);
                }
            } catch (e) {
                console.error('[能力] 声明失败:', e);
            }
        }
        
        function handleCapabilitiesUpdated(data) {
            if (data.capabilities) {
                const prevCaps = currentCapabilities;
                currentCapabilities = data.capabilities;
                console.log('[能力] 能力已更新:', data.capabilities);

                // 媒体渲染能力关闭 → 停止媒体播放，清空画面
                if (!data.capabilities.mediaRendering) {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'none';
                    mediaVideo.pause();
                    mediaVideo.src = '';
                    mediaImage.src = '';
                    fileNameDisplay.textContent = '';
                    waitingMessage.style.display = 'block';
                }

                // 语音播放能力关闭 → 停止 TTS，清空队列
                if (!data.capabilities.voicePlayback) {
                    ttsQueue = [];
                    ttsAudio.pause();
                    ttsAudio.currentTime = 0;
                    isPlayingTts = false;
                    voiceTextDisplay.className = 'voice-text-hidden';
                }

                // 语音录音能力关闭 → 停止录音
                if (!data.capabilities.voiceRecording && isListening) {
                    stopVoiceRecording();
                }

                // 语音识别能力关闭 → 停止 ASR 和录音
                if (!data.capabilities.voiceRecognition) {
                    if (localAsrStreaming) {
                        SherpaASR.stopStreaming();
                        localAsrStreaming = false;
                    }
                    if (isListening) {
                        stopVoiceRecording();
                    }
                }

                // 文本显示能力关闭 → 隐藏提醒弹窗和文字覆盖层
                if (!data.capabilities.displayText) {
                    const popup = document.querySelector('.reminder-popup');
                    if (popup) popup.remove();
                    voiceTextDisplay.className = 'voice-text-hidden';
                }

                // 初始能力从服务器到达 → 检查是否要自动启动录音
                if (pendingAutoStart && isAlwaysListening && !isListening) {
                    pendingAutoStart = false;
                    if (data.capabilities.voiceRecording && data.capabilities.voiceRecognition) {
                        console.log('[能力] 服务器能力已确认，启动录音');
                        startVoiceRecording();
                    } else {
                        console.log('[能力] 服务器禁止语音录制，跳过自动启动');
                    }
                }

                // 动态开启录音 → 如果能力从关闭变为开启，启动录音
                if (!pendingAutoStart && isAlwaysListening && !isListening &&
                    data.capabilities.voiceRecording && data.capabilities.voiceRecognition) {
                    // 检测是否有能力从关闭变为开启（prevCaps 存在时才算转变，避免与初始 pendingAutoStart 冲突）
                    if (prevCaps && (!prevCaps.voiceRecording || !prevCaps.voiceRecognition)) {
                        console.log('[能力] 录音能力已开启，启动录音');
                        startVoiceRecording();
                    }
                }
            }
        }
        
        async function handleAsrAudio(data) {
            if (!SherpaASR || !SherpaASR.isLoaded) {
                console.log('[显示端] 收到ASR音频但本地ASR未初始化');
                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                    displayWs.send(JSON.stringify({
                        type: 'asrResult',
                        requestId: data.requestId,
                        error: '本地ASR未初始化',
                        text: ''
                    }));
                }
                return;
            }

            try {
                const text = await SherpaASR.recognizeBuffer(data.audioData);
                console.log('[显示端] ASR识别结果:', text);

                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                    displayWs.send(JSON.stringify({
                        type: 'asrResult',
                        requestId: data.requestId,
                        text: text || ''
                    }));
                }
            } catch (e) {
                console.error('[显示端] ASR音频处理失败:', e.message);
                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                    displayWs.send(JSON.stringify({
                        type: 'asrResult',
                        requestId: data.requestId,
                        error: e.message,
                        text: ''
                    }));
                }
            }
        }

        function initVoiceRecognition() {
            checkAsrStatus();
        }
        
        async function forceInitLocalAsr() {
            try {
                if (!SherpaASR) return false;
                if (SherpaASR.isLoaded) return true;

                const ready = await SherpaASR.init({ enabled: true });
                if (ready) {
                    SherpaASR.onPartial = (text) => {
                        if (text) {
                            updateVoiceTextDisplay(text, true);
                        }
                    };
                    SherpaASR.onResult = (text) => {
                        if (!text) return;

                        consecutiveIgnoreCount = 0;
                        console.log('显示端本地ASR识别结果:', text);
                        updateVoiceTextDisplay(text, true);

                        if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                            displayWs.send(JSON.stringify({
                                type: 'voiceInput',
                                text: text,
                                isFinal: true,
                                fullText: text
                            }));
                        }

                        setTimeout(() => {
                            updateVoiceTextDisplay('', true);
                        }, 3000);
                    };
                    localAsrAvailable = true;
                    voiceSupported = true;
                    console.log('[显示端] 本地 WASM ASR 已就绪 (服务端请求)');
                    return true;
                }
                return false;
            } catch (e) {
                console.log('[显示端] 强制初始化本地ASR失败:', e.message);
                return false;
            }
        }

                async function checkAsrStatus() {
            try {
                const localAsrReady = await initLocalAsr();
                if (localAsrReady) {
                    localAsrAvailable = true;
                    voiceSupported = true;
                    console.log('显示端本地 WASM ASR 可用');
                    // 不直接启动录音，由 handleCapabilitiesUpdated 中的 pendingAutoStart 处理
                    return;
                }
                
                const response = await fetch('/api/asr/status');
                const data = await response.json();
                voiceSupported = data.ready;
                
                if (voiceSupported) {
                    console.log('显示端服务器 ASR 服务可用');
                    // 不直接启动录音，由 handleCapabilitiesUpdated 中的 pendingAutoStart 处理
                } else {
                    console.log('ASR 服务未初始化');
                    updateVoiceStatusDisplay();
                }
            } catch (e) {
                console.log('ASR 服务不可用:', e.message);
                voiceSupported = false;
                updateVoiceStatusDisplay();
            }
        }
        
        async function initLocalAsr() {
            try {
                if (!window.SherpaASR) return false;
                
                const enabled = await fetch('/api/config/localAsr')
                    .then(r => r.json())
                    .then(d => d.enabled)
                    .catch(() => false);
                
                if (!enabled) return false;
                
                const ready = await SherpaASR.init({ enabled: true });
                if (ready) {
                    SherpaASR.onPartial = (text) => {
                        if (text) {
                            updateVoiceTextDisplay(text, true);
                        }
                    };
                    SherpaASR.onResult = (text) => {
                        if (!text) return;
                        
                        consecutiveIgnoreCount = 0;
                        console.log('显示端本地ASR识别结果:', text);
                        updateVoiceTextDisplay(text, true);
                        
                        if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                            displayWs.send(JSON.stringify({
                                type: 'voiceInput',
                                text: text,
                                isFinal: true,
                                fullText: text
                            }));
                        }
                        
                        setTimeout(() => {
                            updateVoiceTextDisplay('', true);
                        }, 3000);
                    };
                    return true;
                }
                return false;
            } catch (e) {
                console.log('本地ASR初始化失败:', e.message);
                return false;
            }
        }
        
        function stopVoiceRecording() {
            if (!isListening) return;
            isListening = false;
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            stopSilenceDetection();
            if (localAsrStreaming) {
                SherpaASR.stopStreaming();
                localAsrStreaming = false;
            }
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            sendVoiceStatus();
            console.log('[语音] 录音已停止');
        }

        async function startVoiceRecording() {
            if (isListening) return;
            
            if (currentCapabilities && !currentCapabilities.voiceRecording) {
                console.log('[能力] 无语音录音能力，跳过录音启动');
                return;
            }

            if (currentCapabilities && !currentCapabilities.voiceRecognition) {
                console.log('[能力] 无语音识别能力，跳过录音启动');
                return;
            }

            if (Date.now() < voiceCooldownUntil) {
                const remainingMs = voiceCooldownUntil - Date.now();
                console.log('显示端语音冷却中，剩余' + Math.ceil(remainingMs / 1000) + '秒');
                if (isAlwaysListening) {
                    setTimeout(() => startVoiceRecording(), remainingMs + 500);
                }
                return;
            }
            
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 16000
                    }
                });
                
                if (localAsrAvailable && SherpaASR.isLoaded) {
                    const started = await SherpaASR.startStreaming(micStream);
                    if (started) {
                        localAsrStreaming = true;
                        isListening = true;
                        hasSpeech = false;
                        speechStartTime = null;
                        silenceStartTime = null;
                        console.log('显示端本地ASR流式识别已启动');
                        sendVoiceStatus();
                        return;
                    }
                }
                
                mediaRecorder = new MediaRecorder(micStream);
                audioChunks = [];
                speechChunks = [];
                collectingSpeech = false;

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        audioChunks.push(e.data);

                        if (collectingSpeech || hasSpeech) {
                            collectingSpeech = true;
                            speechChunks.push(e.data);
                        } else if (speechChunks.length === 0) {
                            speechChunks.push(e.data);
                        }
                    }
                };

                mediaRecorder.onstop = async () => {
                    const useChunks = collectingSpeech ? speechChunks : audioChunks;
                    if (useChunks.length > 0) {
                        const audioBlob = new Blob(useChunks, { type: 'audio/webm' });
                        await sendAudioForRecognition(audioBlob);
                    }

                    if (isListening) {
                        audioChunks = [];
                        speechChunks = [];
                        collectingSpeech = false;
                        try {
                            mediaRecorder.start();
                            startSilenceDetection();
                        } catch (e) {
                            console.log('重新启动录音失败:', e);
                            isListening = false;
                            sendVoiceStatus();
                        }
                    }
                };
                
                mediaRecorder.start();
                isListening = true;
                hasSpeech = false;
                speechStartTime = null;
                silenceStartTime = null;
                console.log('显示端语音录制已启动');
                sendVoiceStatus();
                startSilenceDetection();
                
            } catch (e) {
                console.error('显示端麦克风访问失败:', e);
                isListening = false;
                voiceSupported = false;
                sendVoiceStatus();
            }
        }
        
        function startSilenceDetection() {
            if (!micStream) return;
            
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);
                
                const SILENCE_THRESHOLD = 0.01;
                const SILENCE_DURATION = 1000;
                const MIN_SPEECH_DURATION = 300;
                
                const checkSilence = () => {
                    if (!isListening || !analyser) return;
                    
                    const timeDomainData = new Uint8Array(analyser.fftSize);
                    analyser.getByteTimeDomainData(timeDomainData);
                    
                    let sumSquares = 0;
                    for (let i = 0; i < timeDomainData.length; i++) {
                        const normalized = (timeDomainData[i] - 128) / 128;
                        sumSquares += normalized * normalized;
                    }
                    const rms = Math.sqrt(sumSquares / timeDomainData.length);
                    
                    if (rms >= SILENCE_THRESHOLD) {
                        if (!hasSpeech && !speechStartTime) {
                            speechStartTime = Date.now();
                        }
                        hasSpeech = true;
                        silenceStartTime = null;
                    } else if (hasSpeech) {
                        if (!silenceStartTime) {
                            silenceStartTime = Date.now();
                        }
                        if (Date.now() - silenceStartTime > SILENCE_DURATION) {
                            const speechDuration = speechStartTime ? Date.now() - speechStartTime : 0;
                            if (speechDuration >= MIN_SPEECH_DURATION) {
                                console.log('显示端检测到静音，发送识别');
                                if (mediaRecorder && mediaRecorder.state === 'recording') {
                                    mediaRecorder.stop();
                                }
                                stopSilenceDetection();
                                return;
                            }
                        }
                    }
                    
                    requestAnimationFrame(checkSilence);
                };
                
                requestAnimationFrame(checkSilence);
            } catch (e) {
                console.log('静音检测初始化失败:', e);
            }
        }
        
        function stopSilenceDetection() {
            if (audioContext) {
                audioContext.close();
                audioContext = null;
                analyser = null;
            }
        }
        
        async function sendAudioForRecognition(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                
                const response = await fetch('/api/asr/recognize', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success' && data.text) {
                    const recognizedText = data.text.trim();
                    console.log('显示端识别结果:', recognizedText);
                    
                    consecutiveIgnoreCount = 0;
                    
                    updateVoiceTextDisplay(recognizedText, true);
                    
                    if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                        displayWs.send(JSON.stringify({
                            type: 'voiceInput',
                            text: recognizedText,
                            isFinal: true,
                            fullText: recognizedText
                        }));
                    }
                    
                    setTimeout(() => {
                        updateVoiceTextDisplay('', true);
                    }, 3000);
                } else if (data.status === 'ignored') {
                    consecutiveIgnoreCount++;
                    console.log('显示端无效语音输入，已忽略 (' + consecutiveIgnoreCount + '/' + MAX_CONSECUTIVE_IGNORES + '):', data.text);
                    updateVoiceTextDisplay('', true);
                    
                    if (consecutiveIgnoreCount >= MAX_CONSECUTIVE_IGNORES) {
                        const cooldownMs = VOICE_COOLDOWN_MS * Math.pow(2, Math.min(consecutiveIgnoreCount - MAX_CONSECUTIVE_IGNORES, 3));
                        voiceCooldownUntil = Date.now() + cooldownMs;
                        console.log('显示端连续' + consecutiveIgnoreCount + '次无效输入，冷却' + (cooldownMs / 1000) + '秒');
                        isListening = false;
                        sendVoiceStatus();
                        
                        if (isAlwaysListening) {
                            setTimeout(() => {
                                if (Date.now() >= voiceCooldownUntil) {
                                    consecutiveIgnoreCount = 0;
                                    startVoiceRecording();
                                }
                            }, cooldownMs);
                        }
                    } else if (isAlwaysListening) {
                        setTimeout(() => startVoiceRecording(), 500);
                    }
                }
            } catch (e) {
                console.error('显示端语音识别请求失败:', e);
            }
        }
        
        document.addEventListener('click', function() {
            if (mediaVideo.style.display === 'block' && mediaVideo.paused) {
                mediaVideo.play().catch(e => console.log('播放被阻止'));
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'f' || e.key === 'F') {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen();
                }
            }
            
            if (e.key === ' ') {
                if (mediaVideo.paused) {
                    mediaVideo.play();
                } else {
                    mediaVideo.pause();
                }
            }
        });
    </script>
