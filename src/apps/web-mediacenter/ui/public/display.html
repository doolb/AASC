                if (dispatchControlInputNative(data)) {
                    return;
                }
            }
            let win = null;
            let doc = null;
            try {
                win = mediaHtml.contentWindow;
                doc = mediaHtml.contentDocument;
            } catch (e) {
                // 跨域 iframe：无法读取内容，忽略输入（防御分支）
                return;
            }
            if (!win || !doc) return;
            const evt = data.event;
            if (evt === 'text') {
                // 文本注入（中文粘贴）：直接插入活动输入框
                injectText(doc, data.text || '');
                return;
            }
            if (evt === 'mousedown' || evt === 'mouseup' || evt === 'click' || evt === 'contextmenu') {
                let px;
                if (controlModeEnabled) {
                    // 控制模式：截图即 iframe 可见视口，坐标直接映射视口像素（不经裁剪框换算）
                    px = {
                        x: Math.round((mediaHtml.clientWidth * (data.x || 0)) / 100),
                        y: Math.round((mediaHtml.clientHeight * (data.y || 0)) / 100)
                    };
                } else {
                    // 裁剪框内百分比 → 内容百分比 → 内容像素
                    const crop = currentCrop || { x: 0, y: 0, width: 100, height: 100 };
                    const pct = ControlModeUtils.contentPointFromCropBox(crop, data.x || 0, data.y || 0);
                    px = ControlModeUtils.contentPixelFromPercent(
                        mediaHtml.clientWidth, mediaHtml.clientHeight, pct
                    );
                }
                const target = doc.elementFromPoint(px.x, px.y) || doc.body;
                // 合成 mousedown 不触发原生 focus：手动聚焦可聚焦元素（输入框等）
                if (evt === 'mousedown' && typeof target.focus === 'function') {
                    try { target.focus(); } catch (e) { /* 不可聚焦元素忽略 */ }
                }
                const opts = {
                    bubbles: true,
                    cancelable: true,
                    view: win,
                    clientX: px.x,
                    clientY: px.y,
                    button: data.button !== undefined ? data.button : 0
                };
                if (evt === 'mousedown') target.dispatchEvent(new MouseEvent('mousedown', opts));
                if (evt === 'mouseup') target.dispatchEvent(new MouseEvent('mouseup', opts));
                if (evt === 'click') target.dispatchEvent(new MouseEvent('click', opts));
                if (evt === 'contextmenu') target.dispatchEvent(new MouseEvent('contextmenu', opts));
            } else if (evt === 'wheel') {
                const target = doc.activeElement || doc.body;
                const wheelOpts = {
                    bubbles: true,
                    cancelable: true,
                    view: win,
                    deltaX: data.deltaX || 0,
                    deltaY: data.deltaY || 0,
                    deltaMode: 0 // 像素
                };
                target.dispatchEvent(new WheelEvent('wheel', wheelOpts));
                // 合成 WheelEvent 不触发浏览器原生滚动，需手动滚动 iframe 窗口
                try { win.scrollBy(data.deltaX || 0, data.deltaY || 0); } catch (e) { /* 忽略 */ }
            } else if (evt === 'keydown' || evt === 'keyup') {
                const target = doc.activeElement || doc.body;
                const keyOpts = {
                    bubbles: true,
                    cancelable: true,
                    view: win,
                    key: data.key || '',
                    code: data.code || '',
                    keyCode: data.keyCode || 0,
                    which: data.keyCode || 0,
                    altKey: !!data.altKey,
                    ctrlKey: !!data.ctrlKey,
                    shiftKey: !!data.shiftKey,
                    metaKey: !!data.metaKey
                };
                target.dispatchEvent(new KeyboardEvent(evt, keyOpts));
                // 单字符文本注入：合成 KeyboardEvent 不会触发输入框默认行为，
                // 需手动 insertText（仅无 Ctrl/Alt/Meta 时）
                if (evt === 'keydown' && data.char && !data.ctrlKey && !data.altKey && !data.metaKey) {
                    injectText(doc, data.char);
                }
            }
        }

        // 原生输入注入：仅键盘/文本走桥（WebView dispatchKeyEvent 真实按键，不需要屏幕坐标，
        // 跨域 iframe 聚焦元素可接收；鼠标/滚轮因盒子 DeX 多屏触摸无法定位，走 JS 合成）
        function dispatchControlInputNative(data) {
            const evt = data.event;
            if (evt === 'text') {
                nativeBridge.injectText(data.text || '');
                return true;
            }
            if (evt === 'keydown' || evt === 'keyup') {
                const keyCode = domKeyToAndroidKeyCode(data.keyCode);
                if (keyCode === 0) return false;   // 未映射键回退 JS 合成
                const meta = domMetaToAndroidMeta(data);
                return nativeBridge.injectKey(keyCode, meta) !== false;
            }
            return false;
        }

        // DOM keyCode → Android keyCode 映射（与 APK KeyInjector 约定一致）
        const DOM_KEY_TO_ANDROID = {
            13: 66, 9: 61, 8: 67, 46: 112, 27: 111, 32: 62,
            37: 21, 38: 19, 39: 22, 40: 20, 33: 92, 34: 93, 35: 123, 36: 122, 45: 124,
            112: 131, 113: 132, 114: 133, 115: 134, 116: 135, 117: 136, 118: 137,
            119: 138, 120: 139, 121: 140, 122: 141, 123: 142,
            48: 7, 49: 8, 50: 9, 51: 10, 52: 11, 53: 12, 54: 13, 55: 14, 56: 15, 57: 16,
            65: 29, 66: 30, 67: 31, 68: 32, 69: 33, 70: 34, 71: 35, 72: 36, 73: 37, 74: 38,
            75: 39, 76: 40, 77: 41, 78: 42, 79: 43, 80: 44, 81: 45, 82: 46, 83: 47, 84: 48,
            85: 49, 86: 50, 87: 51, 88: 52, 89: 53, 90: 54
        };
        function domKeyToAndroidKeyCode(domKeyCode) {
            return DOM_KEY_TO_ANDROID[domKeyCode] || 0;
        }
        function domMetaToAndroidMeta(data) {
            let m = 0;
            if (data.ctrlKey) m |= 4096;   // KeyEvent.META_CTRL_ON
            if (data.altKey) m |= 2;       // KeyEvent.META_ALT_ON
            if (data.shiftKey) m |= 1;     // KeyEvent.META_SHIFT_ON
            if (data.metaKey) m |= 65536;  // KeyEvent.META_META_ON
            return m;
        }

        // 文本注入：对 input/textarea/contentEditable 生效
        function injectText(doc, text) {
            if (!text) return;
            const el = doc.activeElement;
            if (!el) return;
            const tag = (el.tagName || '').toLowerCase();
            const editable = tag === 'input' || tag === 'textarea' || el.isContentEditable;
            if (!editable) return;
            // 先把光标定位到末尾（保证 execCommand 插入位置正确）
            if (tag === 'input' || tag === 'textarea') {
                try {
                    el.focus();
                    const end = el.value ? el.value.length : 0;
                    el.setSelectionRange(end, end);
                } catch (e) { /* 定位失败继续尝试 */ }
            }
            try {
                el.focus();
                if (doc.execCommand && doc.execCommand('insertText', false, text)) return;
            } catch (e) { /* 降级到 input 事件 */ }
            // 兜底：手动修改值 + 派发 input 事件
            if (tag === 'textarea' || (tag === 'input' && (el.type === 'text' || el.type === 'search' || el.type === 'email' || el.type === 'url' || el.type === 'password'))) {
                const start = el.selectionStart || 0;
                const end = el.selectionEnd || 0;
                el.value = el.value.slice(0, start) + text + el.value.slice(end);
                const pos = start + text.length;
                el.setSelectionRange(pos, pos);
                el.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }

        // html 播放进度上报：滚动比例 + 缩放倍数（控制端进度条显示）
        function reportHtmlProgress() {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            let win = null;
            try {
                win = mediaHtml.contentWindow;
            } catch (e) {
                // 跨域 iframe：无法读取内容，跳过进度上报
                return;
            }
            if (!win) return;
            let doc = null;
            try {
                doc = win.document;
            } catch (e) {
                // 跨域 iframe：跳过进度上报
                return;
            }
            const scrollHeight = Math.max(
                (doc.documentElement && doc.documentElement.scrollHeight) || 0,
                (doc.body && doc.body.scrollHeight) || 0
            );
            const clientHeight = win.innerHeight || mediaHtml.clientHeight;
            let scrollProgress = 0;
            if (scrollHeight > clientHeight) {
                scrollProgress = Math.min(100, Math.round((win.scrollY / (scrollHeight - clientHeight)) * 100));
            }
            displayWs.send(JSON.stringify({
                type: 'htmlProgress',
                scrollProgress: scrollProgress,
                scale: currentHtmlScale,
                mode: currentHtmlScroll ? currentHtmlScroll.mode : 'page',
                loop: currentHtmlScroll ? !!currentHtmlScroll.loop : false
            }));
        }

        function stopHtmlScroll() {
            if (htmlScrollState) {
                if (htmlScrollState.timer) clearInterval(htmlScrollState.timer);
                if (htmlScrollState.rafId) cancelAnimationFrame(htmlScrollState.rafId);
                htmlScrollState = null;
            }
            if (htmlProgressTimer) {
                clearInterval(htmlProgressTimer);
                htmlProgressTimer = null;
            }
        }

        function startHtmlScroll(iframe, htmlScroll) {
            stopHtmlScroll();
            // 进度上报定时器（暂停/恢复/切换统一管理）
            if (!htmlProgressTimer) {
                htmlProgressTimer = setInterval(reportHtmlProgress, 1000);
            }
            const win = iframe.contentWindow;
            if (!win) return;
            const opts = htmlScroll || {};
            // 兼容旧消息：mode='loop' 视为平滑+循环
            const mode = opts.mode === 'loop' ? 'smooth' : (opts.mode || 'page');
            const loop = !!opts.loop || opts.mode === 'loop';
            const pageInterval = opts.pageInterval || 5;
            const speedPx = { slow: 60, medium: 120, fast: 240 }[opts.speed || 'medium'];

            const scrollHeight = Math.max(
                (win.document.documentElement && win.document.documentElement.scrollHeight) || 0,
                (win.document.body && win.document.body.scrollHeight) || 0
            );
            const clientHeight = win.innerHeight || iframe.clientHeight;
            // 内容不溢出时无需滚动
            if (scrollHeight <= clientHeight + 1) return;

            if (mode === 'page') {
                // 分页式：每 pageInterval 秒滚一屏；循环时到底回顶继续
                htmlScrollState = {
                    timer: setInterval(() => {
                        if (!htmlScrollState) return;
                        if (win.scrollY + clientHeight >= scrollHeight - 2) {
                            if (loop) {
                                win.scrollTo(0, 0);
                                return;
                            }
                            stopHtmlScroll();
                            return;
                        }
                        win.scrollBy(0, clientHeight);
                    }, pageInterval * 1000)
                };
            } else {
                // 平滑：匀速滚动；循环时滚到底回顶继续
                let last = performance.now();
                const step = (now) => {
                    if (!htmlScrollState) return;
                    const dt = (now - last) / 1000;
                    last = now;
                    if (win.scrollY + clientHeight >= scrollHeight - 2) {
                        if (loop) {
                            win.scrollTo(0, 0);
                        } else {
                            stopHtmlScroll();
                            return;
                        }
                    }
                    win.scrollBy(0, speedPx * dt);
                    htmlScrollState.rafId = requestAnimationFrame(step);
                };
                htmlScrollState = { rafId: requestAnimationFrame(step) };
            }
        }

        // TTS 播报 + 临时媒体信息上报（各媒体类型共用）
        function announceAndReport(mediaName, data) {
            if (autoTtsEnabled && mediaName) {
                const displayName = extractFileName(mediaName);
                if (displayName) {
                    playTTS(displayName);
                }
            }

            if (!data.temp) return;
            const sendTempInfo = () => {
                if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                let w, h;
                if (data.mediaType === 'video') {
                    w = mediaVideo.videoWidth;
                    h = mediaVideo.videoHeight;
                } else if (data.mediaType !== 'html' && data.mediaType !== 'audio') {
                    w = mediaImage.naturalWidth;
                    h = mediaImage.naturalHeight;
                }
                displayWs.send(JSON.stringify({
                    type: 'tempMediaInfo',
                    fileName: data.fileName || mediaName || '',
                    mediaType: data.mediaType,
                    width: w || undefined,
                    height: h || undefined
                }));
            };
            const readyTarget = data.mediaType === 'video'
                ? mediaVideo
                : (data.mediaType === 'audio' ? mediaAudio : (data.mediaType === 'html' ? mediaHtml : mediaImage));
            const readyEvent = data.mediaType === 'video' || data.mediaType === 'audio' ? 'loadedmetadata' : 'load';
            if (data.mediaType === 'html') {
                // html 无固有尺寸，加载完成即上报（不含宽高）
                readyTarget.addEventListener(readyEvent, sendTempInfo, { once: true });
            } else if (readyTarget.readyState >= 1 || (readyTarget.complete && readyTarget.naturalWidth > 0)) {
                sendTempInfo();
            } else {
                readyTarget.addEventListener(readyEvent, sendTempInfo, { once: true });
            }
        }

        // 视频自动播放：浏览器/WebView autoplay 策略拦截有声视频（无用户手势），
        // 先 muted 播放绕过拦截，成功后取消静音（音量跟随显示端 volume）
        function playVideoAuto(video) {
            requestNativeAudioFocus();
            video.muted = true;
            return video.play().then(() => {
                video.muted = false;
                return true;
            }).catch(e => {
                video.muted = false;
                console.log('自动播放被阻止');
                return false;
            });
        }

        // 音频自动播放沿用统一的 Promise 捕获，避免浏览器策略阻止时产生未处理 rejection。
        function playAudioAuto(audio) {
            // WebSocket 下发不属于用户手势，先静音播放绕过 Chromium/WebView 自动播放限制，
            // 播放成功后恢复当前音量；失败时捕获 Promise，交给控制端播放按钮再次触发。
            requestNativeAudioFocus();
            audio.muted = true;
            return audio.play().then(() => {
                audio.muted = false;
                return true;
            }).catch(e => {
                audio.muted = false;
                console.log('音频自动播放被阻止');
                return false;
            });
        }

        function getCurrentPlayableMedia() {
            if (currentMediaType === 'audio') return mediaAudio;
            if (currentMediaType === 'video') return mediaVideo;
            return null;
        }

        // 媒体元数据加载后才能安全设置 currentTime；旧状态没有进度时保持 0 秒。
        function applyResumeTime(media, resumeTime) {
            const time = Number(resumeTime);
            if (!Number.isFinite(time) || time <= 0 || !Number.isFinite(media.duration) || media.duration <= 0) return;
            const maxTime = Math.max(media.duration - 0.05, 0);
            media.currentTime = Math.min(Math.max(time, 0), maxTime);
        }

        function showMedia(data, noActivate, paused, resumeTime = 0) {
            // 控制端下发媒体自动进入 60 秒激活窗口（睡眠中操作即时可见）；restore/播放列表等显示端内部调用不激活
            if (!noActivate) activateTemporarily();
            pauseExpected = true;
            mediaAudioFocusInterrupted = false;
            mediaRecoveryAttempts = 0;
            if (mediaRecoveryTimer) {
                clearTimeout(mediaRecoveryTimer);
                mediaRecoveryTimer = null;
            }
            abandonNativeAudioFocus();
            currentMediaType = data.mediaType || 'image';
            mediaVideo.pause();
            mediaVideo.src = '';
            mediaVideo.load();
            mediaAudio.pause();
            mediaAudio.src = '';
            mediaAudio.load();
            mediaAudio.ontimeupdate = null;
            mediaVideo.onloadedmetadata = null;
            mediaAudio.onloadedmetadata = null;
            waitingMessage.style.display = 'none';

            if (data.mediaType === 'html') {
                // HTML 媒体：iframe 铺满纯展示，跳过 img/video 与裁剪
                stopHtmlScroll();
                mediaImage.style.display = 'none';
                mediaImage.removeAttribute('src');
                mediaVideo.pause();
                mediaVideo.src = '';
                mediaVideo.load();
                mediaVideo.style.display = 'none';
                mediaAudio.style.display = 'none';
                mediaHtml.style.display = 'block';
                // 发送未指定模式时沿用显示端当前模式；指定则更新记忆
                if (data.htmlScroll) currentHtmlScroll = data.htmlScroll;
                mediaHtml.onload = () => {
                    // 重连恢复且为暂停状态时不自动滚动（控制端暂停的页面重连后保持冻结）
                    if (paused) {
                        stopHtmlScroll();
                    } else {
                        startHtmlScroll(mediaHtml, data.htmlScroll || currentHtmlScroll);
                    }
                };
                // html 播放进度上报（滚动比例 + 缩放倍数）
                if (!htmlProgressTimer) {
                    htmlProgressTimer = setInterval(reportHtmlProgress, 1000);
                }
                let mediaName = data.fileName || 'HTML内容';
                if (data.type === 'url') {
                    // 关键：必须移除 srcdoc 属性，否则 src 导航被 srcdoc（优先）占位，外部网页永远显示空白
                    mediaHtml.removeAttribute('srcdoc');
                    if (/\.mhtml?$/i.test(data.url)) {
                        // .mhtml 浏览器无法直接渲染：fetch 后转纯 HTML 用 srcdoc 显示
                        fetch(data.url, { credentials: 'same-origin' })
                            .then(r => r.text())
                            .then(text => {
                                const html = mhtmlToHtml(text);
                                mediaHtml.srcdoc = html || '<p style="color:#fff;padding:20px">无法解析该 .mhtml 文件</p>';
                            })
                            .catch(() => {
                                mediaHtml.srcdoc = '<p style="color:#fff;padding:20px">加载 .mhtml 失败</p>';
                            });
                    } else {
                        mediaHtml.src = data.url;
                    }
                    const urlParts = data.url.split('/');
                    mediaName = decodeURIComponent(urlParts[urlParts.length - 1].split('?')[0]) || mediaName;
                } else {
                    const bytes = Uint8Array.from(atob(data.data), c => c.charCodeAt(0));
                    const html = new TextDecoder().decode(bytes);
                    mediaHtml.src = '';
                    mediaHtml.srcdoc = html;
                }
                fileNameDisplay.textContent = mediaName;
                pauseExpected = true;
                mediaIsPlaying = false;
                announceAndReport(mediaName, data);
                return;
            }

            // 非 html 媒体：取消滚动并隐藏 iframe（html 切回图片/视频时清理）
            stopHtmlScroll();
            mediaHtml.style.display = 'none';
            mediaHtml.removeAttribute('src');
            mediaHtml.srcdoc = '';
            mediaAudio.style.display = 'none';

            let mediaName = '';

            if (data.type === 'url') {
                if (data.mediaType === 'audio') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'none';
                    mediaAudio.src = data.url;
                    mediaAudio.loop = true;
                    mediaAudio.onloadedmetadata = () => applyResumeTime(mediaAudio, resumeTime);
                    mediaAudio.load();
                    if (paused) {
                        mediaAudio.pause();
                    } else {
                        playAudioAuto(mediaAudio);
                    }
                    mediaAudio.ontimeupdate = function() {
                        if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                        if (!mediaAudio.duration) return;
                        displayWs.send(JSON.stringify({
                            type: 'audioProgress',
                            currentTime: mediaAudio.currentTime,
                            duration: mediaAudio.duration
                        }));
                    };
                } else if (data.mediaType === 'video') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'block';
                    mediaVideo.src = data.url;
                    mediaVideo.onloadedmetadata = () => {
                        applyResumeTime(mediaVideo, resumeTime);
                        applyCrop();
                    };
                    mediaVideo.load();
                    // 重连恢复且为暂停状态时不自动播放（控制端暂停的视频重连后保持暂停）
                    if (paused) {
                        mediaVideo.pause();
                    } else {
                        playVideoAuto(mediaVideo);
                    }
                    mediaVideo.ontimeupdate = function() {
                        if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                        var d = mediaVideo.duration;
                        if (!d) return;
                        displayWs.send(JSON.stringify({
                            type: 'videoProgress',
                            currentTime: mediaVideo.currentTime,
                            duration: d
                        }));
                    };
                } else {
                    mediaVideo.style.display = 'none';
                    mediaImage.style.display = 'block';
                    mediaImage.src = data.url;
                    mediaImage.onload = () => applyCrop();
                }
                const urlParts = data.url.split('/');
                mediaName = decodeURIComponent(urlParts[urlParts.length - 1].split('?')[0]) || '来自URL';
                fileNameDisplay.textContent = mediaName;
            } else if (data.type === 'base64') {
                const mimeType = data.mimeType || 'application/octet-stream';
                const src = 'data:' + mimeType + ';base64,' + data.data;
                
                if (data.mediaType === 'audio') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'none';
                    mediaAudio.src = src;
                    mediaAudio.loop = true;
                    mediaAudio.onloadedmetadata = () => applyResumeTime(mediaAudio, resumeTime);
                    mediaAudio.load();
                    if (paused) {
                        mediaAudio.pause();
                    } else {
                        playAudioAuto(mediaAudio);
                    }
                    mediaAudio.ontimeupdate = function() {
                        if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
                        if (!mediaAudio.duration) return;
                        displayWs.send(JSON.stringify({
                            type: 'audioProgress',
                            currentTime: mediaAudio.currentTime,
                            duration: mediaAudio.duration
                        }));
                    };
                } else if (data.mediaType === 'video') {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'block';
                    mediaVideo.src = src;
                    mediaVideo.onloadedmetadata = () => {
                        applyResumeTime(mediaVideo, resumeTime);
                        applyCrop();
                    };
                    mediaVideo.load();
                    // 重连恢复且为暂停状态时不自动播放
                    if (paused) {
                        mediaVideo.pause();
                    } else {
                        playVideoAuto(mediaVideo);
                    }
                } else {
                    mediaVideo.style.display = 'none';
                    mediaImage.style.display = 'block';
                    mediaImage.src = src;
                    mediaImage.onload = () => applyCrop();
                }
                mediaName = data.fileName || '未知文件';
                fileNameDisplay.textContent = mediaName;
            }

            announceAndReport(mediaName, data);
            // 新媒体显示即播放（或按恢复的暂停状态），同步本地播放状态 + 上报真实播放状态，避免服务端残留陈旧的 isPlaying=false 导致重连误暂停
            mediaIsPlaying = !paused;
            pauseExpected = !!paused;
            reportPlayState(!paused, resumeTime);
        }

        // 上报播放状态到服务端：控制端暂停/播放、显示新媒体、重连恢复后，供服务端持久化 isPlaying 并在重连时恢复
        function reportPlayState(playing, resumeTime) {
            if (displayWs && displayWs.readyState === 1) {
                const media = getCurrentPlayableMedia();
                const currentTime = Number.isFinite(resumeTime)
                    ? resumeTime
                    : (media && Number.isFinite(media.currentTime) ? media.currentTime : 0);
                const duration = media && Number.isFinite(media.duration) ? media.duration : 0;
                displayWs.send(JSON.stringify({
                    type: 'playStateReport',
                    isPlaying: !!playing,
                    currentTime: currentTime,
                    duration: duration
                }));
            }
        }

        function handleControl(data) {
            switch (data.action) {
                case 'rotate':
                    currentRotation = data.value !== undefined ? data.value : data.rotation;
                    applyRotation();
                    applyCrop();
                    break;
                    
                case 'fit':
                    applyFit(data.value);
                    break;

                case 'reload':
                    // 控制端主动刷新显示端页面（重新加载最新代码并恢复持久化状态）
                    console.log('[显示端] 收到控制端刷新指令，reload...');
                    location.reload();
                    break;

                case 'htmlScroll':
                    // 控制端切换当前 html 播放模式（未指定模式时记忆沿用）
                    if (data.value) currentHtmlScroll = data.value;
                    if (mediaHtml.style.display !== 'none') {
                        startHtmlScroll(mediaHtml, currentHtmlScroll);
                    }
                    break;

                case 'htmlScrollTo':
                    // 控制端拖动进度条：同步滚动到对应位置（0-100）
                    if (mediaHtml.style.display !== 'none') {
                        const win = mediaHtml.contentWindow;
                        if (win && win.document) {
                            const doc = win.document;
                            const scrollHeight = Math.max(
                                (doc.documentElement && doc.documentElement.scrollHeight) || 0,
                                (doc.body && doc.body.scrollHeight) || 0
                            );
                            const clientHeight = win.innerHeight || mediaHtml.clientHeight;
                            win.scrollTo(0, (data.value / 100) * (scrollHeight - clientHeight));
                        }
                    }
                    break;

                case 'controlMode':
                    // 控制模式开关：开启暂停自动滚动并开始截图，关闭恢复
                    setControlMode(data.value === true);
                    break;

                case 'controlInput':
                    // 控制端输入转发：鼠标/滚轮/键盘/文本
                    dispatchControlInput(data);
                    break;

                case 'play':
                    // 睡眠/深度睡眠中拒绝播放命令（暂停命令仍生效并上报）
                    if (data.value === true && isSleepPaused()) break;
                    mediaIsPlaying = data.value === true;  // 同步本地播放状态（退出睡眠恢复时检查）
                    if (data.value === true) {
                        pauseExpected = false;
                        if (mediaHtml.style.display !== 'none') {
                            // html 模式：恢复滚动播放（从当前滚动位置继续）
                            startHtmlScroll(mediaHtml, currentHtmlScroll);
                        } else if (currentMediaType === 'audio') {
                            playAudioAuto(mediaAudio);
                        } else {
                            playVideoAuto(mediaVideo);
                        }
                    } else {
                        pauseExpected = true;
                        abandonNativeAudioFocus();
                        if (mediaHtml.style.display !== 'none') {
                            // html 模式：暂停滚动（滚动位置保留）
                            stopHtmlScroll();
                        } else if (currentMediaType === 'audio') {
                            mediaAudio.pause();
                        } else {
                            mediaVideo.pause();
                        }
                    }
                    // 上报真实播放状态：暂停后重连/刷新时服务端据此恢复，避免自动播放
                    reportPlayState(data.value === true);
                    break;
                    
                case 'seek':
                    {
                        const media = getCurrentPlayableMedia();
                        if (media && media.duration) {
                            media.currentTime = (data.value / 100) * media.duration;
                        }
                    }
                    break;
                    
                case 'volume':
                    {
                        const media = getCurrentPlayableMedia();
                        if (media) media.volume = data.value / 100;
                    }
                    break;
                    
                case 'cropDebug':
                    _cropDebug = !!data.value;
                    break;

                case 'crop':
                    currentCrop = data.value;
                    currentFit = 'crop';
                    scheduleCropApply();
                    break;
                    
                case 'customCrop':
                    applyCustomCrop(data.value);
                    sendCommandAck('customCrop', true, '自定义裁剪已应用');
                    break;

                case 'sleepSettings':
                    // 应用控制端下发的睡眠设置（合法化小时值），立即判定并应用
                    {
                        const s = data.value || {};
                        sleepSettings = {
                            enabled: !!s.enabled,
                            startHour: clampHour(s.startHour),
                            endHour: clampHour(s.endHour),
                            deepStartHour: clampHour(s.deepStartHour),
                            deepEndHour: clampHour(s.deepEndHour)
                        };
                        checkSleepMode();
                    }
                    break;

                case 'sleepActivate':
                    activateTemporarily();
                    break;

                case 'sleepOverride':
                    // 立即切换优先于临时激活：先清除 60 秒窗口，再应用手动睡眠/恢复正常
                    activationUntil = 0;
                    manualSleepMode = (data.value === 'sleep' || data.value === 'deep') ? data.value : null;
                    checkSleepMode();
                    break;
            }
        }

        // ===== 睡眠模式：按时段使用媒体/UI 遮罩，降低夜间干扰 =====
        // 时间在显示端本地判断（各设备用自己时区），每 10 秒检查一次。
        // 优先级：立即手动覆盖 > 临时激活 > 深度睡眠 > 睡眠 > 正常。
        // 下发媒体/临时激活（activateTemporarily）会同时取消手动覆盖（manualSleepMode=null），
        // 因此手动覆盖与激活窗口不会同时有效：覆盖被取消后按正常时段判定。
        const mediaSleepOverlay = document.getElementById('mediaSleepOverlay');
        const uiSleepOverlay = document.getElementById('uiSleepOverlay');
        let sleepSettings = { enabled: true, startHour: 23, endHour: 8, deepStartHour: 1, deepEndHour: 6 };
        let sleepState = 'normal';   // 'normal' | 'sleep' | 'deep' | 'active'
        let activationUntil = 0;     // 临时激活截止时间戳
        let manualSleepMode = null;  // 手动覆盖枚举：null | 'sleep' | 'deep'，控制端显式进入睡眠/深度睡眠，直到再次下发
        let mediaIsPlaying = false;  // 单媒体控制端播放/暂停设置：showMedia 末尾与 handleControl('play') 同步更新；退出睡眠恢复时检查，暂停则保持暂停
        let pauseExpected = true;    // 媒体元素的暂停是否由控制端、睡眠或媒体切换主动触发
        let mediaRecoveryTimer = null;
        let mediaRecoveryAttempts = 0;
        let mediaAudioFocusInterrupted = false;
        const MEDIA_RECOVERY_MAX_ATTEMPTS = 5;
        const MEDIA_RECOVERY_DELAY_MS = 300;

        // 跨天时段判定：startHour > endHour 时跨天（23-8），否则非跨天（1-6）
        function inSleepWindow(hour, start, end) {
            if (start > end) return hour >= start || hour < end;
            return hour >= start && hour < end;
        }

        // 小时值合法化：clamp 到 0-23
        function clampHour(h) {
            h = parseInt(h, 10);
            if (isNaN(h)) return 0;
            return Math.max(0, Math.min(23, h));
        }

        // 暂停媒体：视频暂停 + html 滚动暂停（图片无需处理）
        function pauseSleepMedia() {
            pauseExpected = true;
            mediaAudioFocusInterrupted = false;
            abandonNativeAudioFocus();
            mediaRecoveryAttempts = 0;
            if (mediaRecoveryTimer) {
                clearTimeout(mediaRecoveryTimer);
                mediaRecoveryTimer = null;
            }
            mediaVideo.pause();
            mediaAudio.pause();
            if (mediaHtml.style.display !== 'none') stopHtmlScroll();
        }

        // 当前媒体该不该播放：播放列表读 ps.paused（睡眠前控制端暂停播放列表则保持暂停），单媒体读 mediaIsPlaying（控制端播放/暂停设置）
        function shouldPlayMedia() {
            if (playlistState && playlistState.active) return !playlistState.paused;
            return mediaIsPlaying !== false;
        }

        // 睡眠期间 ended/timer 可能已经清掉当前项监听；唤醒时恢复当前项的批量生命周期。
        function resumePlaylistAfterSleep() {
            const ps = playlistState;
            if (!ps || !ps.active || ps.paused || ps.timer) return;
            const item = ps.playlist[ps.index];
            if (!item) return;
            if (item.mediaType === 'video' && !ps.videoEndedHandler) {
                playCurrentItem();
                return;
            }
            if (item.mediaType === 'audio' && !ps.audioEndedHandler) {
                playCurrentItem();
                return;
            }
            if (item.mediaType !== 'video' && item.mediaType !== 'audio') {
                ps.timer = setTimeout(playlistNext, ps.interval);
            }
        }

        // 恢复媒体：html 续滚动，视频/音频续播（拦截自动播放限制）；控制端暂停的媒体保持暂停，不自动播放
        function resumeSleepMedia() {
            if (!shouldPlayMedia()) return;
            pauseExpected = false;
            resumePlaylistAfterSleep();
            if (playlistState && playlistState.active) {
                const item = playlistState.playlist[playlistState.index];
                if (item && (item.mediaType === 'video' || item.mediaType === 'audio')) return;
            }
            if (mediaHtml.style.display !== 'none') {
                startHtmlScroll(mediaHtml, currentHtmlScroll);
            } else if (currentMediaType === 'audio' && mediaAudio.src) {
                playAudioAuto(mediaAudio);
            } else if (mediaVideo.src) {
                playVideoAuto(mediaVideo);
            }
        }

        // 请求 APK 原生层取得媒体焦点；浏览器显示端没有该桥时保持兼容。
        function requestNativeAudioFocus() {
            if (!window.NativeDisplay || typeof window.NativeDisplay.requestAudioFocus !== 'function') return;
            try {
                window.NativeDisplay.requestAudioFocus();
            } catch (error) {
                console.warn('申请原生音频焦点失败', error);
            }
        }

        // 控制端明确暂停、进入睡眠或切换媒体时释放焦点，避免影响系统媒体播放。
        function abandonNativeAudioFocus() {
            if (!window.NativeDisplay || typeof window.NativeDisplay.abandonAudioFocus !== 'function') return;
            try {
                window.NativeDisplay.abandonAudioFocus();
            } catch (error) {
                console.warn('释放原生音频焦点失败', error);
            }
        }

        function getExpectedMediaElement() {
            if (currentMediaType === 'audio') return mediaAudio;
            if (currentMediaType === 'video') return mediaVideo;
            return null;
        }

        // 只要控制端仍期望播放且不在睡眠/播放列表暂停状态，就允许恢复系统打断的媒体。
        function isMediaPlaybackExpected() {
            if (isSleepPaused()) return false;
            if (playlistState && playlistState.active && playlistState.paused) return false;
            return mediaIsPlaying && !pauseExpected;
        }

        // 系统媒体抢占导致 WebView 暂停时，保持服务器期望状态为播放并有限重试。
        // 手动暂停、睡眠、列表暂停会通过 pauseExpected 拦截，不会被误恢复。
        function recoverUnexpectedMediaPause() {
            const reason = arguments[0] || 'pause';
            const media = getExpectedMediaElement();
            if (!media || !media.src || !isMediaPlaybackExpected() || pauseExpected) return;
            if (media.ended || mediaAudioFocusInterrupted) {
                reportPlayState(true);
                return;
            }

            reportPlayState(true);
            if (!media.paused) return;
            if (mediaRecoveryTimer || mediaRecoveryAttempts >= MEDIA_RECOVERY_MAX_ATTEMPTS) return;
            mediaRecoveryAttempts++;
            const playPromise = currentMediaType === 'audio'
                ? playAudioAuto(media)
                : playVideoAuto(media);
            Promise.resolve(playPromise).then(success => {
                if (success) {
                    mediaRecoveryAttempts = 0;
                    reportPlayState(true);
                    return;
                }
                if (isMediaPlaybackExpected()) {
                    mediaRecoveryTimer = setTimeout(() => {
                        mediaRecoveryTimer = null;
                        recoverUnexpectedMediaPause(reason + ':retry');
                    }, MEDIA_RECOVERY_DELAY_MS);
                }
            });
        }

        // 事件优先、低频 watchdog 兜底：覆盖系统媒体焦点切换时 WebView 未发出完整事件的机型。
        function installMediaPlaybackStateMonitor() {
            [mediaVideo, mediaAudio].forEach(media => {
                media.addEventListener('pause', () => {
                    if (media === getExpectedMediaElement()) recoverUnexpectedMediaPause('pause');
                });
                media.addEventListener('play', () => {
                    if (isSleepPaused()) {
                        // WebView/原生焦点回调可能在睡眠已生效后延迟触发 play，必须立即拦截。
                        pauseSleepMedia();
                        return;
                    }
                    if (media === getExpectedMediaElement() && isMediaPlaybackExpected() && !pauseExpected) {
                        mediaRecoveryAttempts = 0;
                        if (mediaRecoveryTimer) {
                            clearTimeout(mediaRecoveryTimer);
                            mediaRecoveryTimer = null;
                        }
                        reportPlayState(true);
                    }
                });
                media.addEventListener('error', () => {
                    // 批量媒体的 error 由当前项处理器安排下一项；单媒体才交给恢复逻辑重试。
                    if (media === getExpectedMediaElement() && !(playlistState && playlistState.active)) {
                        recoverUnexpectedMediaPause('error');
                    }
                });
            });
            setInterval(() => {
                const media = getExpectedMediaElement();
                if (isSleepPaused()) {
                    if (media && media.src && !media.paused) pauseSleepMedia();
                    return;
                }
                if (media && media.src && media.paused && !media.ended && !mediaAudioFocusInterrupted
                    && isMediaPlaybackExpected() && !pauseExpected) {
                    recoverUnexpectedMediaPause('watchdog');
                }
            }, 1000);
        }

        // 原生焦点丢失只记录中断，焦点恢复后按控制端期望状态再次尝试播放。
        window.onNativeAudioFocusChanged = function(change) {
            const code = Number(change);
            if (code < 0) {
                mediaAudioFocusInterrupted = true;
                // 焦点丢失期间不与系统媒体反复争抢；服务器仍保留控制端期望的播放状态。
                if (isMediaPlaybackExpected()) reportPlayState(true);
                return;
            }
            if (mediaAudioFocusInterrupted) {
                mediaAudioFocusInterrupted = false;
                mediaRecoveryAttempts = 0;
                if (mediaRecoveryTimer) {
                    clearTimeout(mediaRecoveryTimer);
                    mediaRecoveryTimer = null;
                }
                recoverUnexpectedMediaPause('audioFocusGain');
            }
        };

        installMediaPlaybackStateMonitor();

        // 睡眠/深度睡眠期间为 true：暂停语音播放、丢弃新 TTS
        function isSleepPaused() {
            return sleepState === 'sleep' || sleepState === 'deep';
        }

        // 睡眠暂停 TTS：暂停当前语音（保留进度）、清空待播队列、隐藏语音文本
        function pauseSleepTts() {
            ttsAudio.pause();
            ttsQueue = [];
            hideTtsText();
        }

        // 恢复（normal/active）时续播睡眠前被暂停的那条 utterance
        function resumeSleepTts() {
            if (isPlayingTts && ttsAudio.paused) {
                ttsAudio.play().catch(e => console.log('恢复TTS播放被阻止'));
            }
        }

        // 应用睡眠状态：普通睡眠只遮媒体，深度睡眠只显示全屏 UI 遮罩；媒体容器始终保持布局
        function applySleepState(state) {
            const prev = sleepState;
            sleepState = state;
            mediaSleepOverlay.style.display = state === 'sleep' ? 'block' : 'none';
            uiSleepOverlay.style.display = state === 'deep' ? 'block' : 'none';
            if (state === 'sleep' || state === 'deep') {
                pauseSleepMedia();
                pauseSleepTts();
            } else if (prev === 'sleep' || prev === 'deep') {
                // 仅从隐藏态恢复时续播，避免重复 play
                resumeSleepMedia();
                resumeSleepTts();
            }
            // 状态变化时上报，供控制端按钮实时显示
            reportSleepState();
        }

        // 上报当前睡眠状态到服务端（连接成功 + 每次状态变化）：服务端存 displayData.state.sleepState 并转发控制端
        function reportSleepState() {
            if (displayWs && displayWs.readyState === 1) {
                displayWs.send(JSON.stringify({ type: 'sleepStateReport', sleepState: sleepState }));
            }
        }

        // 10 秒定时检查：按优先级计算目标状态，状态变化才应用（避免每 10 秒重复 DOM 操作）
        function checkSleepMode() {
            let target = 'normal';
            // 立即切换优先于临时激活；临时激活只覆盖时段判定
            if (manualSleepMode === 'deep' || manualSleepMode === 'sleep') {
                target = manualSleepMode;
            } else if (Date.now() < activationUntil) {
                target = 'active';
            } else if (sleepSettings.enabled) {
                const hour = new Date().getHours();
                if (inSleepWindow(hour, sleepSettings.deepStartHour, sleepSettings.deepEndHour)) {
                    target = 'deep';
                } else if (inSleepWindow(hour, sleepSettings.startHour, sleepSettings.endHour)) {
                    target = 'sleep';
                }
            }
            if (target !== sleepState) {
                applySleepState(target);
            }
        }

        // 临时激活：强制显示 60 秒。下发媒体/临时激活同时取消手动覆盖（manualSleepMode 置 null），
        // 覆盖解除后不再回落手动，改按时段判定
        function activateTemporarily() {
            manualSleepMode = null;
            activationUntil = Date.now() + 60000;
            applySleepState('active');
        }

        function getPersistentDisplayId() {
            let id = localStorage.getItem('displayId');
            if (!id) {
                id = 'display-' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('displayId', id);
            }
            return id;
        }

        function applyLogReportConfig(data) {
            logReportConfig = data;
            if (data.enabled) {
                if (!_originalConsole) {
                    _originalConsole = {
                        log: console.log,
                        info: console.info,
                        warn: console.warn,
                        error: console.error,
                        debug: console.debug
                    };
                    console.log = function() {};
                    console.info = function() {};
                    console.warn = function() {};
                    console.error = function() {};
                    console.debug = function() {};
                }
            } else {
                if (_originalConsole) {
                    console.log = _originalConsole.log;
                    console.info = _originalConsole.info;
                    console.warn = _originalConsole.warn;
                    console.error = _originalConsole.error;
                    console.debug = _originalConsole.debug;
                    _originalConsole = null;
                }
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const id = getPersistentDisplayId();
            const wsUrl = `${protocol}//${window.location.host}/display?displayId=${id}`;
            
            displayWs = new WebSocket(wsUrl);
            
            displayWs.onopen = function() {
                setConnectionStatus('connected', '已连接');
                sendCanvasSize();
                sendBrowserInfo();
                declareCapabilities();
                sendVoiceStatus();
                reportSleepState();
                
                if (!isAlwaysListening) {
                    pendingAutoStart = true;
                    isAlwaysListening = true;
                    console.log('标记自动启动监听模式，等待服务器能力确认');
                }
            };
            
            displayWs.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    console.log('[显示端] 收到消息:', data.type, data);
                    setCorrelationId(data.correlationId);

                    if (data.type === 'serverStartTime') {
                        const storedTime = localStorage.getItem('serverStartTime');
                        if (storedTime && storedTime !== String(data.time)) {
                            localStorage.setItem('serverStartTime', data.time);
                            location.reload();
                        } else {
                            localStorage.setItem('serverStartTime', data.time);
                        }
                        return;
                    }
                    
                    if (data.type === 'displayId') {
                        displayId = data.id;
                        return;
                    }
                    
                    if (data.type === 'capabilitiesUpdated') {
                        handleCapabilitiesUpdated(data);
                        return;
                    }

                    if (data.type === 'asrAudio') {
                        handleAsrAudio(data);
                        return;
                    }

                    if (data.type === 'voiceprintConfig') {
                        voiceprintEnabled = !!data.enabled;
                        voiceprintMultiSpeaker = !!data.multiSpeaker;
                        if (nativeVoiceprintAvailable) {
                            nativeBridge.voiceprintConfigure(JSON.stringify({
                                enabled: voiceprintEnabled,
                                threshold: data.threshold || 0.5,
                                multiSpeaker: voiceprintMultiSpeaker
                            }));
                            if (voiceprintEnabled) {
                                // 拉取权威库重建本地声纹库（WebView 信任自签名证书，走 fetch）
                                fetch('/api/voiceprint/db')
                                    .then(r => r.json())
                                    .then(db => nativeBridge.voiceprintSyncDb(JSON.stringify(db)))
                                    .catch(e => console.warn('[声纹] 拉取声纹库失败:', e));
                            }
                        }
                        return;
                    }

                    if (data.type === 'speakerDbUpdated') {
                        // 声纹库变更 → 重拉重建（静默，不打扰）
                        if (nativeVoiceprintAvailable && voiceprintEnabled) {
                            fetch('/api/voiceprint/db')
                                .then(r => r.json())
                                .then(db => nativeBridge.voiceprintSyncDb(JSON.stringify(db)))
                                .catch(e => console.warn('[声纹] 重拉声纹库失败:', e));
                        }
                        return;
                    }

                    if (data.type === 'voiceprintExtract') {
                        // register display 模式：中转提取 → 回传 embedding
                        if (nativeVoiceprintAvailable) {
                            try {
                                const res = JSON.parse(nativeBridge.voiceprintExtract(data.audioBase64));
                                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                                    displayWs.send(JSON.stringify({
                                        type: 'voiceprintExtracted',
                                        requestId: data.requestId,
                                        embedding: res.embedding || [],
                                        error: res.error || ''
                                    }));
                                }
                            } catch (e) {
                                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                                    displayWs.send(JSON.stringify({
                                        type: 'voiceprintExtracted',
                                        requestId: data.requestId,
                                        embedding: [],
                                        error: e.message
                                    }));
                                }
                            }
                        } else {
                            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                                displayWs.send(JSON.stringify({
                                    type: 'voiceprintExtracted',
                                    requestId: data.requestId,
                                    embedding: [],
                                    error: '声纹桥不可用'
                                }));
                            }
                        }
                        return;
                    }

                    if (data.type === 'asrConfig') {
                        if (nativeAsrAvailable) {
                            // APK 原生引擎：localAsrEnabled 关闭时把能力声明置 false
                            if (!data.localAsrEnabled && nativeAsrReady) {
                                nativeAsrReady = false;
                                if (displayWs && displayWs.readyState === WebSocket.OPEN && currentCapabilities) {
                                    currentCapabilities.voiceRecognition = false;
                                    displayWs.send(JSON.stringify({ type: 'capabilities', capabilities: currentCapabilities }));
                                }
                            } else if (data.localAsrEnabled && !nativeAsrReady) {
                                // 重新启用原生 ASR：模型已就绪则恢复能力上报（未就绪保持原状，等 onNativeAsrModel ready 回调）
                                try {
                                    const st = JSON.parse(nativeBridge.asrStatus());
                                    if (st.state === 'ready') {
                                        nativeAsrReady = true;
                                        if (displayWs && displayWs.readyState === WebSocket.OPEN && currentCapabilities) {
                                            currentCapabilities.voiceRecognition = true;
                                            displayWs.send(JSON.stringify({ type: 'capabilities', capabilities: currentCapabilities }));
                                        }
                                    }
                                } catch (e) {
                                    console.warn('[ASR] asrStatus 解析失败:', e);
                                }
                            }
                            return;
                        }
                        if (data.localAsrEnabled && !localAsrAvailable) {
                            forceInitLocalAsr();
                        } else if (!data.localAsrEnabled && localAsrAvailable) {
                            if (localAsrStreaming) {
                                SherpaASR.stopStreaming();
                                localAsrStreaming = false;
                            }
                        }
                        return;
                    }

                    if (data.type === 'logReportConfig') {
                        applyLogReportConfig(data);
                        return;
                    }

                    if (data.type === 'control') {
                        handleControl(data);
                        if (data.action !== 'crop') {
                            // 睡眠设置/激活/手动覆盖回传当前 sleepState，供控制端状态显示
                            let ackExtra = null;
                            if (data.action === 'sleepSettings' || data.action === 'sleepActivate' || data.action === 'sleepOverride') {
                                ackExtra = { sleepState: sleepState };
                            }
                            sendCommandAck('control', true, data.action, ackExtra);
                        }
                    } else if (data.type === 'tts') {
                        handleTTS(data);
                        sendCommandAck('tts', true, data.action);
                    } else if (data.type === 'reminder') {
                        handleReminder(data);
                        sendCommandAck('reminder', true, data.action);
                    } else if (data.type === 'restoreState') {
                        handleRestoreState(data.state);
                        sendCommandAck('restoreState', true, 'state restored');
                    } else if (data.type === 'voiceCommand') {
                        handleVoiceCommand(data);
                        sendCommandAck('voiceCommand', true, data.action);
                    } else if (data.type === 'task:execute') {
                        executeTask(data.payload);
                    } else if (data.type === 'task:stop') {
                        // 停止显示端渲染任务，清理覆盖层
                        var stopInstanceId = data.instanceId;
                        console.log('[显示端] 停止任务:', stopInstanceId);
                        var overlayEl = document.getElementById('renderTask-' + stopInstanceId);
                        if (overlayEl) overlayEl.remove();
                        var styleEl = document.getElementById('renderTaskStyle-' + stopInstanceId);
                        if (styleEl) styleEl.remove();
                        if (window._renderTaskUpdates) {
                            delete window._renderTaskUpdates[stopInstanceId];
                        }
                    } else if (data.type === 'task:renderUpdate') {
                        // 渲染任务实时数据更新
                        var fn = window._renderTaskUpdates && window._renderTaskUpdates[data.instanceId];
                        if (fn) fn(data.data, data.sourceInstanceId);
                        sendCommandAck('renderUpdate', true, null);
                    } else if (data.type === 'hardwareStats') {
                        // 兼容 direct hardwareStats 消息（旧转发方式）
                        for (var _rid in window._renderTaskUpdates) {
                            window._renderTaskUpdates[_rid](data.data);
                        }
                        sendCommandAck('hardwareStats', true, null);
                    } else if (data.type === 'playlistStart') {
                        handlePlaylistStart(data);
                        sendCommandAck('playlistStart', true, data.listId);
                    } else if (data.type === 'playlistControl') {
                        handlePlaylistControl(data);
                        sendCommandAck('playlistControl', true, data.action);
                    } else {
                        console.log('[显示端] 处理媒体消息，发送 media 确认');
                        stopPlaylist();
                        showMedia(data);
                        sendCommandAck('media', true, data.type);
                    }
                } catch (e) {
                    console.error('解析消息失败:', e);
                }
            };
            
            displayWs.onclose = function() {
                stopControlScreenshot();
                controlModeEnabled = false;
                setConnectionStatus('disconnected', '已断开');
                setTimeout(connectWebSocket, 3000);
            };
            
            displayWs.onerror = function(error) {
                console.error('WebSocket错误:', error);
                setConnectionStatus('disconnected', '连接错误');
            };
        }
        
        window.addEventListener('resize', function() {
            applyCrop();
            sendCanvasSize();
        });
        
        applyRotation();
        connectWebSocket();
        checkSleepMode();
        setInterval(checkSleepMode, 10000);

        // 显示端代码自动刷新：轮询服务器文件版本，mtime 变化即 reload（无需重启 APK）
        // APK 已禁用 HTTP 缓存 + URL 带时间戳，reload 即加载最新代码
        let lastDisplayVersion = 0;
        (function watchDisplayVersion() {
            fetch('/api/display-version', { cache: 'no-store' })
                .then(r => r.json())
                .then(d => {
                    if (lastDisplayVersion === 0) {
                        lastDisplayVersion = d.version;
                    } else if (d.version !== lastDisplayVersion) {
                        console.log('[显示端] 检测到代码更新，自动刷新...');
                        location.reload();
                        return;
                    }
                    setTimeout(watchDisplayVersion, 8000);
                })
                .catch(() => setTimeout(watchDisplayVersion, 8000));
        })();

        initVoiceRecognition();
        updateVoiceStatusDisplay();
        
        function updateVoiceStatusDisplay() {
            if (!voiceStatus) return;
            
            if (!voiceSupported) {
                voiceStatus.className = 'voice-status-unsupported';
                voiceStatus.title = '不支持语音识别';
            } else if (isListening) {
                voiceStatus.className = 'voice-status-listening';
                voiceStatus.title = '语音识别中...';
            } else {
                voiceStatus.className = 'voice-status-ready';
                voiceStatus.title = '语音识别就绪';
            }
        }
        
        function updateVoiceTextDisplay(text, isFinal) {
            if (!voiceTextDisplay) return;
            
            if (text) {
                voiceTextDisplay.textContent = text + (isFinal ? '' : '…');
                voiceTextDisplay.className = 'voice-text-visible';
            } else {
                voiceTextDisplay.className = 'voice-text-hidden';
            }
        }
        
        function sendVoiceStatus() {
            if (!isListening && localAsrStreaming) {
                SherpaASR.stopStreaming();
                localAsrStreaming = false;
            }
            
            updateVoiceStatusDisplay();
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'voiceStatus',
                    supported: voiceSupported,
                    listening: isListening
                }));
            }
        }
        
        let currentCapabilities = null;
        
        async function detectCapabilities() {
            const capabilities = {
                mediaRendering: true,
                voicePlayback: true,
                voiceRecording: false,
                voiceRecognition: false,
                displayText: true,
                webgl: (function() {
                    try {
                        const c = document.createElement('canvas');
                        return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
                    } catch(e) { return false; }
                })(),
                webgpu: !!navigator.gpu && await (async function () {
                    try {
                        var diag = [];
                        try {
                            var glCanvas = document.createElement('canvas');
                            var gl = glCanvas.getContext('webgl2') || glCanvas.getContext('webgl');
                            if (gl) {
                                var dbg = gl.getExtension('WEBGL_debug_renderer_info');
                                if (dbg) {
                                    diag.push('GL_VENDOR=' + gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
                                    diag.push('GL_RENDERER=' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
                                }
                            }
                        } catch (e) {}
                        diag.push('UA=' + (navigator.userAgent.match(/Chrome\/(\d+\.\d+)/) || ['?'])[1]);

                        // requestAdapter 在部分设备（如旧 WebView 无 WebGPU）会永久挂起，
                        // 加超时保护避免 detectCapabilities 卡死导致能力不上报
                        const adapterWithTimeout = (promise, ms) => Promise.race([
                            promise,
                            new Promise(resolve => setTimeout(() => resolve(null), ms))
                        ]);
                        var a = await adapterWithTimeout(navigator.gpu.requestAdapter(), 3000);
                        var path = 'default';
                        if (!a) { a = await adapterWithTimeout(navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }), 3000); path = 'high-performance'; }
                        if (!a) { a = await adapterWithTimeout(navigator.gpu.requestAdapter({ powerPreference: 'low-power' }), 3000); path = 'low-power'; }
                        if (!a) {
                            diag.push('RESULT=三轮回退全部返回null');
                            capabilities._webgpuDiag = diag.join(' | ');
                            return false;
                        }
                        try {
                            var info = await a.requestAdapterInfo();
                            diag.push('VENDOR=' + (info.vendor || '?'));
                            diag.push('ARCH=' + (info.architecture || '?'));
                            diag.push('DEVICE=' + (info.device || '?'));
                        } catch (e) {}
                        diag.push('PREF=' + path);
                        capabilities._webgpuDiag = diag.join(' | ');
                        a.destroy();
                        return true;
                    } catch (e) {
                        capabilities._webgpuDiag = 'EXCEPTION: ' + e.message;
                        return false;
                    }
                })(),
                // APK 原生桥能力：真实像素截图 + 跨域输入注入
                crossOriginControl: !!(nativeBridge && nativeBridge.injectTouch),
                crossOriginControlDegraded: !!(nativeBridge && !nativeBridge.injectTouch),
                voiceprintAvailable: nativeVoiceprintAvailable
            };
            
            try {
                // getUserMedia 授权弹窗无人值守时会永久挂起：3 秒超时视为不可用
                const stream = await Promise.race([
                    navigator.mediaDevices.getUserMedia({ audio: true }),
                    new Promise(resolve => setTimeout(() => resolve(null), 3000))
                ]);
                if (stream) {
                    capabilities.voiceRecording = true;
                    stream.getTracks().forEach(track => track.stop());
                }
            } catch (e) {
                capabilities.voiceRecording = false;
            }
            
            if (nativeAsrAvailable) {
                // APK 原生识别引擎：按模型就绪状态声明能力，未就绪时触发下载
                try {
                    const st = JSON.parse(nativeBridge.asrStatus());
                    nativeAsrReady = (st.state === 'ready');
                    capabilities.voiceRecognition = nativeAsrReady;
                    if (st.state === 'downloading') {
                        showNativeAsrDownloadProgress(st.progress);
                    } else if (st.state === 'not_ready' || st.state === 'error') {
                        nativeBridge.asrEnsureModel();
                    }
                } catch (e) {
                    capabilities.voiceRecognition = false;
                }
            } else if (localAsrAvailable || voiceSupported) {
                capabilities.voiceRecognition = true;
            } else {
                try {
                    const response = await fetch('/api/asr/status');
                    const result = await response.json();
                    if (result.available || result.ready) {
                        capabilities.voiceRecognition = true;
                    }
                } catch (e) {
                    capabilities.voiceRecognition = false;
                }
            }
            
            return capabilities;
        }
        
        async function declareCapabilities() {
            console.log('[能力] 入口: 开始声明');
            try {
                // 同步构造基础能力立即上报（不依赖可能挂起的异步检测），
                // 确保原生桥能力（crossOriginControl）第一时间生效
                const baseCaps = {
                    mediaRendering: true,
                    voicePlayback: true,
                    displayText: true,
                    webgl: (function() {
                        try {
                            const c = document.createElement('canvas');
                            return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
                        } catch(e) { return false; }
                    })(),
                    crossOriginControl: !!(nativeBridge && nativeBridge.injectTouch),
                    crossOriginControlDegraded: !!(nativeBridge && !nativeBridge.injectTouch)
                };
                currentCapabilities = baseCaps;
                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                    displayWs.send(JSON.stringify({
                        type: 'capabilities',
                        capabilities: baseCaps
                    }));
                }
                console.log('[能力] 已声明基础能力:', baseCaps);
                // 异步补全能力（voiceRecording/webgpu 等）：挂起不影响基础能力
                detectCapabilities().then(full => {
                    if (!full) return;
                    currentCapabilities = full;
                    if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                        displayWs.send(JSON.stringify({
                            type: 'capabilities',
                            capabilities: full
                        }));
                    }
                    console.log('[能力] 已声明完整能力:', full);
                }).catch(e => console.error('[能力] 完整能力声明失败:', e));
            } catch (e) {
                console.error('[能力] 声明失败:', e);
            }
        }
        
        function handleCapabilitiesUpdated(data) {
            if (data.capabilities) {
                const prevCaps = currentCapabilities;
                currentCapabilities = data.capabilities;
                console.log('[能力] 能力已更新:', data.capabilities);

                // 媒体渲染能力关闭 → 停止媒体播放，清空画面
                if (!data.capabilities.mediaRendering) {
                    mediaImage.style.display = 'none';
                    mediaVideo.style.display = 'none';
                    mediaVideo.pause();
                    mediaVideo.src = '';
                    mediaImage.src = '';
                    fileNameDisplay.textContent = '';
                    waitingMessage.style.display = 'block';
                }

                // 语音播放能力关闭 → 停止 TTS，清空队列
                if (!data.capabilities.voicePlayback) {
                    ttsQueue = [];
                    ttsAudio.pause();
                    ttsAudio.currentTime = 0;
                    isPlayingTts = false;
                    voiceTextDisplay.className = 'voice-text-hidden';
                }

                // 语音录音能力关闭 → 停止录音
                if (!data.capabilities.voiceRecording && isListening) {
                    stopVoiceRecording();
                }

                // 语音识别能力关闭 → 停止 ASR 和录音
                if (!data.capabilities.voiceRecognition) {
                    if (localAsrStreaming) {
                        SherpaASR.stopStreaming();
                        localAsrStreaming = false;
                    }
                    if (isListening) {
                        stopVoiceRecording();
                    }
                }

                // 文本显示能力关闭 → 隐藏提醒弹窗和文字覆盖层
                if (!data.capabilities.displayText) {
                    const popup = document.querySelector('.reminder-popup');
                    if (popup) popup.remove();
                    voiceTextDisplay.className = 'voice-text-hidden';
                }

                // 初始能力从服务器到达 → 检查是否要自动启动录音
                if (pendingAutoStart && isAlwaysListening && !isListening) {
                    pendingAutoStart = false;
                    if (data.capabilities.voiceRecording && data.capabilities.voiceRecognition) {
                        console.log('[能力] 服务器能力已确认，启动录音');
                        startVoiceRecording();
                    } else {
                        console.log('[能力] 服务器禁止语音录制，跳过自动启动');
                    }
                }

                // 动态开启录音 → 如果能力从关闭变为开启，启动录音
                if (!pendingAutoStart && isAlwaysListening && !isListening &&
                    data.capabilities.voiceRecording && data.capabilities.voiceRecognition) {
                    // 检测是否有能力从关闭变为开启（prevCaps 存在时才算转变，避免与初始 pendingAutoStart 冲突）
                    if (prevCaps && (!prevCaps.voiceRecording || !prevCaps.voiceRecognition)) {
                        console.log('[能力] 录音能力已开启，启动录音');
                        startVoiceRecording();
                    }
                }
            }
        }
        
        async function handleAsrAudio(data) {
            // APK 原生识别路径：webm/wav base64 → WebAudio 解码重采样 16k mono → 裸 PCM → 原生引擎
            if (nativeAsrAvailable) {
                if (!nativeAsrReady) {
                    // asrStatus 解析容错：桥异常/返回非 JSON 时也按未就绪处理并触发下载，
                    // 始终回 asrResult{error:'模型下载中'}，避免异常挂住服务器 30s 超时
                    let triggerEnsure = false;
                    try {
                        const st = JSON.parse(nativeBridge.asrStatus());
                        triggerEnsure = (st.state === 'not_ready' || st.state === 'error');
                    } catch (e) {
                        console.warn('[ASR] asrStatus 解析失败:', e);
                        triggerEnsure = true;
                    }
                    if (triggerEnsure) {
                        nativeBridge.asrEnsureModel();
                    }
                    if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                        displayWs.send(JSON.stringify({
                            type: 'asrResult',
                            requestId: data.requestId,
                            error: '模型下载中',
                            text: ''
                        }));
                    }
                    return;
                }
                try {
                    const pcmBase64 = await decodeAudioToPcmBase64(data.audioData);
                    // 声纹分派：enabled+ready → 按 multiSpeaker 走单段匹配或多人分割；否则纯 ASR（speaker 缺省放行）
                    if (nativeVoiceprintAvailable && voiceprintEnabled && voiceprintReady) {
                        if (voiceprintMultiSpeaker) {
                            const res = JSON.parse(nativeBridge.voiceprintDiarize(pcmBase64));
                            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                                displayWs.send(JSON.stringify({
                                    type: 'asrResult',
                                    requestId: data.requestId,
                                    segments: res.segments || [],
                                    error: res.error || ''
                                }));
                            }
                        } else {
                            const res = JSON.parse(nativeBridge.asrRecognize(pcmBase64));
                            const vp = JSON.parse(nativeBridge.voiceprintMatch(pcmBase64));
                            const msg = {
                                type: 'asrResult',
                                requestId: data.requestId,
                                text: res.text || '',
                                error: res.error || vp.error || ''
                            };
                            // speaker 语义：vp.error → 声纹未就绪/不可用 → 不带 speaker（放行）；vp.speaker null → 可用但未匹配 → speaker:null（拦截）
                            if (!vp.error) msg.speaker = vp.speaker || null;
                            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                                displayWs.send(JSON.stringify(msg));
                            }
                        }
                    } else {
                        const res = JSON.parse(nativeBridge.asrRecognize(pcmBase64));
                        if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                            displayWs.send(JSON.stringify({
                                type: 'asrResult',
                                requestId: data.requestId,
                                text: res.text || '',
                                error: res.error || ''
                            }));
                        }
                    }
                } catch (e) {
                    if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                        displayWs.send(JSON.stringify({
                            type: 'asrResult',
                            requestId: data.requestId,
                            error: e.message,
                            text: ''
                        }));
                    }
                }
                return;
            }

            if (!SherpaASR || !SherpaASR.isLoaded) {
                console.log('[显示端] 收到ASR音频但本地ASR未初始化');
                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                    displayWs.send(JSON.stringify({
                        type: 'asrResult',
                        requestId: data.requestId,

        // webm/wav base64 → 16kHz mono 裸 PCM s16le 的 base64（原生引擎输入契约）
        async function decodeAudioToPcmBase64(base64Audio) {
            const binary = atob(base64Audio);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const decodeCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, 44100);
            const audioBuffer = await decodeCtx.decodeAudioData(bytes.buffer.slice(0));
            const length = Math.ceil(audioBuffer.duration * 16000);
            const resampleCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, length, 16000);
            const src = resampleCtx.createBufferSource();
            src.buffer = audioBuffer;
            src.connect(resampleCtx.destination);
            src.start();
            const rendered = await resampleCtx.startRendering();
            const samples = rendered.getChannelData(0);
            const pcm = new Uint8Array(samples.length * 2);
            const dv = new DataView(pcm.buffer);
            for (let i = 0; i < samples.length; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                dv.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
            }
            let bin = '';
            for (let i = 0; i < pcm.length; i++) bin += String.fromCharCode(pcm[i]);
            return btoa(bin);
        }
