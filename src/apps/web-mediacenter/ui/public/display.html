<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>媒体显示端</title>
    <link rel="stylesheet" href="css/display.css">
</head>
<body>
    <div id="connectionStatus" class="connecting">连接中...</div>
    <div id="timeDisplay"></div>
    <div id="fileNameDisplay"></div>
    <div id="voiceStatus" class="voice-status-hidden">语音</div>
    <div id="voiceTextDisplay" class="voice-text-hidden"></div>
    <div id="taskStatusDisplay" class="task-status-hidden">
        <div class="task-status-title">模型推理中</div>
        <div class="task-status-model" id="taskStatusModel"></div>
        <div class="task-status-progress" id="taskStatusProgress"><span></span></div>
        <div class="task-status-metrics" id="taskStatusMetrics"></div>
    </div>
    <div class="monitor-wrapper" id="monitorWrapper">
        <div class="monitor-label">AUDIO_FREQ // MONITOR</div>
        <canvas id="mini-monitor" width="160" height="50"></canvas>
    </div>
    
    <div id="mediaContainer">
        <div id="waitingMessage">
            <h2>等待媒体...</h2>
            <p>请在上传端选择图片或视频</p>
        </div>
        <img id="mediaImage">
        <video id="mediaVideo" autoplay loop playsinline></video>
        <iframe id="mediaHtml" style="display:none;"></iframe>
    </div>
    
    <audio id="ttsAudio" style="display:none;"></audio>
    <script src="js/sherpa-asr.js"></script>
    <script src="/js/lib/ort.min.js"></script>
    <script>
        const connectionStatus = document.getElementById('connectionStatus');
        const timeDisplay = document.getElementById('timeDisplay');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceTextDisplay = document.getElementById('voiceTextDisplay');
        const monitorWrapper = document.getElementById('monitorWrapper');
        const waitingMessage = document.getElementById('waitingMessage');
        const mediaImage = document.getElementById('mediaImage');
        const mediaVideo = document.getElementById('mediaVideo');
        const mediaHtml = document.getElementById('mediaHtml');
        const ttsAudio = document.getElementById('ttsAudio');
        const taskStatusDisplay = document.getElementById('taskStatusDisplay');
        const taskStatusModel = document.getElementById('taskStatusModel');
        const taskStatusProgress = document.getElementById('taskStatusProgress');
        const taskStatusMetrics = document.getElementById('taskStatusMetrics');
        
        let currentRotation = 0;
        window.currentRotation = 0;
        let currentFit = 'contain';
        let currentCrop = { x: 0, y: 0, width: 100, height: 100 };
        let displayWs = null;
        let autoTtsEnabled = true;
        let ttsQueue = [];
        let isPlayingTts = false;
        let voiceSupported = false;
        let isListening = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let micStream = null;
        let audioContext = null;
        let analyser = null;
        let silenceStartTime = null;
        let hasSpeech = false;
        let speechStartTime = null;
        let speechChunks = [];
        let collectingSpeech = false;
        let isAlwaysListening = false;
        let pendingAutoStart = false;
        let wasListeningBeforePlayback = false;
        let noInterruptMode = true;
        let audioQueue = [];
        let isPlayingAudio = false;
        let currentAudio = null;
        let isLLMGenerating = false;
        let consecutiveIgnoreCount = 0;
        let voiceCooldownUntil = 0;
        const MAX_CONSECUTIVE_IGNORES = 3;
        const VOICE_COOLDOWN_MS = 10000;
        let localAsrAvailable = false;
        let localAsrStreaming = false;
        let logReportConfig = null;
        let _originalConsole = null;
        
        let monitorTime = 0;
        let monitorAnalyser = null;
        let monitorDataArray = null;
        
        const monitorCanvas = document.getElementById('mini-monitor');
        const monitorCtx = monitorCanvas.getContext('2d');
        
        function drawMonitor(data) {
            monitorCtx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
            monitorCtx.fillStyle = '#00f2ff';
            
            const barWidth = 3;
            const gap = 1;
            const step = Math.floor(data.length / (monitorCanvas.width / (barWidth + gap)));

            for (let i = 0; i < monitorCanvas.width; i += (barWidth + gap)) {
                const dataIndex = Math.floor(i / (barWidth + gap)) * step;
                const value = data[dataIndex] || 0;
                const percent = value / 255;
                const barHeight = percent * monitorCanvas.height;

                monitorCtx.globalAlpha = 0.5 + (percent * 0.5);
                monitorCtx.fillRect(i, monitorCanvas.height - barHeight, barWidth, barHeight);
            }
        }
        
        function drawIdleMonitor(t) {
            monitorCtx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
            monitorCtx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < monitorCanvas.width; i += 4) {
                const h = 5 + Math.sin(i * 0.1 + t * 5) * 3;
                monitorCtx.fillRect(i, monitorCanvas.height - h, 3, h);
            }
        }
        
        function animateMonitor() {
            requestAnimationFrame(animateMonitor);
            monitorTime += 0.005;

            if (isListening && analyser) {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                drawMonitor(data);
            } else {
                drawIdleMonitor(monitorTime);
            }
        }
        
        animateMonitor();
        
        function sendCanvasSize() {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'canvasSize',
                    width: window.innerWidth,
                    height: window.innerHeight
                }));
            }
        }
        
        // 存储最近收到的消息中的 correlationId，用于 commandAck 回传
        let _lastCorrelationId = null;
        function setCorrelationId(cid) { if (cid) _lastCorrelationId = cid; }

        function sendCommandAck(commandType, success, details, extraData) {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                const ack = {
                    type: 'commandAck',
                    commandType: commandType,
                    success: success,
                    details: details || '',
                    timestamp: Date.now()
                };
                if (_lastCorrelationId) {
                    ack.correlationId = _lastCorrelationId;
                    _lastCorrelationId = null; // 使用后清空，避免重复
                }
                if (extraData) {
                    ack.extraData = extraData;
                }
                displayWs.send(JSON.stringify(ack));
            }
        }
        
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            const uaLower = ua.toLowerCase();
            
            let browserName = '未知浏览器';
            let browserVersion = '未知';
            
            if (uaLower.includes('edg/')) {
                browserName = 'Microsoft Edge';
                browserVersion = ua.split('Edg/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('opr/') || uaLower.includes('opera')) {
                browserName = 'Opera';
                browserVersion = ua.split('OPR/')[1]?.split(' ')[0]?.split('.')[0] || 
                                ua.split('Opera')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('brave')) {
                browserName = 'Brave';
                browserVersion = ua.split('Chrome/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('samsungbrowser')) {
                browserName = 'Samsung Internet';
                browserVersion = ua.split('SamsungBrowser/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('ucbrowser') || uaLower.includes('ubrowser')) {
                browserName = 'UC Browser';
                browserVersion = ua.split('UCBrowser/')[1]?.split(' ')[0]?.split('.')[0] || 
                                ua.split('UBrowser/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('firefox')) {
                browserName = 'Firefox';
                browserVersion = ua.split('Firefox/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('safari') && !uaLower.includes('chrome')) {
                browserName = 'Safari';
                browserVersion = ua.split('Version/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('chrome')) {
                browserName = 'Google Chrome';
                browserVersion = ua.split('Chrome/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            }
            
            let os = '未知系统';
            if (ua.includes('Windows NT 10')) os = 'Windows 10/11';
            else if (ua.includes('Windows NT 6.3')) os = 'Windows 8.1';
            else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
            else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
            else if (ua.includes('Mac OS X')) {
                const match = ua.match(/Mac OS X (\d+[._]\d+)/);
                os = match ? `macOS ${match[1].replace('_', '.')}` : 'macOS';
            } else if (ua.includes('Android')) {
                const match = ua.match(/Android (\d+(\.\d+)?)/);
                os = match ? `Android ${match[1]}` : 'Android';
            } else if (ua.includes('iPhone OS') || ua.includes('iPad')) {
                const match = ua.match(/OS (\d+[._]\d+)/);
                os = match ? `iOS ${match[1].replace('_', '.')}` : 'iOS';
            } else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('CrOS')) os = 'Chrome OS';
            
            let deviceType = '桌面设备';
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                if (/iPad|Android/i.test(ua) || ua.includes('Tablet')) {
                    deviceType = '平板设备';
                } else {
                    deviceType = '移动设备';
                }
            }
            
            return {
                userAgent: ua,
                browserName: browserName,
                browserVersion: browserVersion,
                os: os,
                deviceType: deviceType,
                screenWidth: screen.width,
                screenHeight: screen.height,
                devicePixelRatio: window.devicePixelRatio
            };
        }
        
        function getFeatureSupport() {
            return [
                {
                    name: 'Web Speech API',
                    supported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
                    note: '语音识别'
                },
                {
                    name: 'WebRTC',
                    supported: !!(window.RTCPeerConnection || window.webkitRTCPeerConnection),
                    note: '实时通信'
                },
                {
                    name: 'WebGL 1.0',
                    supported: (function() {
                        try {
                            const canvas = document.createElement('canvas');
                            return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
                        } catch(e) { return false; }
                    })(),
                    note: '基础3D图形'
                },
                {
                    name: 'WebGL 2.0',
                    supported: (function() {
                        try {
                            const canvas = document.createElement('canvas');
                            return !!canvas.getContext('webgl2');
                        } catch(e) { return false; }
                    })(),
                    note: '高级3D图形'
                },
                {
                    name: 'WebGPU',
                    supported: !!navigator.gpu,
                    note: 'GPU加速计算'
                },
                {
                    name: 'Service Worker',
                    supported: 'serviceWorker' in navigator,
                    note: '离线缓存'
                },
                {
                    name: 'WebAssembly',
                    supported: typeof WebAssembly === 'object',
                    note: '高性能计算'
                },
                {
                    name: 'Clipboard API',
                    supported: navigator.clipboard && typeof navigator.clipboard.writeText === 'function',
                    note: '剪贴板'
                },
                {
                    name: 'Geolocation',
                    supported: 'geolocation' in navigator,
                    note: '地理位置'
                },
                {
                    name: 'Web Workers',
                    supported: typeof Worker !== 'undefined',
                    note: '后台线程'
                },
                {
                    name: 'Fullscreen API',
                    supported: document.fullscreenEnabled || document.webkitFullscreenEnabled,
                    note: '全屏'
                },
                {
                    name: 'Screen Orientation',
                    supported: 'orientation' in screen,
                    note: '屏幕方向'
                }
            ];
        }
        
        function sendBrowserInfo() {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'browserInfo',
                    ...getBrowserInfo(),
                    featureSupport: getFeatureSupport()
                }));
            }
        }
        
        function applyRotation() {
            window.currentRotation = currentRotation;
            var rotTransform = 'rotate(' + currentRotation + 'deg)';
            mediaImage.style.transform = rotTransform;
            mediaVideo.style.transform = rotTransform;
            if (currentRotation === 90 || currentRotation === 270) {
                // 旋转 90/270：宽高互换；保持左上角定位（清除会让元素回到 flex 静态位置），
                // 先绕自身中心旋转，再平移至视口中心
                mediaHtml.style.width = '100vh';
                mediaHtml.style.height = '100vw';
                mediaHtml.style.top = '0';
                mediaHtml.style.left = '0';
                mediaHtml.style.transform = 'translate(50vw, 50vh) translate(-50%, -50%) rotate(' + currentRotation + 'deg)';
            } else {
                mediaHtml.style.width = '100%';
                mediaHtml.style.height = '100%';
                mediaHtml.style.top = '0';
                mediaHtml.style.left = '0';
                mediaHtml.style.transform = rotTransform;
            }

            // 立即更新所有活跃渲染任务覆盖层的旋转
            // render 任务覆盖层的旋转定位由 render.js 的 applyRotationStyle 管理

            const uiElements = [connectionStatus, timeDisplay, fileNameDisplay, voiceStatus, voiceTextDisplay, monitorWrapper];
            
            uiElements.forEach(el => {
                if (!el) return;
                el.style.transform = '';
                el.style.transformOrigin = '';
                el.style.left = '';
                el.style.top = '';
                el.style.right = '';
                el.style.bottom = '';
                el.style.maxWidth = '';
                el.style.writingMode = '';
                el.style.textOrientation = '';
                el.style.flexDirection = '';
            });
            
            if (currentRotation === 0) {
                connectionStatus.style.top = '20px';
                connectionStatus.style.left = '20px';
                timeDisplay.style.top = '20px';
                timeDisplay.style.right = '20px';
                fileNameDisplay.style.bottom = '20px';
                fileNameDisplay.style.left = '20px';
                monitorWrapper.style.bottom = '20px';
                monitorWrapper.style.right = '20px';
                voiceStatus.style.bottom = '80px';
                voiceStatus.style.right = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.bottom = '140px';
                    voiceTextDisplay.style.right = '20px';
                }
            } else if (currentRotation === 90) {
                connectionStatus.style.top = '20px';
                connectionStatus.style.right = '20px';
                connectionStatus.style.writingMode = 'vertical-rl';
                connectionStatus.style.textOrientation = 'mixed';
                
                timeDisplay.style.bottom = '20px';
                timeDisplay.style.right = '20px';
                timeDisplay.style.writingMode = 'vertical-rl';
                timeDisplay.style.textOrientation = 'mixed';
                
                fileNameDisplay.style.top = '20px';
                fileNameDisplay.style.left = '20px';
                fileNameDisplay.style.writingMode = 'vertical-rl';
                fileNameDisplay.style.textOrientation = 'mixed';
                
                monitorWrapper.style.bottom = '20px';
                monitorWrapper.style.left = '20px';
                monitorWrapper.style.flexDirection = 'column-reverse';
                
                voiceStatus.style.bottom = '80px';
                voiceStatus.style.left = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.bottom = '140px';
                    voiceTextDisplay.style.left = '20px';
                    voiceTextDisplay.style.maxWidth = '50vh';
                }
                [timeDisplay, fileNameDisplay, voiceTextDisplay].forEach(el => {
                    if (el) el.style.maxWidth = '50vh';
                });
            } else if (currentRotation === 180) {
                connectionStatus.style.bottom = '20px';
                connectionStatus.style.right = '20px';
                connectionStatus.style.transform = 'rotate(180deg)';
                
                timeDisplay.style.bottom = '20px';
                timeDisplay.style.left = '20px';
                timeDisplay.style.transform = 'rotate(180deg)';
                
                fileNameDisplay.style.top = '20px';
                fileNameDisplay.style.right = '20px';
                fileNameDisplay.style.transform = 'rotate(180deg)';
                
                monitorWrapper.style.top = '20px';
                monitorWrapper.style.left = '20px';
                
                voiceStatus.style.top = '80px';
                voiceStatus.style.left = '20px';
                voiceStatus.style.transform = 'rotate(180deg)';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.top = '140px';
                    voiceTextDisplay.style.left = '20px';
                    voiceTextDisplay.style.transform = 'rotate(180deg)';
                }
            } else if (currentRotation === 270) {
                connectionStatus.style.bottom = '20px';
                connectionStatus.style.left = '20px';
                connectionStatus.style.writingMode = 'vertical-rl';
                connectionStatus.style.textOrientation = 'mixed';
                connectionStatus.style.transform = 'rotate(180deg)';
                
                timeDisplay.style.top = '20px';
                timeDisplay.style.left = '20px';
                timeDisplay.style.writingMode = 'vertical-rl';
                timeDisplay.style.textOrientation = 'mixed';
                timeDisplay.style.transform = 'rotate(180deg)';
                
                fileNameDisplay.style.bottom = '20px';
                fileNameDisplay.style.right = '20px';
                fileNameDisplay.style.writingMode = 'vertical-rl';
                fileNameDisplay.style.textOrientation = 'mixed';
                fileNameDisplay.style.transform = 'rotate(180deg)';
                
                monitorWrapper.style.top = '20px';
                monitorWrapper.style.right = '20px';
                monitorWrapper.style.flexDirection = 'column-reverse';
                
                voiceStatus.style.top = '80px';
                voiceStatus.style.right = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.top = '140px';
                    voiceTextDisplay.style.right = '20px';
                    voiceTextDisplay.style.maxWidth = '50vh';
                }
                [timeDisplay, fileNameDisplay, voiceTextDisplay].forEach(el => {
                    if (el) el.style.maxWidth = '50vh';
                });
            }
        }
        
        function applyFit(fit) {
            currentFit = fit;
            mediaImage.classList.remove('height', 'width', 'crop');
            mediaVideo.classList.remove('height', 'width', 'crop');
            
            if (fit === 'height') {
                mediaImage.classList.add('height');
                mediaVideo.classList.add('height');
            } else if (fit === 'width') {
                mediaImage.classList.add('width');
                mediaVideo.classList.add('width');
            } else if (fit === 'crop') {
                mediaImage.classList.add('height');
                mediaVideo.classList.add('height');
            } else if (fit === 'contain') {
                // 铺满方向（高度/宽度）由 applyCrop 根据旋转角度/容器比例/媒体比例自动计算
            } else if (fit === 'cover') {
                // 覆盖铺满方向（高度/宽度）由 applyCrop 自动计算，超出部分居中裁切
            }

            applyCrop();
        }
        
        let _cropRafId = null;
        let _cropDebug = false;
        function _cropLog(...args) {
            if (_cropDebug) console.log(...args);
        }
        function scheduleCropApply() {
            if (_cropRafId) return;
            _cropRafId = requestAnimationFrame(() => {
                _cropRafId = null;
                const info = applyCrop();
                if (_cropDebug) {
                    sendCommandAck('crop', true, '裁剪已应用', info);
                }
            });
        }

        // html 媒体裁剪：裁剪框区域等比放大铺满屏幕（可叠加旋转）
        function applyHtmlCrop() {
            const crop = currentCrop;
            if (!crop) return;
            // 默认全屏（无裁剪）时恢复旋转基准变换
            if (crop.width >= 99.9 && crop.height >= 99.9 && crop.x <= 0.1 && crop.y <= 0.1) {
                currentHtmlScale = 1;
                applyRotation();
                return;
            }
            const cx = crop.x + crop.width / 2;
            const cy = crop.y + crop.height / 2;
            const scale = Math.max(100 / crop.width, 100 / crop.height);
            currentHtmlScale = scale;
            const isRotated = currentRotation === 90 || currentRotation === 270;
            mediaHtml.style.top = '0';
            mediaHtml.style.left = '0';
            // 点变换从右到左：原点移到裁剪框中心 → 等比放大 → 移回 → 旋转 → 平移到视口中心
            const cropTransform = 'translate(-' + cx + '%, -' + cy + '%) scale(' + scale + ') translate(' + cx + '%, ' + cy + '%)';
            if (isRotated) {
                mediaHtml.style.width = '100vh';
                mediaHtml.style.height = '100vw';
                mediaHtml.style.transform = 'translate(50vw, 50vh) translate(-50%, -50%) rotate(' + currentRotation + 'deg)' + cropTransform;
            } else {
                mediaHtml.style.width = '100%';
                mediaHtml.style.height = '100%';
                mediaHtml.style.transform = 'rotate(0deg)' + cropTransform;
            }
        }

        function applyCrop() {
            if (mediaHtml.style.display !== 'none') {
                // html 裁剪只在 crop 适配模式下生效，其他适配方式还原默认铺满
                if (currentFit === 'crop') {
                    applyHtmlCrop();
                } else {
                    applyRotation();
                }
                return;
            }
            const media = mediaImage.style.display !== 'none' ? mediaImage : mediaVideo;

            media.classList.remove('crop');
            media.style.width = '';
            media.style.height = '';
            media.style.left = '';
            media.style.top = '';
            media.style.maxWidth = '';
            media.style.maxHeight = '';
            
            const container = document.getElementById('mediaContainer');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            const naturalWidth = media.naturalWidth || media.videoWidth || containerWidth;
            const naturalHeight = media.naturalHeight || media.videoHeight || containerHeight;
            
            const isRotated = currentRotation === 90 || currentRotation === 270;

            _cropLog('[Crop] applyCrop 开始');
            _cropLog('[Crop] 容器尺寸:', containerWidth, 'x', containerHeight);
            _cropLog('[Crop] 媒体原始尺寸:', naturalWidth, 'x', naturalHeight);
            _cropLog('[Crop] 当前旋转:', currentRotation, '是否旋转:', isRotated);
            _cropLog('[Crop] 当前适配模式:', currentFit);
            _cropLog('[Crop] 当前裁剪百分比:', JSON.stringify(currentCrop));

            const baseInfo = {
                容器尺寸: { width: containerWidth, height: containerHeight },
                媒体原始尺寸: { width: naturalWidth, height: naturalHeight },
                当前旋转: currentRotation,
                是否旋转: isRotated,
                当前适配模式: currentFit,
                当前裁剪百分比: currentCrop
            };

            // 铺满模式：媒体等比放大覆盖整个容器（超出部分居中裁切）
            if (currentFit === 'cover') {
                if (naturalWidth > 0 && naturalHeight > 0 && containerWidth > 0 && containerHeight > 0) {
                    // 旋转后媒体的有效宽高比（宽/高互换）
                    const effectiveRatio = isRotated ? naturalHeight / naturalWidth : naturalWidth / naturalHeight;
                    const containerRatio = containerWidth / containerHeight;
                    let viewW, viewH;
                    if (effectiveRatio > containerRatio) {
                        // 媒体更宽：高度铺满容器高，宽度超出裁切
                        viewH = containerHeight;
                        viewW = containerHeight * effectiveRatio;
                    } else {
                        // 媒体更高：宽度铺满容器宽，高度超出裁切
                        viewW = containerWidth;
                        viewH = containerWidth / effectiveRatio;
                    }
                    if (isRotated) {
                        // 旋转 90/270 后布局宽高与视觉互换
                        media.style.width = viewH + 'px';
                        media.style.height = viewW + 'px';
                    } else {
                        media.style.width = viewW + 'px';
                        media.style.height = viewH + 'px';
                    }
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '铺满模式' };
            }

            // 适应模式：根据旋转角度/容器比例/媒体比例自动计算铺满尺寸
            if (currentFit === 'contain') {
                if (naturalWidth > 0 && naturalHeight > 0 && containerWidth > 0 && containerHeight > 0) {
                    // 旋转后媒体的有效宽高比（宽/高互换）
                    const effectiveRatio = isRotated ? naturalHeight / naturalWidth : naturalWidth / naturalHeight;
                    const containerRatio = containerWidth / containerHeight;
                    let viewW, viewH;
                    if (effectiveRatio > containerRatio) {
                        // 媒体更宽：宽度铺满容器宽，高度按比例
                        viewW = containerWidth;
                        viewH = containerWidth / effectiveRatio;
                    } else {
                        // 媒体更高：高度铺满容器高，宽度按比例
                        viewH = containerHeight;
                        viewW = containerHeight * effectiveRatio;
                    }
                    if (isRotated) {
                        // 旋转 90/270 后布局宽高与视觉互换
                        media.style.width = viewH + 'px';
                        media.style.height = viewW + 'px';
                    } else {
                        media.style.width = viewW + 'px';
                        media.style.height = viewH + 'px';
                    }
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '适应模式' };
            }

            if (currentFit !== 'height' && currentFit !== 'width' && currentFit !== 'crop') {
                _cropLog('[Crop] 非适配模式，跳过');
                return { ...baseInfo, 状态: '非适配模式' };
            }

            const mediaRatio = naturalWidth / naturalHeight;

            if (currentFit === 'height') {
                if (isRotated) {
                    const displayHeight = containerWidth;
                    const displayWidth = containerWidth * mediaRatio;
                    media.style.width = displayWidth + 'px';
                    media.style.height = displayHeight + 'px';
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '高度适配模式' };
            }
            
            if (currentFit === 'width') {
                if (isRotated) {
                    const displayWidth = containerHeight;
                    const displayHeight = containerHeight / mediaRatio;
                    media.style.width = displayWidth + 'px';
                    media.style.height = displayHeight + 'px';
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '宽度适配模式' };
            }
            
            if (currentFit !== 'crop') {
                return { ...baseInfo, 状态: '非裁剪模式' };
            }
            
            const containerRatio = containerWidth / containerHeight;
            let displayWidth, displayHeight;
            
            if (isRotated) {
                const rotatedRatio = 1 / mediaRatio;
                if (rotatedRatio > containerRatio) {
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / mediaRatio;
                } else {
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * mediaRatio;
                }
            } else {
                if (mediaRatio > containerRatio) {
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * mediaRatio;
                } else {
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / mediaRatio;
                }
            }
            
            let cropWidth, cropHeight, cropX, cropY;
            let targetWidth, targetHeight;
            
            if (isRotated) {
                cropWidth = displayWidth * (currentCrop.height / 100);
                cropHeight = displayHeight * (currentCrop.width / 100);
                cropX = displayWidth *  (currentCrop.y / 100);
                cropY = displayHeight * (currentCrop.x / 100);
                targetWidth = containerHeight;
                targetHeight = containerWidth;
            } else {
                cropWidth = displayWidth * (currentCrop.width / 100);
                cropHeight = displayHeight * (currentCrop.height / 100);
                cropX = displayWidth * (currentCrop.x / 100);
                cropY = displayHeight * (currentCrop.y / 100);
                targetWidth = containerWidth;
                targetHeight = containerHeight;
            }
            
            const scaleX = targetWidth / cropWidth;
            const scaleY = targetHeight / cropHeight;
            const scale = Math.max(scaleX, scaleY);
            
            let finalWidth, finalHeight, finalLeft, finalTop;
            
            if (isRotated) {
                finalWidth = displayWidth * scale;
                finalHeight = displayHeight * scale;
                finalLeft = -cropY * scale;
                finalTop = -cropX * scale;
                
                // 旋转补偿：CSS transform rotate 是围绕元素中心旋转的
                // 旋转90度后，元素视觉宽度变为原高度，视觉高度变为原宽度
                // 需要补偿 (finalWidth - finalHeight) / 2 的偏移
                const rotationOffset = (finalWidth - finalHeight) / 2;
                finalLeft -= rotationOffset;
                finalTop += rotationOffset;
            } else {
                finalWidth = displayWidth * scale;
                finalHeight = displayHeight * scale;
                finalLeft = -cropX * scale;
                finalTop = -cropY * scale;
            }
            
            media.classList.add('crop');
            media.style.width = finalWidth + 'px';
            media.style.height = finalHeight + 'px';
            media.style.left = finalLeft + 'px';
            media.style.top = finalTop + 'px';
            
            _cropLog('[Crop] 裁剪计算完成');
            _cropLog('[Crop] 显示尺寸:', displayWidth, 'x', displayHeight);
            _cropLog('[Crop] 裁剪像素值:', { cropX, cropY, cropWidth, cropHeight });
            _cropLog('[Crop] 最终样式:', {
                width: Math.round(finalWidth) + 'px',
                height: Math.round(finalHeight) + 'px',
                left: Math.round(finalLeft) + 'px',
                top: Math.round(finalTop) + 'px'
            });
            
            return {
                ...baseInfo,
                状态: '裁剪模式',
                媒体显示尺寸: { width: displayWidth, height: displayHeight },
                裁剪像素值: { cropX, cropY, cropWidth, cropHeight },
                最终样式: {
                    width: Math.round(finalWidth) + 'px',
                    height: Math.round(finalHeight) + 'px',
                    left: Math.round(finalLeft) + 'px',
                    top: Math.round(finalTop) + 'px'
                }
            };
        }
        
        function applyCustomCrop(customData) {
            const media = mediaImage.style.display !== 'none' ? mediaImage : mediaVideo;
            
            media.classList.remove('crop');
            media.classList.add('height');
            media.style.position = 'absolute';
            media.style.maxWidth = 'none';
            media.style.maxHeight = 'none';
            
            const width = customData.width || 1920;
            const height = customData.height || 1080;
            const left = customData.left || 0;

            media.style.width = width + 'px';
            media.style.height = height + 'px';
            media.style.left = left + 'px';
            media.style.top = top + 'px';
            
            currentFit = 'custom';
            
            return {
                自定义模式: true,
                宽度: width + 'px',
                高度: height + 'px',
                左边距: left + 'px',
                上边距: top + 'px'
            };
        }

        function playTTS(text) {
            fetch('/api/tts/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    ttsAudio.src = data.audioUrl;
                    ttsAudio.play().catch(e => console.log('TTS播放被阻止'));
                }
            })
            .catch(err => console.error('TTS生成失败:', err));

        function playNextTts() {
            console.log('[显示端] playNextTts: isPlayingTts=', isPlayingTts, 'queue=', ttsQueue.length);
            if (isPlayingTts) {
                return;
            }
            if (ttsQueue.length === 0) {
                // TTS 队列播放完毕，如果始终监听模式且能力允许，恢复录音
                if (isAlwaysListening && currentCapabilities?.voiceRecording) {
                    setTimeout(() => startVoiceRecording(), 500);
                }
                return;
            }
            
            isPlayingTts = true;
            const item = ttsQueue.shift();
            
            console.log('[显示端] 播放TTS:', item.audioUrl || item.text);
            
            if (item.text) {
                showTtsText(item.text);
            }
            
            if (item.audioUrl) {
                ttsAudio.src = item.audioUrl;
                ttsAudio.play().catch(e => {
                    console.log('TTS播放被阻止:', e.message);
                    hideTtsText();
                    isPlayingTts = false;
                    playNextTts();
                });
            } else if (item.text) {
                fetch('/api/tts/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: item.text })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        ttsAudio.src = data.audioUrl;
                        ttsAudio.play().catch(e => {
                            console.log('TTS播放被阻止');
                            hideTtsText();
                            isPlayingTts = false;
                            playNextTts();
                        });
                    } else {
                        isPlayingTts = false;
                        playNextTts();
                    }
                })
                .catch(err => {
                    console.error('TTS生成失败:', err);
                    isPlayingTts = false;
                    playNextTts();
                });
            } else {
                isPlayingTts = false;
                playNextTts();
            }
        }
        
        function queueTts(item) {
            ttsQueue.push(item);
            playNextTts();
        }
        
        ttsAudio.addEventListener('ended', () => {
            hideTtsText();
            isPlayingTts = false;
            playNextTts();
        });
        
        ttsAudio.addEventListener('error', () => {
            hideTtsText();
            isPlayingTts = false;
            playNextTts();
        });
        
        function showTtsText(text) {
            if (voiceTextDisplay && text) {
                voiceTextDisplay.textContent = text;
                voiceTextDisplay.className = 'voice-text-visible';
            }
        }
        
        function hideTtsText() {
            if (voiceTextDisplay) {
                voiceTextDisplay.className = 'voice-text-hidden';
            }
        }
        
        function handleTTS(data) {
            console.log('[显示端] 收到TTS消息:', data.action, data.audioUrl || data.text);
            if (data.action === 'play') {
                queueTts({ text: data.text });
            } else if (data.action === 'playAudio') {
                queueTts({ audioUrl: data.audioUrl, text: data.text });
            } else if (data.action === 'stop') {
                ttsQueue = [];
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                isPlayingTts = false;
            } else if (data.action === 'setAutoTts') {
                autoTtsEnabled = data.enabled;
            }
        }
        
        function handleReminder(data) {
            if (data.action === 'popup') {
                showReminderPopup(data.time, data.content);
            } else if (data.action === 'voice') {
                queueTts({ audioUrl: data.audioUrl, text: data.text });
            }
        }
        
        function handleVoiceCommand(data) {
            if (data.action === 'confirm') {
                showVoiceConfirmPopup(data.confirmationId, data.text, data.audioUrl);
            } else if (data.action === 'response') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showVoiceResponsePopup(data.text);
            } else if (data.action === 'searchResult') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showSearchResultPopup(data.query, data.results);
            } else if (data.action === 'weatherResult') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showVoiceResponsePopup(data.text);
            } else if (data.action === 'playChoices') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showPlayChoicesPopup(data.confirmationId, data.matches, data.text);
            }
        }
        
        function showVoiceConfirmPopup(confirmationId, text, audioUrl) {
            const existing = document.querySelector('.voice-confirm-popup');
            if (existing) {
                existing.remove();
            }
            
            if (audioUrl) {
                queueTts({ audioUrl: audioUrl, text: text });
            }
            
            const popup = document.createElement('div');
            popup.className = 'voice-confirm-popup';

                <div class="voice-confirm-content">${text}</div>

            `;

            setTimeout(() => {
