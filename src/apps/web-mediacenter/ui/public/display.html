<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>媒体显示端</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/display.css">
</head>
<body>
    <div id="connectionStatus" class="connecting">连接中...</div>
    <div id="timeDisplay"></div>
    <div id="fileNameDisplay"></div>
    <div class="voice-status-row" id="voiceStatusRow">
        <div class="voice-status-main-row" id="voiceStatusMainRow">
            <div id="voiceStatus" class="voice-status-hidden">语音</div>
            <div class="monitor-wrapper" id="monitorWrapper">
                <div class="monitor-label">AUDIO_FREQ // MONITOR</div>
                <canvas id="mini-monitor" width="140" height="50"></canvas>
            </div>
        </div>
        <div id="voiceConversationCountdown" class="voice-conversation-countdown" aria-hidden="true"></div>
        <div id="voiceConversationConfirmationCountdown" class="voice-conversation-countdown voice-conversation-countdown-confirmation" aria-hidden="true"></div>
    </div>
    <div id="voiceTextDisplay" class="voice-text-hidden"></div>
    <div id="taskStatusDisplay" class="task-status-hidden">
        <div class="task-status-title">模型推理中</div>
        <div class="task-status-model" id="taskStatusModel"></div>
        <div class="task-status-progress" id="taskStatusProgress"><span></span></div>
        <div class="task-status-metrics" id="taskStatusMetrics"></div>
    </div>

    <div id="mediaContainer">
        <div id="waitingMessage">
            <h2>等待媒体...</h2>
            <p>请在上传端选择图片或视频</p>
        </div>
        <img id="mediaImage">
        <video id="mediaVideo" autoplay loop playsinline></video>
        <audio id="mediaAudio" preload="auto" style="display:none;"></audio>
        <iframe id="mediaHtml" style="display:none;"></iframe>
        <section id="mediaText" aria-live="polite" style="display:none;">
            <div id="mediaTextContent"></div>
            <div id="mediaTextStatus"></div>
        </section>
        <div id="mediaSleepOverlay" class="sleep-overlay sleep-overlay-media"></div>
    </div>
    
    <audio id="ttsAudio" style="display:none;"></audio>
    <div id="uiSleepOverlay" class="sleep-overlay sleep-overlay-ui"></div>
    <script src="js/html-to-image.min.js"></script>
    <script src="js/control-mode-utils.js"></script>
    <script src="js/dynamic-fit-controller.js"></script>
    <script src="js/sherpa-asr.js"></script>
    <script src="js/pcm-audio-capture.js"></script>
    <script src="/js/lib/ort.min.js"></script>
    <script src="js/native-compute.js"></script>
    <script src="/js/sentence-splitter.js"></script>
    <script src="js/chat-markdown.js"></script>
    <script src="js/text-media-player.js"></script>
    <script src="js/ui-theme.js"></script>
    <script>
        const connectionStatus = document.getElementById('connectionStatus');
        const timeDisplay = document.getElementById('timeDisplay');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const voiceStatusRow = document.getElementById('voiceStatusRow');
        const voiceStatusMainRow = document.getElementById('voiceStatusMainRow');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceConversationCountdown = document.getElementById('voiceConversationCountdown');
        const voiceConversationConfirmationCountdown = document.getElementById('voiceConversationConfirmationCountdown');
        const voiceTextDisplay = document.getElementById('voiceTextDisplay');
        const monitorWrapper = document.getElementById('monitorWrapper');
        const waitingMessage = document.getElementById('waitingMessage');
        const mediaImage = document.getElementById('mediaImage');
        const mediaVideo = document.getElementById('mediaVideo');
        const mediaAudio = document.getElementById('mediaAudio');
        const mediaHtml = document.getElementById('mediaHtml');
        const mediaText = document.getElementById('mediaText');
        const mediaTextContent = document.getElementById('mediaTextContent');
        const mediaTextStatus = document.getElementById('mediaTextStatus');
        const ttsAudio = document.getElementById('ttsAudio');
        const taskStatusDisplay = document.getElementById('taskStatusDisplay');
        const taskStatusModel = document.getElementById('taskStatusModel');
        const taskStatusProgress = document.getElementById('taskStatusProgress');
        const taskStatusMetrics = document.getElementById('taskStatusMetrics');

        // 显示端复用控制端主题管理器，仅应用服务端主题，不在显示端发起保存请求。
        if (window.UiTheme) {
            window.UiTheme.init();
        }
        
        let currentRotation = 0;
        window.currentRotation = 0;
        let currentFit = 'contain';
        let dynamicFitConfig = { transitionSeconds: 3, holdSeconds: 2 };
        let dynamicFitController = null;
        let dynamicGeometryMode = 'contain';
        let currentCrop = { x: 0, y: 0, width: 100, height: 100 };
        let currentMediaType = 'image';
        let displayWs = null;
        // 显示端重连必须单飞：原生 ASR/TTS 同步阻塞 WebView 时，旧 close 回调不能再创建第二个连接。
        let displayReconnectTimer = null;
        let displayPageActive = true;
        // 服务器重启后 ASR 可能比 WebSocket 晚就绪，使用独立单飞定时器轮询恢复状态。
        const ASR_STATUS_RETRY_MS = 5000;
        let asrStatusRetryTimer = null;
        let asrStatusRequestToken = 0;
        // 文本播放器独立管理分页和逐句 TTS；显示页只提供 DOM、WebSocket 与旋转状态。
        const TextMediaPlayer = window.TextMediaPlayer;
        TextMediaPlayer.configure({
            container: mediaText,
            content: mediaTextContent,
            status: mediaTextStatus,
            audio: ttsAudio,
            getRotation: () => currentRotation,
            getDisplayId: () => (typeof displayId === 'string' ? displayId : null),
            send(message) {
                if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                    displayWs.send(JSON.stringify(message));
                }
            },
            // 文本播放器逐页/逐句变化时，同步到播放列表进度；非列表文本仍只上报 textProgress。
            onProgress(progress) {
                if (!playlistState || !playlistState.active) return;
                if (progress.state !== 'playing' && progress.state !== 'paused') return;
                sendPlaylistProgress(progress.state);
            },
            // 文本播放器只会在最后一页结束后触发完成回调，不能把单页结束误当作列表切项。
            onFinished(context) {
                if (!playlistState || !playlistState.active || !context) return;
                if (context.listId !== playlistState.listId || context.index !== playlistState.index) return;
                playlistNext();
            },
            // 文本媒体 TTS 与普通 TTS 共用网页视频音轨协调，避免逐句播放时改写视频声音。
            onAudioPlaybackStart() {
                textTtsPlaybackActive = true;
                pauseVoiceRecordingForTts();
                beginTtsVideoCoordination();
            },
            onAudioPlaybackEnd(playbackId) {
                textTtsPlaybackActive = false;
                sendVoiceTtsPlaybackFinished(playbackId);
                endTtsVideoCoordinationIfIdle();
                scheduleTtsRecordingResume();
            }
        });
        let autoTtsEnabled = true;
        let ttsQueue = [];
        // 分句 TTS 共用批次标识，避免服务端生成下一句的间隔被误判为整段播报完成。
        const ttsBatchPlaybackStates = new Map();
        let isPlayingTts = false;
        let ttsVideoState = null;
        let textTtsPlaybackActive = false;
        let ttsRecordingPaused = false;
        let ttsRecordingResumeTimer = null;
        const remoteTtsPlaybackIds = new Set();
        let remoteTextPlayback = null;
        let remotePrefetchedTextPlayback = null;
        let remoteTextPlaybackToken = 0;
        let voiceSupported = false;
        let isListening = false;
        let voiceListeningEnabled = true;
        let voiceConversationState = 'waitingWake';
        let voiceConversationTarget = null;
        let voiceConversationExpiresAt = null;
        let voiceConversationTimer = null;
        let voiceConversationCountdownTimer = null;
        let voiceConversationConfirmationExpiresAt = null;
        let voiceConversationConfirmationCountdownTimer = null;
        let micStream = null;
        let audioContext = null;
        let pcmCapture = null;
        let analyser = null;
        let vadSource = null;
        let silenceDetectionFrameId = null;
        let silenceDetectionRunning = false;
        let silenceStartTime = null;
        let hasSpeech = false;
        let speechStartTime = null;
        // VAD 阈值由服务端按显示端保存并下发，初始值只用于首次连接前的兜底。
        const DEFAULT_VAD_THRESHOLD = 0.01;
        let vadThreshold = DEFAULT_VAD_THRESHOLD;
        let vadNoiseTestActive = false;
        let vadNoiseTestRequestId = null;
        let isAlwaysListening = false;
        let pendingAutoStart = false;
        let wasListeningBeforePlayback = false;
        let noInterruptMode = true;
        let audioQueue = [];
        let isPlayingAudio = false;
        let currentAudio = null;
        let isLLMGenerating = false;
        let consecutiveIgnoreCount = 0;
        let voiceCooldownUntil = 0;
        const MAX_CONSECUTIVE_IGNORES = 3;
        const VOICE_COOLDOWN_MS = 10000;
        let localAsrAvailable = false;
        // APK 原生 ASR 只作为服务器选择的识别提供端，录音端仍走公共 HTTP 接口。
        const nativeAsrAvailable = !!(window.NativeDisplay && window.NativeDisplay.asrStatus);
        let nativeAsrReady = false;
        // APK 原生 TTS 引擎：检测到桥方法即认为可用，模型就绪后上报 ttsGeneration 能力
        const nativeTtsAvailable = !!(window.NativeDisplay && window.NativeDisplay.ttsStatus);
        let nativeTtsReady = false;
        let ttsDevice = 'server';
        let localTtsEnabled = false;
        // APK 原生声纹引擎：检测到桥方法即认为可用
        const nativeVoiceprintAvailable = !!(window.NativeDisplay && window.NativeDisplay.voiceprintMatch);
        let voiceprintEnabled = false;
        let voiceprintReady = false;
        let voiceprintMultiSpeaker = true;
        let voiceprintMultiMode = 'fast';
        let voiceprintSpeakerCount = 'AUTO';
        // 正式显示端统一使用中文 ASR，不向用户暴露语言选择。
        let asrLanguageMode = 'zh';
        let asrDenoiseEnabled = false;

        // 声纹模型下载/引擎加载事件（NativeBridge voiceprintConfigure 触发）
        window.onVoiceprintModel = function(payload) {
            if (!payload) return;
            if (payload.state === 'ready' && payload.engineReady) {
                voiceprintReady = true;
                updateVoiceTextDisplay('声纹引擎已就绪', true);
                setTimeout(() => updateVoiceTextDisplay('', true), 2000);
            } else if (payload.state === 'error') {
                voiceprintReady = false;
                updateVoiceTextDisplay('声纹模型下载失败: ' + (payload.error || '未知错误'), true);
                setTimeout(() => updateVoiceTextDisplay('', true), 4000);
            }
        };

        // 声纹库同步结果（NativeBridge voiceprintSyncDb 触发）
        window.onVoiceprintDb = function(payload) {
            if (!payload) return;
            if (payload.state === 'ready') {
                voiceprintReady = true;
                const n = (payload.speakers || []).length;
                console.log('[声纹] 声纹库已同步', n, '人');
            } else if (payload.state === 'error') {
                voiceprintReady = false;
                console.warn('[声纹] 声纹库同步失败:', payload.error);
            }
        };

        let localAsrStreaming = false;
        window.onNativeAsrModel = function(payload) {
            if (!payload) return;
            if (payload.state === 'downloading') {
                showNativeAsrDownloadProgress(payload.progress);
            } else if (payload.state === 'ready') {
                nativeAsrReady = true;
                updateVoiceTextDisplay('语音识别已就绪', true);
                setTimeout(() => updateVoiceTextDisplay('', true), 2000);
                reportLocalAsrProviderAvailability(true);
            } else if (payload.state === 'error') {
                nativeAsrReady = false;
                const errorText = payload.error || '未知错误';
                updateVoiceTextDisplay('语音模型加载失败: ' + errorText, true);
                setTimeout(() => updateVoiceTextDisplay('', true), 4000);
                if (errorText.includes('内存不足')) {
                    if (isListening) stopVoiceRecording();
                    reportLocalAsrProviderAvailability(false);
                }
            }
        };

        function sendAsrResult(requestId, payload) {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            displayWs.send(JSON.stringify(Object.assign({
                type: 'asrResult',
                requestId
            }, payload)));
        }

        window.onNativeAsrResult = function(payload) {
            if (!payload || !payload.requestId) return;
            const result = {
                text: payload.text || '',
                error: payload.error || ''
            };
            if (Array.isArray(payload.segments)) result.segments = payload.segments;
            if (Object.prototype.hasOwnProperty.call(payload, 'speaker')) result.speaker = payload.speaker;
            sendAsrResult(payload.requestId, result);
        };
        function reportNativeTtsCapability(ready) {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN || !currentCapabilities) return;
            currentCapabilities.ttsGeneration = ready;
            displayWs.send(JSON.stringify({ type: 'capabilities', capabilities: currentCapabilities }));
        }

        // 查询原生 TTS 状态；未就绪且服务端选择显示端生成时触发模型下载（幂等）
        function ensureNativeTtsModel() {
            if (!nativeTtsAvailable) return;
            try {
                const st = JSON.parse(nativeBridge.ttsStatus());
                if (st.state === 'ready') {
                    nativeTtsReady = true;
                    reportNativeTtsCapability(true);
                } else if (st.state === 'downloading') {
                    console.log('[TTS] 模型下载中', st.progress);
                } else if (st.state === 'not_ready' || st.state === 'error') {
                    nativeBridge.ttsEnsureModel();
                }
            } catch (e) {
                console.warn('[TTS] ttsStatus 解析失败:', e);
            }
        }

        // 原生 TTS 模型下载/加载事件（由 NativeBridge evaluateJavascript 触发）
        window.onNativeTtsModel = function(payload) {
            if (!payload) return;
            if (payload.state === 'downloading') {
                console.log('[TTS] 模型下载中', payload.progress);
            } else if (payload.state === 'ready') {
                nativeTtsReady = true;
                reportNativeTtsCapability(true);
            } else if (payload.state === 'error') {
                nativeTtsReady = false;
                reportNativeTtsCapability(false);
                console.warn('[TTS] 模型下载失败:', payload.error);
            }
        };

        // 原生 ASR 能力与公共 ASR 可用性分开上报，避免 1.39 的公共录音状态覆盖 1.6 的提供端能力。
        function reportLocalAsrProviderAvailability(available) {
            if (!currentCapabilities) return;
            currentCapabilities.voiceRecognition = available === true;
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({ type: 'capabilities', capabilities: currentCapabilities }));
            }
        }

        let logReportConfig = null;
        let _originalConsole = null;
        
        let monitorTime = 0;
        let monitorDataArray = null;
        let monitorLastFrameAt = 0;
        const VOICE_MONITOR_WIDTH = 140;
        
        const monitorCanvas = document.getElementById('mini-monitor');
        const monitorCtx = monitorCanvas.getContext('2d');
        
        function drawMonitor(data, timeSeconds) {
            monitorCtx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
            monitorCtx.fillStyle = '#00f2ff';
            
            const barWidth = 3;
            const gap = 1;
            const step = Math.floor(data.length / (monitorCanvas.width / (barWidth + gap)));

            for (let i = 0; i < monitorCanvas.width; i += (barWidth + gap)) {
                const dataIndex = Math.floor(i / (barWidth + gap)) * step;
                const value = data[dataIndex] || 0;
                const percent = value / 255;
                // 真实频谱过低时保留轻微动态基线，避免监听状态下整块监视图看起来像停止刷新。
                const motionFloor = 1 + (Math.sin(timeSeconds * 5 + i * 0.18) + 1) * 0.75;
                const barHeight = Math.max(percent * monitorCanvas.height, motionFloor);

                monitorCtx.globalAlpha = 0.5 + (percent * 0.5);
                monitorCtx.fillRect(i, monitorCanvas.height - barHeight, barWidth, barHeight);
            }
            monitorCtx.globalAlpha = 1;
        }
        
        function drawIdleMonitor(t) {
            monitorCtx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
            monitorCtx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < monitorCanvas.width; i += 4) {
                const h = 5 + (Math.sin(i * 0.1 + t * 5) + 1) * 1.5;
                monitorCtx.fillRect(i, monitorCanvas.height - h, 3, h);
            }
            monitorCtx.globalAlpha = 1;
        }
        
        function animateMonitor(timestamp = 0) {
            const elapsed = monitorLastFrameAt === 0
                ? 1 / 60
                : Math.min(Math.max(timestamp - monitorLastFrameAt, 0) / 1000, 0.1);
            monitorLastFrameAt = timestamp;
            monitorTime += elapsed;

            if (isListening && analyser) {
                if (!monitorDataArray || monitorDataArray.length !== analyser.frequencyBinCount) {
                    monitorDataArray = new Uint8Array(analyser.frequencyBinCount);
                }
                analyser.getByteFrequencyData(monitorDataArray);
                drawMonitor(monitorDataArray, monitorTime);
            } else {
                drawIdleMonitor(monitorTime);
            }
            requestAnimationFrame(animateMonitor);
        }
        
        requestAnimationFrame(animateMonitor);
        
        function sendCanvasSize() {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'canvasSize',
                    width: window.innerWidth,
                    height: window.innerHeight
                }));
            }
        }
        
        // 存储最近收到的消息中的 correlationId，用于 commandAck 回传
        let _lastCorrelationId = null;
        function setCorrelationId(cid) { if (cid) _lastCorrelationId = cid; }

        function sendCommandAck(commandType, success, details, extraData) {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                const ack = {
                    type: 'commandAck',
                    commandType: commandType,
                    success: success,
                    details: details || '',
                    timestamp: Date.now()
                };
                if (_lastCorrelationId) {
                    ack.correlationId = _lastCorrelationId;
                    _lastCorrelationId = null; // 使用后清空，避免重复
                }
                if (extraData) {
                    ack.extraData = extraData;
                }
                displayWs.send(JSON.stringify(ack));
            }
        }
        
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            const uaLower = ua.toLowerCase();
            
            let browserName = '未知浏览器';
            let browserVersion = '未知';
            
            if (uaLower.includes('edg/')) {
                browserName = 'Microsoft Edge';
                browserVersion = ua.split('Edg/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('opr/') || uaLower.includes('opera')) {
                browserName = 'Opera';
                browserVersion = ua.split('OPR/')[1]?.split(' ')[0]?.split('.')[0] || 
                                ua.split('Opera')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('brave')) {
                browserName = 'Brave';
                browserVersion = ua.split('Chrome/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('samsungbrowser')) {
                browserName = 'Samsung Internet';
                browserVersion = ua.split('SamsungBrowser/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('ucbrowser') || uaLower.includes('ubrowser')) {
                browserName = 'UC Browser';
                browserVersion = ua.split('UCBrowser/')[1]?.split(' ')[0]?.split('.')[0] || 
                                ua.split('UBrowser/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('firefox')) {
                browserName = 'Firefox';
                browserVersion = ua.split('Firefox/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('safari') && !uaLower.includes('chrome')) {
                browserName = 'Safari';
                browserVersion = ua.split('Version/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('chrome')) {
                browserName = 'Google Chrome';
                browserVersion = ua.split('Chrome/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            }
            
            let os = '未知系统';
            if (ua.includes('Windows NT 10')) os = 'Windows 10/11';
            else if (ua.includes('Windows NT 6.3')) os = 'Windows 8.1';
            else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
            else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
            else if (ua.includes('Mac OS X')) {
                const match = ua.match(/Mac OS X (\d+[._]\d+)/);
                os = match ? `macOS ${match[1].replace('_', '.')}` : 'macOS';
            } else if (ua.includes('Android')) {
                const match = ua.match(/Android (\d+(\.\d+)?)/);
                os = match ? `Android ${match[1]}` : 'Android';
            } else if (ua.includes('iPhone OS') || ua.includes('iPad')) {
                const match = ua.match(/OS (\d+[._]\d+)/);
                os = match ? `iOS ${match[1].replace('_', '.')}` : 'iOS';
            } else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('CrOS')) os = 'Chrome OS';
            
            let deviceType = '桌面设备';
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                if (/iPad|Android/i.test(ua) || ua.includes('Tablet')) {
                    deviceType = '平板设备';
                } else {
                    deviceType = '移动设备';
                }
            }
            
            return {
                userAgent: ua,
                browserName: browserName,
                browserVersion: browserVersion,
                os: os,
                deviceType: deviceType,
                screenWidth: screen.width,
                screenHeight: screen.height,
                devicePixelRatio: window.devicePixelRatio
            };
        }
        
        function getFeatureSupport() {
            return [
                {
                    name: 'Web Speech API',
                    supported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
                    note: '语音识别'
                },
                {
                    name: 'WebRTC',
                    supported: !!(window.RTCPeerConnection || window.webkitRTCPeerConnection),
                    note: '实时通信'
                },
                {
                    name: 'WebGL 1.0',
                    supported: (function() {
                        try {
                            const canvas = document.createElement('canvas');
                            return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
                        } catch(e) { return false; }
                    })(),
                    note: '基础3D图形'
                },
                {
                    name: 'WebGL 2.0',
                    supported: (function() {
                        try {
                            const canvas = document.createElement('canvas');
                            return !!canvas.getContext('webgl2');
                        } catch(e) { return false; }
                    })(),
                    note: '高级3D图形'
                },
                {
                    name: 'WebGPU',
                    supported: !!navigator.gpu,
                    note: 'GPU加速计算'
                },
                {
                    name: 'Service Worker',
                    supported: 'serviceWorker' in navigator,
                    note: '离线缓存'
                },
                {
                    name: 'WebAssembly',
                    supported: typeof WebAssembly === 'object',
                    note: '高性能计算'
                },
                {
                    name: 'Clipboard API',
                    supported: navigator.clipboard && typeof navigator.clipboard.writeText === 'function',
                    note: '剪贴板'
                },
                {
                    name: 'Geolocation',
                    supported: 'geolocation' in navigator,
                    note: '地理位置'
                },
                {
                    name: 'Web Workers',
                    supported: typeof Worker !== 'undefined',
                    note: '后台线程'
                },
                {
                    name: 'Fullscreen API',
                    supported: document.fullscreenEnabled || document.webkitFullscreenEnabled,
                    note: '全屏'
                },
                {
                    name: 'Screen Orientation',
                    supported: 'orientation' in screen,
                    note: '屏幕方向'
                }
            ];
        }
        
        function sendBrowserInfo() {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'browserInfo',
                    ...getBrowserInfo(),
                    featureSupport: getFeatureSupport()

            };

            const geometryMode = currentFit === 'dynamic' ? dynamicGeometryMode : currentFit;

            // 铺满模式：媒体等比放大覆盖整个容器（超出部分居中裁切）
            if (geometryMode === 'cover') {
                if (naturalWidth > 0 && naturalHeight > 0 && containerWidth > 0 && containerHeight > 0) {
                    // 旋转后媒体的有效宽高比（宽/高互换）
                    const effectiveRatio = isRotated ? naturalHeight / naturalWidth : naturalWidth / naturalHeight;
                    const containerRatio = containerWidth / containerHeight;
                    let viewW, viewH;
                    if (effectiveRatio > containerRatio) {
                        // 媒体更宽：高度铺满容器高，宽度超出裁切
                        viewH = containerHeight;
                        viewW = containerHeight * effectiveRatio;
                    } else {
                        // 媒体更高：宽度铺满容器宽，高度超出裁切
                        viewW = containerWidth;
                        viewH = containerWidth / effectiveRatio;
                    }
                    if (isRotated) {
                        // 旋转 90/270 后布局宽高与视觉互换
                        media.style.width = viewH + 'px';
                        media.style.height = viewW + 'px';
                    } else {
                        media.style.width = viewW + 'px';
                        media.style.height = viewH + 'px';
                    }
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '铺满模式' };
            }

            // 适应模式：根据旋转角度/容器比例/媒体比例自动计算铺满尺寸
            if (geometryMode === 'contain') {
                if (naturalWidth > 0 && naturalHeight > 0 && containerWidth > 0 && containerHeight > 0) {
                    // 旋转后媒体的有效宽高比（宽/高互换）
                    const effectiveRatio = isRotated ? naturalHeight / naturalWidth : naturalWidth / naturalHeight;
                    const containerRatio = containerWidth / containerHeight;
                    let viewW, viewH;
                    if (effectiveRatio > containerRatio) {
                        // 媒体更宽：宽度铺满容器宽，高度按比例
                        viewW = containerWidth;
                        viewH = containerWidth / effectiveRatio;
                    } else {
                        // 媒体更高：高度铺满容器高，宽度按比例
                        viewH = containerHeight;
                        viewW = containerHeight * effectiveRatio;
                    }
                    if (isRotated) {
                        // 旋转 90/270 后布局宽高与视觉互换
                        media.style.width = viewH + 'px';
                        media.style.height = viewW + 'px';
                    } else {
                        media.style.width = viewW + 'px';
                        media.style.height = viewH + 'px';
                    }
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '适应模式' };
            }

            if (geometryMode !== 'height' && geometryMode !== 'width' && geometryMode !== 'crop') {
                _cropLog('[Crop] 非适配模式，跳过');
                return { ...baseInfo, 状态: '非适配模式' };
            }

            const mediaRatio = naturalWidth / naturalHeight;

            if (geometryMode === 'height') {
                if (isRotated) {
                    const displayHeight = containerWidth;
                    const displayWidth = containerWidth * mediaRatio;
                    media.style.width = displayWidth + 'px';
                    media.style.height = displayHeight + 'px';
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '高度适配模式' };
            }
            
            if (geometryMode === 'width') {
                if (isRotated) {
                    const displayWidth = containerHeight;
                    const displayHeight = containerHeight / mediaRatio;
                    media.style.width = displayWidth + 'px';
                    media.style.height = displayHeight + 'px';
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '宽度适配模式' };
            }
            
            if (geometryMode !== 'crop') {
                return { ...baseInfo, 状态: '非裁剪模式' };
            }
            
            const containerRatio = containerWidth / containerHeight;
            let displayWidth, displayHeight;
            
            if (isRotated) {
                const rotatedRatio = 1 / mediaRatio;
                if (rotatedRatio > containerRatio) {
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / mediaRatio;
                } else {
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * mediaRatio;
                }
            } else {
                if (mediaRatio > containerRatio) {
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * mediaRatio;
                } else {
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / mediaRatio;
                }
            }
            
            let cropWidth, cropHeight, cropX, cropY;
            let targetWidth, targetHeight;
            
            if (isRotated) {
                cropWidth = displayWidth * (currentCrop.height / 100);
                cropHeight = displayHeight * (currentCrop.width / 100);
                cropX = displayWidth *  (currentCrop.y / 100);
                cropY = displayHeight * (currentCrop.x / 100);
                targetWidth = containerHeight;
                targetHeight = containerWidth;
            } else {
                cropWidth = displayWidth * (currentCrop.width / 100);
                cropHeight = displayHeight * (currentCrop.height / 100);
                cropX = displayWidth * (currentCrop.x / 100);
                cropY = displayHeight * (currentCrop.y / 100);
                targetWidth = containerWidth;
                targetHeight = containerHeight;
            }
            
            const scaleX = targetWidth / cropWidth;
            const scaleY = targetHeight / cropHeight;
            const scale = Math.max(scaleX, scaleY);
            
            let finalWidth, finalHeight, finalLeft, finalTop;
            
            if (isRotated) {
                finalWidth = displayWidth * scale;
                finalHeight = displayHeight * scale;
                finalLeft = -cropY * scale;
                finalTop = -cropX * scale;
                
                // 旋转补偿：CSS transform rotate 是围绕元素中心旋转的
                // 旋转90度后，元素视觉宽度变为原高度，视觉高度变为原宽度
                // 需要补偿 (finalWidth - finalHeight) / 2 的偏移
                const rotationOffset = (finalWidth - finalHeight) / 2;
                finalLeft -= rotationOffset;
                finalTop += rotationOffset;
            } else {
                finalWidth = displayWidth * scale;
                finalHeight = displayHeight * scale;
                finalLeft = -cropX * scale;
                finalTop = -cropY * scale;
            }
            
            media.classList.add('crop');
            media.style.width = finalWidth + 'px';
            media.style.height = finalHeight + 'px';
            media.style.left = finalLeft + 'px';
            media.style.top = finalTop + 'px';
            
            _cropLog('[Crop] 裁剪计算完成');
            _cropLog('[Crop] 显示尺寸:', displayWidth, 'x', displayHeight);
            _cropLog('[Crop] 裁剪像素值:', { cropX, cropY, cropWidth, cropHeight });
            _cropLog('[Crop] 最终样式:', {
                width: Math.round(finalWidth) + 'px',
                height: Math.round(finalHeight) + 'px',
                left: Math.round(finalLeft) + 'px',
                top: Math.round(finalTop) + 'px'
            });
            
            return {
                ...baseInfo,
                状态: '裁剪模式',
                媒体显示尺寸: { width: displayWidth, height: displayHeight },
                裁剪像素值: { cropX, cropY, cropWidth, cropHeight },
                最终样式: {
                    width: Math.round(finalWidth) + 'px',
                    height: Math.round(finalHeight) + 'px',
                    left: Math.round(finalLeft) + 'px',
                    top: Math.round(finalTop) + 'px'
                }
            };
        }
        
        function applyCustomCrop(customData) {
            const media = mediaImage.style.display !== 'none' ? mediaImage : mediaVideo;
            
            media.classList.remove('crop');
            media.classList.add('height');
            media.style.position = 'absolute';
            media.style.maxWidth = 'none';
            media.style.maxHeight = 'none';
            
            const width = customData.width || 1920;
            const height = customData.height || 1080;
            const left = customData.left || 0;
            const top = customData.top || 0;
            
            media.style.width = width + 'px';
            media.style.height = height + 'px';
            media.style.left = left + 'px';
            media.style.top = top + 'px';
            
            currentFit = 'custom';
            
            return {
                自定义模式: true,
                宽度: width + 'px',
                高度: height + 'px',
                左边距: left + 'px',
                上边距: top + 'px'
            };
        }
        
        window.addEventListener('resize', applyCrop);
        window.addEventListener('resize', () => {
            if (currentMediaType === 'text') TextMediaPlayer.applyStyle({});
        });
        
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        setInterval(updateTime, 1000);
        updateTime();
        
        function setConnectionStatus(status, text) {
            connectionStatus.className = status;
            connectionStatus.textContent = text;
        }
        
        // 媒体文件名必须交给服务器统一 TTS，才能让其他显示端收到跨设备播放状态并暂停非声纹监听。
        function requestMediaNameTts(text) {
            if (!text || !displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            displayWs.send(JSON.stringify({
                type: 'mediaNameTts',
                text: text
            }));
        }

        // TTS 播放期间视频保留画面和音轨；网页不主动静音，焦点行为交由 WebView 网页媒体处理。
        function isTtsPlaybackActive() {
            return !!(ttsVideoState && ttsVideoState.active);
        }

        function beginTtsVideoCoordination() {
            if (isTtsPlaybackActive()) return;
            const hasPlayableVideo = currentMediaType === 'video' && !!mediaVideo.src;
            ttsVideoState = {
                active: true,
                wasPlaying: hasPlayableVideo && !mediaVideo.paused && !mediaVideo.ended
            };
            // TTS 使用网页音频元素的最大音量；视频音量由页面和系统策略自行决定，不在这里改动。
            ttsAudio.volume = 1;
        }

        function endTtsVideoCoordination() {
            const state = ttsVideoState;
            if (!state) return;
            ttsVideoState = null;
            if (!state.wasPlaying || !isMediaPlaybackExpected() || !mediaVideo.src || mediaVideo.ended || !mediaVideo.paused) return;
            try {
                const playResult = mediaVideo.play();
                if (playResult && typeof playResult.catch === 'function') {
                    playResult.catch((error) => console.warn('TTS 结束后恢复视频播放失败', error));
                }
            } catch (error) {
                console.warn('TTS 结束后恢复视频播放失败', error);
            }
        }

        function endTtsVideoCoordinationIfIdle() {
            if (isPlayingTts || ttsQueue.length > 0 || textTtsPlaybackActive || remoteTextPlayback
                || ttsBatchPlaybackStates.size > 0) return;
            endTtsVideoCoordination();
        }

        function hasActiveTtsPlayback() {
            return isPlayingTts || ttsQueue.length > 0 || textTtsPlaybackActive
                || !!remoteTextPlayback || remoteTtsPlaybackIds.size > 0 || ttsBatchPlaybackStates.size > 0;
        }

        function registerTtsBatchItem(item) {
            if (!item.voiceTtsBatchId) return;
            const state = ttsBatchPlaybackStates.get(item.voiceTtsBatchId) || {
                totalItems: 0,
                completedItems: 0,
                endQueued: false
            };
            state.totalItems++;
            state.endQueued = state.endQueued || item.voiceTtsBatchEnd === true;
            ttsBatchPlaybackStates.set(item.voiceTtsBatchId, state);
        }

        function markTtsBatchItemFinished(item) {
            if (!item?.voiceTtsBatchId) return;
            const state = ttsBatchPlaybackStates.get(item.voiceTtsBatchId);
            if (!state) return;
            state.completedItems++;
        }

        function isVoiceTtsBatchPlaybackComplete() {
            for (const state of ttsBatchPlaybackStates.values()) {
                if (!state.endQueued || state.completedItems < state.totalItems) return false;
            }
            return true;
        }

        function clearCompletedTtsBatches() {
            for (const [batchId, state] of ttsBatchPlaybackStates.entries()) {
                if (state.endQueued && state.completedItems >= state.totalItems) {
                    ttsBatchPlaybackStates.delete(batchId);
                }
            }
        }

        function getRemoteTtsPlaybackKey(data) {
            return `${data.playbackDisplayId || ''}:${data.voiceTtsPlaybackId}`;
        }

        function clearTtsRecordingResumeTimer() {
            if (ttsRecordingResumeTimer) clearTimeout(ttsRecordingResumeTimer);
            ttsRecordingResumeTimer = null;
        }

        // 复用子显示端 mute 模式：无声纹时暂停 PCM/VAD，避免扬声器回声进入 ASR。
        function pauseVoiceRecordingForTts() {
            if (voiceprintEnabled === true || ttsRecordingPaused || !isListening || !pcmCapture?.active) return;
            clearTtsRecordingResumeTimer();
            wasListeningBeforePlayback = true;
            ttsRecordingPaused = true;
            stopSilenceDetection();
            hasSpeech = false;
            speechStartTime = null;
            silenceStartTime = null;
            pcmCapture.setPaused(true);
            isListening = false;
            sendVoiceStatus();
            console.log('[语音] 未启用声纹识别，TTS 播放期间暂停录音');
        }

        // TTS 队列结束后恢复原本正在监听的显示端，AudioContext 和麦克风轨道保持复用。
        function resumeVoiceRecordingAfterTts() {
            clearTtsRecordingResumeTimer();
            if (!ttsRecordingPaused) return;
            const shouldResume = wasListeningBeforePlayback && displayPageActive
                && voiceListeningEnabled && currentCapabilities?.voiceRecording === true
                && pcmCapture?.active && micStream;
            ttsRecordingPaused = false;
            wasListeningBeforePlayback = false;
            if (!shouldResume) return;
            pcmCapture.setPaused(false);
            isListening = true;
            hasSpeech = false;
            speechStartTime = null;
            silenceStartTime = null;
            sendVoiceStatus();
            startSilenceDetection();
            console.log('[语音] TTS 播放结束，恢复录音');
        }

        // 文本媒体逐句播报之间可能有短暂请求间隔，延迟恢复避免把下一句 TTS 的开头再次采入。
        function scheduleTtsRecordingResume() {
            if (!ttsRecordingPaused) return;
            clearTtsRecordingResumeTimer();
            ttsRecordingResumeTimer = setTimeout(() => {
                ttsRecordingResumeTimer = null;
                if (!hasActiveTtsPlayback()) resumeVoiceRecordingAfterTts();
            }, 300);
        }

        function handleVoiceTtsPlaybackState(data) {
            const playbackId = data.voiceTtsPlaybackId;
            if (!playbackId) return;
            const playbackKey = getRemoteTtsPlaybackKey(data);
            if (data.state === 'started') {
                remoteTtsPlaybackIds.add(playbackKey);
                pauseVoiceRecordingForTts();
                return;
            }
            if (['finished', 'timeout', 'stopped'].includes(data.state)) {
                remoteTtsPlaybackIds.delete(playbackKey);
                scheduleTtsRecordingResume();
            }
        }

        let currentTtsItem = null;
        let ttsRecoveryTimer = null;
        let ttsRecoveryAttempts = 0;
        let ttsPlaybackToken = 0;
        const TTS_RECOVERY_DELAY_MS = 200;
        const TTS_RECOVERY_MAX_ATTEMPTS = 5;

        function clearTtsRecovery() {
            if (ttsRecoveryTimer) clearTimeout(ttsRecoveryTimer);
            ttsRecoveryTimer = null;
            ttsRecoveryAttempts = 0;
        }

        function scheduleTtsRecovery(reason) {
            if (!currentTtsItem || !isPlayingTts || ttsAudio.ended
                || ttsRecoveryTimer || ttsRecoveryAttempts >= TTS_RECOVERY_MAX_ATTEMPTS) return;
            ttsRecoveryTimer = setTimeout(() => {
                ttsRecoveryTimer = null;
                if (!currentTtsItem || !isPlayingTts || ttsAudio.ended) return;
                recoverTtsPlayback(reason + ':retry');
            }, TTS_RECOVERY_DELAY_MS);
        }

        function recoverTtsPlayback(reason) {
            if (!currentTtsItem || !currentTtsItem.audioUrl || !isPlayingTts) return;
            if (reason !== 'start') ttsRecoveryAttempts++;
            ttsAudio.volume = 1;
            try {
                const playResult = ttsAudio.play();
                if (playResult && typeof playResult.catch === 'function') {
                    playResult.catch((error) => {
                        if (!currentTtsItem || !isPlayingTts) return;
                        if (ttsAudio.error) {
                            finishCurrentTts('error');
                            return;
                        }
                        console.warn('TTS 播放失败:', reason, error);
                        scheduleTtsRecovery(reason);
                    });
                }
            } catch (error) {
                console.warn('TTS 播放失败:', reason, error);
                scheduleTtsRecovery(reason);
            }
            if (ttsAudio.paused) scheduleTtsRecovery(reason);
        }

        function finishCurrentTts(status) {
            if (!currentTtsItem) return;
            clearTtsRecovery();
            const finishedItem = currentTtsItem;
            const playbackId = finishedItem.voiceTtsPlaybackId;
            currentTtsItem = null;
            ttsPlaybackToken++;
            hideTtsText();
            isPlayingTts = false;
            markTtsBatchItemFinished(finishedItem);
            sendVoiceTtsPlaybackFinished(playbackId);
            console.log('[显示端] TTS 当前句完成:', status || 'ended');
            playNextTts();
            endTtsVideoCoordinationIfIdle();
            scheduleTtsRecordingResume();
        }

        function stopTtsPlayback() {
            clearTtsRecovery();
            const playbackIds = [
                currentTtsItem?.voiceTtsPlaybackId,
                ...ttsQueue.map((item) => item.voiceTtsPlaybackId)
            ].filter(Boolean);
            currentTtsItem = null;
            ttsPlaybackToken++;
            ttsQueue = [];
            ttsBatchPlaybackStates.clear();
            ttsAudio.pause();
            ttsAudio.currentTime = 0;
            isPlayingTts = false;
            hideTtsText();
            playbackIds.forEach((playbackId) => sendVoiceTtsPlaybackFinished(playbackId));
            endTtsVideoCoordinationIfIdle();
            scheduleTtsRecordingResume();
        }

        function startTtsAudio(item, audioUrl) {
            if (currentTtsItem !== item || !isPlayingTts) return;
            item.audioUrl = audioUrl;
            ttsAudio.src = audioUrl;
            recoverTtsPlayback('start');
        }

        function isCurrentTtsAudioSource() {
            if (!currentTtsItem || !currentTtsItem.audioUrl) return false;
            const elementSource = ttsAudio.getAttribute && ttsAudio.getAttribute('src');
            if (elementSource === currentTtsItem.audioUrl) return true;
            try {
                return new URL(currentTtsItem.audioUrl, window.location.href).href === ttsAudio.currentSrc;
            } catch (error) {
                return false;
            }
        }
        
        function playNextTts() {
            console.log('[显示端] playNextTts: isPlayingTts=', isPlayingTts, 'queue=', ttsQueue.length);
            if (isPlayingTts) {
                return;
            }
            if (ttsQueue.length === 0) {
                // 分句生成之间队列可能短暂为空；批次未收到结束句或仍有句子未播完时不能结束会话。
                if (!isVoiceTtsBatchPlaybackComplete()) return;
                clearCompletedTtsBatches();
                // TTS 队列播放完毕，如果此前由无声纹模式暂停了录音，恢复原有采集链路。
                scheduleTtsRecordingResume();
                sendVoiceConversationTtsFinished();
                return;
            }
            
            pauseVoiceRecordingForTts();
            isPlayingTts = true;
            const item = ttsQueue.shift();
            currentTtsItem = item;
            item.playbackToken = ++ttsPlaybackToken;
            beginTtsVideoCoordination();
            
            console.log('[显示端] 播放TTS:', item.audioUrl || item.text);
            
            if (item.text) {
                showTtsText(item.text);
            }
            
            if (item.audioUrl) {
                startTtsAudio(item, item.audioUrl);
            } else if (item.text) {
                fetch('/api/tts/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: item.text })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') startTtsAudio(item, data.audioUrl);
                    else finishCurrentTts('generate-error');
                })
                .catch(err => {
                    console.error('TTS生成失败:', err);
                    finishCurrentTts('generate-error');
                });
            } else {
                finishCurrentTts('empty');
            }
        }
        
        function queueTts(item) {
            registerTtsBatchItem(item);
            ttsQueue.push(item);
            playNextTts();
        }
        
        ttsAudio.addEventListener('ended', () => {
            if (!isCurrentTtsAudioSource()) return;
            finishCurrentTts('ended');
        });
        
        ttsAudio.addEventListener('error', () => {
            if (!isCurrentTtsAudioSource()) return;
            finishCurrentTts('error');
        });

        ttsAudio.addEventListener('play', () => {
            ttsRecoveryAttempts = 0;
        });

        ['pause', 'stalled', 'waiting'].forEach((eventName) => {
            ttsAudio.addEventListener(eventName, () => {
                if (!currentTtsItem || !isPlayingTts || ttsAudio.ended) return;
                scheduleTtsRecovery('audio-' + eventName);
            });
        });

        function showTtsText(text) {
            if (voiceTextDisplay && text) {
                voiceTextDisplay.textContent = text;
                voiceTextDisplay.className = 'voice-text-visible';
            }
        }
        
        function hideTtsText() {
            if (voiceTextDisplay) {
                voiceTextDisplay.className = 'voice-text-hidden';
            }
        }
        
        function handleTTS(data) {
            console.log('[显示端] 收到TTS消息:', data.action, data.audioUrl || data.text);
            if (data.textPlaybackRemote) {
                handleRemoteTextPlayback(data);
                return;
            }
            if (data.textPlayback) {
                TextMediaPlayer.handleTtsAudio(data);
                return;
            }
            if (data.action === 'play') {
                queueTts({
                    text: data.text,
                    voiceTtsPlaybackId: data.voiceTtsPlaybackId,
                    voiceTtsBatchId: data.voiceTtsBatchId,
                    voiceTtsBatchEnd: data.voiceTtsBatchEnd === true
                });
            } else if (data.action === 'playAudio') {
                queueTts({
                    audioUrl: data.audioUrl,
                    text: data.text,
                    voiceTtsPlaybackId: data.voiceTtsPlaybackId,
                    voiceTtsBatchId: data.voiceTtsBatchId,
                    voiceTtsBatchEnd: data.voiceTtsBatchEnd === true
                });
            } else if (data.action === 'stop') {
                stopTtsPlayback();
                clearRemoteTextPlayback();
            } else if (data.action === 'setAutoTts') {
                autoTtsEnabled = data.enabled;
            }
        }

        // 显示端 TTS 生成回包：base64 WAV 或错误信息
        function sendTtsResult(requestId, payload) {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            displayWs.send(JSON.stringify(Object.assign({
                type: 'ttsResult',
                requestId: requestId
            }, payload)));
        }

        // 服务端要求先收到开始生成回执；该回执只表示任务已被 APK 接受，不代表音频已完成。
        function sendTtsGenerating(requestId) {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            displayWs.send(JSON.stringify({
                type: 'ttsGenerating',
                requestId: requestId
            }));
        }

        // 新版 APK 原生 TTS 完成回调；生成完成后只回传 WAV，不在此处直接播放。
        window.onNativeTtsResult = function(payload) {
            if (!payload || !payload.requestId) return;
            if (payload.audio) {
                sendTtsResult(payload.requestId, { audioData: payload.audio });
            } else {
                sendTtsResult(payload.requestId, { error: payload.error || '语音合成失败' });
            }
        };

        // 服务端 tts.device='display' 时下发离线合成请求；模型未就绪先触下载并快速回错由服务端回退
        function handleTtsGenerate(data) {
            if (!nativeTtsAvailable) {
                sendTtsResult(data.requestId, { error: '原生 TTS 不可用' });
                return;
            }
            if (!nativeTtsReady) {
                if (localTtsEnabled) {
                    ensureNativeTtsModel();
                }
                sendTtsResult(data.requestId, { error: '模型下载中' });
                return;
            }
            if (typeof nativeBridge.ttsSynthesizeAsync === 'function') {
                try {
                    const accepted = JSON.parse(nativeBridge.ttsSynthesizeAsync(data.requestId, data.text || ''));
                    if (!accepted.accepted) {
                        sendTtsResult(data.requestId, { error: accepted.error || '语音合成任务提交失败' });
                    } else {
                        sendTtsGenerating(data.requestId);
                    }
                } catch (e) {
                    sendTtsResult(data.requestId, { error: e.message || '语音合成任务提交异常' });
                }
                return;
            }

            // 旧 APK 没有异步桥方法时保留同步回退，避免服务器页面升级后旧包完全失去 TTS。
            sendTtsGenerating(data.requestId);
            try {
                const res = JSON.parse(nativeBridge.ttsSynthesize(data.text || ''));
                if (res && res.audio) {
                    sendTtsResult(data.requestId, { audioData: res.audio });
                } else {
                    sendTtsResult(data.requestId, { error: (res && res.error) || '语音合成失败' });
                }
            } catch (e) {
                sendTtsResult(data.requestId, { error: e.message || '语音合成异常' });
            }
        }

        function sendTextSentenceTtsFinished(data, status) {
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            displayWs.send(JSON.stringify({
                type: 'textSentenceTtsFinished',
                originDisplayId: data.originDisplayId,
                voiceTargetDisplayId: data.voiceTargetDisplayId,
                playbackId: data.playbackId,
                pageIndex: data.pageIndex,
                sentenceIndex: data.sentenceIndex,
                status
            }));
        }

        function isSameRemoteTextPlayback(left, right) {
            return !!left && !!right
                && left.originDisplayId === right.originDisplayId
                && left.voiceTargetDisplayId === right.voiceTargetDisplayId
                && left.playbackId === right.playbackId;
        }

        function isSameRemoteSentence(left, right) {
            return isSameRemoteTextPlayback(left, right)
                && Number(left.pageIndex) === Number(right.pageIndex)
                && Number(left.sentenceIndex) === Number(right.sentenceIndex);
        }

        function isNextRemoteTextPlayback(finished, candidate) {
            return isSameRemoteTextPlayback(finished, candidate)
                && Number(candidate.pageIndex) === Number(finished.pageIndex)
                && Number(candidate.sentenceIndex) === Number(finished.sentenceIndex) + 1;
        }

        function hasRemoteTextPlaybackContext(data) {
            return isSameRemoteTextPlayback(remoteTextPlayback, data)
                || isSameRemoteTextPlayback(remotePrefetchedTextPlayback, data);
        }

        function clearRemoteTextPlayback(data) {
            if (data && !hasRemoteTextPlaybackContext(data)) return false;
            remoteTextPlaybackToken += 1;
            remoteTextPlayback = null;
            remotePrefetchedTextPlayback = null;
            return true;
        }

        function stopRemoteTextAudio(data) {
            const playbackId = remoteTextPlayback?.voiceTtsPlaybackId;
            if (!clearRemoteTextPlayback(data)) return;
            ttsAudio.pause();
            ttsAudio.currentTime = 0;
            isPlayingTts = false;
            sendVoiceTtsPlaybackFinished(playbackId);
            endTtsVideoCoordinationIfIdle();
            scheduleTtsRecordingResume();
        }

        function playRemoteTextPlayback(data) {
            const audio = ttsAudio;
            if (!audio || !data.audioUrl) {
                sendTextSentenceTtsFinished(data, 'failed');
                return;
            }
            remoteTextPlaybackToken += 1;
            const playbackToken = remoteTextPlaybackToken;
            remoteTextPlayback = data;
            pauseVoiceRecordingForTts();
            beginTtsVideoCoordination();
            // 远程文本播报只负责发声，不改变本机文本分页状态；结束/失败后由源显示端推进句子。
            const cleanup = () => {
                audio.removeEventListener('ended', onEnded);
                audio.removeEventListener('error', onError);
            };
            const finishRemoteSentence = (status) => {
                cleanup();
                if (playbackToken !== remoteTextPlaybackToken) return;
                const finishedData = remoteTextPlayback;
                if (finishedData) sendTextSentenceTtsFinished(finishedData, status);
                if (remotePrefetchedTextPlayback && isNextRemoteTextPlayback(finishedData, remotePrefetchedTextPlayback)) {
                    const cached = remotePrefetchedTextPlayback;
                    remotePrefetchedTextPlayback = null;
                    playRemoteTextPlayback(cached);
                    return;
                }
                remoteTextPlayback = null;
                sendVoiceTtsPlaybackFinished(finishedData?.voiceTtsPlaybackId);
                endTtsVideoCoordinationIfIdle();
                scheduleTtsRecordingResume();
            };
            const onEnded = () => finishRemoteSentence('ended');
            const onError = () => finishRemoteSentence('failed');
            audio.addEventListener('ended', onEnded, { once: true });
            audio.addEventListener('error', onError, { once: true });
            audio.src = data.audioUrl;
            audio.volume = 1;
            audio.play().catch((error) => {
                console.warn('远程文本 TTS 播放失败', error);
                onError();
            });
        }

        function handleRemoteTextPlayback(data) {
            if (data.action === 'stop') {
                stopRemoteTextAudio(data);
                return;
            }
            if ((remoteTextPlayback && !isSameRemoteTextPlayback(remoteTextPlayback, data))
                || (remotePrefetchedTextPlayback && !isSameRemoteTextPlayback(remotePrefetchedTextPlayback, data))) {
                stopRemoteTextAudio();
            }
            if (data.prefetch) {
                if (remotePrefetchedTextPlayback && isSameRemoteSentence(remotePrefetchedTextPlayback, data)) return;
                remotePrefetchedTextPlayback = data;
                return;
            }
            if (!isSameRemoteTextPlayback(remoteTextPlayback, data)) {
                remotePrefetchedTextPlayback = null;
            }
            playRemoteTextPlayback(data);
        }
        
        function handleReminder(data) {
            if (data.action === 'popup') {
                showReminderPopup(data.time, data.content);
            } else if (data.action === 'voice') {
                queueTts({ audioUrl: data.audioUrl, text: data.text });
            }
        }
        
        function handleVoiceCommand(data) {
            if (data.action === 'confirm') {
                showVoiceConfirmPopup(data.confirmationId, data.text, data.audioUrl);
            } else if (data.action === 'conversationConfirm') {
                voiceConversationConfirmationExpiresAt = Number.isFinite(Number(data.expiresAt))
                    ? Number(data.expiresAt)
                    : null;
                showVoiceConversationConfirmationPopup(data.detailText || data.text, data.confirmationId);
                startVoiceConversationConfirmationCountdown();
            } else if (data.action === 'conversationConfirmWindow') {
                voiceConversationConfirmationExpiresAt = Number(data.expiresAt);
                startVoiceConversationConfirmationCountdown();
            } else if (data.action === 'conversationConfirmClear') {
                clearVoiceConversationConfirmation(data.confirmationId);
            } else if (data.action === 'response') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                const detailText = data.detailText || data.text;
                showVoiceResponsePopup(detailText, calculateWeatherPopupDuration(detailText));
            } else if (data.action === 'searchResult') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showSearchResultPopup(data.query, data.results);
            } else if (data.action === 'weatherResult') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                const detailText = data.detailText || data.text;
                showVoiceResponsePopup(detailText, calculateWeatherPopupDuration(detailText));
            } else if (data.action === 'playChoices') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showPlayChoicesPopup(data.confirmationId, data.matches, data.text);
            }
        }
        
        function showVoiceConfirmPopup(confirmationId, text, audioUrl) {
            const existing = document.querySelector('.voice-confirm-popup');
            if (existing) {
                existing.remove();
            }
            
            if (audioUrl) {
                queueTts({ audioUrl: audioUrl, text: text });
            }
            
            const popup = document.createElement('div');
            popup.className = 'voice-confirm-popup';
            popup.innerHTML = `
                <div class="voice-confirm-content">${text}</div>
                <div class="voice-confirm-hint">请说确认或取消</div>
            `;
            appendRotationPopup(popup);
            
            setTimeout(() => {
                if (popup.parentElement) {
                    popup.remove();
                }
            }, 30000);
        }

        function showVoiceConversationConfirmationPopup(text, confirmationId) {
            showVoiceResponsePopup(
                text,
                Math.max(30000, calculateWeatherPopupDuration(text)),
                { conversationConfirmationId: confirmationId }
            );
        }
        
        // 天气详情需要覆盖足够长的阅读时间；空白不计入字数，每 3 个可见字符保留 1 秒，最长 90 秒。
        function calculateWeatherPopupDuration(text) {
            const visibleTextLength = Array.from(String(text || '').replace(/\s/gu, '')).length;
            return Math.min(90000, Math.max(5000, Math.ceil(visibleTextLength / 3) * 1000));
        }

        function showVoiceResponsePopup(text, durationMs = 5000, options = {}) {
            const existing = document.querySelector('.voice-response-popup');
            if (existing) {
                existing.remove();
            }
            
            const popup = document.createElement('div');
            popup.className = 'voice-response-popup';
            if (options.conversationConfirmationId) {
                popup.dataset.conversationConfirmationId = options.conversationConfirmationId;
            }
            // 详情文本可能来自 LLM，必须复用安全 Markdown 渲染器，禁止把原始 HTML 直接插入页面。
            popup.innerHTML = `<div class="voice-response-content">${ChatMarkdown.render(text)}</div>`;
            appendRotationPopup(popup);
            
            setTimeout(() => {
                if (popup.parentElement) {
                    popup.remove();
                }
            }, durationMs);
            return popup;
        }
        
        function showSearchResultPopup(query, results) {
            const existing = document.querySelector('.search-result-popup');
            if (existing) {
                existing.remove();
            }
            
            const resultList = Array.isArray(results) ? results : (results ? [results] : []);
            const escapeSearchText = (text) => String(text || '').replace(/[&<>"']/gu, (char) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
            let contentHtml = '';
            if (resultList.length > 0) {
                contentHtml = resultList.map((result, index) => {
                    if (result.type === 'ai_answer') {
                        return `<div class="search-result-item"><div class="search-result-title">${index + 1}. AI 回答</div><div class="search-ai-answer">${escapeSearchText(result.content)}</div></div>`;
                    }
                    if (result.type === 'first_result') {
                        return `<div class="search-result-item"><div class="search-result-title">${index + 1}. ${escapeSearchText(result.title)}</div><div class="search-result-snippet">${escapeSearchText(result.snippet)}</div></div>`;
                    }
                    return `<div class="search-result-item"><div class="search-result-snippet">${index + 1}. ${escapeSearchText(result.message || '没有找到结果')}</div></div>`;
                }).join('');
            } else {
                contentHtml = '<div class="search-no-result">没有找到结果</div>';
            }
            
            const popup = document.createElement('div');
            popup.className = 'search-result-popup';
            popup.innerHTML = `
                <div class="search-result-query">搜索: ${query}</div>
                <div class="search-result-body">${contentHtml}</div>
            `;
            appendRotationPopup(popup);
            
            setTimeout(() => {
                if (popup.parentElement) {
                    popup.remove();
                }
            }, 10000);
        }
        
        function showPlayChoicesPopup(confirmationId, matches, text) {
            const existing = document.querySelector('.play-choices-popup');
            if (existing) {
                existing.remove();
            }
            
            let listHtml = '';
            if (matches && matches.length > 0) {
                listHtml = matches.map((item, index) => 
                    `<div class="play-choice-item">${index + 1}. ${item.name}</div>`
                ).join('');
            }
            
            const popup = document.createElement('div');
            popup.className = 'play-choices-popup';
            popup.innerHTML = `
                <div class="play-choices-text">${text}</div>
                <div class="play-choices-list">${listHtml}</div>
            `;
            appendRotationPopup(popup);
            
            setTimeout(() => {
                if (popup.parentElement) {
                    popup.remove();
                }
            }, 30000);
        }
        
        function showReminderPopup(time, content) {
            const existing = document.querySelector('.reminder-popup');
            if (existing) {
                existing.remove();
            }
            
            const popup = document.createElement('div');
            popup.className = 'reminder-popup';
            popup.innerHTML = `
                <span class="close-btn" onclick="this.parentElement.remove()">×</span>
                <div class="time">${time}</div>
                <div class="content">${content}</div>
            `;
            appendRotationPopup(popup);
            
            setTimeout(() => {
                if (popup.parentElement) {
                    popup.style.animation = 'popupPulse 0.3s ease reverse';
                    setTimeout(() => popup.remove(), 300);
                }
            }, 10000);
        }
        
        function handleRestoreState(state) {
            if (!state) return;

            if (state.dynamicFitConfig !== undefined) {
                dynamicFitConfig = normalizeDynamicFitConfig(state.dynamicFitConfig);
            }
            
            if (state.rotation !== undefined) {
                currentRotation = state.rotation;
                applyRotation();
            }
            
            if (state.fit !== undefined) {
                applyFit(state.fit);
            }
            
            if (state.crop !== undefined) {
                currentCrop = state.crop;
                applyCrop();
            }
            
            if (state.volume !== undefined) {
                mediaVideo.volume = state.volume / 100;
            }
            
            if (state.textStyle) {
                TextMediaPlayer.applyStyle(state.textStyle);
            }

            if (state.currentMedia) {
                // 恢复 html 滚动模式（服务器持久化，刷新/重启后沿用）
                if (state.currentHtmlScroll) {
                    currentHtmlScroll = state.currentHtmlScroll;
                }
                if (state.currentMedia.mediaType === 'text') {
                    // 文本播放使用专用进度；旧持久化状态才回退到通用媒体进度。
                    const textProgress = state.currentTextProgress || state.currentMediaProgress;
                    if (textProgress) state.currentMedia.textProgress = textProgress;
                }
                showMedia(
                    state.currentMedia,
                    true,
                    state.isPlaying === false,
                    state.currentMediaProgress ? state.currentMediaProgress.currentTime : 0
                );  // 恢复不激活；暂停状态保持暂停，并跳回上次播放位置
            }

            if (state.sleep !== undefined) {
                // 容错：state.sleep 可能为 null/非对象（服务端持久化异常），按空值降级，避免 TypeError
                const s = state.sleep || {};
                sleepSettings = {
                    // 默认开启：持久化数据缺 enabled 字段（旧数据/从未配置过）时按开启处理
                    enabled: s.enabled === undefined ? true : !!s.enabled,
                    startHour: clampHour(s.startHour),
                    endHour: clampHour(s.endHour),
                    deepStartHour: clampHour(s.deepStartHour),
                    deepEndHour: clampHour(s.deepEndHour)
                };
                checkSleepMode();
            }

            if (state.autoTts !== undefined) {
                // 自动播报开关持久化：显示端刷新/重启后恢复控制端设置（默认开，旧数据无字段则保持默认）
                autoTtsEnabled = !!state.autoTts;
            }
        }
        
        function extractFileName(url) {
            try {
                const urlParts = url.split('/');
                let fileName = urlParts[urlParts.length - 1].split('?')[0];
                fileName = decodeURIComponent(fileName);
                const dotIndex = fileName.lastIndexOf('.');
                if (dotIndex > 0) {
                    fileName = fileName.substring(0, dotIndex);
                }
                return fileName;
            } catch (e) {
                return '';
            }
        }
        
        <!-- 批量播放模式：本地自循环播放列表 -->
        let playlistState = null;
        let savedAutoTts = null;

        function stopPlaylist() {
            if (!playlistState) return;
            playlistState.active = false;
            // 先解绑列表上下文再停止，过期 TTS 回包不会再推进已经停止的列表。
            TextMediaPlayer.attachPlaylist(null);
            TextMediaPlayer.stop();
            pauseExpected = true;
            stopHtmlScroll();
            if (playlistState.timer) {
                clearTimeout(playlistState.timer);
                playlistState.timer = null;
            }
            if (playlistState.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', playlistState.videoEndedHandler);
                playlistState.videoEndedHandler = null;
            }
            if (playlistState.audioEndedHandler) {
                mediaAudio.removeEventListener('ended', playlistState.audioEndedHandler);
                playlistState.audioEndedHandler = null;
            }
            if (savedAutoTts !== null) {
                autoTtsEnabled = savedAutoTts;
                savedAutoTts = null;
            }
            playlistState = null;
        }

        function sendPlaylistProgress(state) {
            if (!playlistState || !displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            const ps = playlistState;
            const item = ps.playlist[ps.index];
            let width, height;
            let currentTime = 0;
            let duration = 0;
            const textProgress = item && item.mediaType === 'text' ? TextMediaPlayer.getProgress() : null;
            if (item) {
                // 回传实际播放尺寸（临时模式控制端无数据，依赖此尺寸做裁剪预览）
                if (item.mediaType === 'video') {
                    width = mediaVideo.videoWidth || undefined;
                    height = mediaVideo.videoHeight || undefined;
                    currentTime = Number.isFinite(mediaVideo.currentTime) ? mediaVideo.currentTime : 0;
                    duration = Number.isFinite(mediaVideo.duration) ? mediaVideo.duration : 0;
                } else {
                    width = mediaImage.naturalWidth || undefined;
                    height = mediaImage.naturalHeight || undefined;
                    if (item.mediaType === 'audio') {
                        currentTime = Number.isFinite(mediaAudio.currentTime) ? mediaAudio.currentTime : 0;
                        duration = Number.isFinite(mediaAudio.duration) ? mediaAudio.duration : 0;
                    }
                }
            }
            // 重连恢复的媒体在 loadedmetadata 前 currentTime 仍可能是 0，先用待恢复值回传一次。
            if (currentTime === 0 && Number.isFinite(ps.resumeTime) && ps.resumeTime > 0) {
                currentTime = ps.resumeTime;
            }
            displayWs.send(JSON.stringify({
                type: 'playlistProgress',
                listId: ps.listId,
                index: ps.index,
                total: ps.playlist.length,
                state: state,
                fileName: item ? item.fileName : '',
                url: item ? item.url : undefined,
                mediaType: item ? item.mediaType : undefined,
                width: width,
                height: height,
                currentTime: currentTime,
                duration: duration,
                pageIndex: textProgress ? textProgress.pageIndex : undefined,
                pageTotal: textProgress ? textProgress.pageTotal : undefined,
                sentenceIndex: textProgress ? textProgress.sentenceIndex : undefined,
                sentenceTotal: textProgress ? textProgress.sentenceTotal : undefined,
                format: textProgress ? textProgress.format : item && item.format
            }));
        }

        function handlePlaylistStart(data) {
            stopPlaylist();
            savedAutoTts = autoTtsEnabled;
            autoTtsEnabled = !!data.announceName;
            const playlist = data.playlist || [];
            if (playlist.length === 0) {
                stopPlaylist();
                return;
            }
            const resumeIndex = Math.max(Math.min(Number.isFinite(data.resumeIndex) ? data.resumeIndex : 0, playlist.length - 1), 0);
            const resumeTime = Number.isFinite(data.resumeTime) && data.resumeTime > 0 ? data.resumeTime : 0;
            playlistState = {
                listId: data.listId,
                playlist: playlist,
                interval: (data.interval || 0) * 1000,
                loop: !!data.loop,
                index: resumeIndex,
                timer: null,
                videoEndedHandler: null,
                audioEndedHandler: null,
                active: true,
                paused: data.resumeState === 'paused',
                resumeTime: resumeTime,
                resumeTextPage: Number.isFinite(data.resumeTextPage) ? data.resumeTextPage : 0,
                selectedDisplayIds: data.selectedDisplayIds || [],
                selectedVoiceDisplayIds: data.selectedVoiceDisplayIds || [],
                voiceTargetDisplayId: data.voiceTargetDisplayId || null,
                voiceRouteByDisplayId: data.voiceRouteByDisplayId || null
            };
            playCurrentItem({ allowPausedLoad: true, resumeTime: resumeTime });
        }

        function getPlaylistTextRoute(ps) {
            if (!ps) return null;
            const routeByDisplay = ps.voiceRouteByDisplayId || {};
            const currentDisplayId = typeof displayId === 'string' ? displayId : null;
            const route = currentDisplayId ? routeByDisplay[currentDisplayId] || null : null;
            if (route) return route;
            if (!ps.selectedDisplayIds.length && !ps.selectedVoiceDisplayIds.length && !ps.voiceTargetDisplayId) return null;
            return {
                selectedDisplayIds: ps.selectedDisplayIds,
                selectedVoiceDisplayIds: ps.selectedVoiceDisplayIds,
                voiceTargetDisplayId: ps.voiceTargetDisplayId
            };
        }

        function playCurrentItem(options = {}) {
            if (!playlistState || !playlistState.active) return;
            if (playlistState.paused && !options.allowPausedLoad) return;
            if (isSleepPaused() && !(playlistState.paused && options.allowPausedLoad)) {
                return;  // 睡眠/深度睡眠中不自动切播；暂停重连仍允许加载当前项，唤醒后可继续
            }
            const ps = playlistState;
            const item = ps.playlist[ps.index];
            if (!item) {
                finishPlaylist();
                return;
            }
            // 清除上一项残留的定时器/ended 监听/加载失败回调，
            // 防止切换时重复触发 next 跳过媒体项
            if (ps.timer) {
                clearTimeout(ps.timer);
                ps.timer = null;
            }
            if (ps.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                ps.videoEndedHandler = null;
            }
            if (ps.audioEndedHandler) {
                mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                ps.audioEndedHandler = null;
            }
            mediaVideo.onerror = null;
            mediaAudio.onerror = null;
            mediaImage.onerror = null;
            // 每次切项均取消旧文本句子的播放标识，避免旧回包覆盖新媒体。
            TextMediaPlayer.attachPlaylist(null);
            TextMediaPlayer.stop();
            const mediaData = item.url
                ? { type: 'url', url: item.url, fileName: item.fileName, mediaType: item.mediaType, ...(item.mediaType === 'text' ? { format: item.format, route: getPlaylistTextRoute(ps) } : {}) }
                : { type: 'base64', data: item.data, fileName: item.fileName, mediaType: item.mediaType, mimeType: item.mimeType, ...(item.mediaType === 'text' ? { format: item.format, route: getPlaylistTextRoute(ps) } : {}) };
            const resumeTime = Number.isFinite(options.resumeTime) ? options.resumeTime : ps.resumeTime;
            if (item.mediaType === 'text') {
                currentMediaType = 'text';
                mediaImage.style.display = 'none';
                mediaVideo.style.display = 'none';
                mediaAudio.style.display = 'none';
                mediaHtml.style.display = 'none';
