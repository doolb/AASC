<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>媒体显示端</title>
    <link rel="stylesheet" href="css/display.css">
</head>
<body>
    <div id="connectionStatus" class="connecting">连接中...</div>
    <div id="timeDisplay"></div>
    <div id="fileNameDisplay"></div>
    <div id="voiceStatus" class="voice-status-hidden">语音</div>
    <div id="voiceTextDisplay" class="voice-text-hidden"></div>
    <div id="taskStatusDisplay" class="task-status-hidden">
        <div class="task-status-title">模型推理中</div>
        <div class="task-status-model" id="taskStatusModel"></div>
        <div class="task-status-progress" id="taskStatusProgress"><span></span></div>
        <div class="task-status-metrics" id="taskStatusMetrics"></div>
    </div>
    <div class="monitor-wrapper" id="monitorWrapper">
        <div class="monitor-label">AUDIO_FREQ // MONITOR</div>
        <canvas id="mini-monitor" width="160" height="50"></canvas>
    </div>
    
    <div id="mediaContainer">
        <div id="waitingMessage">
            <h2>等待媒体...</h2>
            <p>请在上传端选择图片或视频</p>
        </div>
        <img id="mediaImage">
        <video id="mediaVideo" autoplay loop playsinline></video>
        <audio id="mediaAudio" preload="auto" style="display:none;"></audio>
        <iframe id="mediaHtml" style="display:none;"></iframe>
        <div id="mediaSleepOverlay" class="sleep-overlay sleep-overlay-media"></div>
    </div>
    
    <audio id="ttsAudio" style="display:none;"></audio>
    <div id="uiSleepOverlay" class="sleep-overlay sleep-overlay-ui"></div>
    <script src="js/html-to-image.min.js"></script>
    <script src="js/control-mode-utils.js"></script>
    <script src="js/sherpa-asr.js"></script>
    <script src="/js/lib/ort.min.js"></script>
    <script src="js/native-compute.js"></script>
    <script>
        const connectionStatus = document.getElementById('connectionStatus');
        const timeDisplay = document.getElementById('timeDisplay');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceTextDisplay = document.getElementById('voiceTextDisplay');
        const monitorWrapper = document.getElementById('monitorWrapper');
        const waitingMessage = document.getElementById('waitingMessage');
        const mediaImage = document.getElementById('mediaImage');
        const mediaVideo = document.getElementById('mediaVideo');
        const mediaAudio = document.getElementById('mediaAudio');
        const mediaHtml = document.getElementById('mediaHtml');
        const ttsAudio = document.getElementById('ttsAudio');
        const taskStatusDisplay = document.getElementById('taskStatusDisplay');
        const taskStatusModel = document.getElementById('taskStatusModel');
        const taskStatusProgress = document.getElementById('taskStatusProgress');
        const taskStatusMetrics = document.getElementById('taskStatusMetrics');
        
        let currentRotation = 0;
        window.currentRotation = 0;
        let currentFit = 'contain';
        let currentCrop = { x: 0, y: 0, width: 100, height: 100 };
        let currentMediaType = 'image';
        let displayWs = null;
        let autoTtsEnabled = true;
        let ttsQueue = [];
        let isPlayingTts = false;
        let voiceSupported = false;
        let isListening = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let micStream = null;
        let audioContext = null;
        let analyser = null;
        let silenceStartTime = null;
        let hasSpeech = false;
        let speechStartTime = null;
        let speechChunks = [];
        let collectingSpeech = false;
        let isAlwaysListening = false;
        let pendingAutoStart = false;
        let wasListeningBeforePlayback = false;
        let noInterruptMode = true;
        let audioQueue = [];
        let isPlayingAudio = false;
        let currentAudio = null;
        let isLLMGenerating = false;
        let consecutiveIgnoreCount = 0;
        let voiceCooldownUntil = 0;
        const MAX_CONSECUTIVE_IGNORES = 3;
        const VOICE_COOLDOWN_MS = 10000;
        let localAsrAvailable = false;
        // APK 原生 ASR 引擎（sherpa-onnx AAR）：检测到桥方法即认为可用，不再加载 WASM
        const nativeAsrAvailable = !!(window.NativeDisplay && window.NativeDisplay.asrStatus);
        let nativeAsrReady = false;
        // APK 原生声纹引擎：检测到桥方法即认为可用
        const nativeVoiceprintAvailable = !!(window.NativeDisplay && window.NativeDisplay.voiceprintMatch);
        let voiceprintEnabled = false;
        let voiceprintReady = false;
        let voiceprintMultiSpeaker = true;

        // 声纹模型下载/引擎加载事件（NativeBridge voiceprintConfigure 触发）
        window.onVoiceprintModel = function(payload) {
            if (!payload) return;
            if (payload.state === 'ready' && payload.engineReady) {
                voiceprintReady = true;
                updateVoiceTextDisplay('声纹引擎已就绪', true);
                setTimeout(() => updateVoiceTextDisplay('', true), 2000);
            } else if (payload.state === 'error') {
                voiceprintReady = false;
                updateVoiceTextDisplay('声纹模型下载失败: ' + (payload.error || '未知错误'), true);
                setTimeout(() => updateVoiceTextDisplay('', true), 4000);
            }
        };

        // 声纹库同步结果（NativeBridge voiceprintSyncDb 触发）
        window.onVoiceprintDb = function(payload) {
            if (!payload) return;
            if (payload.state === 'ready') {
                voiceprintReady = true;
                const n = (payload.speakers || []).length;
                console.log('[声纹] 声纹库已同步', n, '人');
            } else if (payload.state === 'error') {
                voiceprintReady = false;
                console.warn('[声纹] 声纹库同步失败:', payload.error);
            }
        };
        let localAsrStreaming = false;
        // 原生 ASR 模型下载/加载事件（由 NativeBridge evaluateJavascript 触发）
        window.onNativeAsrModel = function(payload) {
            if (!payload) return;
            if (payload.state === 'downloading') {
                showNativeAsrDownloadProgress(payload.progress);
            } else if (payload.state === 'ready') {
                nativeAsrReady = true;
                updateVoiceTextDisplay('语音识别已就绪', true);
                setTimeout(() => updateVoiceTextDisplay('', true), 2000);
                // 模型就绪后重新上报能力，让服务器 findDisplayWithAsr 能选中本机
                if (displayWs && displayWs.readyState === WebSocket.OPEN && currentCapabilities) {
                    currentCapabilities.voiceRecognition = true;
                    displayWs.send(JSON.stringify({ type: 'capabilities', capabilities: currentCapabilities }));
                }
            } else if (payload.state === 'error') {
                nativeAsrReady = false;
                updateVoiceTextDisplay('语音模型下载失败: ' + (payload.error || '未知错误'), true);
                setTimeout(() => updateVoiceTextDisplay('', true), 4000);
            }
        };

        // 统一显示原生 ASR 下载进度；回调或状态查询缺少进度时也明确显示 0%，避免用户误以为下载未启动。
        function showNativeAsrDownloadProgress(progress) {
            const numericProgress = Number(progress);
            const safeProgress = Number.isFinite(numericProgress)
                ? Math.max(0, Math.min(100, Math.floor(numericProgress)))
                : 0;
            updateVoiceTextDisplay('语音模型下载中 ' + safeProgress + '%', false);
        }
        let logReportConfig = null;
        let _originalConsole = null;
        
        let monitorTime = 0;
        let monitorAnalyser = null;
        let monitorDataArray = null;
        
        const monitorCanvas = document.getElementById('mini-monitor');
        const monitorCtx = monitorCanvas.getContext('2d');
        
        function drawMonitor(data) {
            monitorCtx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
            monitorCtx.fillStyle = '#00f2ff';
            
            const barWidth = 3;
            const gap = 1;
            const step = Math.floor(data.length / (monitorCanvas.width / (barWidth + gap)));

            for (let i = 0; i < monitorCanvas.width; i += (barWidth + gap)) {
                const dataIndex = Math.floor(i / (barWidth + gap)) * step;
                const value = data[dataIndex] || 0;
                const percent = value / 255;
                const barHeight = percent * monitorCanvas.height;

                monitorCtx.globalAlpha = 0.5 + (percent * 0.5);
                monitorCtx.fillRect(i, monitorCanvas.height - barHeight, barWidth, barHeight);
            }
        }
        
        function drawIdleMonitor(t) {
            monitorCtx.clearRect(0, 0, monitorCanvas.width, monitorCanvas.height);
            monitorCtx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < monitorCanvas.width; i += 4) {
                const h = 5 + Math.sin(i * 0.1 + t * 5) * 3;
                monitorCtx.fillRect(i, monitorCanvas.height - h, 3, h);
            }
        }
        
        function animateMonitor() {
            requestAnimationFrame(animateMonitor);
            monitorTime += 0.005;

            if (isListening && analyser) {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                drawMonitor(data);
            } else {
                drawIdleMonitor(monitorTime);
            }
        }
        
        animateMonitor();
        
        function sendCanvasSize() {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'canvasSize',
                    width: window.innerWidth,
                    height: window.innerHeight
                }));
            }
        }
        
        // 存储最近收到的消息中的 correlationId，用于 commandAck 回传
        let _lastCorrelationId = null;
        function setCorrelationId(cid) { if (cid) _lastCorrelationId = cid; }

        function sendCommandAck(commandType, success, details, extraData) {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                const ack = {
                    type: 'commandAck',
                    commandType: commandType,
                    success: success,
                    details: details || '',
                    timestamp: Date.now()
                };
                if (_lastCorrelationId) {
                    ack.correlationId = _lastCorrelationId;
                    _lastCorrelationId = null; // 使用后清空，避免重复
                }
                if (extraData) {
                    ack.extraData = extraData;
                }
                displayWs.send(JSON.stringify(ack));
            }
        }
        
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            const uaLower = ua.toLowerCase();
            
            let browserName = '未知浏览器';
            let browserVersion = '未知';
            
            if (uaLower.includes('edg/')) {
                browserName = 'Microsoft Edge';
                browserVersion = ua.split('Edg/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('opr/') || uaLower.includes('opera')) {
                browserName = 'Opera';
                browserVersion = ua.split('OPR/')[1]?.split(' ')[0]?.split('.')[0] || 
                                ua.split('Opera')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('brave')) {
                browserName = 'Brave';
                browserVersion = ua.split('Chrome/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('samsungbrowser')) {
                browserName = 'Samsung Internet';
                browserVersion = ua.split('SamsungBrowser/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('ucbrowser') || uaLower.includes('ubrowser')) {
                browserName = 'UC Browser';
                browserVersion = ua.split('UCBrowser/')[1]?.split(' ')[0]?.split('.')[0] || 
                                ua.split('UBrowser/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('firefox')) {
                browserName = 'Firefox';
                browserVersion = ua.split('Firefox/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('safari') && !uaLower.includes('chrome')) {
                browserName = 'Safari';
                browserVersion = ua.split('Version/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            } else if (uaLower.includes('chrome')) {
                browserName = 'Google Chrome';
                browserVersion = ua.split('Chrome/')[1]?.split(' ')[0]?.split('.')[0] || '未知';
            }
            
            let os = '未知系统';
            if (ua.includes('Windows NT 10')) os = 'Windows 10/11';
            else if (ua.includes('Windows NT 6.3')) os = 'Windows 8.1';
            else if (ua.includes('Windows NT 6.2')) os = 'Windows 8';
            else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
            else if (ua.includes('Mac OS X')) {
                const match = ua.match(/Mac OS X (\d+[._]\d+)/);
                os = match ? `macOS ${match[1].replace('_', '.')}` : 'macOS';
            } else if (ua.includes('Android')) {
                const match = ua.match(/Android (\d+(\.\d+)?)/);
                os = match ? `Android ${match[1]}` : 'Android';
            } else if (ua.includes('iPhone OS') || ua.includes('iPad')) {
                const match = ua.match(/OS (\d+[._]\d+)/);
                os = match ? `iOS ${match[1].replace('_', '.')}` : 'iOS';
            } else if (ua.includes('Linux')) os = 'Linux';
            else if (ua.includes('CrOS')) os = 'Chrome OS';
            
            let deviceType = '桌面设备';
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                if (/iPad|Android/i.test(ua) || ua.includes('Tablet')) {
                    deviceType = '平板设备';
                } else {
                    deviceType = '移动设备';
                }
            }
            
            return {
                userAgent: ua,
                browserName: browserName,
                browserVersion: browserVersion,
                os: os,
                deviceType: deviceType,
                screenWidth: screen.width,
                screenHeight: screen.height,
                devicePixelRatio: window.devicePixelRatio
            };
        }
        
        function getFeatureSupport() {
            return [
                {
                    name: 'Web Speech API',
                    supported: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
                    note: '语音识别'
                },
                {
                    name: 'WebRTC',
                    supported: !!(window.RTCPeerConnection || window.webkitRTCPeerConnection),
                    note: '实时通信'
                },
                {
                    name: 'WebGL 1.0',
                    supported: (function() {
                        try {
                            const canvas = document.createElement('canvas');
                            return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
                        } catch(e) { return false; }
                    })(),
                    note: '基础3D图形'
                },
                {
                    name: 'WebGL 2.0',
                    supported: (function() {
                        try {
                            const canvas = document.createElement('canvas');
                            return !!canvas.getContext('webgl2');
                        } catch(e) { return false; }
                    })(),
                    note: '高级3D图形'
                },
                {
                    name: 'WebGPU',
                    supported: !!navigator.gpu,
                    note: 'GPU加速计算'
                },
                {
                    name: 'Service Worker',
                    supported: 'serviceWorker' in navigator,
                    note: '离线缓存'
                },
                {
                    name: 'WebAssembly',
                    supported: typeof WebAssembly === 'object',
                    note: '高性能计算'
                },
                {
                    name: 'Clipboard API',
                    supported: navigator.clipboard && typeof navigator.clipboard.writeText === 'function',
                    note: '剪贴板'
                },
                {
                    name: 'Geolocation',
                    supported: 'geolocation' in navigator,
                    note: '地理位置'
                },
                {
                    name: 'Web Workers',
                    supported: typeof Worker !== 'undefined',
                    note: '后台线程'
                },
                {
                    name: 'Fullscreen API',
                    supported: document.fullscreenEnabled || document.webkitFullscreenEnabled,
                    note: '全屏'
                },
                {
                    name: 'Screen Orientation',
                    supported: 'orientation' in screen,
                    note: '屏幕方向'
                }
            ];
        }
        
        function sendBrowserInfo() {
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({
                    type: 'browserInfo',
                    ...getBrowserInfo(),
                    featureSupport: getFeatureSupport()
                }));
            }
        }
        
        function applyRotation() {
            window.currentRotation = currentRotation;
            var rotTransform = 'rotate(' + currentRotation + 'deg)';
            mediaImage.style.transform = rotTransform;
            mediaVideo.style.transform = rotTransform;
            if (currentRotation === 90 || currentRotation === 270) {
                // 旋转 90/270：宽高互换；保持左上角定位（清除会让元素回到 flex 静态位置），
                // 先绕自身中心旋转，再平移至视口中心
                mediaHtml.style.width = '100vh';
                mediaHtml.style.height = '100vw';
                mediaHtml.style.top = '0';
                mediaHtml.style.left = '0';
                mediaHtml.style.transform = 'translate(50vw, 50vh) translate(-50%, -50%) rotate(' + currentRotation + 'deg)';
            } else {
                mediaHtml.style.width = '100%';
                mediaHtml.style.height = '100%';
                mediaHtml.style.top = '0';
                mediaHtml.style.left = '0';
                mediaHtml.style.transform = rotTransform;
            }

            // 立即更新所有活跃渲染任务覆盖层的旋转
            // render 任务覆盖层的旋转定位由 render.js 的 applyRotationStyle 管理

            const uiElements = [connectionStatus, timeDisplay, fileNameDisplay, voiceStatus, voiceTextDisplay, monitorWrapper];
            
            uiElements.forEach(el => {
                if (!el) return;
                el.style.transform = '';
                el.style.transformOrigin = '';
                el.style.left = '';
                el.style.top = '';
                el.style.right = '';
                el.style.bottom = '';
                el.style.maxWidth = '';
                el.style.writingMode = '';
                el.style.textOrientation = '';
                el.style.flexDirection = '';
            });
            
            if (currentRotation === 0) {
                connectionStatus.style.top = '20px';
                connectionStatus.style.left = '20px';
                timeDisplay.style.top = '20px';
                timeDisplay.style.right = '20px';
                fileNameDisplay.style.bottom = '20px';
                fileNameDisplay.style.left = '20px';
                monitorWrapper.style.bottom = '20px';
                monitorWrapper.style.right = '20px';
                voiceStatus.style.bottom = '80px';
                voiceStatus.style.right = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.bottom = '140px';
                    voiceTextDisplay.style.right = '20px';
                }
            } else if (currentRotation === 90) {
                connectionStatus.style.top = '20px';
                connectionStatus.style.right = '20px';
                connectionStatus.style.writingMode = 'vertical-rl';
                connectionStatus.style.textOrientation = 'mixed';
                
                timeDisplay.style.bottom = '20px';
                timeDisplay.style.right = '20px';
                timeDisplay.style.writingMode = 'vertical-rl';
                timeDisplay.style.textOrientation = 'mixed';
                
                fileNameDisplay.style.top = '20px';
                fileNameDisplay.style.left = '20px';
                fileNameDisplay.style.writingMode = 'vertical-rl';
                fileNameDisplay.style.textOrientation = 'mixed';
                
                monitorWrapper.style.bottom = '20px';
                monitorWrapper.style.left = '20px';
                monitorWrapper.style.flexDirection = 'column-reverse';
                
                voiceStatus.style.bottom = '80px';
                voiceStatus.style.left = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.bottom = '140px';
                    voiceTextDisplay.style.left = '20px';
                    voiceTextDisplay.style.maxWidth = '50vh';
                }
                [timeDisplay, fileNameDisplay, voiceTextDisplay].forEach(el => {
                    if (el) el.style.maxWidth = '50vh';
                });
            } else if (currentRotation === 180) {
                connectionStatus.style.bottom = '20px';
                connectionStatus.style.right = '20px';
                connectionStatus.style.transform = 'rotate(180deg)';
                
                timeDisplay.style.bottom = '20px';
                timeDisplay.style.left = '20px';
                timeDisplay.style.transform = 'rotate(180deg)';
                
                fileNameDisplay.style.top = '20px';
                fileNameDisplay.style.right = '20px';
                fileNameDisplay.style.transform = 'rotate(180deg)';
                
                monitorWrapper.style.top = '20px';
                monitorWrapper.style.left = '20px';
                
                voiceStatus.style.top = '80px';
                voiceStatus.style.left = '20px';
                voiceStatus.style.transform = 'rotate(180deg)';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.top = '140px';
                    voiceTextDisplay.style.left = '20px';
                    voiceTextDisplay.style.transform = 'rotate(180deg)';
                }
            } else if (currentRotation === 270) {
                connectionStatus.style.bottom = '20px';
                connectionStatus.style.left = '20px';
                connectionStatus.style.writingMode = 'vertical-rl';
                connectionStatus.style.textOrientation = 'mixed';
                connectionStatus.style.transform = 'rotate(180deg)';
                
                timeDisplay.style.top = '20px';
                timeDisplay.style.left = '20px';
                timeDisplay.style.writingMode = 'vertical-rl';
                timeDisplay.style.textOrientation = 'mixed';
                timeDisplay.style.transform = 'rotate(180deg)';
                
                fileNameDisplay.style.bottom = '20px';
                fileNameDisplay.style.right = '20px';
                fileNameDisplay.style.writingMode = 'vertical-rl';
                fileNameDisplay.style.textOrientation = 'mixed';
                fileNameDisplay.style.transform = 'rotate(180deg)';
                
                monitorWrapper.style.top = '20px';
                monitorWrapper.style.right = '20px';
                monitorWrapper.style.flexDirection = 'column-reverse';
                
                voiceStatus.style.top = '80px';
                voiceStatus.style.right = '20px';
                if (voiceTextDisplay) {
                    voiceTextDisplay.style.top = '140px';
                    voiceTextDisplay.style.right = '20px';
                    voiceTextDisplay.style.maxWidth = '50vh';
                }
                [timeDisplay, fileNameDisplay, voiceTextDisplay].forEach(el => {
                    if (el) el.style.maxWidth = '50vh';
                });
            }
        }
        
        function applyFit(fit) {
            currentFit = fit;
            mediaImage.classList.remove('height', 'width', 'crop');
            mediaVideo.classList.remove('height', 'width', 'crop');
            
            if (fit === 'height') {
                mediaImage.classList.add('height');
                mediaVideo.classList.add('height');
            } else if (fit === 'width') {
                mediaImage.classList.add('width');
                mediaVideo.classList.add('width');
            } else if (fit === 'crop') {
                mediaImage.classList.add('height');
                mediaVideo.classList.add('height');
            } else if (fit === 'contain') {
                // 铺满方向（高度/宽度）由 applyCrop 根据旋转角度/容器比例/媒体比例自动计算
            } else if (fit === 'cover') {
                // 覆盖铺满方向（高度/宽度）由 applyCrop 自动计算，超出部分居中裁切
            }

            applyCrop();
        }
        
        let _cropRafId = null;
        let _cropDebug = false;
        function _cropLog(...args) {
            if (_cropDebug) console.log(...args);
        }
        function scheduleCropApply() {
            if (_cropRafId) return;
            _cropRafId = requestAnimationFrame(() => {
                _cropRafId = null;
                const info = applyCrop();
                if (_cropDebug) {
                    sendCommandAck('crop', true, '裁剪已应用', info);
                }
            });
        }

        // html 媒体裁剪：裁剪框区域等比放大铺满屏幕（可叠加旋转）
        function applyHtmlCrop() {
            const crop = currentCrop;
            if (!crop) return;
            // 默认全屏（无裁剪）时恢复旋转基准变换
            if (crop.width >= 99.9 && crop.height >= 99.9 && crop.x <= 0.1 && crop.y <= 0.1) {
                currentHtmlScale = 1;
                applyRotation();
                return;
            }
            const cx = crop.x + crop.width / 2;
            const cy = crop.y + crop.height / 2;
            const scale = Math.max(100 / crop.width, 100 / crop.height);
            currentHtmlScale = scale;
            const isRotated = currentRotation === 90 || currentRotation === 270;
            mediaHtml.style.top = '0';
            mediaHtml.style.left = '0';
            // 点变换从右到左：原点移到裁剪框中心 → 等比放大 → 移回 → 旋转 → 平移到视口中心
            const cropTransform = 'translate(-' + cx + '%, -' + cy + '%) scale(' + scale + ') translate(' + cx + '%, ' + cy + '%)';
            if (isRotated) {
                mediaHtml.style.width = '100vh';
                mediaHtml.style.height = '100vw';
                mediaHtml.style.transform = 'translate(50vw, 50vh) translate(-50%, -50%) rotate(' + currentRotation + 'deg)' + cropTransform;
            } else {
                mediaHtml.style.width = '100%';
                mediaHtml.style.height = '100%';
                mediaHtml.style.transform = 'rotate(0deg)' + cropTransform;
            }
        }

        function applyCrop() {
            if (mediaHtml.style.display !== 'none') {
                // html 裁剪只在 crop 适配模式下生效，其他适配方式还原默认铺满
                if (currentFit === 'crop') {
                    applyHtmlCrop();
                } else {
                    applyRotation();
                }
                return;
            }
            const media = mediaImage.style.display !== 'none' ? mediaImage : mediaVideo;

            media.classList.remove('crop');
            media.style.width = '';
            media.style.height = '';
            media.style.left = '';
            media.style.top = '';
            media.style.maxWidth = '';
            media.style.maxHeight = '';
            
            const container = document.getElementById('mediaContainer');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            const naturalWidth = media.naturalWidth || media.videoWidth || containerWidth;
            const naturalHeight = media.naturalHeight || media.videoHeight || containerHeight;
            
            const isRotated = currentRotation === 90 || currentRotation === 270;

            _cropLog('[Crop] applyCrop 开始');
            _cropLog('[Crop] 容器尺寸:', containerWidth, 'x', containerHeight);
            _cropLog('[Crop] 媒体原始尺寸:', naturalWidth, 'x', naturalHeight);
            _cropLog('[Crop] 当前旋转:', currentRotation, '是否旋转:', isRotated);
            _cropLog('[Crop] 当前适配模式:', currentFit);
            _cropLog('[Crop] 当前裁剪百分比:', JSON.stringify(currentCrop));

            const baseInfo = {
                容器尺寸: { width: containerWidth, height: containerHeight },
                媒体原始尺寸: { width: naturalWidth, height: naturalHeight },
                当前旋转: currentRotation,
                是否旋转: isRotated,
                当前适配模式: currentFit,
                当前裁剪百分比: currentCrop
            };

            // 铺满模式：媒体等比放大覆盖整个容器（超出部分居中裁切）
            if (currentFit === 'cover') {
                if (naturalWidth > 0 && naturalHeight > 0 && containerWidth > 0 && containerHeight > 0) {
                    // 旋转后媒体的有效宽高比（宽/高互换）
                    const effectiveRatio = isRotated ? naturalHeight / naturalWidth : naturalWidth / naturalHeight;
                    const containerRatio = containerWidth / containerHeight;
                    let viewW, viewH;
                    if (effectiveRatio > containerRatio) {
                        // 媒体更宽：高度铺满容器高，宽度超出裁切
                        viewH = containerHeight;
                        viewW = containerHeight * effectiveRatio;
                    } else {
                        // 媒体更高：宽度铺满容器宽，高度超出裁切
                        viewW = containerWidth;
                        viewH = containerWidth / effectiveRatio;
                    }
                    if (isRotated) {
                        // 旋转 90/270 后布局宽高与视觉互换
                        media.style.width = viewH + 'px';
                        media.style.height = viewW + 'px';
                    } else {
                        media.style.width = viewW + 'px';
                        media.style.height = viewH + 'px';
                    }
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '铺满模式' };
            }

            // 适应模式：根据旋转角度/容器比例/媒体比例自动计算铺满尺寸
            if (currentFit === 'contain') {
                if (naturalWidth > 0 && naturalHeight > 0 && containerWidth > 0 && containerHeight > 0) {
                    // 旋转后媒体的有效宽高比（宽/高互换）
                    const effectiveRatio = isRotated ? naturalHeight / naturalWidth : naturalWidth / naturalHeight;
                    const containerRatio = containerWidth / containerHeight;
                    let viewW, viewH;
                    if (effectiveRatio > containerRatio) {
                        // 媒体更宽：宽度铺满容器宽，高度按比例
                        viewW = containerWidth;
                        viewH = containerWidth / effectiveRatio;
                    } else {
                        // 媒体更高：高度铺满容器高，宽度按比例
                        viewH = containerHeight;
                        viewW = containerHeight * effectiveRatio;
                    }
                    if (isRotated) {
                        // 旋转 90/270 后布局宽高与视觉互换
                        media.style.width = viewH + 'px';
                        media.style.height = viewW + 'px';
                    } else {
                        media.style.width = viewW + 'px';
                        media.style.height = viewH + 'px';
                    }
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '适应模式' };
            }

            if (currentFit !== 'height' && currentFit !== 'width' && currentFit !== 'crop') {
                _cropLog('[Crop] 非适配模式，跳过');
                return { ...baseInfo, 状态: '非适配模式' };
            }

            const mediaRatio = naturalWidth / naturalHeight;

            if (currentFit === 'height') {
                if (isRotated) {
                    const displayHeight = containerWidth;
                    const displayWidth = containerWidth * mediaRatio;
                    media.style.width = displayWidth + 'px';
                    media.style.height = displayHeight + 'px';
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '高度适配模式' };
            }
            
            if (currentFit === 'width') {
                if (isRotated) {
                    const displayWidth = containerHeight;
                    const displayHeight = containerHeight / mediaRatio;
                    media.style.width = displayWidth + 'px';
                    media.style.height = displayHeight + 'px';
                    media.style.maxWidth = 'none';
                    media.style.maxHeight = 'none';
                }
                return { ...baseInfo, 状态: '宽度适配模式' };
            }
            
            if (currentFit !== 'crop') {
                return { ...baseInfo, 状态: '非裁剪模式' };
            }
            
            const containerRatio = containerWidth / containerHeight;
            let displayWidth, displayHeight;
            
            if (isRotated) {
                const rotatedRatio = 1 / mediaRatio;
                if (rotatedRatio > containerRatio) {
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / mediaRatio;
                } else {
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * mediaRatio;
                }
            } else {
                if (mediaRatio > containerRatio) {
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * mediaRatio;
                } else {
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / mediaRatio;
                }
            }
            
            let cropWidth, cropHeight, cropX, cropY;
            let targetWidth, targetHeight;
            
            if (isRotated) {
                cropWidth = displayWidth * (currentCrop.height / 100);
                cropHeight = displayHeight * (currentCrop.width / 100);
                cropX = displayWidth *  (currentCrop.y / 100);
                cropY = displayHeight * (currentCrop.x / 100);
                targetWidth = containerHeight;
                targetHeight = containerWidth;
            } else {
                cropWidth = displayWidth * (currentCrop.width / 100);
                cropHeight = displayHeight * (currentCrop.height / 100);
                cropX = displayWidth * (currentCrop.x / 100);
                cropY = displayHeight * (currentCrop.y / 100);
                targetWidth = containerWidth;
                targetHeight = containerHeight;
            }
            
            const scaleX = targetWidth / cropWidth;
            const scaleY = targetHeight / cropHeight;
            const scale = Math.max(scaleX, scaleY);
            
            let finalWidth, finalHeight, finalLeft, finalTop;
            
            if (isRotated) {
                finalWidth = displayWidth * scale;
                finalHeight = displayHeight * scale;
                finalLeft = -cropY * scale;
                finalTop = -cropX * scale;
                
                // 旋转补偿：CSS transform rotate 是围绕元素中心旋转的
                // 旋转90度后，元素视觉宽度变为原高度，视觉高度变为原宽度
                // 需要补偿 (finalWidth - finalHeight) / 2 的偏移
                const rotationOffset = (finalWidth - finalHeight) / 2;
                finalLeft -= rotationOffset;
                finalTop += rotationOffset;
            } else {
                finalWidth = displayWidth * scale;
                finalHeight = displayHeight * scale;
                finalLeft = -cropX * scale;
                finalTop = -cropY * scale;
            }
            
            media.classList.add('crop');
            media.style.width = finalWidth + 'px';
            media.style.height = finalHeight + 'px';
            media.style.left = finalLeft + 'px';
            media.style.top = finalTop + 'px';
            
            _cropLog('[Crop] 裁剪计算完成');
            _cropLog('[Crop] 显示尺寸:', displayWidth, 'x', displayHeight);
            _cropLog('[Crop] 裁剪像素值:', { cropX, cropY, cropWidth, cropHeight });
            _cropLog('[Crop] 最终样式:', {
                width: Math.round(finalWidth) + 'px',
                height: Math.round(finalHeight) + 'px',
                left: Math.round(finalLeft) + 'px',
                top: Math.round(finalTop) + 'px'
            });
            
            return {
                ...baseInfo,
                状态: '裁剪模式',
                媒体显示尺寸: { width: displayWidth, height: displayHeight },
                裁剪像素值: { cropX, cropY, cropWidth, cropHeight },
                最终样式: {
                    width: Math.round(finalWidth) + 'px',
                    height: Math.round(finalHeight) + 'px',
                    left: Math.round(finalLeft) + 'px',
                    top: Math.round(finalTop) + 'px'
                }
            };
        }
        
        function applyCustomCrop(customData) {
            const media = mediaImage.style.display !== 'none' ? mediaImage : mediaVideo;
            
            media.classList.remove('crop');

        function playTTS(text) {
            if (isSleepPaused()) return;  // 睡眠/深度睡眠期间丢弃媒体名播报，不播放
            fetch('/api/tts/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    ttsAudio.src = data.audioUrl;
                    ttsAudio.play().catch(e => console.log('TTS播放被阻止'));
                }
            })
            .catch(err => console.error('TTS生成失败:', err));
        }
        
        function playNextTts() {
            console.log('[显示端] playNextTts: isPlayingTts=', isPlayingTts, 'queue=', ttsQueue.length);
            if (isSleepPaused()) return;  // 睡眠/深度睡眠期间不播放（ended/error 回调等触达时直接跳过）
            if (isPlayingTts) {
                return;
            }
            if (ttsQueue.length === 0) {
                // TTS 队列播放完毕，如果始终监听模式且能力允许，恢复录音
                if (isAlwaysListening && currentCapabilities?.voiceRecording) {
                    setTimeout(() => startVoiceRecording(), 500);
                }
                return;
            }
            
            isPlayingTts = true;
            const item = ttsQueue.shift();
            
            console.log('[显示端] 播放TTS:', item.audioUrl || item.text);
            
            if (item.text) {
                showTtsText(item.text);
            }
            
            if (item.audioUrl) {
                ttsAudio.src = item.audioUrl;
                ttsAudio.play().catch(e => {
                    console.log('TTS播放被阻止:', e.message);
                    hideTtsText();
                    isPlayingTts = false;
                    playNextTts();
                });
            } else if (item.text) {
                fetch('/api/tts/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: item.text })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        ttsAudio.src = data.audioUrl;
                        ttsAudio.play().catch(e => {
                            console.log('TTS播放被阻止');
                            hideTtsText();
                            isPlayingTts = false;
                            playNextTts();
                        });
                    } else {
                        isPlayingTts = false;
                        playNextTts();
                    }
                })
                .catch(err => {
                    console.error('TTS生成失败:', err);
                    isPlayingTts = false;
                    playNextTts();
                });
            } else {
                isPlayingTts = false;
                playNextTts();
            }
        }
        
        function queueTts(item) {
            if (isSleepPaused()) return;  // 睡眠/深度睡眠期间丢弃新 TTS（不入队不播放），唤醒不重放整晚内容
            ttsQueue.push(item);
            playNextTts();
        }
        
        ttsAudio.addEventListener('ended', () => {
            hideTtsText();
            isPlayingTts = false;
            playNextTts();
        });
        
        ttsAudio.addEventListener('error', () => {

            isPlayingTts = false;

        });
        
        function showTtsText(text) {
            if (voiceTextDisplay && text) {
                voiceTextDisplay.textContent = text;
                voiceTextDisplay.className = 'voice-text-visible';
            }
        }
        
        function hideTtsText() {
            if (voiceTextDisplay) {
                voiceTextDisplay.className = 'voice-text-hidden';
            }
        }
        
        function handleTTS(data) {
            console.log('[显示端] 收到TTS消息:', data.action, data.audioUrl || data.text);
            if (data.action === 'play') {
                queueTts({ text: data.text });
            } else if (data.action === 'playAudio') {
                queueTts({ audioUrl: data.audioUrl, text: data.text });
            } else if (data.action === 'stop') {
                ttsQueue = [];
                ttsAudio.pause();
                ttsAudio.currentTime = 0;
                isPlayingTts = false;
            } else if (data.action === 'setAutoTts') {
                autoTtsEnabled = data.enabled;
            }
        }
        
        function handleReminder(data) {
            if (data.action === 'popup') {
                showReminderPopup(data.time, data.content);
            } else if (data.action === 'voice') {
                queueTts({ audioUrl: data.audioUrl, text: data.text });
            }
        }
        
        function handleVoiceCommand(data) {
            if (data.action === 'confirm') {
                showVoiceConfirmPopup(data.confirmationId, data.text, data.audioUrl);
            } else if (data.action === 'response') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showVoiceResponsePopup(data.text);
            } else if (data.action === 'searchResult') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showSearchResultPopup(data.query, data.results);
            } else if (data.action === 'weatherResult') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showVoiceResponsePopup(data.text);
            } else if (data.action === 'playChoices') {
                if (data.audioUrl) {
                    queueTts({ audioUrl: data.audioUrl, text: data.text });
                }
                showPlayChoicesPopup(data.confirmationId, data.matches, data.text);
            }
        }

        function handleRestoreState(state) {
            if (!state) return;
            
            if (state.rotation !== undefined) {
                currentRotation = state.rotation;
                applyRotation();
            }
            
            if (state.fit !== undefined) {
                applyFit(state.fit);
            }
            
            if (state.crop !== undefined) {
                currentCrop = state.crop;
                applyCrop();
            }
            
            if (state.volume !== undefined) {
                mediaVideo.volume = state.volume / 100;
            }
            
            if (state.currentMedia) {
                // 恢复 html 滚动模式（服务器持久化，刷新/重启后沿用）
                if (state.currentHtmlScroll) {
                    currentHtmlScroll = state.currentHtmlScroll;
                }
                showMedia(
                    state.currentMedia,
                    true,
                    state.isPlaying === false,
                    state.currentMediaProgress ? state.currentMediaProgress.currentTime : 0
                );  // 恢复不激活；暂停状态保持暂停，并跳回上次播放位置
            }

            if (state.sleep !== undefined) {
                // 容错：state.sleep 可能为 null/非对象（服务端持久化异常），按空值降级，避免 TypeError
                const s = state.sleep || {};
                sleepSettings = {
                    // 默认开启：持久化数据缺 enabled 字段（旧数据/从未配置过）时按开启处理
                    enabled: s.enabled === undefined ? true : !!s.enabled,
                    startHour: clampHour(s.startHour),
                    endHour: clampHour(s.endHour),
                    deepStartHour: clampHour(s.deepStartHour),
                    deepEndHour: clampHour(s.deepEndHour)
                };
                checkSleepMode();
            }

            if (state.autoTts !== undefined) {
                // 自动播报开关持久化：显示端刷新/重启后恢复控制端设置（默认开，旧数据无字段则保持默认）
                autoTtsEnabled = !!state.autoTts;
            }
        }
        
        function extractFileName(url) {
            try {
                const urlParts = url.split('/');
                let fileName = urlParts[urlParts.length - 1].split('?')[0];
                fileName = decodeURIComponent(fileName);
                const dotIndex = fileName.lastIndexOf('.');
                if (dotIndex > 0) {
                    fileName = fileName.substring(0, dotIndex);
                }
                return fileName;
            } catch (e) {
                return '';
            }
        }
        
        <!-- 批量播放模式：本地自循环播放列表 -->
        let playlistState = null;
        let savedAutoTts = null;

        function stopPlaylist() {
            if (!playlistState) return;
            playlistState.active = false;
            pauseExpected = true;
            abandonNativeAudioFocus();
            stopHtmlScroll();
            if (playlistState.timer) {
                clearTimeout(playlistState.timer);
                playlistState.timer = null;
            }
            if (playlistState.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', playlistState.videoEndedHandler);
                playlistState.videoEndedHandler = null;
            }
            if (playlistState.audioEndedHandler) {
                mediaAudio.removeEventListener('ended', playlistState.audioEndedHandler);
                playlistState.audioEndedHandler = null;
            }
            if (savedAutoTts !== null) {
                autoTtsEnabled = savedAutoTts;
                savedAutoTts = null;
            }
            playlistState = null;
        }

        function sendPlaylistProgress(state) {
            if (!playlistState || !displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            const ps = playlistState;
            const item = ps.playlist[ps.index];
            let width, height;
            let currentTime = 0;
            let duration = 0;
            if (item) {
                // 回传实际播放尺寸（临时模式控制端无数据，依赖此尺寸做裁剪预览）
                if (item.mediaType === 'video') {
                    width = mediaVideo.videoWidth || undefined;
                    height = mediaVideo.videoHeight || undefined;
                    currentTime = Number.isFinite(mediaVideo.currentTime) ? mediaVideo.currentTime : 0;
                    duration = Number.isFinite(mediaVideo.duration) ? mediaVideo.duration : 0;
                } else {
                    width = mediaImage.naturalWidth || undefined;
                    height = mediaImage.naturalHeight || undefined;
                    if (item.mediaType === 'audio') {
                        currentTime = Number.isFinite(mediaAudio.currentTime) ? mediaAudio.currentTime : 0;
                        duration = Number.isFinite(mediaAudio.duration) ? mediaAudio.duration : 0;
                    }
                }
            }
            // 重连恢复的媒体在 loadedmetadata 前 currentTime 仍可能是 0，先用待恢复值回传一次。
            if (currentTime === 0 && Number.isFinite(ps.resumeTime) && ps.resumeTime > 0) {
                currentTime = ps.resumeTime;
            }
            displayWs.send(JSON.stringify({
                type: 'playlistProgress',
                listId: ps.listId,
                index: ps.index,
                total: ps.playlist.length,
                state: state,
                fileName: item ? item.fileName : '',
                url: item ? item.url : undefined,
                mediaType: item ? item.mediaType : undefined,
                width: width,
                height: height,
                currentTime: currentTime,
                duration: duration
            }));
        }

        function handlePlaylistStart(data) {
            stopPlaylist();
            savedAutoTts = autoTtsEnabled;
            autoTtsEnabled = !!data.announceName;
            const playlist = data.playlist || [];
            if (playlist.length === 0) {
                stopPlaylist();
                return;
            }
            const resumeIndex = Math.max(Math.min(Number.isFinite(data.resumeIndex) ? data.resumeIndex : 0, playlist.length - 1), 0);
            const resumeTime = Number.isFinite(data.resumeTime) && data.resumeTime > 0 ? data.resumeTime : 0;
            playlistState = {
                listId: data.listId,
                playlist: playlist,
                interval: (data.interval || 0) * 1000,
                loop: !!data.loop,
                index: resumeIndex,
                timer: null,
                videoEndedHandler: null,
                audioEndedHandler: null,
                active: true,
                paused: data.resumeState === 'paused',
                resumeTime: resumeTime
            };
            playCurrentItem({ allowPausedLoad: true, resumeTime: resumeTime });
        }

        function playCurrentItem(options = {}) {
            if (!playlistState || !playlistState.active) return;
            if (playlistState.paused && !options.allowPausedLoad) return;
            if (isSleepPaused() && !(playlistState.paused && options.allowPausedLoad)) {
                return;  // 睡眠/深度睡眠中不自动切播；暂停重连仍允许加载当前项，唤醒后可继续
            }
            const ps = playlistState;
            const item = ps.playlist[ps.index];
            if (!item) {
                finishPlaylist();
                return;
            }
            // 清除上一项残留的定时器/ended 监听/加载失败回调，
            // 防止切换时重复触发 next 跳过媒体项
            if (ps.timer) {
                clearTimeout(ps.timer);
                ps.timer = null;
            }
            if (ps.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                ps.videoEndedHandler = null;
            }
            if (ps.audioEndedHandler) {
                mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                ps.audioEndedHandler = null;
            }
            mediaVideo.onerror = null;
            mediaAudio.onerror = null;
            mediaImage.onerror = null;
            const mediaData = item.url
                ? { type: 'url', url: item.url, fileName: item.fileName, mediaType: item.mediaType }
                : { type: 'base64', data: item.data, fileName: item.fileName, mediaType: item.mediaType, mimeType: item.mimeType };
            const resumeTime = Number.isFinite(options.resumeTime) ? options.resumeTime : ps.resumeTime;
            showMedia(mediaData, true, ps.paused, resumeTime);  // 播放列表自动切播不激活（显示端内部行为）
            // 媒体加载完成后补报一次进度（带实际尺寸，供控制端裁剪预览）
            const reportSizeOnce = () => {
                if (playlistState && playlistState.paused) {
                    sendPlaylistProgress('paused');
                } else {
                    sendPlaylistProgress('playing');
                }
                if (playlistState) playlistState.resumeTime = null;
            };
            if (item.mediaType === 'video') {
                mediaVideo.addEventListener('loadedmetadata', reportSizeOnce, { once: true });
            } else if (item.mediaType === 'audio') {
                mediaAudio.addEventListener('loadedmetadata', reportSizeOnce, { once: true });
            } else if (item.mediaType === 'html') {
                mediaHtml.addEventListener('load', reportSizeOnce, { once: true });
            } else {
                mediaImage.addEventListener('load', reportSizeOnce, { once: true });
            }
            if (item.mediaType === 'video') {
                // 视频用自己的时长播放，播完后再等间隔
                mediaVideo.loop = false;
                if (!ps.paused) {
                    ps.videoEndedHandler = function() {
                        mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                        ps.videoEndedHandler = null;
                        ps.timer = setTimeout(playlistNext, ps.interval);
                    };
                    mediaVideo.addEventListener('ended', ps.videoEndedHandler);
                }
                mediaVideo.onerror = function() {
                    // 视频加载失败：等间隔后播下一个，不卡死循环
                    mediaVideo.onerror = null;
                    if (ps.paused) return;
                    if (ps.videoEndedHandler) {
                        mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                        ps.videoEndedHandler = null;
                    }
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
            } else if (item.mediaType === 'audio') {
                // 音频按自然时长播放，结束后等待间隔再切换，和视频批量语义一致。
                mediaAudio.loop = false;
                if (!ps.paused) {
                    ps.audioEndedHandler = function() {
                        mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                        ps.audioEndedHandler = null;
                        ps.timer = setTimeout(playlistNext, ps.interval);
                    };
                    mediaAudio.addEventListener('ended', ps.audioEndedHandler);
                }
                mediaAudio.onerror = function() {
                    // 音频加载失败：等待间隔后播下一个，避免单项错误卡住列表。
                    mediaAudio.onerror = null;
                    if (ps.paused) return;
                    if (ps.audioEndedHandler) {
                        mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                        ps.audioEndedHandler = null;
                    }
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
            } else {
                // 图片按间隔时间切换
                mediaImage.onerror = function() {
                    // 图片加载失败：等间隔后播下一个，不卡死循环
                    mediaImage.onerror = null;
                    if (ps.paused) return;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                if (!ps.paused) ps.timer = setTimeout(playlistNext, ps.interval);
            }
            sendPlaylistProgress(ps.paused ? 'paused' : 'playing');
        }

        function playlistNext() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.resumeTime = null;
            // 定时器已经触发，先清除句柄，避免睡眠拦截后唤醒逻辑误判仍在等待。
            if (ps.timer) clearTimeout(ps.timer);
            ps.timer = null;
            // 自动 timer/ended 在睡眠期间只保留当前项，不推进索引、不排队下一项；
            // 控制端手动 next 会先临时激活，再进入此函数执行切换。
            if (isSleepPaused()) return;
            if (ps.index + 1 >= ps.playlist.length) {
                if (ps.loop) {
                    ps.index = 0;
                    playCurrentItem();
                } else {
                    finishPlaylist();
                }
            } else {
                ps.index++;
                playCurrentItem();
            }
        }

        function playlistPrev() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.resumeTime = null;
            ps.index = ps.index - 1 < 0 ? (ps.loop ? ps.playlist.length - 1 : 0) : ps.index - 1;
            playCurrentItem();
        }

        function playlistJump(index) {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            if (index < 0 || index >= ps.playlist.length) return;
            ps.resumeTime = null;
            ps.index = index;
            playCurrentItem();
        }

        function playlistPause() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.paused = true;
            pauseExpected = true;
            abandonNativeAudioFocus();
            stopHtmlScroll();
            if (ps.timer) {
                clearTimeout(ps.timer);
                ps.timer = null;
            }
            if (ps.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                ps.videoEndedHandler = null;
                mediaVideo.pause();
            }
            if (ps.audioEndedHandler) {
                mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                ps.audioEndedHandler = null;
                mediaAudio.pause();
            }
            // 清除加载失败回调，防止 pause 后 error 事件重新设置定时器自动播下一项
            mediaVideo.onerror = null;
            mediaAudio.onerror = null;
            mediaImage.onerror = null;
            sendPlaylistProgress('paused');
        }

        function playlistResume() {
            if (!playlistState || !playlistState.active) return;
            const ps = playlistState;
            ps.paused = false;
            pauseExpected = false;
            const item = ps.playlist[ps.index];
            if (item && item.mediaType === 'video' && !ps.timer && !ps.videoEndedHandler) {
                // 暂停时视频正在播放 → 继续播放视频
                playVideoAuto(mediaVideo);
                ps.videoEndedHandler = function() {
                    mediaVideo.removeEventListener('ended', ps.videoEndedHandler);
                    ps.videoEndedHandler = null;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                mediaVideo.addEventListener('ended', ps.videoEndedHandler);
            } else if (item && item.mediaType === 'audio' && !ps.timer && !ps.audioEndedHandler) {
                // 暂停时音频正在播放 → 继续播放并重新绑定 ended。
                playAudioAuto(mediaAudio);
                ps.audioEndedHandler = function() {
                    mediaAudio.removeEventListener('ended', ps.audioEndedHandler);
                    ps.audioEndedHandler = null;
                    ps.timer = setTimeout(playlistNext, ps.interval);
                };
                mediaAudio.addEventListener('ended', ps.audioEndedHandler);
            } else {
                // 图片或间隔等待中 → 重新计时
                ps.timer = setTimeout(playlistNext, ps.interval);
                // html 项暂停时滚动已冻结，恢复时继续滚动
                if (item && item.mediaType === 'html') {
                    startHtmlScroll(mediaHtml, item.htmlScroll || null);
                }
            }
            sendPlaylistProgress('playing');
        }

        function finishPlaylist() {
            if (!playlistState) return;
            pauseExpected = true;
            abandonNativeAudioFocus();
            const info = {
                listId: playlistState.listId,
                index: playlistState.index,
                total: playlistState.playlist.length,
                state: 'finished'
            };
            playlistState.active = false;
            stopHtmlScroll();
            if (playlistState.timer) {
                clearTimeout(playlistState.timer);
                playlistState.timer = null;
            }
            if (playlistState.videoEndedHandler) {
                mediaVideo.removeEventListener('ended', playlistState.videoEndedHandler);
                playlistState.videoEndedHandler = null;
            }
            if (playlistState.audioEndedHandler) {
                mediaAudio.removeEventListener('ended', playlistState.audioEndedHandler);
                playlistState.audioEndedHandler = null;
            }
            if (savedAutoTts !== null) {
                autoTtsEnabled = savedAutoTts;
                savedAutoTts = null;
            }
            playlistState = null;
            if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                displayWs.send(JSON.stringify({ type: 'playlistProgress', ...info }));
            }
        }

        function handlePlaylistControl(data) {
            if (!playlistState) return;
            switch (data.action) {
                case 'pause':
                    playlistPause();
                    break;
                case 'resume':
                    playlistResume();
                    break;
                case 'next':
                    // 手动 next 是用户主动唤醒操作；自动 timer/ended 不经过此分支，睡眠拦截保持不变。
                    activateTemporarily();
                    playlistNext();
                    break;
                case 'prev':
                    playlistPrev();
                    break;
                case 'jump':
                    playlistJump(data.index);
                    break;
                case 'stop':
                    const info = {
                        listId: playlistState.listId,
                        index: playlistState.index,
                        total: playlistState.playlist.length,
                        state: 'stopped'
                    };
                    stopPlaylist();
                    if (displayWs && displayWs.readyState === WebSocket.OPEN) {
                        displayWs.send(JSON.stringify({ type: 'playlistProgress', ...info }));
                    }
                    break;
            }
        }

        // .mhtml（MIME 打包网页）转纯 HTML：提取主文档，内嵌资源转为 data: URI。
        // Chromium 对 .mhtml 渲染支持差（直接导航都会 ERR_ABORTED），必须转换后用 srcdoc 渲染
        // quoted-printable 解码为字节数组（=XX 十六进制、行尾 = 软换行）
        function qpToBytes(str) {
            const decoded = str.replace(/=\r?\n/g, '').replace(/=([0-9A-Fa-f]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
            return Uint8Array.from(decoded, c => c.charCodeAt(0));
        }

        function decodePartBody(body, encoding, charset) {
            if (encoding === 'base64') {
                const bytes = Uint8Array.from(atob(body.replace(/\s/g, '')), c => c.charCodeAt(0));
                return new TextDecoder(charset === 'gbk' || charset === 'gb2312' ? 'gbk' : 'utf-8').decode(bytes);
            }
            if (encoding === 'quoted-printable') {
                const bytes = qpToBytes(body);
                return new TextDecoder(charset === 'gbk' || charset === 'gb2312' ? 'gbk' : 'utf-8').decode(bytes);
            }
            return body;
        }

        function mhtmlToHtml(text) {
            const boundaryMatch = text.match(/^--([^\r\n]+)/m);
            if (!boundaryMatch) return null;
            const boundary = boundaryMatch[1].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const parts = text.split(new RegExp('--' + boundary));
            if (parts.length < 2) return null;

            let main = null;
            const resources = new Map();

            for (let i = 1; i < parts.length; i++) {
                const part = parts[i];
                if (!part || part.trim() === '' || part.trim() === '--') continue;
                const headerEnd = part.indexOf('\r\n\r\n');
                const bodyStart = headerEnd === -1 ? part.indexOf('\n\n') : headerEnd;
                if (bodyStart === -1) continue;
                const headersText = part.slice(0, bodyStart);
                const body = part.slice(bodyStart + (headerEnd === -1 ? 2 : 4)).replace(/^[\r\n]+/, '').replace(/[\r\n]+$/, '');
                const headers = {};
                headersText.split(/\r?\n/).forEach(line => {
                    const idx = line.indexOf(':');
                    if (idx > 0) headers[line.slice(0, idx).trim().toLowerCase()] = line.slice(idx + 1).trim();
                });
                const ctype = headers['content-type'] || 'text/html';
                const encoding = (headers['content-transfer-encoding'] || '').toLowerCase();
                const charsetMatch = ctype.match(/charset=([^;]+)/i);
                const charset = charsetMatch ? charsetMatch[1].trim() : 'utf-8';

                if (ctype.startsWith('text/html')) {
                    main = decodePartBody(body, encoding, charset);
                } else {
                    const loc = headers['content-location'] || headers['content-id'] || '';
                    if (loc) {
                        // 与 findResource 一致：剥离查询串（?xxx），否则带 ?ulf 的 CSS/图片资源 key 对不上
                        const clean = loc.replace(/^cid:/i, '').replace(/^<|>$/g, '').split('?')[0].split('/').pop();
                        const mime = ctype.split(';')[0].trim();
                        let data;
                        if (encoding === 'quoted-printable') {
                            // QP 解码后转回 base64（data URI 用）
                            const bytes = qpToBytes(body);
                            let bin = '';
                            bytes.forEach(b => { bin += String.fromCharCode(b); });
                            data = btoa(bin);
                        } else if (encoding === 'base64') {
                            data = body.replace(/\s/g, '');
                        } else {
                            data = btoa(unescape(encodeURIComponent(body)));
                        }
                        resources.set(clean, { mime: mime, data: data });
                    }
                }
            }
            if (main === null) return null;

            // 重写资源引用为 data: URI（src/href/style url()，支持 cid: 引用）
            const findResource = (loc) => {
                const clean = loc.replace(/^cid:/i, '').replace(/^<|>$/g, '').split('?')[0].split('/').pop();
                return resources.get(clean) || resources.get(loc);
            };
            main = main.replace(/(src|href)=["']([^"']+)["']/gi, (m, attr, loc) => {
                const r = findResource(loc);
                return r ? attr + '="data:' + r.mime + ';base64,' + r.data + '"' : m;
            });
            main = main.replace(/url\(["']?([^"')]+)["']?\)/gi, (m, loc) => {
                const r = findResource(loc);
                return r ? 'url("data:' + r.mime + ';base64,' + r.data + '")' : m;
            });
            return main;
        }

        // HTML 媒体滚动控制器：分页式 / 平滑 / 循环
        let htmlScrollState = null;
        // 当前生效的 html 播放模式（发送未指定时沿用；控制端可实时切换）
        let currentHtmlScroll = null;
        // 当前 html 裁剪缩放倍数（无裁剪=1）；进度上报用
        let currentHtmlScale = 1;
        let htmlProgressTimer = null;

        // ===== 控制模式：转发控制端输入 + 每秒回传 720p 截图 =====
        let controlModeEnabled = false;
        let controlShotTimer = null;
        let controlShotBusy = false;
        let gdmStream = null;        // getDisplayMedia 捕获流（会话内复用）
        let gdmVideo = null;         // 取帧用隐藏 video
        let gdmPending = false;      // 授权请求进行中（防止重复弹框）
        let gdmFailed = false;       // 本会话授权失败，不再重试
        let controlShotCanvas = null;
        let controlShotCtx = null;

        // APK 原生桥探测（Android APK 显示端注入：真实像素截图 + 跨域输入注入）
        const nativeBridge = window.NativeDisplay || null;

        // 截图降级链：APK 原生截图 → 同源 html-to-image → 跨域 getDisplayMedia → 兜底 html-to-image → none
        async function captureHtmlShot() {
            if (mediaHtml.style.display === 'none') {
                sendControlScreenshot('none', null, 0, 0);
                return;
            }
            // APK 原生截图优先：真实像素，跨域 iframe / 外站图片均可截
            if (nativeBridge && nativeBridge.takeScreenshot) {
                const shot = await shotWithNativeBridge();
                if (shot) return;
                // 原生失败（如视频位图空白）回退现有降级链
            }
            // 同源检测：能读 contentDocument 即同源（srcdoc / 服务器同源 URL）
            let sameOrigin = false;
            try {
                if (mediaHtml.contentDocument && mediaHtml.contentDocument.body) {
                    sameOrigin = true;
                }
            } catch (e) {
                sameOrigin = false;
            }
            if (sameOrigin) {
                // 优先 html-to-image 截 iframe 可见区域
                try {
                    const shot = await shotWithHtmlToImage();
                    if (shot) return;
                } catch (e) {
                    console.log('[控制模式] html-to-image 失败:', e.message);
                }
                // 同源内容失败属瞬时异常（如渲染变换期间）：跳过本帧，下一帧重试，
                // 不降级 none（避免误导"跨域未授权"提示）
                return;
            }
            // 检测失败：可能 iframe 导航中瞬时不可读，先试 html-to-image 区分
            // （恢复则正常截图；真跨域会抛 SecurityError）
            try {
                const shotTry = await shotWithHtmlToImage();
                if (shotTry) return;
            } catch (e) { /* 真跨域或持续不可读，走降级 */ }
            // 跨域：尝试 getDisplayMedia（整屏，不裁剪）
            const shot = await shotWithGdm();
            if (shot) return;
            // getDisplayMedia 失败：兜底再试 html-to-image（跨域通常仍失败，成本极低）
            try {
                const shot2 = await shotWithHtmlToImage();
                if (shot2) return;
            } catch (e) { /* 忽略，降级 none */ }
            sendControlScreenshot('none', null, 0, 0);
        }

        // NativeDisplay.takeScreenshot：APK WebView 位图真实像素，同步返回 JSON {dataUrl,width,height}
        // 截图反旋转：WebView 位图 = 屏幕画面（横屏 1280x720，内容随 rotation 换方向），
        // 反旋转成页面直立（阅读方向）：90/270 输出宽高互换成竖图，内容转回可读方向
        function rotateShotToOriginal(dataUrl, width, height, rotation) {
            return new Promise((resolve) => {
                if (!rotation) { resolve({ dataUrl, width, height }); return; }
                const img = new Image();
                img.onload = () => {
                    try {
                        const swap = (rotation === 90 || rotation === 270);
                        const outW = swap ? height : width;
                        const outH = swap ? width : height;
                        const canvas = document.createElement('canvas');
                        canvas.width = outW;
                        canvas.height = outH;
                        const ctx = canvas.getContext('2d');
                        ctx.translate(outW / 2, outH / 2);
                        // 位图内容已顺时针 rotate(rotation)，反旋转用 -rotation 转回直立
                        ctx.rotate(-rotation * Math.PI / 180);
                        ctx.drawImage(img, -width / 2, -height / 2);
                        const fit = ControlModeUtils.fitSizeTo720p(outW, outH);
                        const out = document.createElement('canvas');
                        out.width = fit.width;
                        out.height = fit.height;
                        out.getContext('2d').drawImage(canvas, 0, 0, fit.width, fit.height);
                        resolve({ dataUrl: out.toDataURL('image/jpeg', 0.7), width: fit.width, height: fit.height });
                    } catch (e) {
                        resolve({ dataUrl, width, height });
                    }
                };
                img.onerror = () => resolve({ dataUrl, width, height });
                img.src = dataUrl;
            });
        }

        function shotWithNativeBridge() {
            return new Promise((resolve) => {
                try {
                    const res = JSON.parse(nativeBridge.takeScreenshot());
                    if (res && res.dataUrl) {
                        // 反旋转成页面直立：控制端预览随显示端旋转，阅读方向正确
                        rotateShotToOriginal(res.dataUrl, res.width || 0, res.height || 0, currentRotation).then(rot => {
                            sendControlScreenshot('native', rot.dataUrl, rot.width || 0, rot.height || 0);
                            resolve(rot.dataUrl);
                        });
                        return;
                    }
                } catch (e) { /* 桥截图失败，回退现有降级链 */ }
                resolve(null);
            });
        }

        // html-to-image 截 iframe 可见视口，缩至 720p
        async function shotWithHtmlToImage() {
            const doc = mediaHtml.contentDocument;
            const body = doc && doc.body;
            if (!body) return null;
            const clientW = mediaHtml.clientWidth || 800;
            const clientH = mediaHtml.clientHeight || 600;
            const canvas = await htmlToImage.toCanvas(body, {
                width: clientW,
                height: clientH,
                backgroundColor: '#ffffff'
            });
            const fit = ControlModeUtils.fitSizeTo720p(canvas.width, canvas.height);
            if (!controlShotCanvas) {
                controlShotCanvas = document.createElement('canvas');
                controlShotCtx = controlShotCanvas.getContext('2d');
            }
            controlShotCanvas.width = fit.width;
            controlShotCanvas.height = fit.height;
            controlShotCtx.drawImage(canvas, 0, 0, fit.width, fit.height);
            const dataUrl = controlShotCanvas.toDataURL('image/jpeg', 0.7);
            sendControlScreenshot('html-to-image', dataUrl, fit.width, fit.height);
            return dataUrl;
        }

        // getDisplayMedia 整屏截图（不裁剪），缩至 720p
        // 临时屏蔽浏览器原生截图（GDM_ENABLED = false）：保留代码与状态变量，恢复时改回 true
        const GDM_ENABLED = false;
        async function shotWithGdm() {
            if (!GDM_ENABLED) return null;
            if (gdmFailed || gdmPending) return null;
            if (!gdmStream) {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    gdmFailed = true;
                    return null;
                }
                gdmPending = true;
                try {
                    // 授权弹窗无人值守时会一直挂起：8 秒超时视为失败，走降级链
                    gdmStream = await Promise.race([
                        navigator.mediaDevices.getDisplayMedia({ video: true }),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('授权超时')), 8000))
                    ]);
                    gdmVideo = document.createElement('video');
                    gdmVideo.srcObject = gdmStream;
                    gdmVideo.muted = true;
                    await gdmVideo.play();
                    // 用户停止共享时清理，会话内重新申请
                    gdmStream.getVideoTracks()[0].addEventListener('ended', () => {
                        gdmStream = null;
                        gdmVideo = null;
                        gdmFailed = false;
                    });
                } catch (e) {
                    // 用户拒绝授权或浏览器不支持
                    console.log('[控制模式] getDisplayMedia 授权失败:', e.message);
                    gdmStream = null;
                    gdmFailed = true;
                    return null;
                } finally {
                    gdmPending = false;
                }
            }
            if (!gdmVideo || gdmVideo.videoWidth === 0) return null;
            const vw = gdmVideo.videoWidth;
            const vh = gdmVideo.videoHeight;
            const fit = ControlModeUtils.fitSizeTo720p(vw, vh);
            if (!controlShotCanvas) {
                controlShotCanvas = document.createElement('canvas');
                controlShotCtx = controlShotCanvas.getContext('2d');
            }
            controlShotCanvas.width = fit.width;
            controlShotCanvas.height = fit.height;
            controlShotCtx.drawImage(gdmVideo, 0, 0, fit.width, fit.height);
            const dataUrl = controlShotCanvas.toDataURL('image/jpeg', 0.7);
            sendControlScreenshot('gdm', dataUrl, fit.width, fit.height);
            return dataUrl;
        }

        function sendControlScreenshot(mode, dataUrl, width, height) {
            // 关闭控制模式后丢弃在途帧（busy 中完成的截图不再发送）
            if (!controlModeEnabled) return;
            if (!displayWs || displayWs.readyState !== WebSocket.OPEN) return;
            displayWs.send(JSON.stringify({
                type: 'controlScreenshot',
                mode: mode,
                dataUrl: dataUrl || null,
                width: width || 0,
                height: height || 0
            }));
        }

        // 截图定时器：1 秒 1 帧；上一帧未完成跳过（防堆积）
        function startControlScreenshot() {
            stopControlScreenshot();
            controlShotTimer = setInterval(async () => {
                if (controlShotBusy) return;
                controlShotBusy = true;
                try {
                    await captureHtmlShot();
                } catch (e) {
                    console.log('[控制模式] 截图失败:', e.message);
                } finally {
                    controlShotBusy = false;
                }
            }, 1000);
        }

        function stopControlScreenshot() {
            if (controlShotTimer) {
                clearInterval(controlShotTimer);
                controlShotTimer = null;
            }
            if (gdmStream) {
                gdmStream.getTracks().forEach(t => t.stop());
                gdmStream = null;
            }
            gdmVideo = null;
        }

        // 控制模式开关：开启暂停自动滚动 + 强制全屏（截图完整网页、坐标按视口+rotation 纯映射），关闭恢复
        let controlSavedCrop = null;
        function setControlMode(on) {
            controlModeEnabled = !!on;
            if (on) {
                stopHtmlScroll();
                startControlScreenshot();
                // 强制全屏：清除裁剪放大（残留 crop 的 scale 会放大 iframe 内容，截图/坐标映射都会错），
                // 保存 crop 供关闭时恢复
                if (mediaHtml.style.display !== 'none') {
                    controlSavedCrop = currentCrop ? { ...currentCrop } : null;
                    currentCrop = { x: 0, y: 0, width: 100, height: 100 };
                    currentHtmlScale = 1;
                    applyRotation();
                }
            } else {
                stopControlScreenshot();
                if (mediaHtml.style.display !== 'none') {
                    startHtmlScroll(mediaHtml, currentHtmlScroll);
                    // 恢复裁剪放大
                    if (controlSavedCrop) {
                        currentCrop = controlSavedCrop;
                        controlSavedCrop = null;
                    }
                    applyCrop();
                }
            }
            console.log('[控制模式] 状态:', controlModeEnabled ? '开启' : '关闭');
        }

        // 输入合成：把控制端输入派发到 iframe 内容
        function dispatchControlInput(data) {
            if (mediaHtml.style.display === 'none') return;
            const evt0 = data.event;
            // 键盘/文本走桥（WebView dispatchKeyEvent 真实按键，不需要屏幕坐标，跨域 iframe 聚焦元素可接收）；
            // 鼠标/滚轮走 JS 合成（0° 同源准确；跨域 iframe 读不到 contentDocument 静默跳过）
            if (nativeBridge && (evt0 === 'keydown' || evt0 === 'keyup' || evt0 === 'text')) {
